<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Enchanted Spelling Workshop</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <link rel="stylesheet" href="./shared/bg-deco/bg-deco.css"/>
  <meta name="theme-color" content="#0a0e2d"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Magic Spelling"/>
  <script src="./vendor/react-18.3.1.production.min.js"></script>
  <script src="./vendor/react-dom-18.3.1.production.min.js"></script>
  <script src="./shared/bg-deco/bg-deco.js"></script>
  <script src="./js/tap-zoom-guard.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;background:#fce4ec}

    /* ── BG ── */
    .app-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:
        radial-gradient(1.8px 1.8px at 30px 40px,rgba(255,255,255,.95),transparent 55%),
        radial-gradient(1.4px 1.4px at 150px 110px,rgba(255,213,79,.8),transparent 55%),
        radial-gradient(1.2px 1.2px at 90px 180px,rgba(255,255,255,.7),transparent 55%),
        radial-gradient(ellipse 130% 55% at 50% 118%,rgba(206,147,216,.5),transparent 65%),
        linear-gradient(180deg,#ffe3ef 0%,#fdd0e2 45%,#e8d4f5 100%);
      background-size:240px 210px,240px 210px,240px 210px,cover,cover;
      background-repeat:repeat,repeat,repeat,no-repeat,no-repeat}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}
    @media (prefers-reduced-motion: reduce){
      *{animation-duration:.001s!important}
    }

    /* ── LAYOUT ── */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 140px;gap:12px}

    /* ── HOME ── */
    .home-title{font-size:clamp(1.9rem,7.5vw,3.3rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(173,20,87,.25));margin-top:6px}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:1rem;font-weight:900;color:#ad1457;text-shadow:0 1px 0 #fff;letter-spacing:.5px}
    .home-crown-row{display:flex;gap:80px;align-items:center;justify-content:center;min-height:64px;margin-bottom:-6px}
    .home-crown{font-size:52px;line-height:1;filter:drop-shadow(0 5px 10px rgba(173,20,87,.25))}
    .mode-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%;max-width:640px}
    .mode-card{flex:1;min-width:140px;max-width:190px;border-radius:26px;padding:18px 12px 14px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s;font-family:inherit}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mc-pink  {background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 7px 0 #ad1457,0 10px 20px rgba(233,30,99,.3)}
    .mc-purple{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 7px 0 #4a148c,0 10px 20px rgba(123,31,162,.3)}
    .mc-gold  {background:linear-gradient(160deg,#ffe082,#f9a825);box-shadow:0 7px 0 #e65100,0 10px 20px rgba(249,168,37,.35)}
    .mode-card-art{font-size:56px;line-height:1;height:64px;display:flex;align-items:center;justify-content:center}
    .mode-card-label{font-size:.95rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
    .mode-card-sub{font-size:.68rem;font-weight:900;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.25);margin-top:-4px}
    .trophy-line{font-size:.9rem;font-weight:900;color:#7b1fa2;background:rgba(255,255,255,.7);border-radius:50px;padding:5px 14px}

    /* ── TOP BAR / SHARED ── */
    .top-bar{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .round-btn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:#e91e63;font-size:1.3rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #f48fb1;display:flex;align-items:center;justify-content:center;font-family:inherit}
    .round-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f48fb1}
    /* Owner, 2026-08-27: *"need to make sure ALL games has back icon to the hub"* --
       a 4-year-old could not get out of this app. Fixed rather than in the top bar,
       because Home has no top bar to sit in, and top-left is where the same arrow
       lives in Space Math and Unicorn Math. z-index clears the drifting petals. */
    .hub-btn{position:fixed;top:12px;left:12px;z-index:20;text-decoration:none}
    .bar-label{font-size:.8rem;font-weight:900;color:#9c27b0;background:rgba(255,255,255,.7);border-radius:50px;padding:4px 12px}

    /* ── PACK GRID ── */
    .pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;width:100%;max-width:640px}
    .pack-card{border:none;border-radius:20px;padding:12px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:inherit;min-height:100px}
    .pack-card:active{transform:translateY(4px) scale(.97)}
    .pack-num{font-size:1.7rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);line-height:1.1}
    .pack-word{font-size:.62rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.25)}
    .pack-stars{font-size:.95rem;letter-spacing:2px;line-height:1;margin-top:2px}
    .star-on {color:#fff59d;text-shadow:0 1px 3px rgba(0,0,0,.35)}
    .star-off{color:rgba(255,255,255,.38)}

    /* ── GAME AREA ── */
    .prompt-bubble{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 #f48fb1;font-size:clamp(1rem,4vw,1.4rem);font-weight:900;color:#333;text-align:center;display:flex;align-items:center;gap:10px}
    /* THE ROBOT IS THE BUTTON. This was a bare 🔊 on a purple pill, and the emoji is drawn
       by the operating system -- a grey metal speaker on macOS, something else again on the
       iPad -- so it was chrome pretending to be art. It also asked a pre-reader to
       know that a speaker glyph means "press me and I will say it", which is exactly the
       kind of reading this game exists to teach. A face that opens its mouth when you tap
       it needs no such decoding. Sized well past the 44px tap minimum, both because the
       target must stay generous and because the ABC on his chin has to read at all. */
    /* THE ROBOT STANDS OUTSIDE THE BUBBLE, and the bubble points at him. Inside it he was
       58px of button glyph -- at that size the ABC on his chin is a smudge and he reads as
       decoration on a control. Out here at 88px he is a character who is saying the thing
       in the bubble, which is what a speech bubble has always meant. */
    .read-row{display:flex;align-items:center;gap:12px;max-width:min(94vw,640px)}
    .speak-btn{border:none;background:none;padding:0;width:88px;height:88px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
    .speak-btn:active{transform:translateY(2px)}
    .read-row .prompt-bubble{position:relative}
    .read-row .prompt-bubble::before{content:'';position:absolute;left:-11px;top:50%;transform:translateY(-50%);border:9px solid transparent;border-right-color:#f48fb1;border-left:0}
    .read-row .prompt-bubble::after{content:'';position:absolute;left:-7px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:#fff;border-left:0}
    .rb-robot{width:88px;display:grid;place-items:center}
    /* Both frames share one grid cell so the swap cannot shift the bubble by a pixel, and
       both are in the DOM from the start so the first word never waits for a decode. An
       animated WebP cannot be paused, so the idle robot is simply the still one with the
       animation running unseen underneath. At 58px that costs nothing. */
    .rb-robot img{width:100%;height:auto;display:block;grid-area:1/1;transition:opacity .18s linear}
    .rb-robot .rb-talk{opacity:0}
    .rb-robot.talking .rb-still{opacity:0}
    .rb-robot.talking .rb-talk{opacity:1}
    @media (prefers-reduced-motion: reduce){
      .rb-robot .rb-talk{display:none}
      .rb-robot .rb-still{opacity:1 !important}
      /* Movement is refused, so "who is speaking" falls back to light on the still face --
         the child still has to know the robot is the one talking. */
      .rb-robot.talking{animation:rbPulse 1.4s ease-in-out infinite}
    }
    @keyframes rbPulse{0%,100%{filter:none}50%{filter:brightness(1.12) drop-shadow(0 0 9px rgba(233,30,99,.7))}}
    .icon-svg{width:22px;height:22px;display:block}

    /* THE SLOTS ARE LOWERCASE NOW, and that is the point. The old game showed CAT in
       capitals because it was teaching letter recognition; this game teaches children to
       write real words, and a Grade 3 child writes "because", not "BECAUSE". Capitals
       appear exactly where the written form has them -- the I in I'll, the M in Mrs. --
       so the tiles a child taps are the characters they would put on paper. */
    .slot-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .slot{width:52px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:900;background:rgba(255,255,255,.55);border:3px dashed #f06292;color:#ad1457}
    .slot.filled{background:linear-gradient(160deg,#fff,#fce4ec);border:3px solid #e91e63;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
    .slot-row.long{gap:5px}
    .slot-row.long .slot{width:38px;height:46px;font-size:1.2rem;border-radius:10px;border-width:2.5px}
    @keyframes popIn{from{transform:scale(0) rotate(-10deg)}to{transform:scale(1)}}

    .tile-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:560px}
    .tile{width:60px;height:64px;border-radius:16px;border:none;font-family:inherit;font-size:1.8rem;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
    .tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
    .tile.t0{background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 5px 0 #ad1457}
    .tile.t1{background:linear-gradient(160deg,#ce93d8,#8e24aa);box-shadow:0 5px 0 #4a148c}
    .tile.t2{background:linear-gradient(160deg,#ffd54f,#f9a825);box-shadow:0 5px 0 #e65100}
    .tile.t3{background:linear-gradient(160deg,#80cbc4,#00897b);box-shadow:0 5px 0 #004d40}
    .tile.used{opacity:.25;pointer-events:none;transform:scale(.9)}
    .tile.wrong{animation:wrongShake .35s ease}
    .tile.right{animation:correctPop .5s ease}
    /* THE HINT GLOWS THE TILES THAT COULD BE NEXT, and never fills the slot for the child
       until the third miss. It is help that still asks for a tap -- the child keeps the
       agency of choosing, which is the whole difference between help and the game
       playing itself. */
    .tile.hint{animation:hintGlow 1s ease-in-out infinite alternate}
    @keyframes hintGlow{from{outline:0 solid rgba(255,213,79,0)}to{outline:5px solid rgba(255,213,79,.9)}}
    .tile-row.dense{gap:7px;max-width:600px}
    .tile-row.dense .tile{width:46px;height:50px;font-size:1.3rem;border-radius:12px}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-8deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}

    .praise-banner{font-size:1.3rem;font-weight:900;color:#e91e63;text-shadow:0 1px 0 #fff;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);min-height:1.6em;text-align:center}

    /* ── PACK COMPLETE ── */
    .complete-overlay{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:rgba(255,240,247,.94);backdrop-filter:blur(4px)}
    .complete-stars{font-size:clamp(56px,16vw,84px);display:flex;gap:12px;line-height:1}
    .complete-stars span{display:inline-block;animation:popIn .55s cubic-bezier(.34,1.56,.64,1) both}
    .complete-stars .off{filter:grayscale(1);opacity:.3}
    .complete-title{font-size:clamp(1.4rem,6vw,2rem);font-weight:900;color:#ad1457;text-shadow:0 1px 0 #fff;text-align:center}
    .complete-sub{font-size:1rem;font-weight:900;color:#880e4f}
    .complete-btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
    .big-btn{border:none;border-radius:50px;padding:14px 26px;font-family:inherit;font-size:1rem;font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(160deg,#f06292,#c2185b);box-shadow:0 5px 0 #880e4f}
    .big-btn.alt{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 5px 0 #4a148c}
    .big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #880e4f}

    /* ── SCORE / GARDEN ── */
    .score-row{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border-top:2px solid rgba(244,143,177,.5)}
    .score-badge{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.85);border:2px solid #f8bbd0;border-radius:50px;padding:5px 12px;font-weight:900;color:#ad1457;font-size:.95rem}
    .flower-garden{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:6px 8px;background:rgba(255,255,255,.84);border:2px solid #f8bbd0;border-radius:16px;max-width:300px;flex:1}
    .flower-slot{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
    .flower-slot.empty{opacity:.18;filter:grayscale(.45)}
    .flower-slot.filled{animation:popIn .35s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 3px rgba(123,31,162,.25))}
    .garden-full-badge{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:linear-gradient(160deg,#ffd54f,#f9a825);color:#7b1fa2;font-weight:900;padding:8px 18px;border-radius:50px;box-shadow:0 5px 0 #e65100;z-index:6;animation:popIn .35s}

    /* ── MASCOT ── */
    .mascot-corner{position:fixed;left:18px;bottom:76px;width:104px;height:104px;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 7px 14px rgba(123,31,162,.32))}
    .mascot-corner::before{content:'';position:absolute;left:50%;bottom:2px;width:96%;height:82%;transform:translateX(-50%);border-radius:999px;background:radial-gradient(circle at 50% 54%,rgba(255,255,255,.96) 0 46%,rgba(255,245,253,.82) 58%,rgba(244,143,177,.38) 75%,rgba(244,143,177,0) 100%);box-shadow:0 0 0 3px rgba(255,255,255,.62),0 8px 22px rgba(123,31,162,.22)}
    .mascot-emoji{position:relative;font-size:58px;line-height:1;animation:float 2.3s ease-in-out infinite alternate;transform-origin:center bottom}
    .mascot-corner.happy .mascot-emoji{animation:correctPop 1s cubic-bezier(.34,1.56,.64,1)}
    .mascot-corner.oops .mascot-emoji{animation:wrongShake .4s ease}
    @media (max-width:560px){
      .mascot-corner{width:76px;height:76px;left:8px;bottom:70px}
      .mascot-emoji{font-size:44px}
      .flower-garden{max-width:240px}
      .flower-slot{width:20px;height:20px;font-size:14px}
      .slot{width:44px;height:50px;font-size:1.4rem}
      .tile{width:52px;height:56px;font-size:1.5rem}
      .slot-row.long{gap:3px}
      .slot-row.long .slot{width:29px;height:36px;font-size:.95rem;border-width:2px}
      .tile-row.dense{gap:5px}
      .tile-row.dense .tile{width:41px;height:45px;font-size:1.05rem}
    }

    /* ── CONFETTI ── */
    .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
    .confetti-piece{position:absolute;top:-24px;animation:confettiFall linear forwards}
    @keyframes confettiFall{to{transform:translateY(110vh) rotate(560deg)}}

    /* Enchanted Spelling Workshop — live controls over dedicated art plates. */
    :root{--ink:#2b1626;--plum:#4a2340;--violet:#7c3aed;--lavender:#a78bfa;--gold:#ffd54f;--cream:#fff5d6}
    html,body,#root{min-height:100%;touch-action:manipulation}
    body{background:var(--ink);color:var(--cream);overflow:hidden}
    button,a{font:inherit}
    button:focus-visible,a:focus-visible{outline:5px solid var(--gold);outline-offset:4px}
    .app-bg{display:none}
    .screen{min-height:100svh;padding:max(12px,env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom));gap:10px;background-position:center;background-size:cover;overflow:hidden}
    .workshop-screen{background-image:linear-gradient(rgba(43,22,38,.12),rgba(43,22,38,.2)),url('assets-runtime/spelling/workshop/grade-room-landscape.webp')}
    .shelf-screen{background-image:linear-gradient(rgba(43,22,38,.16),rgba(43,22,38,.18)),url('assets-runtime/spelling/workshop/pack-shelf-landscape.webp')}
    .desk-screen{background-image:url('assets-runtime/spelling/workshop/desk-landscape.webp');--paper-left:26.2vw;--paper-top:30.5vh;--paper-width:59.8vw;--paper-height:20.5vh;--read-top:31.1vh;--read-height:9.8vh;--praise-top:40.3vh;--slot-left:28.9vw;--slot-top:42.8vh;--slot-width:54.4vw;--tray-left:5.5vw;--tray-top:55.5vh;--tray-width:89vw}
    .complete-screen{background-image:url('assets-runtime/spelling/workshop/complete-landscape.webp')}
    .top-bar{max-width:960px;z-index:3}.round-btn{width:54px;height:54px;background:rgba(58,30,51,.94);color:var(--gold);box-shadow:0 4px 0 #1c0d19;border:2px solid rgba(255,213,79,.65)}
    .bar-label{font-size:clamp(.78rem,2.2vw,1rem);color:var(--cream);background:rgba(43,22,38,.9);border:2px solid rgba(255,213,79,.55);padding:7px 14px}
    .hub-btn{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}.workshop-mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:20}
    .workshop-title{font-family:'Fredoka One',sans-serif;font-size:clamp(1.55rem,5vw,2.8rem);color:var(--cream);text-align:center;text-shadow:0 3px 10px #1c0d19;margin-top:2px}
    .station-grid{width:min(96vw,1050px);margin:auto 0 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.5vw,28px);align-items:end}
    .station-card{min-height:190px;border:3px solid rgba(255,213,79,.75);border-radius:26px;padding:12px;background:linear-gradient(180deg,rgba(58,30,51,.15),rgba(43,22,38,.92));color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;cursor:pointer;box-shadow:0 8px 22px rgba(20,8,18,.45);transition:transform .2s,filter .2s}
    .station-card:active{transform:translateY(4px) scale(.98)}.station-name{font-family:'Fredoka One';font-size:clamp(1.05rem,2.6vw,1.55rem);color:var(--gold)}.station-grade{font-weight:900;font-size:1rem}.station-progress{font-size:.78rem;font-weight:800;margin-top:5px;line-height:1.25}
    .continue-btn{min-height:58px;border:3px solid var(--gold);border-radius:999px;padding:10px 28px;background:linear-gradient(#8b5cf6,#5b21b6);color:white;font-weight:900;font-size:1.05rem;box-shadow:0 5px 0 #35106d;cursor:pointer}.continue-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #35106d}.continue-btn[disabled]{opacity:.7}
    .drawer-summary{background:rgba(43,22,38,.92);border:2px solid rgba(255,213,79,.65);border-radius:18px;padding:7px 14px;font-weight:900;color:var(--cream)}
    .shelf-screen .top-bar .bar-label{position:absolute;top:66px;left:calc(50% - 100px);transform:translateX(-50%);min-width:112px;text-align:center;background:linear-gradient(#6d28a9,#3b1663);border-color:var(--gold);box-shadow:0 4px 0 #24101f}

<script>
const {
  useState,
  useEffect,
  useMemo,
  useRef,
  useCallback
} = React;
const useBgDecoEffect = React.useLayoutEffect || useEffect;

/* ══ SOUND ══ */
const Sound = (() => {
  let _ctx = null,
    _muted = false;
  const ctx = () => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!_ctx) _ctx = new AC();
    if (_ctx.state === 'suspended') _ctx.resume();
    return _ctx;
  };
  const tone = (c, freq, type, t, dur, vol, fe) => {
    try {
      const o = c.createOscillator(),
        g = c.createGain();
      o.connect(g);
      g.connect(c.destination);
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (fe) o.frequency.exponentialRampToValueAtTime(fe, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t);
      o.stop(t + dur);
    } catch (e) {}
  };
  return {
    setMuted(m) {
      _muted = m;
    },
    tap() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 880, 'sine', n, .08, .12);
      tone(c, 1320, 'sine', n + .04, .06, .08);
    },
    ding() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      [[523, 0], [659, .06], [784, .12], [1047, .22]].forEach(([f, t]) => tone(c, f, 'sine', n + t, .45, .16));
    },
    wrong() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 220, 'sawtooth', n, .28, .09, 100);
    },
    celebrate() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      [[523, 0], [659, .1], [784, .2], [1047, .32], [784, .46], [1047, .58], [1319, .68], [1047, .82]].forEach(([f, t]) => tone(c, f, 'sine', n + t, .2, .18));
    },
    fanfare() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      [523, 659, 784, 1047, 1319, 1568, 2093, 1568, 1319, 1047].forEach((f, i) => tone(c, f, 'sine', n + i * .1, .2, .22));
    }
  };
})();

/* ══ VOICE ══ */
let _voiceMuted = false;
const Voice = {
  setMuted(m) {
    _voiceMuted = m;
    if (m && window.speechSynthesis) window.speechSynthesis.cancel();
  },
  say(text, rate = 0.85, on) {
    const off = () => {
      try {
        on && on(false);
      } catch (e) {}
    };
    if (_voiceMuted) {
      off();
      return;
    }
    try {
      const s = window.speechSynthesis;
      if (!s) {
        off();
        return;
      }
      s.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = rate;
      u.pitch = 1.15;
      u.lang = 'en-US';
      u.onstart = () => {
        try {
          on && on(true);
        } catch (e) {}
      };
      u.onend = off;
      u.onerror = off;
      s.speak(u);
    } catch (e) {
      off();
    }
  }
};

/* ══ NARRATION CLIPS ══
   Rendered speech for the whole game -- every word, the praise and the pack-complete
   lines -- replacing the browser's adult robot voice, which was never a decision for
   this game, just what it always had (2026-08-27 open item, closed by the owner
   2026-08-29: render it). Same resolver idea as Space Math's Clips: the game asks for
   a line by its exact text and neither knows nor cares whether a file exists, so a
   missing clip falls back to speechSynthesis line by line rather than breaking the
   game. One set, exact strings only -- there are no patterns here because every spoken
   line in this game is one of a fixed handful of strings plus the words themselves,
   which is exactly what made the render affordable. The index is fetched, not guessed:
   without clips.json the only way to discover a missing clip is a 404 the child hears
   as silence before the engine picks the word up. */
const Clips = (() => {
  const ROOT = 'assets-runtime/narration/spelling/';
  let texts = null,
    tried = false;
  const load = () => {
    if (tried) return;
    tried = true;
    try {
      fetch(ROOT + 'clips.json').then(r => r.ok ? r.json() : null).then(j => {
        if (j && j.texts) texts = j.texts;
      }).catch(() => {});
    } catch (e) {}
  };
  return {
    url(text) {
      load();
      const s = String(text).trim();
      return texts && texts[s] ? ROOT + texts[s] + '.m4a' : null;
    }
  };
})();
/* One Audio at a time, so a rapid robot tap cannot stack two words on top of each
   other, and so the mute button can stop a clip that is already playing. */
let _lineAudio = null;
const speakLine = (text, rate = 0.95) => {
  try {
    _lineAudio && _lineAudio.pause();
  } catch (e) {}
  _lineAudio = null;
  const u = Clips.url(text);
  if (u) {
    const a = new Audio(u);
