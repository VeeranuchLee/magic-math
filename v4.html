<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>✨ Magic Math! ✨</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;background:linear-gradient(145deg,#fce4ec,#f3e5f5,#e8eaf6,#fce4ec);min-height:100vh;overflow-x:hidden}

    .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .bg-deco span{position:absolute;opacity:.15;animation:floatDeco linear infinite}
    @keyframes floatDeco{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-10vh) rotate(360deg)}}

    /* HOME */
    .home{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:22px;padding:24px}
    .home-rainbow{font-size:clamp(.9rem,3vw,1.4rem);letter-spacing:4px;animation:bounce 1.4s ease-in-out infinite alternate}
    .home-title{font-size:clamp(1.9rem,7.5vw,3.4rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:clamp(.85rem,2.8vw,1.15rem);font-weight:900;color:#7b1fa2;background:rgba(255,255,255,.55);border-radius:50px;padding:6px 20px;box-shadow:0 2px 8px rgba(171,71,188,.2)}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
    .mode-section{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:680px}
    .mode-section-label{font-size:1rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:2px;background:rgba(255,255,255,.6);border-radius:50px;padding:5px 18px}
    .mode-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%}
    .mode-card{flex:1;min-width:140px;max-width:200px;border-radius:28px;padding:20px 14px 16px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:9px;transition:transform .15s,box-shadow .15s}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mode-card-icon{font-size:50px;line-height:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
    .mode-card-label{font-size:.95rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);text-align:center}
    .mode-card-stars{font-size:1.05rem}
    .mc-pink  {background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 7px 0 #ad1457,0 12px 24px rgba(233,30,99,.3)}
    .mc-purple{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 7px 0 #4a148c,0 12px 24px rgba(123,31,162,.3)}
    .mc-rose  {background:linear-gradient(160deg,#f06292,#c2185b);box-shadow:0 7px 0 #880e4f,0 12px 24px rgba(194,24,91,.3)}
    .mc-magic {background:linear-gradient(160deg,#ba68c8,#4a148c);box-shadow:0 7px 0 #311b92,0 12px 24px rgba(74,20,140,.3)}

    /* SCREEN */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 24px;gap:12px}
    .blocks-screen {background:linear-gradient(160deg,#fce4ec,#f8bbd0,#fce4ec)}
    .choose-screen {background:linear-gradient(160deg,#f3e5f5,#e1bee7,#f3e5f5)}
    .line-screen   {background:linear-gradient(160deg,#e8eaf6,#f3e5f5,#fce4ec)}
    .addsub-screen {background:linear-gradient(160deg,#fff3e0,#fce4ec,#f3e5f5)}

    /* TOP BAR */
    .top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:740px;gap:8px}
    .back-btn{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:50px;padding:9px 18px;font-family:inherit;font-size:.95rem;font-weight:900;color:#e91e63;cursor:pointer;box-shadow:0 4px 0 #f48fb1;transition:transform .1s;white-space:nowrap}
    .back-btn:active{transform:translateY(3px)}
    .settings-btn{background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:50px;padding:9px 14px;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 0 #ce93d8;transition:transform .1s;line-height:1}
    .settings-btn:active{transform:translateY(3px)}
    .sound-btn{background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:50px;padding:9px 14px;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 0 #ce93d8;transition:transform .1s;line-height:1}
    .sound-btn:active{transform:translateY(3px)}

    /* SETTINGS MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-box{background:#fff;border-radius:28px;padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px solid #f48fb1}
    .modal-title{font-size:1.3rem;font-weight:900;color:#7b1fa2;text-align:center;margin-bottom:16px}
    .preset-btn{width:100%;padding:13px 18px;border-radius:16px;border:3px solid;font-family:inherit;font-size:1rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .1s;margin-bottom:8px}
    .preset-btn:active{transform:scale(.97)}
    .preset-btn.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .preset-btn.inactive{background:#fff;border-color:#f8bbd0;color:#7b1fa2}
    .preset-tag{font-size:1.3rem}
    .preset-info{text-align:left;flex:1}
    .preset-name{font-size:1rem;font-weight:900}
    .preset-range{font-size:.78rem;opacity:.7;font-weight:700}
    .modal-close{margin-top:6px;width:100%;padding:12px;border-radius:50px;border:none;background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;font-family:inherit;font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #ad1457}
    .modal-close:active{transform:translateY(3px)}

    /* NUMBER DISPLAY */
    .number-display{display:flex;gap:8px;align-items:flex-end;justify-content:center;background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:22px;padding:11px 20px;box-shadow:0 4px 0 #f48fb1,0 8px 20px rgba(240,98,146,.2)}
    .digit-box{display:flex;flex-direction:column;align-items:center;gap:3px}
    .digit-value{font-size:clamp(2rem,9vw,3.8rem);font-weight:900;line-height:1;min-width:44px;text-align:center}
    .digit-value.pop  {animation:pop .3s ease}
    .digit-value.shake{animation:shake .35s ease}
    .digit-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .digit-hundreds{color:#9c27b0}.digit-tens{color:#e91e63}.digit-ones{color:#ff6f00}
    @keyframes pop  {0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

    /* BLOCKS */
    .blocks-area{flex:1;width:100%;max-width:700px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;justify-content:center;padding:6px}
    .block-hundred{width:70px;height:70px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:12px;border:3px solid #6a1b9a;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1.5px;padding:4px;cursor:pointer;box-shadow:0 4px 0 #4a148c;transition:transform .12s,opacity .2s;animation:blockIn .3s ease}
    .block-hundred:active{transform:scale(.92) translateY(4px)}
    .block-hundred .inner-cell{background:rgba(255,255,255,.38);border-radius:1px}
    .block-ten{width:27px;height:70px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:8px;border:3px solid #c2185b;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1.5px;padding:4px;cursor:pointer;box-shadow:0 4px 0 #880e4f;transition:transform .12s,opacity .2s;animation:blockIn .3s ease}
    .block-ten:active{transform:scale(.92) translateY(4px)}
    .block-ten .inner-cell{background:rgba(255,255,255,.38);border-radius:2px}
    .block-one{width:27px;height:27px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:7px;border:3px solid #e65100;cursor:pointer;box-shadow:0 4px 0 #bf360c;transition:transform .12s,opacity .2s;animation:blockIn .3s ease}
    .block-one:active{transform:scale(.87) translateY(4px)}
    @keyframes blockIn{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

    /* CHOOSE BLOCKS */
    .block-bank{width:100%;max-width:700px;display:flex;flex-direction:column;gap:10px;padding:2px 8px}
    .block-bank-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
    .block-bank-label{font-size:.8rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;width:100%;text-align:center}
    .bank-h-label{color:#7b1fa2}.bank-t-label{color:#c2185b}.bank-o-label{color:#e65100}
    .sel-hundred{width:62px;height:62px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:10px;border:3px solid #6a1b9a;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:4px;cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .15s;box-shadow:0 4px 0 #4a148c}
    .sel-hundred.off{opacity:.22;transform:scale(.93)}.sel-hundred.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #f06292,0 5px 0 #4a148c}
    .sel-hundred .inner-cell{background:rgba(255,255,255,.36);border-radius:1px}
    .sel-ten{width:25px;height:62px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:8px;border:3px solid #c2185b;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px;cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .15s;box-shadow:0 4px 0 #880e4f}
    .sel-ten.off{opacity:.22;transform:scale(.93)}.sel-ten.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #f06292,0 5px 0 #880e4f}
    .sel-ten .inner-cell{background:rgba(255,255,255,.36);border-radius:2px}
    .sel-one{width:29px;height:29px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:7px;border:3px solid #e65100;cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .15s;box-shadow:0 4px 0 #bf360c}
    .sel-one.off{opacity:.22;transform:scale(.93)}.sel-one.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #f06292,0 5px 0 #bf360c}

    /* BUTTONS */
    .check-btn{background:linear-gradient(160deg,#ba68c8,#6a1b9a);color:#fff;border:none;border-radius:50px;padding:15px 34px;font-family:inherit;font-size:1.2rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #4a148c;transition:transform .1s}
    .check-btn:active{transform:translateY(4px)}
    .new-number-btn{background:linear-gradient(160deg,#f48fb1,#c2185b);color:#fff;border:none;border-radius:50px;padding:13px 28px;font-family:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #880e4f;transition:transform .1s}
    .new-number-btn:active{transform:translateY(4px)}
    .next-btn{background:linear-gradient(160deg,#f06292,#ad1457);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 #880e4f;transition:transform .1s}
    .next-btn:active{transform:translateY(4px)}
    .block-label{font-size:.82rem;font-weight:900;color:#7b1fa2;background:rgba(255,255,255,.65);border-radius:12px;padding:4px 12px;border:1.5px solid #ce93d8}

    /* NUMBER LINE */
    .prompt-bubble{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:22px;padding:13px 20px;box-shadow:0 4px 0 #f48fb1;font-size:clamp(1.1rem,4.2vw,1.7rem);font-weight:900;color:#333;text-align:center}
    .target-num{display:inline-block;color:#e91e63;font-size:1.3em;animation:pulse 1s infinite alternate}
    .start-num {display:inline-block;color:#7b1fa2;font-size:1.15em}
    .op-add    {display:inline-block;color:#2e7d32;font-size:1.15em}
    .op-sub    {display:inline-block;color:#c62828;font-size:1.15em}
    .eq-mark   {color:#999}
    @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}
    .hop-counter{background:linear-gradient(135deg,#fff,#e8f5e9);border:2.5px solid #a5d6a7;border-radius:50px;padding:6px 18px;font-size:.95rem;font-weight:900;color:#2e7d32;box-shadow:0 3px 8px rgba(46,125,50,.15)}

    .character{font-size:50px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));animation:float 2s ease-in-out infinite alternate;transition:left .45s cubic-bezier(.34,1.56,.64,1);position:absolute;top:0}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}
    .char-wrap{width:100%;max-width:740px;position:relative;height:68px;overflow:hidden}

    .number-line-wrapper{width:100%;max-width:740px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
    .number-line{display:flex;align-items:center;min-width:max-content;padding:8px 16px;position:relative}
    .nl-track{position:absolute;top:50%;left:0;right:0;height:12px;background:linear-gradient(90deg,#f44336,#ff9800,#ffeb3b,#4caf50,#2196f3,#9c27b0,#e91e63);border-radius:6px;transform:translateY(-50%);box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:0}
    .nl-number{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;cursor:pointer;border:none;position:relative;z-index:1;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s;flex-shrink:0}
    .nl-number:active{transform:scale(.9) translateY(3px)}
    .nl-number.current     {outline:5px solid #fff;outline-offset:3px}
    .nl-number.hop-path    {outline:3px solid rgba(255,255,255,.75);outline-offset:2px}
    .nl-number.correct     {animation:correctPop .5s ease}
    .nl-number.wrong       {animation:wrongShake .35s ease}

    /* START MARKER — very visible pulsing ring */
    .nl-number.start-marker{
      background:#fff !important;
      color:#7b1fa2 !important;
      font-size:1.25rem;
      width:54px;height:54px;
      box-shadow:0 0 0 4px #e91e63, 0 5px 0 #880e4f, 0 8px 16px rgba(233,30,99,.35) !important;
      animation:startPulse 1.1s ease-in-out infinite;
      z-index:2;
    }
    @keyframes startPulse{
      0%,100%{box-shadow:0 0 0 4px #e91e63, 0 5px 0 #880e4f;transform:scale(1)}
      50%     {box-shadow:0 0 0 7px #f06292, 0 5px 0 #880e4f;transform:scale(1.07)}
    }

    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.55) rotate(-8deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}

    /* HOP STRIP */
    .hop-strip{width:100%;max-width:740px;overflow-x:auto;padding:0 16px;-webkit-overflow-scrolling:touch;display:flex;min-width:0}
    .hop-arrows{display:flex;align-items:flex-end;min-width:max-content;gap:0;padding:0 16px}
    .hop-cell{width:50px;display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0}
    .hop-cell.start-cell{width:54px}
    .hop-num-badge{font-size:.72rem;font-weight:900;padding:1px 3px;border-radius:4px;min-width:14px;text-align:center}
    .hop-num-add{color:#1b5e20;background:#c8e6c9}
    .hop-num-sub{color:#b71c1c;background:#ffcdd2}
    .hop-arrow-add{color:#2e7d32;font-size:1.35rem;font-weight:900;line-height:1}
    .hop-arrow-sub{color:#c62828;font-size:1.35rem;font-weight:900;line-height:1}
    .hop-dot{width:7px;height:7px;border-radius:50%;background:#e0e0e0;margin-bottom:4px}
    .start-flag{font-size:.95rem;line-height:1;margin-bottom:2px}

    /* SCORE / 20 FLOWERS */
    .score-row{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:740px}
    .score-badge{background:linear-gradient(135deg,#fff,#fce4ec);border:2px solid #f48fb1;border-radius:50px;padding:6px 16px;font-size:1rem;font-weight:900;color:#e91e63;box-shadow:0 3px 8px rgba(240,98,146,.2)}
    .score-badge span{color:#7b1fa2}
    .flowers{display:flex;flex-wrap:wrap;gap:2px;max-width:168px;justify-content:flex-end}
    .flower{font-size:1.1rem;line-height:1;transition:transform .15s}
    .flower.lit{animation:flowerPop .4s cubic-bezier(.34,1.56,.64,1)}
    @keyframes flowerPop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}

    /* celebrate / feedback */
    .celebrate-text{font-size:clamp(1.3rem,5vw,2.1rem);font-weight:900;text-align:center;color:#e91e63;text-shadow:0 3px 0 #9c27b0;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
    .wrong-text{font-size:clamp(1.1rem,4vw,1.8rem);font-weight:900;text-align:center;color:#e91e63;animation:popIn .35s ease}
    @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

    /* confetti */
    .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
    .confetti-piece{position:absolute;animation:confettiFall linear forwards}
    @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useMemo, useRef } = React;

/* ── SOUND ── */
const Sound = (() => {
  let _ctx=null, _muted=false;
  const ctx=()=>{if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();if(_ctx.state==='suspended')_ctx.resume();return _ctx;};
  const tone=(c,freq,type,t,dur,vol,freqEnd)=>{try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(freq,t);if(freqEnd)o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}};
  return{
    setMuted(v){_muted=v;},
    tap(){if(_muted)return;const c=ctx(),n=c.currentTime;tone(c,880,'sine',n,.08,.12);tone(c,1320,'sine',n+.04,.06,.08);},
    twinkle(){if(_muted)return;const c=ctx(),n=c.currentTime;[523,659,784,1047,1319].forEach((f,i)=>tone(c,f,'sine',n+i*.07,.18,.14));},
    ding(){if(_muted)return;const c=ctx(),n=c.currentTime;[[523,0],[659,.06],[784,.12],[1047,.22],[1319,.32]].forEach(([f,t])=>tone(c,f,'sine',n+t,.55,.18));},
    wrong(){if(_muted)return;const c=ctx(),n=c.currentTime;tone(c,220,'sawtooth',n,.28,.1,100);},
    celebrate(){if(_muted)return;const c=ctx(),n=c.currentTime;[[523,0],[659,.1],[784,.2],[1047,.32],[784,.46],[1047,.58],[1319,.68],[1047,.82]].forEach(([f,t])=>tone(c,f,'sine',n+t,.2,.2));[1047,1319,1568,2093].forEach((f,i)=>tone(c,f,'sine',n+.9+i*.08,.15,.1));},
    hop(){if(_muted)return;const c=ctx(),n=c.currentTime;tone(c,400,'sine',n,.12,.12,600);},
    allFlowers(){if(_muted)return;const c=ctx(),n=c.currentTime;[523,659,784,1047,1319,1568,2093,1568,1319,1047].forEach((f,i)=>tone(c,f,'sine',n+i*.1,.2,.25));}
  };
})();

/* ── CONSTANTS ── */
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const CONFETTI=['#e91e63','#f06292','#9c27b0','#ce93d8','#ffd54f','#fff176','#f48fb1','#ba68c8','#ff8f00','#fff','#f8bbd0','#e1bee7'];
const CHARACTERS=['🦄','👸','🌸','🦋','🌈'];
const NL_COLORS=[['#e91e63','#880e4f'],['#9c27b0','#4a148c'],['#673ab7','#311b92'],['#3f51b5','#1a237e'],['#2196f3','#0d47a1'],['#00bcd4','#006064'],['#4caf50','#1b5e20'],['#ff9800','#e65100'],['#f44336','#b71c1c'],['#e91e63','#880e4f']];
const TITLE_COLORS=['#e91e63','#f06292','#9c27b0','#7b1fa2','#3f51b5','#2196f3','#00bcd4','#4caf50','#ffeb3b','#ff9800','#e91e63','#9c27b0','#f06292','#ffd54f','#ab47bc','#e91e63'];
const BG_ICONS=['🌸','🌺','🌷','🌼','✨','⭐','💫','🦄','🌈','💜','🌸','🌺','✨','💫','🌷'];
const MAX_FLOWERS = 20;

/* Range presets — now with min AND max */
const BLOCKS_PRESETS=[
  {id:'b10',  emoji:'🌸', tag:'1 – 10',    min:1,   max:10,  desc:'Ones only'},
  {id:'b100', emoji:'🌷', tag:'11 – 100',  min:11,  max:100, desc:'Tens & ones'},
  {id:'b999', emoji:'🌺', tag:'101 – 999', min:101, max:999, desc:'Hundreds'},
  {id:'bfull',emoji:'💜', tag:'Full',       min:1,   max:999, desc:'1 – 999'},
];
const LINE_PRESETS=[
  {id:'l10',  emoji:'🌸', tag:'1 – 10',  min:1,  max:10, desc:'First ten'},
  {id:'l20',  emoji:'🌷', tag:'11 – 20', min:11, max:20, desc:'Teen numbers'},
  {id:'l30',  emoji:'🌺', tag:'21 – 30', min:21, max:30, desc:'Twenties'},
  {id:'lfull',emoji:'💜', tag:'Full',    min:1,  max:30, desc:'1 – 30'},

/* ── SHARED COMPONENTS ── */
function BgDeco(){
  const items=useMemo(()=>BG_ICONS.map((icon,i)=>({icon,id:i,left:rand(0,98),dur:rand(12,28),delay:rand(0,20),size:rand(14,26)})),[]);
  return<div className="bg-deco">{items.map(it=><span key={it.id} style={{left:`${it.left}%`,fontSize:it.size,animationDuration:`${it.dur}s`,animationDelay:`${it.delay}s`}}>{it.icon}</span>)}</div>;
}

function Confetti({active}){
  const p=useMemo(()=>Array.from({length:90},(_,i)=>({id:i,left:rand(0,100),delay:rand(0,900),dur:rand(1200,2400),color:CONFETTI[i%CONFETTI.length],size:rand(7,15),shape:i%4===0?'50%':i%4===1?'2px':i%4===2?'0':'30%',isFlower:i%6===0})),[]);
  if(!active)return null;
  return<div className="confetti-container">{p.map(x=><div key={x.id} className="confetti-piece" style={{left:`${x.left}%`,width:x.isFlower?'auto':x.size,height:x.isFlower?'auto':x.size,fontSize:x.isFlower?x.size+4:undefined,borderRadius:x.isFlower?undefined:x.shape,background:x.isFlower?'none':x.color,animationDuration:`${x.dur}ms`,animationDelay:`${x.delay}ms`}}>{x.isFlower?['🌸','🌺','🌷','⭐','💜'][x.id%5]:null}</div>)}</div>;
}

/* ══ MODE 1-A  Build It! ══ */
function BlocksGuided({onBack}){
  const [preset,setPreset]=useState(BLOCKS_PRESETS[0]);
  const [showSettings,setShowSettings]=useState(false);
  const [muted,setMuted]=useState(false);
  const [target,setTarget]=useState(()=>rand(1,10));
  const [built,setBuilt]=useState(0);
  const [score,setScore]=useState(0);
  const [flowers,setFlowers]=useState(0);
  const [confetti,setConf]=useState(false);

  const tH=Math.floor(target/100),tT=Math.floor((target%100)/10),tO=target%10;
  const h=Math.floor(built/100),t=Math.floor((built%100)/10),o=built%10;
  const won=built===target;

  const tap=useCallback(v=>{
    Sound.setMuted(muted); Sound.tap();
    setBuilt(p=>{
      const next=Math.min(target,p+v);
      if(next===target){
        setTimeout(()=>{Sound.ding();setTimeout(()=>Sound.celebrate(),200);},50);
        setScore(s=>s+1);
        setFlowers(f=>{
          const nf=Math.min(f+1,MAX_FLOWERS);
          if(nf===MAX_FLOWERS){setTimeout(()=>Sound.allFlowers(),300);}
          return nf;
        });
        setConf(true); setTimeout(()=>setConf(false),2600);
      } else Sound.twinkle();
      return next;
    });
  },[target,muted]);

  const newNum=()=>{
    Sound.setMuted(muted);Sound.tap();
    setTarget(rand(preset.min,preset.max));setBuilt(0);
  };
  const applyPreset=p=>{setPreset(p);setTarget(rand(p.min,p.max));setBuilt(0);};

  return(
    <div className="screen blocks-screen">
      {showSettings&&<SettingsModal title="Number Range" presets={BLOCKS_PRESETS} current={preset} onChange={applyPreset} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={()=>setMuted(m=>{Sound.setMuted(!m);return !m;})} label={preset.tag}/>
      <ScoreRow score={score} flowers={flowers}/>
      <NumberDisplay built={built} target={target} shake={false}/>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center'}}>
        {tH>0&&<div className="block-label">💜 Tap hundreds</div>}
        {tT>0&&<div className="block-label">🩷 Tap tens</div>}
        {tO>0&&<div className="block-label">⭐ Tap ones</div>}
      </div>
      <div className="blocks-area">
        {Array.from({length:tH},(_,i)=><div key={i} className="block-hundred" style={{opacity:i>=h?.28:1,cursor:i===h?'pointer':'default'}} onClick={()=>i===h&&tap(100)}>{Array.from({length:100},(_,j)=><div key={j} className="inner-cell"/>)}</div>)}
        {Array.from({length:tT},(_,i)=><div key={i} className="block-ten" style={{opacity:i>=t?.28:1,cursor:i===t?'pointer':'default'}} onClick={()=>i===t&&tap(10)}>{Array.from({length:10},(_,j)=><div key={j} className="inner-cell"/>)}</div>)}
        {Array.from({length:tO},(_,i)=><div key={i} className="block-one" style={{opacity:i>=o?.28:1,cursor:i===o?'pointer':'default'}} onClick={()=>i===o&&tap(1)}/>)}
      </div>
      {won&&<div className="celebrate-text">🦄 You built {target}! 🌈</div>}
      <button className="new-number-btn" onClick={newNum}>New Number 🌸</button>
    </div>
  );
}

/* ══ MODE 1-B  Choose the Right Blocks ══ */
function BlocksChoose({onBack}){
  const [preset,setPreset]=useState(BLOCKS_PRESETS[0]);
  const [showSettings,setShowSettings]=useState(false);
  const [muted,setMuted]=useState(false);
  const [target,setTarget]=useState(()=>rand(1,10));
  const [sel,setSel]=useState({h:0,t:0,o:0});
  const [shake,setShake]=useState(false);
  const [won,setWon]=useState(false);
  const [confetti,setConf]=useState(false);
  const [score,setScore]=useState(0);
  const [flowers,setFlowers]=useState(0);

  const built=sel.h*100+sel.t*10+sel.o;
  const showH=preset.max>=100&&preset.min>=100||preset.id==='bfull';
  const showT=preset.max>=10;

  const toggle=(type,i)=>{if(won)return;Sound.setMuted(muted);Sound.tap();setSel(p=>({...p,[type]:i<p[type]?i:i+1}));};

  const check=()=>{
    Sound.setMuted(muted);
    if(built===target){
      setWon(true);setConf(true);Sound.ding();setTimeout(()=>Sound.celebrate(),200);
      setScore(s=>s+1);
      setFlowers(f=>{const nf=Math.min(f+1,MAX_FLOWERS);if(nf===MAX_FLOWERS)setTimeout(()=>Sound.allFlowers(),300);return nf;});
      setTimeout(()=>setConf(false),2600);
    } else{setShake(true);Sound.wrong();setTimeout(()=>setShake(false),400);}
  };

  const newNum=()=>{Sound.setMuted(muted);Sound.tap();setTarget(rand(preset.min,preset.max));setSel({h:0,t:0,o:0});setWon(false);setShake(false);};
  const applyPreset=p=>{setPreset(p);setTarget(rand(p.min,p.max));setSel({h:0,t:0,o:0});setWon(false);setShake(false);};

  return(
    <div className="screen choose-screen">
      {showSettings&&<SettingsModal title="Number Range" presets={BLOCKS_PRESETS} current={preset} onChange={applyPreset} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={()=>setMuted(m=>{Sound.setMuted(!m);return !m;})} label={preset.tag}/>
      <ScoreRow score={score} flowers={flowers}/>
      <NumberDisplay built={built} target={target} shake={shake}/>
      <div className="block-bank">
        {showH&&<><div className="block-bank-label bank-h-label">💜 Hundreds — tap to pick!</div><div className="block-bank-row">{Array.from({length:10},(_,i)=><div key={i} className={`sel-hundred ${i<sel.h?'on':'off'}`} onClick={()=>toggle('h',i)}>{Array.from({length:100},(_,j)=><div key={j} className="inner-cell"/>)}</div>)}</div></>}
        {showT&&<><div className="block-bank-label bank-t-label">🩷 Tens — tap to pick!</div><div className="block-bank-row">{Array.from({length:10},(_,i)=><div key={i} className={`sel-ten ${i<sel.t?'on':'off'}`} onClick={()=>toggle('t',i)}>{Array.from({length:10},(_,j)=><div key={j} className="inner-cell"/>)}</div>)}</div></>}
        <div className="block-bank-label bank-o-label">⭐ Ones — tap to pick!</div>
        <div className="block-bank-row">{Array.from({length:10},(_,i)=><div key={i} className={`sel-one ${i<sel.o?'on':'off'}`} onClick={()=>toggle('o',i)}/>)}</div>
      </div>
      {won?<><div className="celebrate-text">🦄✨ Perfect! {target} is right! 🌈🌸</div><button className="new-number-btn" onClick={newNum}>New Number 🌸</button></>
         :<>{shake&&<div className="wrong-text">🙈 Try again!</div>}<button className="check-btn" onClick={check}>Check ✓ 💜</button><button className="new-number-btn" onClick={newNum}>New Number 🌸</button></>}
    </div>
  );
}

/* ══ MODE 2-A  Hop to a Number ══ */
function NumberLineHop({onBack}){
  const [char]=useState(()=>CHARACTERS[rand(0,CHARACTERS.length-1)]);
  const [preset,setPreset]=useState(LINE_PRESETS[0]);
  const [showSettings,setShowSettings]=useState(false);
  const [muted,setMuted]=useState(false);
  const [pos,setPos]=useState(()=>LINE_PRESETS[0].min);
  const [target,setTarget]=useState(()=>rand(LINE_PRESETS[0].min+1,LINE_PRESETS[0].max));
  const [celebrating,setCel]=useState(false);
  const [confetti,setConf]=useState(false);
  const [score,setScore]=useState(0);
  const [flowers,setFlowers]=useState(0);
  const [correctId,setCorrId]=useState(null);
  const [hopsFromStart,setHops]=useState(0);
  const startRef=useRef(LINE_PRESETS[0].min);

  const next=useCallback(()=>{
    const {min,max}=preset;
    const p=rand(min,max-1);
    startRef.current=p;setPos(p);setTarget(rand(p+1,max));
    setCel(false);setCorrId(null);setHops(0);
  },[preset]);

  const applyPreset=p=>{
    setPreset(p);
    const st=rand(p.min,p.max-1);
    startRef.current=st;setPos(st);setTarget(rand(st+1,p.max));
    setCel(false);setCorrId(null);setHops(0);
  };

  const tap=useCallback((n)=>{
    Sound.setMuted(muted);
    if(celebrating)return;
    if(n===target){
      setPos(n);setCorrId(n);setCel(true);setConf(true);
      Sound.ding();setTimeout(()=>Sound.celebrate(),200);
      setScore(s=>s+1);
      setFlowers(f=>{const nf=Math.min(f+1,MAX_FLOWERS);if(nf===MAX_FLOWERS)setTimeout(()=>Sound.allFlowers(),300);return nf;});
      setHops(Math.abs(n-startRef.current));
      setTimeout(()=>setConf(false),2500);
    } else{Sound.hop();setPos(n);setHops(Math.abs(n-startRef.current));}
  },[target,celebrating,muted]);

  const {min,max}=preset;
  const count=max-min+1;
  const nlColor=n=>{const[bg,sh]=NL_COLORS[(n-min)%NL_COLORS.length];return{background:bg,boxShadow:`0 4px 0 ${sh}`};};
  const charIdx=pos-min;
  const charPct=count>1?(charIdx/(count-1))*100*(count/(count+1)):0;

  return(
    <div className="screen line-screen">
      {showSettings&&<SettingsModal title="Number Range" presets={LINE_PRESETS} current={preset} onChange={applyPreset} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={()=>setMuted(m=>{Sound.setMuted(!m);return !m;})} label={preset.tag}/>
      <ScoreRow score={score} flowers={flowers}/>
      {celebrating
        ?<div className="celebrate-text">🎉✨ You hopped to {target}! {hopsFromStart} hops! 🦄🌈</div>
        :<div className="prompt-bubble">Hop to <span className="target-num">{target}</span>! 🎯</div>}
      {hopsFromStart>0&&!celebrating&&(
        <div className="hop-counter">{pos>startRef.current?'→':'←'} {hopsFromStart} hop{hopsFromStart!==1?'s':''} from {startRef.current}</div>
      )}
      <div className="char-wrap">
        <div className="character" style={{left:`calc(${charPct}% - 26px)`}}>{char}</div>
      </div>
      <div className="number-line-wrapper">
        <div className="number-line">
          <div className="nl-track"/>
          {Array.from({length:count},(_,i)=>{
            const n=min+i;
            return<button key={n}
              className={`nl-number ${n===pos&&!celebrating?'current':''} ${n===pos&&!celebrating&&n===startRef.current?'start-marker':''} ${n===correctId?'correct':''}`}
              style={nlColor(n)} onClick={()=>tap(n)}>{n}</button>;
          })}
        </div>
      </div>
      {celebrating&&<button className="next-btn" onClick={next}>Next 🌸</button>}
    </div>
  );
}

/* ══ MODE 2-B  Add & Subtract ══ */
function makeProb(min,max){
  const range=max-min;
  const maxHop=Math.min(5,Math.max(1,Math.floor(range/3)));
  const op=Math.random()<.5?'+':'-';
  if(op==='+'){const s=rand(min,max-1),a=rand(1,Math.min(maxHop,max-s));return{start:s,op:'+',amount:a,answer:s+a};}
  else{const s=rand(min+1,max),a=rand(1,Math.min(maxHop,s-min));return{start:s,op:'-',amount:a,answer:s-a};}
}

function NumberLineAddSub({onBack}){
  const [char]=useState(()=>CHARACTERS[rand(0,CHARACTERS.length-1)]);
  const [preset,setPreset]=useState(LINE_PRESETS[0]);
  const [showSettings,setShowSettings]=useState(false);
  const [muted,setMuted]=useState(false);
  const [prob,setProb]=useState(()=>makeProb(1,10));
  const [celebrating,setCel]=useState(false);
  const [wrongId,setWrong]=useState(null);
  const [confetti,setConf]=useState(false);
  const [score,setScore]=useState(0);
  const [flowers,setFlowers]=useState(0);

  const next=useCallback(()=>{setProb(makeProb(preset.min,preset.max));setCel(false);setWrong(null);},[preset]);
  const applyPreset=p=>{setPreset(p);setProb(makeProb(p.min,p.max));setCel(false);setWrong(null);};

  const tap=useCallback((n)=>{
    Sound.setMuted(muted);
    if(celebrating)return;
    if(n===prob.answer){
      setCel(true);setConf(true);Sound.ding();setTimeout(()=>Sound.celebrate(),200);
      setScore(s=>s+1);
      setFlowers(f=>{const nf=Math.min(f+1,MAX_FLOWERS);if(nf===MAX_FLOWERS)setTimeout(()=>Sound.allFlowers(),300);return nf;});
      setTimeout(()=>setConf(false),2500);
    } else{setWrong(n);Sound.wrong();setTimeout(()=>setWrong(null),400);}
  },[prob,celebrating,muted]);

  const {min,max}=preset;
  const count=max-min+1;
  const nlColor=n=>{const[bg,sh]=NL_COLORS[(n-min)%NL_COLORS.length];return{background:bg,boxShadow:`0 4px 0 ${sh}`};};

  const pathSet=new Set();
  if(prob.op==='+'){for(let i=prob.start+1;i<=prob.answer;i++)pathSet.add(i);}
  else{for(let i=prob.answer;i<prob.start;i++)pathSet.add(i);}

  const orderedPath=prob.op==='+'
    ?Array.from({length:prob.amount},(_,i)=>prob.start+1+i)
    :Array.from({length:prob.amount},(_,i)=>prob.start-1-i);

  const charPos=celebrating?prob.answer:prob.start;
  const charIdx=charPos-min;
  const charPct=count>1?(charIdx/(count-1))*100*(count/(count+1)):0;

  return(
    <div className="screen addsub-screen">
      {showSettings&&<SettingsModal title="Number Range" presets={LINE_PRESETS} current={preset} onChange={applyPreset} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={()=>setMuted(m=>{Sound.setMuted(!m);return !m;})} label={preset.tag}/>
      <ScoreRow score={score} flowers={flowers}/>
      {celebrating
        ?<div className="celebrate-text">🦄✨ {prob.start} {prob.op} {prob.amount} = {prob.answer}! 🌈🌸</div>
        :<div className="prompt-bubble">
          <span className="start-num">{prob.start}</span>{' '}
          {prob.op==='+'?<span className="op-add">+ {prob.amount} →</span>:<span className="op-sub">− {prob.amount} ←</span>}
          {' '}<span className="eq-mark">=</span>{' '}<span className="target-num">?</span>
        </div>}
      <div className="char-wrap">
        <div className="character" style={{left:`calc(${charPct}% - 26px)`}}>{char}</div>
      </div>
      {/* hop arrows with START flag and numbered badges */}
      <div className="hop-strip">
        <div className="hop-arrows">
          {Array.from({length:count},(_,i)=>{
            const n=min+i;
            const hi=orderedPath.indexOf(n);
            const inPath=hi>=0;
            const isStart=n===prob.start&&!celebrating;
            const arrow=inPath?(prob.op==='+'?'→':'←'):null;
            return(
              <div key={i} className={`hop-cell ${isStart?'start-cell':''}`}>
                {isStart
                  ?<span className="start-flag">🏁</span>
                  :inPath
                    ?<span className={prob.op==='+'?'hop-num-badge hop-num-add':'hop-num-badge hop-num-sub'}>{hi+1}</span>
                    :<span style={{height:18,display:'block'}}/>
                }
                {inPath?<span className={prob.op==='+'?'hop-arrow-add':'hop-arrow-sub'}>{arrow}</span>:<span className="hop-dot"/>}
              </div>
            );
          })}
        </div>
      </div>
      <div className="number-line-wrapper">
        <div className="number-line">
          <div className="nl-track"/>
          {Array.from({length:count},(_,i)=>{
            const n=min+i;
            return<button key={n}
              className={`nl-number
                ${n===prob.start&&!celebrating?'start-marker':''}
                ${n===prob.answer&&celebrating?'correct':''}
                ${pathSet.has(n)&&!celebrating?'hop-path':''}
                ${n===wrongId?'wrong':''}
              `}
              style={nlColor(n)} onClick={()=>tap(n)}>{n}</button>;
          })}
        </div>
      </div>
      {celebrating&&<button className="next-btn" onClick={next}>Next 🌸</button>}
    </div>
  );
}

  return(
    <div className="home">
      <BgDeco/>
      <div className="home-rainbow">🌈🌸🦄🌸🌈</div>
      <div className="home-title">
        {title.map((c,i)=><span key={i} style={{color:TITLE_COLORS[i%TITLE_COLORS.length],animationDelay:`${i*.07}s`,textShadow:`0 3px 0 ${TITLE_COLORS[(i+4)%TITLE_COLORS.length]}55`}}>{c}</span>)}
      </div>
      <div className="home-sub">🌟 Choose your adventure! 🌟</div>
      <div className="mode-section">
        <div className="mode-section-label">🧱 Counting Blocks</div>
        <div className="mode-row">
          <button className="mode-card mc-pink"   onClick={()=>onSelect('b1')}><div className="mode-card-icon">🧱</div><div className="mode-card-label">Build It!</div><div className="mode-card-stars">⭐</div></button>
          <button className="mode-card mc-purple" onClick={()=>onSelect('b2')}><div className="mode-card-icon">💜</div><div className="mode-card-label">Choose the Right Blocks</div><div className="mode-card-stars">⭐⭐</div></button>
        </div>
      </div>
      <div className="mode-section">
        <div className="mode-section-label">🌈 Number Line</div>
        <div className="mode-row">
          <button className="mode-card mc-rose"  onClick={()=>onSelect('l1')}><div className="mode-card-icon">🦄</div><div className="mode-card-label">Hop to a Number</div><div className="mode-card-stars">⭐</div></button>
          <button className="mode-card mc-magic" onClick={()=>onSelect('l2')}><div className="mode-card-icon">👸</div><div className="mode-card-label">Add &amp; Subtract</div><div className="mode-card-stars">⭐⭐</div></button>
        </div>
      </div>
      <div style={{fontSize:'1.5rem',letterSpacing:'8px',animation:'bounce 2s ease-in-out infinite alternate'}}>🌸🌺🌷🌼🌸</div>
    </div>
  );
}

/* ══ APP ══ */
function App(){
  const [mode,setMode]=useState(null);
  if(mode==='b1')return<BlocksGuided     onBack={()=>setMode(null)}/>;
  if(mode==='b2')return<BlocksChoose     onBack={()=>setMode(null)}/>;
  if(mode==='l1')return<NumberLineHop    onBack={()=>setMode(null)}/>;
  if(mode==='l2')return<NumberLineAddSub onBack={()=>setMode(null)}/>;
  return<Home onSelect={setMode}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
