    <aside class="side"><div class="guide-wrap"><div class="guide-character" role="img" aria-label="Your world guide"></div><p id="guideSpeech" class="guide-speech">Tap a box, then use the number pad.</p></div><div class="helpbar">
      <button class="help" data-help="hint"><svg viewBox="0 0 40 40"><path d="M14 27h12M15 31h10M20 5a11 11 0 0 0-7 19c2 2 3 3 3 5h8c0-2 1-3 3-5A11 11 0 0 0 20 5Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>Hint</span></button>
      <button class="help" data-help="show"><svg viewBox="0 0 40 40"><path d="M7 20h20M21 13l7 7-7 7M9 8v24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>Show Next Step</span></button>
      <button class="help check" data-help="check"><svg viewBox="0 0 40 40"><path d="M7 20l8 8L33 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Check My Work</span></button>
      <button class="help" data-help="why"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="3"/><path d="M15 15a5 5 0 1 1 7 5c-2 1-2 2-2 4M20 30h.1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span>Explain Why</span></button>
      <button class="help" data-help="guide"><svg viewBox="0 0 40 40"><path d="M8 31c7-8 9-14 9-22M17 9l-5 5M17 9l4 6M19 31c5-7 9-10 14-12M33 19l-7-1M33 19l-2 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Guide Me</span></button>
    </div><div id="keypadDock" class="keypad-dock"></div>
    <button id="scratchToggle" class="scratch-toggle" aria-expanded="false"><svg viewBox="0 0 40 40"><path d="M8 31l3-9L27 6l7 7-16 16-10 2Zm4-10 7 7M25 8l7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><span>Scratchpad</span></button>

    </aside></section>
</main>
<script type="module">
import { makeProblem, checkWork } from "./js/math-helper-engine.js";

const $ = selector => document.querySelector(selector);
const world = new URLSearchParams(location.search).get("world");
const worldMenus = {space:"space-math.html",unicorn:"unicorn-math.html",mermaid:"mermaid-math.html"};
if(worldMenus[world]){document.body.dataset.world=world;$("#helperBack").href=`./${worldMenus[world]}`;$("#helperBack").setAttribute("aria-label",`Back to ${world[0].toUpperCase()+world.slice(1)} Math`)}
const readout = $("#questionReadout");
const notebook = $("#notebook");
const CARRY_POSITION = "above"; // Owner default: above the top number, over the receiving column.
let entry = { a: "", op: "", b: "" }, problem = null, work = {}, selected = null, guide = false;
const misses = new Map();
const VOICE_LINES=Object.freeze({
  title:"My Math Helper.",typeQuestion:"Type your question, then tap Go.",chooseBox:"Tap a box, then use the number pad.",
  tryFirst:"Try this step. I'm here if you want help.",correct:"That box is correct.",checkAgain:"Check this box and try again.",
  allCorrect:"Every step is correct. You worked it out.",hint:"Here's a hint.",showStep:"Let's look at the next step.",
  why:"Here is why this step works.",guideOn:"Guide mode is on. You still fill each box.",guideOff:"Guide mode is off. Keep going your way.",
  filledCorrect:"Your filled boxes are correct. Keep going.",wholeSwap:"This helper can't go below zero. Put the bigger number on top.",
  divideZero:"We cannot divide by zero. Choose a different divisor.",backQuestion:"Back to the question.",zero:"Zero."
});
const STEP_RULE_LINES=Object.freeze({
  startRight:"Start at the right-hand column.",addPlace:"Add the digits in this place.",
  carry:"When a column makes ten or more, write the ones and carry the tens.",subtractPlace:"Subtract the digits in this place.",
  borrow:"When the top digit is too small, borrow from the next place that isn't zero.",multiplyPlace:"Multiply by one digit at a time.",
  align:"Move each new partial product one place left.",addPartials:"Add the partial products by place value.",
  divideLeft:"Start division at the left.",divideGroups:"Find how many whole groups fit.",bringDown:"Bring down the next digit.",
  remainder:"The remainder is what is left after the last whole group."
});
const narration={texts:new Map(),audio:null,queue:[]};
async function loadNarration(){for(const set of ["shared","math-helper"]){try{const data=await fetch(`assets-runtime/narration/${set}/clips.json`).then(r=>r.ok?r.json():Promise.reject());for(const [text,id] of Object.entries(data.texts||data.renderedTexts||{}))narration.texts.set(text,`assets-runtime/narration/${set}/${id}.m4a`)}catch(e){}}try{const data=await fetch("assets-runtime/narration/times-tables/clips.json").then(r=>r.ok?r.json():Promise.reject());const have=new Set(data.clips||[]);for(let digit=0;digit<=9;digit+=1){const id=`tt-n-${digit}`;if(have.has(id))narration.texts.set(String(digit),`assets-runtime/narration/times-tables/${id}.m4a`)}}catch(e){}}
function playNextVoice(){const text=narration.queue.shift();if(!text)return;const src=narration.texts.get(text);if(!src){playNextVoice();return}try{narration.audio?.pause();narration.audio=new Audio(src);narration.audio.addEventListener("ended",playNextVoice,{once:true});narration.audio.play().catch(playNextVoice)}catch(e){playNextVoice()}}
function speak(text){narration.queue=[text];playNextVoice()}
function speakSequence(lines){narration.queue=lines.filter(Boolean);playNextVoice()}
function stepRuleKind(step,context="current"){
  if(!step)return "";
  if(step.id.startsWith("add-"))return step.calculation?.carryOut?"carry":"addPlace";
  if(step.id.startsWith("subtract-"))return step.calculation?.borrowed?"borrow":"subtractPlace";
  if(step.id==="multiply-sum")return "addPartials";
  if(step.id.startsWith("multiply-"))return step.calculation?.shift?"align":"multiplyPlace";
  if(step.id==="division-remainder")return "remainder";
  if(step.id.startsWith("divide-"))return step.calculation&&step.id===problem?.steps.find(item=>item.id.startsWith("divide-"))?.id?(context==="help"?"divideGroups":"divideLeft"):"bringDown";
  return "";
}
function stepRuleLine(step,context="current"){return STEP_RULE_LINES[stepRuleKind(step,context)]||""}
function speakStepRule(step,context="current"){const line=stepRuleLine(step,context);if(line)speak(line)}
loadNarration();

function questionText(){ return `${entry.a}${entry.op ? ` ${entry.op} ` : ""}${entry.b}`; }
function updateReadout(message){ readout.innerHTML = message ? `<span class="empty">${message}</span>` : questionText() || '<span class="empty">Type a number, an operation, and another number.</span>'; }
function questionKey(value){
  if(problem && (/^\d$/.test(value) || value==="back")){writeSelected(value);return}
  if (/^\d$/.test(value)) { const side = entry.op ? "b" : "a",first=!entry.a&&!entry.b;if(first)speakSequence([VOICE_LINES.title,VOICE_LINES.typeQuestion]);else speak(value==="0"?VOICE_LINES.zero:value);if(entry[side].length < 4) entry[side] += value; }
  else if (["+","-","×","÷"].includes(value) && entry.a) entry.op = value;
  else if (value === "back") { const side = entry.b ? "b" : entry.op ? "op" : "a"; entry[side] = entry[side].slice(0,-1); }
  else if (value === "clear") entry = { a:"",op:"",b:"" };
  else if (value === "go") startProblem();
  updateReadout();
}
function buildKeys(){
  const q = ["7","8","9","+","-","back","4","5","6","×","÷","clear","1","2","3","0","go"];
  const operationIcon={"+":"M16 5v22M5 16h22","-":"M5 16h22","×":"M7 7l18 18M25 7 7 25","÷":"M5 16h22M16 7h.1M16 25h.1"};
  $("#questionKeys").innerHTML = q.map(v=>{const op=operationIcon[v];const label=v==="+"?"plus":v==="-"?"minus":v==="×"?"times":v==="÷"?"divided by":v==="back"?"backspace":v==="clear"?"Clear":v==="go"?"Go":v;const content=op?`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="${op}" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>`:v==="back"?'<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 8 5 16l8 8h14V8H13Zm4 5 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':v==="clear"?"Clear":v==="go"?"Go":v;return `<button class="key ${op?"op question-only":""} ${["clear","go"].includes(v)?"question-only":""} ${v==="go"?"go":""}" data-q="${v}" aria-label="${label}">${content}</button>`}).join("");
  $("#questionKeys").addEventListener("click",e=>{const key=e.target.closest("[data-q]");if(key)questionKey(key.dataset.q)});
}
function startProblem(){
  if (!entry.a || !entry.op || !entry.b) { updateReadout("Finish both numbers first."); return; }
  problem = makeProblem(Number(entry.a),entry.op,Number(entry.b)); work={};selected=null;guide=false;misses.clear();lastAnnouncedStep="";
  document.body.classList.add("solving");$("#questionKeys").classList.add("workspace");$("#keypadDock").append($("#questionKeys"));$("#topNewQuestion").hidden=false;render();
  if(problem.needsSwap){$("#guideSpeech").textContent=VOICE_LINES.wholeSwap;speak(VOICE_LINES.wholeSwap);return}
  if(problem.message){$("#guideSpeech").textContent=VOICE_LINES.divideZero;speak(VOICE_LINES.divideZero);return}
  const firstStep=stepFor(nextCell()),startsRight=problem.op!=="÷"?STEP_RULE_LINES.startRight:"";
  $("#guideSpeech").textContent=VOICE_LINES.tryFirst;speakSequence([VOICE_LINES.tryFirst,VOICE_LINES.chooseBox,startsRight,stepRuleLine(firstStep)]);
}
function swapProblem(){ const old=entry.a;entry.a=entry.b;entry.b=old;updateReadout();startProblem(); }
function allCells(){ return problem ? problem.steps.flatMap(step=>step.cells) : []; }
function nextCell(){ return checkWork(problem,work).next; }
function ensureStepVisible(id){requestAnimationFrame(()=>{const meta=allCells().find(c=>c.id===id),step=stepFor(meta);if(!step)return;const boxes=step.cells.map(c=>document.querySelector(`[data-cell="${CSS.escape(c.id)}"]`)).filter(Boolean);if(!boxes.length)return;const pane=notebook.getBoundingClientRect(),top=Math.min(...boxes.map(el=>el.getBoundingClientRect().top)),bottom=Math.max(...boxes.map(el=>el.getBoundingClientRect().bottom));if(top<pane.top+8)notebook.scrollTop-=pane.top+8-top;else if(bottom>pane.bottom-54)notebook.scrollTop+=bottom-(pane.bottom-54)})}
let lastAnnouncedStep="";
function selectCell(id,announce=true){selected=id;document.querySelectorAll(".cell").forEach(el=>el.classList.toggle("selected",el.dataset.cell===id));ensureStepVisible(id);const step=stepFor(allCells().find(c=>c.id===id));if(announce&&step&&step.id!==lastAnnouncedStep){lastAnnouncedStep=step.id;speakStepRule(step)}}
function writeSelected(value){
  if(!selected)return;
  const meta=allCells().find(c=>c.id===selected);if(!meta)return;
  if(value==="back") work[selected]=(work[selected]||"").slice(0,-1); else if((work[selected]||"").length<(meta.maxDigits||1)){work[selected]=(work[selected]||"")+value;speak(value==="0"?VOICE_LINES.zero:value)}
  const el=document.querySelector(`[data-cell="${CSS.escape(selected)}"]`);if(el){el.value=work[selected]||"";el.classList.remove("wrong","correct")}
  if(work[selected]===meta.expected){el?.classList.add("correct");const completedStep=stepFor(meta),next=nextCell(),nextStep=stepFor(next);if(next){selectCell(next.id,false);const changed=nextStep?.id!==completedStep?.id;if(changed)lastAnnouncedStep=nextStep.id;speakSequence([VOICE_LINES.correct,changed?stepRuleLine(nextStep):null]);if(guide){document.querySelectorAll(".cell").forEach(box=>box.classList.remove("guide"));document.querySelector(`[data-cell="${CSS.escape(next.id)}"]`)?.classList.add("guide");message(`${nextStep.instruction} You still fill the box.`,"teach")}}else message(VOICE_LINES.allCorrect,"good",[VOICE_LINES.correct,VOICE_LINES.allCorrect]);}
}
function rowHtml(label,cells,width,extra="",ariaLabel=label){
  const slots=Array(width).fill("");cells.forEach(c=>{slots[c.slot??(width-1-c.column)]=`<input readonly inputmode="none" class="cell ${c.kind}" data-cell="${c.id}" data-step="${c.step}" aria-label="${c.kind} in the ${c.column>=0?c.column+1:"next"} place" maxlength="${c.maxDigits||1}" value="${work[c.id]||""}">`});
  return `<div class="math-row work-row ${extra}" style="--cols:${width}"><span class="row-label"${ariaLabel?` aria-label="${ariaLabel}"`:""}>${label}</span>${slots.map((v,i)=>v||`<span aria-hidden="true"></span>`).join("")}</div>`;
}
function render(){
  if(problem.needsSwap){notebook.innerHTML=`<div class="swap"><h2>Keep the bigger number on top</h2><p>${problem.message}</p><button id="swapButton">Swap to ${problem.b} − ${problem.a}</button></div>`;$("#swapButton").onclick=swapProblem;return}
  if(problem.message){notebook.innerHTML=`<div class="swap"><h2>Choose another question</h2><p>${problem.message}</p></div>`;return}
  const width=problem.width;const workRows=new Set(allCells().map(c=>c.row||c.kind)).size;const density=workRows>=8?"dense":workRows>=5?"compact":"";let html=`<div class="problem-head"><h2>${problem.a} ${problem.op} ${problem.b}</h2></div><div class="vertical ${density}" data-work-rows="${workRows}">`;
  const grouped=new Map();allCells().forEach(c=>{const group=c.row||c.kind;if(!grouped.has(group))grouped.set(group,[]);grouped.get(group).push(c)});
  if(problem.op==="÷"){
    html+=rowHtml("",grouped.get("quotient")||[],width,"divider");
    html+=`<div class="math-row" style="--cols:${width}"><span></span><div class="division-given"><span class="divisor">${problem.b}</span><span class="dividend">${problem.a}</span></div></div>`;
    for(const [key,cells] of grouped) if(key!=="quotient") html+=rowHtml(key.startsWith("divide-product")?"−":key==="final-remainder"?"R":"",cells,width,key.startsWith("divide-product")?"divider":"");
  }else{
    const preGroups=[...grouped.entries()].filter(([key])=>key.startsWith("borrow-")||(key==="carry"&&CARRY_POSITION==="above"));
    for(const [key,cells] of preGroups) html+=key==="carry"?rowHtml("",cells,width,"","carry"):rowHtml("",cells,width,"","borrow");
    html+=`<div class="math-row" style="--cols:${width}"><span class="row-label"></span><span class="given">${problem.a}</span></div>`;
    html+=`<div class="math-row divider" style="--cols:${width}"><span class="row-label">${problem.op}</span><span class="given">${problem.b}</span></div>`;
    const order=[...grouped.entries()].filter(([key])=>!key.startsWith("borrow-")&&key!=="carry").sort((a,b)=>Math.min(...a[1].map(c=>c.step))-Math.min(...b[1].map(c=>c.step)));
    for(const [key,cells] of order) html+=rowHtml(key.startsWith("partial-")&&key!=="partial-0"?"+":"",cells,width,key==="answer"?"divider":"");
    if(CARRY_POSITION==="below"&&grouped.has("carry"))html+=rowHtml("",grouped.get("carry"),width,"","carry");
  }
  html+=`</div><div id="stepNote" class="step-note">Tap the first empty box. Try it yourself, or ask for help.</div>`;notebook.innerHTML=html;
  notebook.querySelectorAll(".cell").forEach(el=>el.addEventListener("click",()=>selectCell(el.dataset.cell)));
  const next=nextCell();if(next)selectCell(next.id,false);
}
function renderWelcome(){notebook.innerHTML='<div class="welcome"><h2>Make a sum!</h2><p>Choose two numbers and a maths sign. I will stay beside you while you work it out.</p></div>'}
function resetQuestion(){problem=null;work={};selected=null;entry={a:"",op:"",b:""};document.body.classList.remove("solving");$("#questionKeys").classList.remove("workspace");$("#questionBar").append($("#questionKeys"));$("#topNewQuestion").hidden=true;updateReadout();renderWelcome()}
$("#topNewQuestion").addEventListener("click",resetQuestion);
function stepFor(cell){return problem.steps.find(step=>step.cells.some(item=>item.id===cell?.id))}
function message(text,kind="",voiceText=[]){const el=$("#stepNote");if(el){el.textContent=text;el.className=`step-note ${kind}`}const bubble=$("#guideSpeech");if(bubble)bubble.textContent=text;const lines=Array.isArray(voiceText)?voiceText:[voiceText];if(lines.some(Boolean))speakSequence(lines)}
function revealStep(step){step.cells.forEach(c=>{if(work[c.id]!==c.expected)work[c.id]=c.expected});render();message(`${step.title}: ${step.instruction}`,"teach")}
function help(action){
  if(!problem||problem.message||problem.needsSwap)return;
  const result=checkWork(problem,work), next=result.next, step=stepFor(next);
  if(!next){message(VOICE_LINES.allCorrect,"good",VOICE_LINES.allCorrect);return}
  if(action==="hint") {const count=(misses.get(step.id)||0)+1;misses.set(step.id,count);if(count>=3){work[next.id]=next.expected;render();const after=stepFor(nextCell());message(`This box is ${next.expected}. Now try the next one.`,"teach",[VOICE_LINES.showStep,stepRuleLine(after||step)]);}else if(count===2)message(step.why,"teach",[VOICE_LINES.why,stepRuleLine(step,"help")]);else message(step.hint,"",[VOICE_LINES.hint,stepRuleLine(step,"help")])}
  if(action==="show") {const rule=stepRuleLine(step,"help");revealStep(step);speakSequence([VOICE_LINES.showStep,rule])}
  if(action==="why") message(step.why,"teach",[VOICE_LINES.why,stepRuleLine(step,"help")]);
  if(action==="guide") {guide=!guide;document.querySelector('[data-help="guide"]').classList.toggle("guide-on",guide);document.querySelectorAll(".cell").forEach(el=>el.classList.remove("guide"));if(guide){selectCell(next.id,false);document.querySelector(`[data-cell="${CSS.escape(next.id)}"]`)?.classList.add("guide");message(`${step.instruction} You still fill the box.`,"teach",[VOICE_LINES.guideOn,stepRuleLine(step,"help")])}else message(VOICE_LINES.guideOff,"",VOICE_LINES.guideOff)}
  if(action==="check") {
    document.querySelectorAll(".cell").forEach(el=>el.classList.remove("wrong","correct"));
    result.correct.forEach(id=>document.querySelector(`[data-cell="${CSS.escape(id)}"]`)?.classList.add("correct"));result.wrong.forEach(id=>document.querySelector(`[data-cell="${CSS.escape(id)}"]`)?.classList.add("wrong"));
    const correctLead=result.correct.length?VOICE_LINES.correct:"";
    if(result.wrong.length){const wrong=result.wrong[0],wrongStep=stepFor({id:wrong});const count=(misses.get(wrongStep.id)||0)+1;misses.set(wrongStep.id,count);if(count>=3){work[wrong]=allCells().find(c=>c.id===wrong).expected;render();message(`This box is ${work[wrong]}. Keep your correct boxes.`,"teach",[correctLead,VOICE_LINES.showStep,stepRuleLine(wrongStep,"help")])}else{message(count===2?wrongStep.why:`Check this box: ${wrongStep.errorKind}.`,count===2?"teach":"",[correctLead,count===2?VOICE_LINES.why:VOICE_LINES.checkAgain,stepRuleLine(wrongStep,"help")]);selectCell(wrong,false)}}else if(result.complete)message(VOICE_LINES.allCorrect,"good",[correctLead,VOICE_LINES.allCorrect]);else{message(VOICE_LINES.filledCorrect,"good",[correctLead,VOICE_LINES.filledCorrect,stepRuleLine(step,"current")]);selectCell(next.id,false)}
  }
}
document.querySelectorAll("[data-help]").forEach(button=>button.addEventListener("click",()=>help(button.dataset.help)));

const scratch=$("#scratch"),canvas=$("#scratchCanvas"),ctx=canvas.getContext("2d");let drawing=false,last=null,colour="#334d8f",pen=6,eraser=false,sizeIndex=0;const strokes=[];const sizes=["small","medium","large"];
function resizeCanvas(){const rect=canvas.getBoundingClientRect(),ratio=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineCap="round";ctx.lineJoin="round";replay()}
function replay(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const stroke of strokes){ctx.strokeStyle=stroke.eraser?"#fff":stroke.colour;ctx.lineWidth=stroke.pen;ctx.beginPath();stroke.points.forEach((p,i)=>i?ctx.lineTo(p.x*canvas.clientWidth,p.y*canvas.clientHeight):ctx.moveTo(p.x*canvas.clientWidth,p.y*canvas.clientHeight));ctx.stroke()}}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
canvas.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"&&!e.isPrimary)return;drawing=true;last=point(e);strokes.push({colour,pen,eraser,points:[last]})});canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=point(e),r=canvas.getBoundingClientRect();ctx.strokeStyle=eraser?"#fff":colour;ctx.lineWidth=eraser?22:pen;ctx.beginPath();ctx.moveTo(last.x*r.width,last.y*r.height);ctx.lineTo(p.x*r.width,p.y*r.height);ctx.stroke();strokes.at(-1).points.push(p);last=p});["pointerup","pointercancel","pointerleave"].forEach(name=>canvas.addEventListener(name,()=>{drawing=false;last=null}));
const icon=(path)=>`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="${path}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function scratchTools(){const tools=[`<button class="scratch-tool scratch-size" data-tool="size" aria-label="Change scratchpad size">${icon("M12 12L6 6m0 0v6m0-6h6M20 20l6 6m0 0v-6m0 6h-6")}</button>`,...[["#334d8f","blue"],["#d13f55","red"],["#24855e","green"],["#7c4aa1","purple"]].map(([c,n])=>`<button class="scratch-tool crayon" style="background:${c}" data-colour="${c}" aria-label="Choose the ${n} crayon"></button>`),...[4,7,12].map((n,i)=>`<button class="scratch-tool" data-pen="${n}" aria-label="${["Thin","Medium","Thick"][i]} crayon">${icon(`M5 16h22${n>4?"M5 19h22":""}${n>8?"M5 13h22":""}`)}</button>`),`<button class="scratch-tool" data-tool="eraser" aria-label="Eraser">${icon("M7 23 20 7l7 7-11 13H9l-2-4Zm9 4 5-6")}</button>`,`<button class="scratch-tool" data-tool="clear" aria-label="Clear page">${icon("M9 10h14l-1 17H10L9 10Zm-2 0h18M13 10V6h6v4")}</button>`];$("#scratchTools").innerHTML=tools.join("")}
$("#scratchTools").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.colour){colour=b.dataset.colour;eraser=false}if(b.dataset.pen){pen=Number(b.dataset.pen);eraser=false}if(b.dataset.tool==="eraser")eraser=true;if(b.dataset.tool==="clear"){strokes.length=0;replay()}if(b.dataset.tool==="size"){sizeIndex=(sizeIndex+1)%3;scratch.classList.remove(...sizes.map(s=>`scratch-size-${s}`));scratch.classList.add(`scratch-size-${sizes[sizeIndex]}`);requestAnimationFrame(resizeCanvas)}});
function toggleScratch(open){const closedLarge=!open&&scratch.classList.contains("open")&&scratch.classList.contains("scratch-size-large");scratch.classList.toggle("open",open);scratch.dataset.question=questionText();$("#scratchToggle").setAttribute("aria-expanded",String(open));if(open)requestAnimationFrame(resizeCanvas);else if(closedLarge)speak(VOICE_LINES.backQuestion)}$("#scratchToggle").onclick=()=>toggleScratch(!scratch.classList.contains("open"));$("#scratchClose").onclick=()=>toggleScratch(false);new ResizeObserver(()=>{if(scratch.classList.contains("open"))resizeCanvas()}).observe(scratch);
buildKeys();scratchTools();updateReadout();
</script>
</body>
