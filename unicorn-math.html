<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <!-- Plain name, deliberately. This read "Magic Math v7" from 7343cc3 until
       2026-08-17 — a version nobody maintained, which drifted out of step with
       CACHE_NAME and then collided with it. No other page carries a version, and
       a title that has to be edited on every publish will be wrong again by the
       next one. -->
  <title>Unicorn Math</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <meta name="theme-color" content="#0a0e2d"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Magic Math"/>
  <script src="./vendor/react-18.3.1.production.min.js"></script>
  <script src="./vendor/react-dom-18.3.1.production.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}

    /* ── BG DECO ── */
    .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .bg-deco img{position:absolute;object-fit:contain;animation:twinkleDeco ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(255,213,79,.35));will-change:transform,opacity}
    @keyframes twinkleDeco{
      0%{opacity:.06;transform:scale(.55) rotate(-12deg)}
      100%{opacity:var(--deco-opacity,.5);transform:scale(1.15) rotate(12deg)}
    }
    @media (prefers-reduced-motion: reduce){
      .bg-deco img{animation:none!important;opacity:.12!important}
    }
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

    /* ── HOME ── */
    .home{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;overflow:hidden}
    .home-bg{position:absolute;inset:0;background:url('assets-runtime/unicorn/bg-home.webp') center/cover no-repeat;z-index:0}
    .home-tint{position:absolute;inset:0;background:rgba(252,228,236,.42);z-index:0}
    .home>*:not(.home-bg):not(.home-tint):not(.music-btn):not(.hub-btn){position:relative;z-index:1}
    .ai-note{margin:2px auto 18px;max-width:34rem;padding:0 16px;text-align:center;
      font-size:.72rem;font-weight:700;line-height:1.5;color:#7b1fa2;opacity:.72}
    .home-rainbow{font-size:clamp(.9rem,3vw,1.4rem);letter-spacing:4px;animation:bounce 1.4s ease-in-out infinite alternate}
    .home-title{font-size:clamp(1.8rem,7vw,3.2rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:clamp(.85rem,2.8vw,1.1rem);font-weight:900;color:#7b1fa2;background:rgba(255,255,255,.7);border-radius:50px;padding:6px 20px;box-shadow:0 2px 8px rgba(171,71,188,.2)}
    .mode-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:640px}
    .mode-section-label{font-size:.95rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:2px;background:rgba(255,255,255,.75);border-radius:50px;padding:5px 18px}
    .mode-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
    /* Only the row that holds a badged card opts out of stretch. Stretching it
       left a badge-sized hole under Column Add and Take Away that read as
       missing art; letting each card end where its content ends costs a ragged
       bottom edge and buys the badged card literally standing taller, which is
       the message. It stays scoped to this row because the others rely on
       stretch — Add & Subtract carries no subtitle and is 15px shorter than
       Times Tables beside it, so making this global went ragged where nothing
       was being said. */
    .mode-row.has-badge{align-items:flex-start}
    /* "Borrow Take Away" wraps to two lines at some widths and "Carry Add" never
       does, so without a reserved second line the two badges in this row sit at
       different heights — 270px against 286px, measured at 768px. Stretch used to
       hide that; opting out of stretch exposed it. Reserving the line costs the
       one-line cards a few pixels nobody sees and keeps the badges level. */
    .mode-row.has-badge .mode-card-label{min-height:2.4em;display:flex;align-items:center}
    .mode-card{flex:1;min-width:130px;max-width:185px;border-radius:26px;padding:18px 12px 14px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mode-card-label{font-size:.9rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);text-align:center}
    .mode-card-sub{font-size:.66rem;font-weight:900;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.25);text-align:center;margin-top:-5px}
    /* ── GAME PREVIEW ──
       A miniature of the screen the child is about to see, not a mascot. Six games is
       too many to tell apart by a decorative planet, and a pre-reader cannot use the
       label — so each card shows the game's own shape: blocks, a column sum, a number
       track, a times fact, a counting chain. The colours are lifted from each game, so
       the picture on the card and the screen it opens match. */
    .gp{width:104px;height:88px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 6px;border-radius:13px;background:linear-gradient(160deg,#fff,#fce4ec);border:2.5px solid #f48fb1;box-shadow:0 3px 0 #e57ca0,0 5px 10px rgba(4,8,30,.22)}
    .gp.gp-tight{gap:2px}
    .gp-row{display:flex;align-items:center;justify-content:center;gap:3px}
    .gp-blocks{display:flex;align-items:flex-end;justify-content:center;gap:3px}
    .gp-num{font-size:.92rem;font-weight:900;color:#7b1fa2;line-height:1}
    .gp-op{font-size:.8rem;font-weight:900;color:#e91e63;line-height:1}
    .gp-box{width:15px;height:18px;border-radius:4px;border:2px solid #e91e63;background:#fff}
    .gp-line{width:40px;height:2.5px;border-radius:2px;background:#e91e63}
    .gp-t{width:7px;height:20px;border-radius:2px;background:linear-gradient(180deg,#f48fb1,#e91e63);border:1.5px solid #c2185b}
    .gp-o{width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,#ffd54f,#f9a825);border:1.5px solid #e65100}
    .gp-o.gp-empty{background:none;border-style:dashed;border-color:#f48fb1}
    .gp-dot{width:7px;height:7px;border-radius:50%;background:#f8bbd0}
    .gp-dot.on{background:#e91e63;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
    .gp-chip{padding:1px 5px;border-radius:999px;border:1.5px solid #f48fb1;background:#fff;font-size:.62rem;font-weight:900;color:#e91e63;line-height:1.35}
    /* The expansion cards' minis: paired dots for odd/even, a five-wide ten-frame row. */
    .gp-pair{display:flex;gap:2px;position:relative;padding-top:3px}
    .gp-pair::before{content:'';position:absolute;left:1px;right:1px;top:0;height:5px;border-top:1.5px solid #e91e63;border-radius:999px 999px 0 0}
    .gp-pd{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#ffd54f,#f9a825);border:1.5px solid #e65100}
    .gp-pd.gp-lone{background:none;border-style:dashed;border-color:#f48fb1;color:#e91e63;font-size:.5rem;font-weight:900;display:flex;align-items:center;justify-content:center}
    .gp-tf{width:10px;height:10px;border-radius:3px;border:1.5px dashed #f48fb1}
    .gp-tf.on{background:linear-gradient(135deg,#ffd54f,#f9a825);border:1.5px solid #e65100}
    .gp-tf.gone{background:linear-gradient(135deg,#ffd54f,#f9a825);border:1.5px solid #e65100;opacity:.45}
    .gp-hc{width:9px;height:9px;border-radius:2px;border:1.5px solid #93b7fb;background:rgba(255,255,255,.5)}
    .gp-hc.on{background:linear-gradient(135deg,#8ec2ff,#4a86e8);border-color:#2f6df6}
    .gp-hc.gold{background:linear-gradient(135deg,#ffd54f,#f9a825);border-color:#e65100}
    .gp-dv{width:9px;height:9px;border-radius:50% 50% 50% 0;background:rgba(255,255,255,.5);border:1.5px solid #93b7fb;transform:rotate(-45deg)}
    .gp-dv.on{background:linear-gradient(135deg,#ffd54f,#f9a825);border-color:#e65100}
    .gp-fr{width:16px;height:12px;border:1.5px solid #93b7fb;border-radius:2px;background:rgba(255,255,255,.5)}
    .gp-fr.on{background:linear-gradient(135deg,#ffd54f,#f9a825);border-color:#e65100}
    .gp-um{width:34px;height:22px;border:2px solid #93b7fb;border-radius:4px;background:rgba(255,255,255,.5);position:relative}
    .gp-um::after{content:'';position:absolute;left:4px;top:4px;width:6px;height:10px;border-radius:2px;background:linear-gradient(135deg,#ffd54f,#f9a825)}
    .gp-ag{width:11px;height:11px;border:1.5px solid #93b7fb;border-radius:2px;background:rgba(255,255,255,.35)}
    .gp-ag.on{background:linear-gradient(135deg,#ffd54f,#f9a825);border-color:#e65100}
    .gp-chip.q{border-style:dashed;color:#7b1fa2}
    .gp-arrow{font-size:.6rem;font-weight:900;color:#7b1fa2;opacity:.5}
    /* ── COLUMN MATHS PREVIEWS (c1-c4) ──
       Four column cards now sit side by side, so the picture has to carry both facts a
       pre-reader needs: which operation, and how hard. Operation is the loud one — a
       big plain glyph for adding, a filled coin for taking away — because the two are
       genuinely different games and a 7px difference between + and − is not a
       difference a four-year-old can use. Difficulty is the quiet one: the dashed box
       (and, on c4, the crossed digit) appears only on the carry/borrow cards. Card
       colour repeats the operation and the star count repeats the difficulty, so the
       two redundant channels carry different axes instead of the same one. */
    .gp-op.gp-big{font-size:1.45rem}
    .gp-take{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:900;line-height:1;color:#fff;background:#c62828}
    .gp-carry{width:12px;height:12px;border-radius:3px;border:1.5px dashed #ce93d8;background:#fff;font-size:.52rem;font-weight:900;color:#e65100;display:flex;align-items:center;justify-content:center;line-height:1}
    .gp-carry-row{margin-right:19px}
    .gp-small{font-size:.55rem;font-weight:900;color:#f4511e;line-height:1;align-self:flex-start}
    .gp-strike{position:relative;color:#a58bb8}
    .gp-strike::after{content:'';position:absolute;left:-2px;right:-2px;top:52%;height:2px;border-radius:1px;background:rgba(244,81,30,.85);transform:rotate(-15deg)}
    .mode-card-stars{height:24px;display:flex;align-items:center;justify-content:center;gap:2px}
    .mode-card-stars img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.16))}
    /* ── BIG-KID BADGE ──
       Worn only by Carry Add and Borrow Take Away. Stars say "hardest" in a
       convention a pre-reader has to be taught; two big children say it in a
       language they already read fluently, because "am I big or little?" is a
       question they think about daily. Both signals stay: same fact, two
       languages, the way card colour and star count already split operation
       from difficulty.
       72px is a floor, not a preference. Measured smaller, the head-to-body
       ratio that carries age collapses and it reads as two coloured smudges —
       the badge stops meaning anything and becomes decoration. */
    .mode-card-badge{height:72px;margin-top:-2px;display:flex;align-items:flex-end;justify-content:center}
    .mode-card-badge img{height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
    .mc-pink  {background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 7px 0 #ad1457,0 10px 20px rgba(233,30,99,.3)}
    .mc-purple{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 7px 0 #4a148c,0 10px 20px rgba(123,31,162,.3)}
    .mc-rose  {background:linear-gradient(160deg,#f06292,#c2185b);box-shadow:0 7px 0 #880e4f,0 10px 20px rgba(194,24,91,.3)}
    .mc-magic {background:linear-gradient(160deg,#ba68c8,#4a148c);box-shadow:0 7px 0 #311b92,0 10px 20px rgba(74,20,140,.3)}

    /* ── SCREEN ── */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 24px;gap:11px;background:transparent;overflow:hidden}
    .screen-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(255,245,255,.16),rgba(255,245,255,.16)),var(--game-bg),var(--screen-fallback,#fce4ec);background-size:cover,cover,cover;background-position:var(--game-bg-position,center center);background-repeat:no-repeat;z-index:0;pointer-events:none}
    /* Every :not() here adds specificity, so this rule outweighs a plain class rule on
       any child. The settings overlay is a child of .screen and must stay position:fixed
       to cover the viewport — without this exclusion it lays out inline in the column,
       squeezed to the flex width instead of centred over the game. */
    .screen>*:not(.screen-bg):not(.bg-deco):not(.confetti-container):not(.mascot-corner):not(.modal-overlay):not(.tc-panel){position:relative;z-index:1}
    .blocks-screen {--game-bg:url('assets-runtime/unicorn/bg-what-number.webp');--screen-fallback:linear-gradient(160deg,#fce4ec,#f8bbd0,#fce4ec)}
    .choose-screen {--game-bg:url('assets-runtime/unicorn/bg-fill-right-block.webp');--screen-fallback:linear-gradient(160deg,#f3e5f5,#e1bee7,#f3e5f5)}
    .addsub-screen {--game-bg:url('assets-runtime/unicorn/bg-add-subtract.webp');--screen-fallback:linear-gradient(160deg,#fff3e0,#fce4ec,#f3e5f5)}

    /* ── TOP BAR ── */
    .top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:740px;gap:8px;position:relative;z-index:2}
    .back-btn{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:50px;padding:8px 14px;font-family:inherit;font-size:1.2rem;font-weight:900;color:#e91e63;cursor:pointer;box-shadow:0 4px 0 #f48fb1;transition:transform .1s;white-space:nowrap;line-height:1;min-width:52px}
    .back-btn:active{transform:translateY(3px)}
    .music-btn{position:fixed;top:14px;right:14px;z-index:9}
    .hub-btn{position:fixed;top:14px;left:14px;z-index:9;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
    .music-btn.music-off{opacity:.45;filter:grayscale(1)}
    .settings-btn,.sound-btn,.music-btn{background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:50px;padding:8px 13px;font-family:inherit;font-size:1.1rem;font-weight:900;color:#7b1fa2;cursor:pointer;box-shadow:0 4px 0 #ce93d8;transition:transform .1s;line-height:1;min-width:48px}
    .settings-btn:active,.sound-btn:active,.music-btn:active{transform:translateY(3px)}
    .icon-svg{width:22px;height:22px;display:block}

    /* ── MODALS ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-box{background:#fff;border-radius:28px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px solid #f48fb1;max-height:90vh;overflow-y:auto}
    .modal-title{font-size:1.2rem;font-weight:900;color:#7b1fa2;text-align:center;margin-bottom:14px}
    .preset-btn{width:100%;padding:12px 16px;border-radius:14px;border:3px solid;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .1s;margin-bottom:7px}
    .preset-btn:active{transform:scale(.97)}
    .preset-btn.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .preset-btn.inactive{background:#fff;border-color:#f8bbd0;color:#7b1fa2}
    .preset-tag{font-size:1.2rem}
    .preset-info{text-align:left;flex:1}
    .preset-name{font-size:.95rem;font-weight:900}
    .preset-range{font-size:.74rem;opacity:.7;font-weight:700}
    .modal-close{margin-top:8px;width:100%;padding:11px;border-radius:50px;border:none;background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #ad1457}
    .modal-close:active{transform:translateY(3px)}
    /* custom range inputs */
    .custom-range-box{background:#fce4ec;border-radius:14px;padding:14px;margin-top:4px;border:2px solid #f48fb1}
    .custom-range-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .custom-range-row label{font-size:.85rem;font-weight:900;color:#7b1fa2;display:flex;align-items:center;gap:6px}
    .custom-input{width:68px;padding:6px 8px;border-radius:8px;border:2px solid #f48fb1;font-family:inherit;font-size:1rem;font-weight:900;color:#333;text-align:center}
    .custom-apply{background:linear-gradient(135deg,#ce93d8,#7b1fa2);color:#fff;border:none;border-radius:50px;padding:8px 18px;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #4a148c}
    .custom-error{font-size:.8rem;font-weight:900;color:#c62828;background:#ffcdd2;border-radius:8px;padding:5px 10px;margin-bottom:6px}
    /* add/sub custom op */
    .op-toggle-row{display:flex;gap:8px;margin-bottom:10px}
    .op-toggle{flex:1;padding:9px;border-radius:10px;border:2px solid #f8bbd0;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;background:#fff;color:#7b1fa2}
    .op-toggle.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .section-label{font-size:.78rem;font-weight:900;color:#9c27b0;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .mode-toggle-row{display:flex;gap:8px;margin-bottom:10px}

    /* ── EQUIVALENCE MODAL ── */
    .equiv-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
    .equiv-box{background:#fff;border-radius:28px;padding:28px 22px;max-width:360px;width:100%;border:4px solid #f48fb1;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .equiv-title{font-size:1.3rem;font-weight:900;color:#e91e63;margin-bottom:6px}
    .equiv-sub{font-size:1rem;font-weight:700;color:#7b1fa2;margin-bottom:18px}
    .equiv-visual{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .equiv-side{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:140px}
    .equiv-eq{font-size:2rem;font-weight:900;color:#9c27b0}
    .mini-h{width:34px;height:34px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:6px;border:2px solid #6a1b9a}
    .mini-t{width:13px;height:34px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:4px;border:2px solid #c2185b}
    .mini-o{width:13px;height:13px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:3px;border:2px solid #e65100}
    .equiv-next{background:linear-gradient(160deg,#f06292,#ad1457);color:#fff;border:none;border-radius:50px;padding:13px 32px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #880e4f}
    .equiv-next:active{transform:translateY(3px)}

    /* ── NUMBER DISPLAY ── */
    .number-display{display:flex;gap:8px;align-items:flex-end;justify-content:center;background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}
    .digit-box{display:flex;flex-direction:column;align-items:center;gap:3px}
    .digit-value{font-size:clamp(2rem,8.5vw,3.5rem);font-weight:900;line-height:1;min-width:42px;text-align:center}
    .digit-value.shake{animation:shake .35s ease}
    .digit-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .digit-hundreds{color:#9c27b0}.digit-tens{color:#e91e63}.digit-ones{color:#ff6f00}
    .simple-number-card{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(252,228,236,.9));border:2.5px solid #f48fb1;border-radius:20px;padding:12px 22px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}
    .simple-number-main{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;color:#7b1fa2;line-height:1}
    .simple-number-sub{font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#e91e63}
    .simple-number-divider{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:#d7b7df}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

    /* ── TAP-TO-SLOT ── */
    .tap-layout{width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .tap-hint{font-size:.82rem;font-weight:900;color:#9c27b0;text-align:center;background:rgba(255,255,255,.65);border-radius:50px;padding:5px 16px;border:1.5px solid #ce93d8}

    /* Pool */
    .pool-area{background:rgba(255,255,255,.55);border-radius:18px;padding:12px;border:2px solid #f8bbd0}
    .pool-label{font-size:.75rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center}
    .pool-blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}

    /* Pool block wrappers */
    .pool-block{cursor:pointer;border-radius:10px;transition:transform .1s;position:relative}
    .pool-block.selected{filter:drop-shadow(0 0 8px #e91e63) drop-shadow(0 0 4px #fff);transform:scale(1.12) translateY(-3px)}
    .pool-block.empty{opacity:.2;cursor:default;pointer-events:none}

    /* The actual block shapes (pool size) */
    .pb-hundred{width:72px;height:72px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:10px;border:3px solid #6a1b9a;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .pb-ten{width:30px;height:72px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:7px;border:3px solid #c2185b;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .pb-one{width:38px;height:38px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:9px;border:3px solid #e65100}

    /* Slots */
    .slots-area{display:flex;flex-direction:column;gap:8px}
    .slot-row{background:rgba(255,255,255,.65);border:3px dashed #f48fb1;border-radius:16px;padding:10px 12px;min-height:64px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
    .slot-row.can-accept{border-color:#e91e63;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(233,30,99,.2)}
    .slot-row.wrong-flash{animation:slotWrong .35s ease}
    @keyframes slotWrong{0%,100%{background:rgba(255,255,255,.65);border-color:#f48fb1}50%{background:#ffcdd2;border-color:#f44336;box-shadow:0 0 0 3px rgba(244,67,54,.3)}}
    .slot-header{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .slot-h-header{color:#7b1fa2}.slot-t-header{color:#c2185b}.slot-o-header{color:#e65100}
    .slot-blocks{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;min-height:28px}

    /* Mini blocks inside slots (tappable to return) */
    .sb-hundred{width:38px;height:38px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:7px;border:2.5px solid #6a1b9a;cursor:pointer;transition:transform .1s;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .sb-hundred:active{transform:scale(.88)}.sb-hundred .ic{background:rgba(255,255,255,.35);border-radius:1px}
    .sb-ten{width:16px;height:38px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:5px;border:2.5px solid #c2185b;cursor:pointer;transition:transform .1s}
    .sb-ten:active{transform:scale(.88)}
    .sb-one{width:18px;height:18px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:5px;border:2.5px solid #e65100;cursor:pointer;transition:transform .1s}
    .sb-one:active{transform:scale(.88)}
    .slot-empty-hint{font-size:.78rem;color:#bbb;font-weight:700;padding:4px 0}

    /* Place-value builder */
    .pv-goal-card{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 16px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1;min-width:min(92vw,430px)}
    .pv-visual-row{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
    .pv-unit-group{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.64);border:2px solid;border-radius:14px;padding:7px 9px;min-height:62px}
    .pv-unit-group.h{border-color:#ce93d8}.pv-unit-group.t{border-color:#f48fb1}.pv-unit-group.o{border-color:#ffd54f}
    .pv-goal-num{font-size:clamp(1.9rem,7vw,3.05rem);font-weight:900;line-height:1;min-width:.72em;text-align:center}
    .pv-goal-plus{font-size:1.55rem;color:#d7b7df;font-weight:900}
    .pv-expanded-form{font-size:clamp(1rem,4vw,1.45rem);font-weight:900;color:#7b1fa2;text-align:center;line-height:1.15}
    .gb-hundred{width:48px;height:48px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:8px;border:3px solid #6a1b9a;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .gb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .gb-ten{width:19px;height:52px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:6px;border:3px solid #c2185b;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .gb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .gb-one{width:28px;height:28px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:7px;border:3px solid #e65100}
    .pv-built-line{background:rgba(255,255,255,.72);border:2px solid #f8bbd0;border-radius:999px;padding:7px 16px;font-size:.9rem;font-weight:900;color:#7b1fa2;position:relative;z-index:1;text-align:center}
    .pv-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .pv-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .pv-zone{min-height:142px;border:3px dashed;border-radius:18px;background:rgba(255,255,255,.56);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px rgba(123,31,162,.08);transition:transform .12s,background .12s}
    .pv-zone:active{transform:scale(.98)}
    .pv-zone-h{border-color:#9c27b0;background:rgba(243,229,245,.68)}
    .pv-zone-t{border-color:#e91e63;background:rgba(252,228,236,.7)}
    .pv-zone-o{border-color:#f9a825;background:rgba(255,248,225,.72)}
    .pv-zone-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .pv-zone-title{font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .pv-zone-h .pv-zone-title{color:#7b1fa2}.pv-zone-t .pv-zone-title{color:#c2185b}.pv-zone-o .pv-zone-title{color:#e65100}
    .pv-zone-hint{font-size:.66rem;font-weight:900;color:#999;text-transform:uppercase;letter-spacing:.6px}
    .pv-zone-count{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:.9rem;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.12)}
    .pv-zone-h .pv-zone-count{color:#7b1fa2}.pv-zone-t .pv-zone-count{color:#c2185b}.pv-zone-o .pv-zone-count{color:#e65100}
    .pv-block-space{position:relative;min-height:66px;display:flex;align-items:flex-end;justify-content:center;gap:5px;flex-wrap:wrap;flex:1}
    .pv-placeholder{opacity:.2;pointer-events:none}
    .pv-placed{cursor:pointer;animation:blockIn .18s ease}
    .pv-bank{background:rgba(255,255,255,.68);border:2px solid #f8bbd0;border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
    .pv-bank-title{width:100%;text-align:center;font-size:.78rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px}
    .pv-bank-btn{border:none;border-radius:16px;background:#fff;min-width:104px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .12s}
    .pv-bank-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
    .pv-bank-btn.h{color:#7b1fa2;border:2px solid #ce93d8}.pv-bank-btn.t{color:#c2185b;border:2px solid #f48fb1}.pv-bank-btn.o{color:#e65100;border:2px solid #ffd54f}

    /* Direct v4-style place-value picker */
    .direct-progress{background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:999px;padding:8px 28px;font-size:clamp(1.2rem,4vw,1.9rem);font-weight:900;color:#7b1fa2;box-shadow:0 4px 0 #ce93d8;position:relative;z-index:1;min-width:150px;text-align:center}
    .direct-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
    .direct-section{background:rgba(255,255,255,.62);border:2px solid #f8bbd0;border-radius:18px;padding:12px 12px 14px;box-shadow:0 5px 18px rgba(123,31,162,.08)}
    .direct-label{font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
    .direct-label.tens{color:#c2185b}.direct-label.ones{color:#e65100}
    .direct-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end}
    .direct-block{cursor:pointer;transition:transform .12s,filter .12s,opacity .12s;position:relative;flex-shrink:0}
    .direct-block:active{transform:scale(.92) translateY(3px)}
    .direct-block.off{opacity:.55;filter:saturate(.8)}
    .direct-block.on{opacity:1;transform:translateY(-3px);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 4px 8px rgba(233,30,99,.22))}
    .direct-block.on .pb-hundred{box-shadow:0 0 0 3px #fff,0 0 0 6px #ce93d8}
    .direct-block.on .pb-ten{box-shadow:0 0 0 3px #fff,0 0 0 6px #f06292}
    .direct-block.on .pb-one{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffd54f}
    .direct-too-many{font-size:.9rem;font-weight:900;color:#c2185b;background:rgba(255,255,255,.72);border:2px solid #f8bbd0;border-radius:999px;padding:6px 14px;text-align:center;position:relative;z-index:1}
    .direct-nav-gap{height:34px}

    /* Count the blocks */
    .count-title{background:rgba(255,255,255,.72);border:2px solid #f8bbd0;border-radius:18px;padding:8px 18px;text-align:center;position:relative;z-index:1;box-shadow:0 4px 14px rgba(123,31,162,.08)}
    .count-title-main{font-size:1.05rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px}
    .count-title-sub{font-size:.78rem;font-weight:900;color:#e91e63;margin-top:2px}
    .count-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .count-section{background:rgba(255,255,255,.62);border:2px solid #f8bbd0;border-radius:18px;padding:12px 12px 14px;box-shadow:0 5px 18px rgba(123,31,162,.08)}
    .count-label{font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
    .count-label.h{color:#7b1fa2}.count-label.t{color:#c2185b}.count-label.o{color:#e65100}
    .count-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;max-width:470px;margin:0 auto}
    .count-block{cursor:pointer;transition:transform .12s,filter .12s,opacity .12s;position:relative;flex-shrink:0}
    .count-block:active{transform:scale(.92) translateY(3px)}
    .count-block.off{opacity:.85;filter:saturate(.95)}
    .count-block.on{opacity:1;transform:translateY(-3px);filter:drop-shadow(0 4px 8px rgba(123,31,162,.2))}
    .count-block.on .pb-hundred,.count-block.on .pb-ten,.count-block.on .pb-one{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(240,98,146,.8)}

    /* ── WHICH IS BIGGER? (g1) ──
       Two panels with a slot between them, and the answer is a mouth that opens
       towards the bigger side. The blocks in the panels are the SAME .pb-ten and
       .pb-one art the child already counts in What Number?, deliberately: at the
       easy end this game is "compare two of the thing you already know", not a
       new set of pictures to learn. */
    .cmp-screen{--game-bg:url('assets-runtime/unicorn/bg-what-number.webp');--screen-fallback:linear-gradient(160deg,#fce4ec,#f8bbd0,#fce4ec)}
    /* stretch, so the two panels are always the same height even when one pile of
       blocks wraps onto an extra row. The blocks are what should say "this side has
       more" — a taller box saying it as well is chrome doing the teaching. */
    .cmp-row{display:flex;align-items:stretch;justify-content:center;gap:clamp(6px,2.5vw,18px);width:100%;max-width:740px;position:relative;z-index:1}
    .cmp-side{flex:1;min-width:0;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.66);border:3px solid #f8bbd0;border-radius:22px;padding:12px 8px;box-shadow:0 5px 18px rgba(123,31,162,.1);transition:transform .2s,border-color .2s,box-shadow .2s}
    /* The winning side lifts and glows. On an equals the class goes on BOTH sides,
       so "the same" is shown as sameness rather than as neither side winning. */
    .cmp-side.chosen{border-color:#e91e63;box-shadow:0 0 0 4px rgba(233,30,99,.22),0 8px 22px rgba(233,30,99,.25);transform:translateY(-4px)}
    .cmp-blocks{display:flex;flex-wrap:wrap;gap:2px 9px;justify-content:center;align-items:flex-end}
    /* One group per place value. The gap between groups is wider than the gap
       inside one, so hundreds, rods and ones read as three piles to be counted
       rather than one wrapped mass. */
    .cmp-place{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:flex-end}
    /* Two panels of blocks side by side is half the width of one, so the block art is
       scaled down here rather than allowed to wrap into an uncountable pile. */
    .cmp-blocks .pb-hundred{width:40px;height:40px;border-width:2px;border-radius:6px;padding:2px}
    .cmp-blocks .pb-ten{width:21px;height:50px;border-width:2px;border-radius:5px;padding:2px}
    /* display:block is load-bearing, not tidying. .pb-one sets no display of its own,
       and it used to be a direct flex child here, which blockified it. Wrapping it in
       a tappable .count-block made it a plain inline span again, and width/height do
       not apply to those — every block silently collapsed to 4px wide. */
    .cmp-blocks .pb-one{display:block;width:26px;height:26px;border-width:2px;border-radius:6px}
    /* The blocks are a control now, not a picture, so the tap target is padded out
       well past the art. Measured before this: 17px for a rod, which is a decorative
       size — a four-year-old counting ten of them cannot reliably hit it, and a miss
       costs them their place in the count. The padding grows the target without
       moving the art, and the flex gap shrinks by the same amount so the pile is no
       wider than it was. */
    .cmp-blocks .count-block{display:block;padding:4px}
    /* Counting reuses What Number?'s .count-block wholesale, because it IS that
       interaction — tap a block and it marks itself. Two things could not be reused.
       Its ring is drawn OUTSIDE the block: 6px of ring each side of a 23px block, in a
       6px gap, made ten counted blocks merge into one striped mass with no countable
       units left in it — so this ring is inset instead. And its lift is on the wrapper,
       which here would shrink the tap target every time a block was counted, so the
       lift moves the art inside a target that never changes size. */
    .cmp-blocks .count-block.on{transform:none}
    .cmp-blocks .count-block .pb-hundred,.cmp-blocks .count-block .pb-ten,.cmp-blocks .count-block .pb-one{transition:transform .12s,box-shadow .12s}
    .cmp-blocks .count-block.on .pb-hundred,.cmp-blocks .count-block.on .pb-ten,.cmp-blocks .count-block.on .pb-one{box-shadow:inset 0 0 0 3px rgba(255,255,255,.96);transform:translateY(-4px) scale(.9)}
    .cmp-blocks .count-block.still{cursor:default}
    .cmp-blocks .count-block.still:active{transform:none}
    .cmp-num{font-size:clamp(1.9rem,9vw,3.4rem);font-weight:900;color:#7b1fa2;line-height:1}
    .cmp-num.small{font-size:clamp(1.1rem,4.5vw,1.6rem);color:#c2185b}
    /* The empty slot is the same dashed box as the carry box in Carry Add: in this
       app a dashed outline always means "you put something here". */
    .cmp-slot{flex:0 0 auto;align-self:center;width:clamp(58px,17vw,86px);height:clamp(58px,17vw,86px);display:flex;align-items:center;justify-content:center;border-radius:20px;border:3px dashed #f48fb1;background:rgba(255,255,255,.55);color:#e91e63}
    .cmp-slot.filled{border-style:solid;border-color:#e91e63;background:linear-gradient(160deg,#fff,#fce4ec);box-shadow:0 4px 0 #f48fb1}
    .cmp-slot-q{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:900;color:#f48fb1}
    .cmp-mouth-svg{width:78%;height:78%;display:block;overflow:visible}
    /* The chomp. Squashing the whole <svg> closes the jaws and reopens them, which
       is the one way to animate this that needs nothing from SVG transform-origin —
       the app still supports Safari 14, where transform-box is not reliable. */
    .cmp-slot.biting .cmp-mouth-svg{animation:cmpBite .5s ease-in-out}
    .cmp-slot.biting.same .cmp-mouth-svg{animation:cmpNod .5s ease-in-out}
    @keyframes cmpBite{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.28)}70%{transform:scaleY(1.08)}}
    @keyframes cmpNod{0%,100%{transform:translateY(0)}40%{transform:translateY(5px) scaleY(.9)}}
    .cmp-keys{display:flex;gap:clamp(8px,3vw,16px);justify-content:center;position:relative;z-index:1}
    .cmp-key{width:clamp(78px,23vw,104px);height:clamp(78px,23vw,104px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px 5px;border-radius:24px;border:3px solid #f48fb1;background:linear-gradient(160deg,#fff,#fce4ec);color:#e91e63;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #f48fb1;transition:transform .1s}
    .cmp-key:active{transform:translateY(4px);box-shadow:0 1px 0 #f48fb1}
    .cmp-key .cmp-mouth-svg{width:clamp(40px,12vw,54px);height:clamp(30px,9vw,40px)}
    /* The real notation, printed under the picture. The mouth is how a pre-reader
       gets in; this is the thing they are actually learning to read, so it is on
       screen from the first tap rather than introduced later. */
    .cmp-key-glyph{font-size:.95rem;font-weight:900;color:#7b1fa2;line-height:1}
    .cmp-key.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .cmp-key.hint-glow{animation:hintGlow 1.1s ease-in-out infinite}
    @media (max-width:430px){
      .cmp-side{min-height:100px;padding:10px 4px}
      .cmp-blocks{gap:0 6px}
    }
    /* A phone is not the target device — the owner's children play on 9.7 inches and up
       (2026-08-18) — but the hundreds rung must not be broken there, and it was:
       measured at 375px, nine flats, nine rods and nine ones pushed the three answer
       keys to 917px down an 812px screen, so the child could not reach the answer
       without scrolling. The art shrinks; the question does not change, because a
       game that asks something different depending on the device is a worse thing
       than small blocks. The tap target keeps padding of its own at every size. */
    @media (max-width:600px){
      .cmp-blocks .pb-hundred{width:24px;height:24px;border-width:1.5px;border-radius:4px;padding:1px}
      .cmp-blocks .pb-ten{width:13px;height:31px;border-width:1.5px;border-radius:4px;padding:1px}
      .cmp-blocks .pb-one{width:16px;height:16px;border-width:1.5px;border-radius:4px}
      .cmp-blocks .count-block{padding:3px}
    }
    /* The two panels were capped at 740px on every screen, so a 9.7-inch iPad drew the
       phone layout with margins either side and the extra width was thrown away. The
       owner's children play on 9.7 inches and up (2026-08-18), and the hundreds rung
       wants that room: at 740px a side holds five flats to a line, at 1000px it holds
       eight, which is one line for almost every pile. */
    @media (min-width:768px){
      .cmp-row{max-width:min(96vw,1000px)}
    }

    /* ── EXPANSION GAMES: odd/even + number bonds to ten ──
       The ten-frame and the pairing board are SHARED MANIPULATIVES (see the MATH
       PRIMITIVES block in the script): one visual language for two families of games.
       The counters are the same yellow as the ones blocks in What Number? on purpose —
       a child who has counted those blocks already knows what a dot here is worth.
       Sizing rule for everything in this block: the whole question — board AND answer
       buttons — fits 768px of height at the 1024-wide design floor without scrolling
       (the What Number? fold lesson). */
    .tf{display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.66);border:3px solid #c4d7fd;border-radius:22px;padding:13px;box-shadow:0 5px 18px rgba(90,46,214,.1)}
    .tf-row{display:flex;gap:9px}
    .tf-cell{width:clamp(46px,7.2vw,60px);height:clamp(46px,7.2vw,60px);border-radius:13px;border:3px dashed #b9c8ee;background:rgba(255,255,255,.5);position:relative;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
    /* ::after draws the counter, so the cell is the seat and the counter is a thing
       that can arrive, stay, or leave without the seat moving. */
    .tf-cell.tf-on::after,.tf-cell.tf-gone::after,.tf-cell.tf-add::after{content:'';width:72%;height:72%;border-radius:50%;background:linear-gradient(135deg,#ffd54f,#f9a825);border:3px solid #e65100;box-shadow:0 3px 0 rgba(150,60,0,.35)}
    .tf-cell.tf-add::after{background:linear-gradient(135deg,#7de3a0,#2e9e5b);border-color:#1c7a44;box-shadow:0 3px 0 rgba(10,70,35,.35);animation:tfPop .45s ease both}
    .tf-cell.tf-gone::after{opacity:.45;filter:grayscale(.6)}
    /* The ✕ is a real child span rather than ::before content so it can sit over the
       faded counter at any cell size. */
    .tf-x{position:absolute;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:900;color:#f4566e;line-height:1;text-shadow:0 1px 0 #fff;pointer-events:none}
    .tf-cell.tf-fly::after{animation:tfFly .6s ease-in both}
    /* A seat the child has counted: the same lifted-ring treatment as a counted block
       in Which is Bigger?, so one gesture means one thing across games. */
    .tf-cell.marked{border-style:solid;box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(91,140,248,.8)}
    @keyframes tfPop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
    @keyframes tfFly{to{transform:translateY(-48px) scale(.3);opacity:0}}
    /* The number-bond equation rung: the same bond written as a sentence of numerals. */
    .nb-eq{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(2rem,7.5vw,2.9rem);font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(47,109,246,.55),0 5px 12px rgba(4,8,30,.5);position:relative;z-index:1}
    .nb-eq .nb-slot{min-width:1.3em;text-align:center}
    .nb-eq .nb-q{color:#ffd54f}
    /* Four big number tiles — the same button idiom as Which is Bigger?'s keys. */
    .nb-tiles{display:flex;gap:clamp(10px,3vw,18px);justify-content:center;position:relative;z-index:1}
    .nb-tile{width:clamp(82px,19vw,112px);height:clamp(82px,19vw,112px);display:flex;align-items:center;justify-content:center;border-radius:24px;border:3px solid #93b7fb;background:linear-gradient(160deg,#fff,#e8f0ff);color:#2f6df6;font-family:inherit;font-size:clamp(2rem,7vw,2.7rem);font-weight:900;cursor:pointer;box-shadow:0 5px 0 #93b7fb;transition:transform .1s}
    .nb-tile:active{transform:translateY(4px);box-shadow:0 1px 0 #93b7fb}
    .nb-tile.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .nb-tile.hint-glow{animation:hintGlow 1.1s ease-in-out infinite}
    /* ── Odd or Even: the pairing board ──
       Objects hold hands in twos. A pair-unit is two dots joined by an arc, and pairs
       wrap as WHOLE PAIRS — never split across lines, because a pair cut in half is
       exactly the misreading this game exists to prevent. */
    .oe-pairs{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 14px;max-width:min(92vw,660px);position:relative;z-index:1}
    .oe-unit{position:relative;display:flex;gap:5px;padding:8px 7px}
    .oe-dot{width:clamp(20px,4.2vw,28px);height:clamp(20px,4.2vw,28px);border-radius:50%;background:linear-gradient(135deg,#ffd54f,#f9a825);border:3px solid #e65100;box-shadow:0 3px 0 rgba(150,60,0,.35)}
    /* The joining arc draws itself on reveal, so "everyone found a partner" is an
       event the child watches rather than a state they are told about. */
    .oe-link{position:absolute;left:4px;right:4px;top:2px;height:14px;width:calc(100% - 8px);pointer-events:none;stroke:#2f6df6;stroke-width:3.5;fill:none;stroke-linecap:round;opacity:0;transform:rotate(180deg)}
    .oe-reveal .oe-link{opacity:.9;animation:oeDraw .4s ease-out both}
    @keyframes oeDraw{from{stroke-dasharray:0 120}to{stroke-dasharray:120 0}}
    .oe-lone{border-style:dashed}
    .oe-reveal .oe-lone .oe-dot{animation:oeWobble .8s ease-in-out infinite alternate}
    @keyframes oeWobble{from{transform:translateX(0)}to{transform:translateX(6px)}}
    .oe-numrow{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:1}
    .oe-num{font-size:clamp(3rem,11vw,4.6rem);font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(47,109,246,.55),0 7px 16px rgba(4,8,30,.5);line-height:1}
    /* The compact board is for the big-numbers rung: one hundred dots still has to fit
       beside the two answer buttons without scrolling. */
    .oe-compact{gap:5px 8px;max-width:min(94vw,760px)}
    .oe-compact .oe-dot{width:14px;height:14px;border-width:2px;box-shadow:none}
    .oe-compact .oe-unit{gap:3px;padding:4px 3px}
    .oe-key-ico .oe-dot.lone{margin-left:5px}
    .oe-pair-btn{display:flex;align-items:center;gap:8px;border:3px solid #93b7fb;background:linear-gradient(160deg,#fff,#e8f0ff);border-radius:50px;padding:10px 22px;font-family:inherit;font-size:1.05rem;font-weight:900;color:#2f6df6;cursor:pointer;box-shadow:0 5px 0 #93b7fb}
    .oe-pair-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #93b7fb}
    /* The two concept buttons. Their pictures are the CONCEPTS (a pair; a pair plus one
       left over), not this problem — static by design, so they teach rather than leak. */
    .oe-keys{display:flex;gap:clamp(12px,4vw,26px);justify-content:center;position:relative;z-index:1}
    .oe-key{width:clamp(120px,30vw,172px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:14px 10px 12px;border-radius:26px;border:3px solid #93b7fb;background:linear-gradient(160deg,#fff,#e8f0ff);color:#2f6df6;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #93b7fb;transition:transform .1s}
    .oe-key:active{transform:translateY(4px);box-shadow:0 1px 0 #93b7fb}
    .oe-key-ico{display:flex;align-items:center;gap:4px}
    .oe-key-ico .oe-dot{width:15px;height:15px;border-width:2px;box-shadow:none}
    .oe-key-word{font-size:1.35rem;font-weight:900;line-height:1}
    .oe-key-glyph{font-size:.8rem;font-weight:900;color:#5a2ed6;line-height:1}
    .oe-key.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .oe-key.hint-glow{animation:hintGlow 1.1s ease-in-out infinite}
    .oe-stage{display:flex;flex-direction:column;align-items:center;gap:12px;flex:1;justify-content:center;width:100%;min-height:0}

    /* ── The hundred board ──
       Ten rows of ten. Sized so the whole board plus question and score fits the
       768px design floor: cells clamp to at most 46px, gaps 4px, so the board is
       ~500px tall and the required interaction never scrolls. */
    /* Sizing measured at the 1024×768 floor: cells cap at 42px so ten rows plus the
       question stack stay above the fold (the What Number? lesson). The build rung
       also shows answer chips, so it drops to the compact size for room. */
    .hb-board{--hb-cell:clamp(30px,3.7vw,38px);display:grid;grid-template-columns:repeat(10,var(--hb-cell));gap:3px;background:rgba(255,255,255,.66);border:3px solid #c4d7fd;border-radius:18px;padding:8px;box-shadow:0 5px 18px rgba(90,46,214,.1);position:relative;z-index:1}
    .hb-board.hb-compact{--hb-cell:clamp(26px,3.3vw,34px)}
    .hb-cell{width:var(--hb-cell);height:var(--hb-cell);border-radius:9px;border:2px solid transparent;background:rgba(255,255,255,.55);color:#2f4a8f;font-family:inherit;font-size:clamp(.66rem,1.8vw,.98rem);font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-sizing:border-box;transition:transform .12s,box-shadow .12s}
    .hb-cell:active{transform:scale(.9)}
    /* The number we stand on: a blue ring, sitting but not shouting. */
    .hb-cell.hb-start{border-color:#2f6df6;box-shadow:0 0 0 3px rgba(47,109,246,.3);background:#e8f0ff}
    /* The revealed stops, lighting in tap order — the "why" of the move. */
    .hb-cell.hb-path{background:#dceaff;animation:hbGlow .5s ease both}
    .hb-cell.hb-path-last{border-color:#2f6df6}
    /* The answer, gold and unmistakable once the move is made. */
    .hb-cell.hb-target{background:linear-gradient(135deg,#ffd54f,#f9a825);border-color:#e65100;color:#7a3c00;transform:scale(1.12);box-shadow:0 3px 10px rgba(230,81,0,.4);animation:tfPop .45s ease both}
    .hb-cell.hb-wrong{animation:wrongShake .35s ease;border-color:#f44336;background:#ffebee}
    @keyframes hbGlow{0%{transform:scale(.8);opacity:.3}100%{transform:scale(1);opacity:1}}
    .hb-question{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(1.7rem,6vw,2.5rem);font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(47,109,246,.55),0 5px 12px rgba(4,8,30,.5);position:relative;z-index:1}
    .hb-qnum{min-width:1.4em;text-align:center}
    .hb-qop{color:#ffd54f}
    .hb-qunk{color:#ffd54f;border:3px dashed rgba(255,213,79,.8);border-radius:12px;padding:0 .2em}
    .hb-qarrow{color:#ffd54f}
    .hb-choices .hb-chip{width:auto;min-width:clamp(84px,20vw,120px);height:clamp(56px,13.5vw,76px);font-size:clamp(1.5rem,4.6vw,2rem)}

    /* ── The sharing mat ──
       Division's manipulative: loose counters above, baskets below. A basket is a
       soft tray that fills vertically; the pool shrinks as counters leave it. Baskets
       are big tap targets — dealing is the interaction. */
    .dv-mat{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:1}
    .dv-pool{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;max-width:min(92vw,560px);background:rgba(255,255,255,.5);border-radius:16px;padding:8px 12px}
    .dv-plates{display:flex;justify-content:center;gap:clamp(10px,3vw,22px);flex-wrap:wrap}
    .dv-plate{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:clamp(56px,9vw,76px);min-height:clamp(64px,12vw,96px);padding:8px 10px;background:rgba(255,255,255,.66);border:3px solid #c4d7fd;border-radius:16px;cursor:pointer;box-shadow:0 4px 0 #c4d7fd;transition:transform .1s}
    .dv-plate:active{transform:translateY(3px)}
    .dv-plate.dv-giveme{border-style:dashed}
    .dv-ring{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:clamp(80px,13vw,110px);padding:10px;border:3px solid #2f6df6;border-radius:50%;background:rgba(232,240,255,.75)}
    .dv-rings{display:flex;justify-content:center;gap:clamp(10px,3vw,20px);flex-wrap:wrap;animation:tfPop .45s ease both}
    .dv-unequal{font-size:1.05rem;font-weight:900;color:#fff;background:rgba(244,67,54,.82);border-radius:14px;padding:8px 16px}

    /* ── The fraction shapes ──
       One whole, four ways. Lit parts use the app's counter gold; unlit parts are
       quiet grey seats. The pie's sectors are drawn from exact angles (360/d each)
       so "equal parts" is true in the geometry, not just claimed. */
    .fr-bar{display:flex;width:min(78vw,560px);height:clamp(64px,13vh,96px);border:3px solid #2f4a8f;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.6);box-shadow:0 5px 16px rgba(90,46,214,.15)}
    .fr-part{border-right:2px solid #fff;transition:filter .15s}
    .fr-part:last-child{border-right:none}
    .fr-part.fr-on{background:linear-gradient(135deg,#ffd54f,#f9a825)}
    .fr-grid{display:grid;gap:4px;width:min(62vw,340px);height:min(62vw,340px);max-height:44vh}
    .fr-grid .fr-cell{border:2px solid #2f4a8f;border-radius:10px;background:rgba(255,255,255,.55)}
    .fr-grid .fr-cell.fr-on{background:linear-gradient(135deg,#ffd54f,#f9a825)}
    .fr-grid .fr-part{border-right:none}
    .fr-pie{width:min(56vw,300px);height:min(56vw,300px);max-height:42vh}
    .fr-pie .fr-off{fill:#f2f5fc;stroke:#2f4a8f;stroke-width:1.6}
    .fr-pie .fr-on{fill:#ffd54f;stroke:#e65100;stroke-width:1.6}
    .fr-group{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;max-width:min(84vw,560px)}
    .fr-group .oe-dot.fr-dot-on{background:linear-gradient(135deg,#ffd54f,#f9a825);border-color:#e65100;box-shadow:0 0 0 3px rgba(255,213,79,.4)}
    .fr-pulse .fr-part.fr-on,.fr-pulse .fr-cell.fr-on,.fr-pulse .fr-on,.fr-pulse .fr-dot-on{animation:frPulse .8s ease-in-out infinite alternate}
    @keyframes frPulse{from{filter:brightness(1)}to{filter:brightness(1.25)}}
    /* Fraction answer tiles: a real stacked numerator-over-denominator chip. */
    .fr-tiles{display:flex;gap:clamp(10px,3vw,20px);justify-content:center;position:relative;z-index:1}
    .fr-tile{width:clamp(84px,19vw,116px);height:clamp(84px,19vw,116px);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:24px;border:3px solid #93b7fb;background:linear-gradient(160deg,#fff,#e8f0ff);color:#2f6df6;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #93b7fb;transition:transform .1s}
    .fr-tile:active{transform:translateY(4px);box-shadow:0 1px 0 #93b7fb}
    .fr-tile-top,.fr-tile-bot{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:900;line-height:1.05}
    .fr-tile-bar{width:64%;height:3px;background:#2f6df6;border-radius:2px;margin:3px 0}
    .fr-tile.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .fr-tile.hint-glow{animation:hintGlow 1.1s ease-in-out infinite}

    /* ── Which Unit? ── */
    .um-thing{display:flex;flex-direction:column;align-items:center;gap:16px}
    .um-glyph{width:clamp(84px,15vw,130px);height:clamp(84px,15vw,130px);color:#2f4a8f;background:rgba(255,255,255,.72);border-radius:26px;padding:18px;box-shadow:0 5px 18px rgba(90,46,214,.12)}
    .um-ask{font-size:clamp(1.4rem,4.6vw,2.1rem);font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(47,109,246,.55),0 5px 12px rgba(4,8,30,.5);text-align:center;max-width:80vw}
    .um-tile{font-size:clamp(1.7rem,5.5vw,2.4rem)}
    /* ── Cover It (area) ── */
    .ag-grid{display:grid;gap:0;background:#2f4a8f;border:3px solid #2f4a8f;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px rgba(90,46,214,.18)}
    .ag-cell{width:var(--ag-cell,clamp(40px,7vw,58px));height:var(--ag-cell,clamp(40px,7vw,58px));box-sizing:border-box;background:rgba(255,255,255,.35);cursor:pointer;transition:background .15s}
    .ag-cell.ag-off{background:rgba(255,255,255,.12);cursor:default}
    .ag-cell.ag-on{background:rgba(255,255,255,.55);border:1.5px solid rgba(47,74,143,.4)}
    .ag-cell.ag-marked{background:#dceaff;box-shadow:inset 0 0 0 3px rgba(47,109,246,.7)}
    .ag-filled .ag-cell.ag-on{background:linear-gradient(135deg,#ffd54f,#f9a825);animation:tfPop .4s ease both}
    @media (max-width:600px){
      .hb-board{gap:2px;padding:6px}
      .hb-cell{border-radius:6px;font-size:.68rem}
    }

    /* ── WHAT'S MISSING? (b3) ──
       Two sides of blocks with an equals between them, and one pile on one side is
       hidden. Each side is ONE grid, ten cells wide, and the ten is doing work: every
       row is a ten-frame, so on the first rung the answer blocks are seen finishing a
       row the given blocks left part-built. The columns of the two sides line up as a
       consequence, which is what turns "the same amount" into "the same shape".
       Every cell is the same size and worth one. Rods cannot appear in this game: two
       rods and three ones is wider than three rods, so equal amounts would have unequal
       footprints and the balance would stop being readable. */
    .ms-screen{--game-bg:url('assets-runtime/unicorn/bg-fill-right-block.webp');--screen-fallback:linear-gradient(160deg,#f3e5f5,#e1bee7,#f3e5f5)}
    .ms-screen .count-title-main{text-transform:none}
    /* One knob for the art. --ms-base is the width tier, --ms-scale the row-count tier
       set in JS (see `density` in MissingGame): a pile many rows deep has to keep the
       Next button on screen, because .screen does not scroll. */
    .ms-row{display:flex;align-items:flex-start;justify-content:center;gap:clamp(5px,2vw,14px);width:100%;position:relative;z-index:1;--ms-base:20px;--ms-gap:3px;--ms-scale:1;--ms-cell:calc(var(--ms-base)*var(--ms-scale))}
    .ms-row.tight{--ms-scale:.8}
    .ms-row.dense{--ms-scale:.62}
    .ms-side{display:flex;flex-direction:column;align-items:center;gap:7px;background:rgba(255,255,255,.66);border:3px solid #f8bbd0;border-radius:20px;padding:11px 9px;box-shadow:0 5px 18px rgba(123,31,162,.1);transition:border-color .2s,box-shadow .2s}
    /* Both sides light up, never one: the statement being made is that they are equal. */
    .ms-side.balanced{border-color:#00a05a;box-shadow:0 0 0 4px rgba(0,160,90,.2),0 8px 22px rgba(0,160,90,.25)}
    .ms-grid{display:grid;grid-template-columns:repeat(10,var(--ms-cell));gap:calc(var(--ms-gap) + 1px) var(--ms-gap);justify-content:center}
    .ms-cell{width:var(--ms-cell);height:var(--ms-cell);border-radius:5px;box-sizing:border-box;cursor:pointer;transition:box-shadow .12s,transform .12s}
    /* A given amount, and BOTH sides draw it the same. Equal amounts have to look
       equal, so nothing distinguishes "what we have" from "what we want" except which
       side of the equals it stands on. It is the same yellow as the ones blocks the
       child already counts in What Number?. */
    .ms-cell.have{background:linear-gradient(135deg,#ffd54f,#f9a825);border:2px solid #e65100}
    /* The pile that went away, on the "? − 8 = 23" rung. It still counts towards the
       amount being built — what we started with is what went away plus what stayed,
       which is that rung's whole idea — so it is a solid block that is marked, not a
       gap where a block used to be. */
    .ms-cell.gone{background:linear-gradient(135deg,#ffe0b2,#ffb74d);border:2px dashed #bf360c;position:relative;opacity:.9}
    .ms-cell.gone::after{content:'';position:absolute;left:12%;right:12%;top:48%;height:2px;border-radius:2px;background:rgba(191,54,12,.8);transform:rotate(-32deg)}
    /* What the child added: the answer. A colour belonging to neither given pile, so
       the amount that was missing can be seen afterwards as a group. */
    .ms-cell.add{background:linear-gradient(135deg,#69f0ae,#00a05a);border:2px solid #00713f}
    /* Empty. Hollow and dashed so it reads as "nothing here yet" rather than as a pale
       block — the child is comparing the solids on one side with the solids on the
       other, and a socket that looked like a block would break that. */
    .ms-cell.socket{background:rgba(255,255,255,.32);border:2px dashed #f48fb1}
    .ms-cell:active{transform:scale(.88)}
    .ms-cell.still{cursor:default}
    .ms-cell.still:active{transform:none}
    /* Counted. The ring is drawn INSIDE the block, which is the lesson Which is Bigger?
       already paid for: at this size a ring outside merges neighbouring blocks into one
       striped mass with no countable units left in it. */
    .ms-cell.on{box-shadow:inset 0 0 0 3px rgba(255,255,255,.96);transform:translateY(-2px) scale(.88)}
    .ms-side-num{font-size:clamp(1.1rem,4.5vw,1.7rem);font-weight:900;color:#7b1fa2;line-height:1}
    .ms-eq-sign{flex:0 0 auto;align-self:center;font-size:clamp(1.5rem,6vw,2.6rem);font-weight:900;color:#f48fb1;transition:color .2s,transform .2s}
    .ms-eq-sign.balanced{color:#00a05a;transform:scale(1.3)}
    /* The notation, above the picture. The box is the same dashed outline as Carry
       Add's carry box and Which is Bigger?'s empty slot: a dashed edge in this app
       always means "you put something here". */
    .ms-eq{display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.72);border:2px solid #f8bbd0;border-radius:18px;padding:7px 16px;position:relative;z-index:1;box-shadow:0 4px 14px rgba(123,31,162,.08)}
    .ms-eq-num{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:900;color:#7b1fa2;line-height:1}
    .ms-eq-op{font-size:clamp(1.1rem,4vw,1.6rem);font-weight:900;color:#e91e63;line-height:1}
    .ms-eq-box{min-width:clamp(36px,9vw,50px);text-align:center;font-size:clamp(1.3rem,5vw,1.9rem);font-weight:900;line-height:1;padding:3px 7px;border-radius:12px;border:3px dashed #f48fb1;background:rgba(255,255,255,.55);color:#f48fb1}
    .ms-eq-box.filled{color:#00a05a;border-color:#00a05a}
    .ms-eq-box.won{border-style:solid;background:linear-gradient(160deg,#fff,#e6faf0);box-shadow:0 3px 0 #00a05a}
    /* Ten cells twice over, plus the equals, has to fit the width — and a phone is not
       the target device (the owner's children play on 9.7 inches and up, 2026-08-18) but
       must not be broken either. Measured: two grids at the tier below plus the sign
       need 440px, so 375px gets its own tier rather than a horizontal scrollbar. The art
       shrinks; the question is the same one. */
    @media (max-width:599px){
      .ms-row{--ms-base:15px;--ms-gap:2px}
      .ms-cell{border-radius:3px}
      .ms-cell.have,.ms-cell.gone,.ms-cell.add,.ms-cell.socket{border-width:1.5px}
      .ms-cell.on{box-shadow:inset 0 0 0 2px rgba(255,255,255,.96)}
      .ms-side{padding:8px 5px;border-width:2px;border-radius:16px}
    }
    @media (max-width:430px){
      .ms-row{--ms-base:13px;--ms-gap:1px}
    }
    /* The design floor is a 9.7-inch iPad, so the biggest tier is the normal one rather
       than a bonus: 26px cells make a row of ten a hand's width, which is the size a
       four-year-old actually counts at. */
    @media (min-width:768px){
      .ms-row{--ms-base:26px;--ms-gap:4px}
    }

    /* Column Add */
    .column-screen{--game-bg:url('assets-runtime/unicorn/bg-add-subtract.webp');--screen-fallback:linear-gradient(160deg,#fff3e0,#fce4ec,#f3e5f5)}
    .column-card{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(252,228,236,.9));border:3px solid #f48fb1;border-radius:22px;padding:18px 22px 20px;box-shadow:0 5px 0 #f48fb1,0 10px 24px rgba(240,98,146,.16);position:relative;z-index:1;min-width:min(92vw,360px)}
    .column-grid{display:grid;grid-template-columns:34px repeat(var(--col-count,3),54px);gap:7px;align-items:center;justify-content:center;font-family:'Nunito',system-ui,sans-serif}
    .column-digit,.column-plus,.column-answer-box{height:54px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,8vw,3rem);font-weight:900;line-height:1}
    .column-digit{color:#7b1fa2}
    .column-plus{color:#e91e63}
    .column-blank{height:54px}
    .column-line{grid-column:1 / -1;height:4px;background:#9c27b0;border-radius:99px;margin:3px 0}
    .column-final-line{grid-column:1 / -1;height:8px;border-top:4px solid #e91e63;border-bottom:4px solid #e91e63;border-radius:99px;margin-top:5px}
    .column-answer-box{background:#fff;border:3px solid #ce93d8;border-radius:14px;color:#e91e63;box-shadow:0 3px 0 #ce93d8;min-width:54px}
    .column-answer-box.active{border-color:#e91e63;box-shadow:0 0 0 4px rgba(233,30,99,.16),0 3px 0 #ad1457}
    .column-answer-box.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .keypad{display:grid;grid-template-columns:repeat(5,62px);gap:10px;justify-content:center;position:relative;z-index:1}
    .key-btn{height:58px;border:none;border-radius:17px;background:linear-gradient(160deg,#fff,#fce4ec);border:2.5px solid #f48fb1;color:#7b1fa2;font-family:inherit;font-size:1.55rem;font-weight:900;box-shadow:0 4px 0 #f48fb1;cursor:pointer}
    .key-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f48fb1}
    .key-btn.clear{font-size:1.05rem;color:#e91e63;grid-column:span 2}
    .column-celebrate{background:rgba(255,255,255,.9);border:2.5px solid #f48fb1;border-radius:999px;padding:8px 18px;color:#e91e63;font-size:clamp(1.05rem,4vw,1.55rem);font-weight:900;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}

    /* ── COLUMN MATHS (modes c2, c3, c4) ──
       Mode c1 above shares the .column-* classes and must come out of this change
       pixel-identical, so nothing below edits a rule c1 reads — hence .cm-top rather
       than adding position:relative to .column-digit, and .cm-mark rather than reusing
       anything.

       The mark is ONE widget with one meaning: "the one that arrived into this column",
       from the right when adding and from the left when taking away. It holds a 1 or a
       typed 0 and nothing else, which is why "there was no carry" needed no new button
       and no new word. */
    .cm-mark-gap{height:30px}
    .cm-mark{justify-self:center;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px dashed #ce93d8;border-radius:9px;color:#e65100;font-size:1.1rem;font-weight:900;line-height:1}
    .cm-mark.active{border-style:solid;border-color:#e91e63;box-shadow:0 0 0 4px rgba(233,30,99,.16);animation:cmPulse 1.1s ease-in-out infinite}
    .cm-mark.wrong{animation:wrongShake .35s ease;border-color:#f44336}  /* must stay AFTER .active */
    .cm-mark.nudge{animation:cmNudge .3s ease}      /* a dimmed key: not a mistake, so not a shake */
    .cm-zero{opacity:.45}                            /* "nothing arrived" is quieter than a 1 */
    .cm-bad{color:#f44336}                           /* the digit just refused, shown then withdrawn */
    @keyframes cmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
    @keyframes cmNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

    /* Borrowing: the digit next door is crossed out and its new value written at its
       LEFT shoulder — the far side from the little box that has just been filled in, so
       the two small numerals are a whole cell apart and cannot be read as one two-digit
       number. The strike is thin and the struck digit stays dark enough to read,
       because "the 3 became a 2" is meaningless once the 3 has been destroyed. */
    .cm-top{position:relative}
    .cm-top.struck{color:#a58bb8}
    .cm-top.struck::after{content:'';position:absolute;left:14%;right:14%;top:50%;height:3px;border-radius:2px;background:rgba(244,81,30,.85);transform:rotate(-13deg)}
    .cm-new{position:absolute;top:1px;left:2px;font-size:.4em;color:#f4511e;font-weight:900;line-height:1;animation:cmPopIn .3s ease}
    @keyframes cmPopIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
    .cm-minus{color:#c62828}

    /* While a little box is live, 2-9 cannot be right. Dimming teaches the rule and
       leaks nothing — the box is 0-or-1 whatever the problem is. The keys stay tappable
       so nothing looks broken; a tap nudges the box and says the rule, and is NOT
       counted as a wrong answer. Punishing a tap on a control the app has already
       greyed out teaches a four-year-old only that the app is angry. */
    .key-btn.dim{opacity:.38}

    /* Four columns is a width c1 never renders — its widest no-carry sum is three — and
       the fixed 34px + 4x54px + 4x7px = 278px does not fit inside .column-card below a
       357px viewport: the card grows past the phone and .screen{overflow:hidden} clips
       the outer digits rather than scrolling them. Measured at 320px: card 328px on a
       320px screen. Fluid tracks instead, floored where a fingertip and a four-year-
       old's eye can both still use them (196px total at 320, 230px at 375, 278px at
       tablet width). */
    .cm-grid.cm-4{grid-template-columns:clamp(22px,8vw,34px) repeat(4,clamp(38px,12vw,54px));gap:clamp(4px,1.3vw,7px)}
    .cm-grid.cm-4 .column-answer-box{min-width:0}
    .cm-grid.cm-4 .cm-mark{width:clamp(22px,7vw,30px);height:clamp(22px,7vw,30px);font-size:clamp(.85rem,3.4vw,1.1rem)}

    /* Height budget, same idiom as .cb-ladder's clamp: spend the viewport, do not guess.
       Measured at 375x667 (iPhone SE/8, the smallest device in the house): c1's page is
       already 680px tall, and the mark row adds another 39, which puts the undo key
       28px below the fold and forces a child to scroll mid-problem. With these six
       rules the page comes back to exactly 667 with the keypad ending at 633. Scoped to
       .cm-screen, so c1 keeps its current metrics. */
    @media (max-height:740px){
      .cm-screen .column-card{padding:10px 18px 12px}
      .cm-screen .count-title{padding:5px 14px}
      .cm-grid{gap:5px}
      .cm-grid .column-digit,.cm-grid .column-plus,.cm-grid .column-answer-box,.cm-grid .column-blank{height:46px;font-size:clamp(1.5rem,7vw,2.4rem)}
      .cm-grid .cm-mark-gap{height:26px}
      .cm-grid .cm-mark{width:26px;height:26px;font-size:.95rem}
    }

    /* Multiplication */
    .multiply-screen{--game-bg:url('assets-runtime/unicorn/bg-hop-to-number.webp');--screen-fallback:linear-gradient(160deg,#f3e5f5,#fce4ec,#fff3e0)}
    .multiply-card{display:flex;flex-direction:column;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(252,228,236,.9));border:3px solid #f48fb1;border-radius:24px;padding:20px 24px;box-shadow:0 5px 0 #f48fb1,0 10px 24px rgba(240,98,146,.16);position:relative;z-index:1;min-width:min(92vw,430px)}
    .multiply-problem{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:#7b1fa2;font-size:clamp(2.1rem,9vw,4.1rem);font-weight:900;line-height:1}
    .times-symbol,.equals-symbol{color:#e91e63}
    .multiply-answer-row{display:flex;align-items:center;justify-content:center;gap:8px}
    .multiply-answer-box{width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #ce93d8;border-radius:15px;color:#e91e63;font-size:clamp(1.8rem,8vw,3rem);font-weight:900;box-shadow:0 3px 0 #ce93d8}
    .multiply-answer-box.active{border-color:#e91e63;box-shadow:0 0 0 4px rgba(233,30,99,.16),0 3px 0 #ad1457}
    .multiply-answer-box.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .multiply-celebrate{background:rgba(255,255,255,.9);border:2.5px solid #f48fb1;border-radius:999px;padding:8px 18px;color:#e91e63;font-size:clamp(1.05rem,4vw,1.55rem);font-weight:900;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}
    .times-picker-label{font-size:.82rem;font-weight:900;color:#9c27b0;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;text-align:center}

    /* ── PICK YOUR NUMBER ──
       The child chooses the difficulty, so the choice is the biggest thing on screen:
       one tap on a number IS the setting, no confirm step and no grown-up gesture.
       Tiles are 60px so a 4-year-old's fingertip cannot miss between them. */
    .pick-box{max-width:440px}
    .pick-question{font-size:clamp(1.25rem,5.5vw,1.7rem);font-weight:900;color:#7b1fa2;text-align:center;line-height:1.15}
    .pick-question span{color:#e91e63}
    .pick-hint{font-size:.9rem;font-weight:900;color:#9c27b0;opacity:.75;text-align:center;margin-top:3px}
    .pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
    .pick-btn{height:60px;border-radius:18px;border:3px solid #f48fb1;background:linear-gradient(160deg,#fff,#fce4ec);color:#7b1fa2;font-family:inherit;font-size:1.6rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #f48fb1;transition:transform .1s}
    .pick-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #f48fb1}
    .pick-btn.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff;box-shadow:0 4px 0 #ad1457}
    @media (max-width:430px){.pick-grid{grid-template-columns:repeat(4,1fr)}}
    /* The difficulty pill in the top bar is the way back to the picker, so it has to
       look pressable — it is a wider target than the gear beside it. */
    .level-chip{display:flex;align-items:center;gap:5px;font-family:inherit;font-size:.85rem;font-weight:900;color:#e91e63;background:linear-gradient(160deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:50px;padding:6px 13px;cursor:pointer;box-shadow:0 3px 0 #f48fb1;white-space:nowrap}
    .level-chip:active{transform:translateY(2px);box-shadow:0 1px 0 #f48fb1}
    .level-chip-caret{font-size:.7rem;opacity:.8}
    .level-chip.static{background:rgba(255,255,255,.65);border-color:transparent;box-shadow:none;color:#9c27b0;cursor:default}

    /* ── COUNT BY: the same numbers read two ways at once ──
       Top strip = the skip-counting chant (12, 24, 36, ?).
       Ladder below = the very same numbers written as the times table.
       The child types into the ladder, so filling in the table IS counting on. */
    .countby-screen{--game-bg:url('assets-runtime/unicorn/bg-hop-to-number.webp');--screen-fallback:linear-gradient(160deg,#f3e5f5,#fce4ec,#fff3e0)}
    /* max-width, not just min-width: the chant strip is one long flex row, and a row of
       20 chips reports that whole length as the card's intrinsic width — which dragged the
       card wider than the phone and clipped both ends of every rung. Pinning both bounds
       fixes the card to the screen and lets .cb-chain scroll inside it, which is what its
       overflow-x was always for. */
    .countby-card{gap:10px;padding:15px 16px 17px;min-width:min(92vw,470px);max-width:min(92vw,470px)}
    .cb-chain{display:flex;align-items:center;gap:6px;width:100%;min-width:0;overflow-x:auto;padding:2px 2px 7px;scrollbar-width:none}
    .cb-chain::-webkit-scrollbar{display:none}
    .cb-chip{flex:0 0 auto;min-width:46px;padding:6px 11px;border-radius:999px;background:linear-gradient(160deg,#fff,#fce4ec);border:2.5px solid #f48fb1;color:#e91e63;font-size:1.05rem;font-weight:900;text-align:center;box-shadow:0 3px 0 #f48fb1}
    .cb-chip.next{border-style:dashed;border-color:#e91e63;color:#7b1fa2;animation:cbPulse 1.2s ease-in-out infinite}
    .cb-arrow{flex:0 0 auto;color:#7b1fa2;font-weight:900;opacity:.5}
    /* Height is budgeted against the viewport, not guessed: everything else on this
       screen (bars, title, chain, keypad) plus the corner mascot's fixed footprint
       costs ~620px, and the keypad must stay clear of the mascot on a phone. */
    .cb-ladder{display:flex;flex-direction:column;gap:6px;width:100%;max-height:clamp(140px,calc(100vh - 620px),290px);overflow-y:auto;padding:2px}
    .cb-rung{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:5px 12px;border-radius:14px;border:2.5px solid #f8bbd0;background:#fff;overflow:hidden}
    .cb-rung::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--fill,0%);background:linear-gradient(90deg,rgba(244,143,177,.5),rgba(233,30,99,.2));transition:width .35s ease}
    .cb-rung>*{position:relative;z-index:1}
    .cb-fact{font-size:1rem;font-weight:900;color:#7b1fa2;white-space:nowrap}
    .cb-fact b{color:#e91e63;font-size:1.2rem}
    .cb-val{font-size:1.4rem;font-weight:900;color:#e91e63;min-width:62px;text-align:right}
    .cb-rung.todo{opacity:.42;border-style:dashed}
    .cb-rung.todo .cb-val{color:#f48fb1}
    .cb-rung.active{border-color:#e91e63;box-shadow:0 0 0 4px rgba(233,30,99,.16)}
    .cb-rung.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .cb-rung.fresh{animation:correctPop .5s ease}
    .cb-answer{display:flex;gap:5px}
    .cb-box{width:34px;height:40px;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid #ce93d8;border-radius:11px;color:#e91e63;font-size:1.3rem;font-weight:900;box-shadow:0 2px 0 #ce93d8}
    .cb-box.active{border-color:#e91e63;box-shadow:0 0 0 3px rgba(233,30,99,.18),0 2px 0 #ad1457}
    @keyframes cbPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.09);opacity:.72}}


    .gp-cellx{width:11px;height:11px;border-radius:2px;border:1.5px solid #f48fb1;background:#fff}
    .gp-cellx.on{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63}

    .gp-gap{width:7px}
    .gp-speak{width:18px;height:18px;display:block}
    /* ── READ BIG NUMBERS (r1) ── */
    .rb-card{gap:10px;padding:14px 16px 16px;min-width:min(94vw,700px);max-width:min(94vw,700px)}
    .rb-robot{width:104px;flex:0 0 auto;position:relative;display:grid;place-items:center}
    /* Both frames occupy the same cell so the swap cannot shift the layout by a pixel. */
    .rb-robot img{width:100%;height:auto;display:block;grid-area:1/1;transition:opacity .18s linear}
    .rb-robot .rb-talk{opacity:0}
    .rb-robot.talking .rb-still{opacity:0}
    .rb-robot.talking .rb-talk{opacity:1}
    /* An animated WebP cannot be paused, so the idle robot is the still one and the
       animation simply runs unseen underneath. At 104px that costs nothing, and it means
       the first word never waits for a decode. */
    @media (prefers-reduced-motion: reduce){
      .rb-robot .rb-talk{display:none}
      .rb-robot .rb-still{opacity:1 !important}
      /* Movement is refused, so the "who is speaking" cue falls back to light on the
         still face -- the child still needs to know he is the one talking. */
      .rb-robot.talking{animation:rbPulse 1.4s ease-in-out infinite}
    }
    @keyframes rbPulse{0%,100%{filter:none}50%{filter:brightness(1.14) drop-shadow(0 0 9px rgba(233,30,99,.7))}}

    /* The gaps between groups ARE the lesson -- they are where the child sees thousands
       part from hundreds -- so the grouping is drawn in space, not with a comma glyph
       a pre-reader cannot decode. */
    .rb-number{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:nowrap;width:100%;min-height:74px}
    .rb-group{display:flex;flex-direction:column;align-items:center;gap:3px}
    .rb-scale{font-size:.6rem;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#e91e63;opacity:.65}
    .rb-digits{display:flex;gap:4px}
    .rb-slot{width:var(--box);height:calc(var(--box) * 1.18);display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid #f8bbd0;border-radius:11px;color:#e91e63;font-size:calc(var(--box) * .62);font-weight:900;box-shadow:0 2px 0 #f8bbd0}
    .rb-slot.next{border-style:dashed;border-color:#e91e63;animation:cbPulse 1.2s ease-in-out infinite}
    .rb-read{background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;border:none;border-radius:50px;padding:11px 38px;font-family:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #7b1fa2}
    .rb-read:active{transform:translateY(3px);box-shadow:0 1px 0 #7b1fa2}
    .rb-read.off{opacity:.4;box-shadow:0 4px 0 #f8bbd0;cursor:default}
    .rb-pad{margin-top:2px}
    .rb-titlerow{display:flex;align-items:center;justify-content:center;gap:12px;position:relative;z-index:1}
