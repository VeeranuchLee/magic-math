    .rb-restart{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:50px;padding:10px 16px;font-family:inherit;font-size:1rem;font-weight:900;color:#7b1fa2;cursor:pointer;box-shadow:0 4px 0 #ce93d8;transition:transform .1s;line-height:1;white-space:nowrap}
    .rb-restart:active{transform:translateY(3px);box-shadow:0 1px 0 #ce93d8}
    .rb-restart.off{opacity:.35;box-shadow:0 4px 0 #e8d3ec;cursor:default}
    .rb-pad .key-btn.clear{grid-column:2/span 3}

    /* ── TIMES TABLE CHART (m2): the whole field at once, one cell explained ──
       A chart, not a quiz. Every product is printed, because the patterns a child
       actually learns from a times table -- the square numbers running down the
       diagonal, the 5s column ending in 0 and 5 -- exist only when the whole field is
       visible. Tapping does not test anything; it explains one cell.
       Sized so 15 x 15 plus its two header strips fits a 9.7" iPad without scrolling:
       16 tracks in a 760px card is ~45px a cell. */
    .tc-card{gap:8px;padding:12px;min-width:min(96vw,760px);max-width:min(96vw,760px)}
    .tc-grid{display:grid;grid-template-columns:repeat(calc(var(--n) + 1),1fr);gap:2px;width:100%}
    .tc-corner{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:1rem;font-weight:900;color:#e91e63;opacity:.55}
    .tc-head{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:6px;background:linear-gradient(160deg,#fff,#fce4ec);border:1.5px solid #f48fb1;color:#e91e63;font-weight:900;font-size:clamp(.6rem,1.55vw,1rem)}
    /* The lit header strips are how a four-year-old keeps their place: the row and the
       column leading to the tapped cell stay marked while the panel is open. */
    .tc-head.lit{background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff}
    .tc-cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:6px;border:1.5px solid #f8bbd0;background:#fff;color:#7b1fa2;font-family:inherit;font-weight:900;font-size:clamp(.5rem,1.35vw,.9rem);cursor:pointer;padding:0;line-height:1}
    .tc-cell.lead{background:#fce4ec}
    .tc-cell.sel{background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;box-shadow:0 0 0 3px rgba(233,30,99,.22);position:relative;z-index:1}
    .tc-cell:active{transform:scale(.92)}

    /* A group is a button now. Uncounted ones breathe, which is how a child finds out
       they are tappable without anyone reading them an instruction. */
    .tc-group{position:relative;cursor:pointer;font-family:inherit;animation:tcBreathe 2.2s ease-in-out infinite}
    .tc-group.counted{animation:none;border-style:solid;background:linear-gradient(160deg,#fff,#fce4ec);box-shadow:0 3px 0 #f48fb1}
    .tc-group .tc-sq{background:#f8bbd0}
    .tc-group.counted .tc-sq{background:linear-gradient(160deg,#e91e63,#7b1fa2)}
    /* The running total sits ON the group that reached it, so the child can read the
       count back along the row afterwards -- 7, 14, 21 stays on screen. */
    .tc-tally{position:absolute;top:-9px;right:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(20,30,90,.3)}
    .tc-done.lit{animation:hintGlow 1.1s ease-in-out infinite}
    @keyframes tcBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

    /* The panel covers the lower grid rather than shrinking it. The chart is the home
       surface of this screen and is never rebuilt underneath the child -- the same
       reason What's Missing? sizes its blocks off the side that cannot change. */
    .tc-panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid #f48fb1;border-radius:26px 26px 0 0;padding:14px 16px 20px;box-shadow:0 -12px 34px rgba(20,30,90,.28);z-index:6;max-height:54vh;overflow-y:auto;animation:tcUp .24s ease}
    @keyframes tcUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .tc-fact{font-size:1.5rem;font-weight:900;color:#7b1fa2;text-align:center;line-height:1.1}
    .tc-fact b{color:#e91e63}
    .tc-sub{font-size:1rem;font-weight:900;color:#e91e63;text-align:center;margin-top:3px;opacity:.85}
    .tc-groups{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:12px}
    .tc-group{display:grid;grid-template-columns:repeat(var(--cols),var(--sq));gap:3px;padding:5px;border:2px dashed #f48fb1;border-radius:10px;background:#fce4ec}
    .tc-sq{width:var(--sq);height:var(--sq);border-radius:3px;background:linear-gradient(160deg,#e91e63,#7b1fa2);animation:correctPop .35s ease}
    .tc-done{display:block;margin:14px auto 0;background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;border:none;border-radius:50px;padding:11px 40px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #7b1fa2}
    .tc-done:active{transform:translateY(3px);box-shadow:0 1px 0 #7b1fa2}

    /* ── THE BLOCKS HINT on Times Tables (m1) ──
       Reuses .tc-groups/.tc-group/.tc-sq/.tc-tally from the chart's panel, so the picture
       is the same one the child met there. Only the frame differs: inline in the screen's
       flow instead of a fixed bottom sheet, and translucent so the screen behind still
       reads through -- it is help sitting on the page, not a panel taking it over. */
    .mh-hint{margin:14px auto 0;max-width:min(94vw,620px);padding:10px 12px 12px;
      background:rgba(255,255,255,.9);border:2.5px solid #f48fb1;border-radius:20px;
      box-shadow:0 5px 0 #f48fb1;animation:mhIn .22s ease}
    @keyframes mhIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .mh-cap{font-size:1.05rem;font-weight:900;color:#e91e63;text-align:center}
    /* The total is the three-miss reveal, so it is the loud part of the caption. */
    .mh-total{color:#7b1fa2;font-size:1.2rem}
    .mh-hint .tc-groups{margin-top:8px;gap:7px}
    /* ── READ FRACTIONS (f1): the wall ──
       Sized so the whole wall is on screen at once on a 9.7" iPad without scrolling,
       because a wall you scroll is not a wall. Twelfths land at roughly 40px a piece,
       under the usual tap minimum -- which is safe here and nowhere else: the pieces
       touch, and ANY piece is the right piece, so a tap that lands between two of them
       still takes one. */
    /* ── FRACTIONS, PIE VIEW (f1) — the default since 2026-08-27 ──
       auto-fit rather than a fixed column count: nine pies land 3-across on a 768px iPad
       and reflow to 2 on a phone without a media query. minmax's floor is what keeps a
       twelfth wide enough to hit. */
    .fp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
      gap:10px 12px;width:100%;justify-items:center}
    .fp-cell{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
    .fp-pie{width:min(100%,132px);height:auto;display:block;overflow:hidden}
    /* Each sector is its own hit area, so the stroke is what separates them -- drawn in the
       card colour rather than a line, which keeps the circle reading as one whole thing. */
    .fp-piece{fill:#fce4ec;stroke:#ce93d8;stroke-width:1.6;cursor:pointer;
      transition:fill .14s ease}
    .fp-piece.on{fill:#e91e63;animation:fpFlash .34s ease}
    @keyframes fpFlash{0%{filter:brightness(1.75)}100%{filter:none}}
    .fp-piece:active{fill:#e9a8d4}
    .fp-piece:focus-visible{outline:none;stroke:#7b1fa2;stroke-width:3}
    /* A completed circle is the equivalence the screen exists for, so it says so out loud. */
    .fp-cell.full .fp-piece.on{fill:#7b1fa2}
    .fp-foot{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px}
    /* Reserved, not grown: the second row must not jump down when a fraction appears
       in the first. 56px is measured, not guessed -- a stacked fraction renders 39.6px
       and the name 14px, so the tallest foot is 54.6px. */
    .fp-foot .fw-read{min-height:40px;justify-content:center}
    .fp-name{font-size:.66rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
      color:#7b1fa2;opacity:.7}
    .fp-toggle{padding:10px 12px}
    .fw-card{gap:6px;padding:14px 16px;min-width:min(96vw,760px);max-width:min(96vw,760px)}
    .fw-wall{display:flex;flex-direction:column;gap:7px;width:100%}
    .fw-row{display:grid;grid-template-columns:76px 1fr 88px;align-items:center;gap:9px}
    .fw-name{font-size:.68rem;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#e91e63;opacity:.65;text-align:right}
    .fw-row.full .fw-name{opacity:1;color:#7b1fa2}
    .fw-bar{display:grid;grid-template-columns:repeat(var(--d),1fr);gap:3px;height:40px}
    .fw-piece{border:2px solid #f48fb1;border-radius:7px;background:#fce4ec;cursor:pointer;padding:0;font-family:inherit}
    .fw-piece:active{transform:scale(.94)}
    .fw-piece.on{background:linear-gradient(160deg,#e91e63,#7b1fa2);border-color:#7b1fa2;animation:correctPop .3s ease}
    .fw-read{display:flex;align-items:center;gap:6px;font-weight:900}
    .fw-frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
    /* The numerator wears the colour of a TAKEN piece and the denominator the colour of an
       EMPTY one. That is the whole explanation of which number means what, and it needs no
       words -- which matters on a screen aimed at a child who cannot read a caption. */
    .fw-top{font-size:1.05rem;color:#e91e63}
    .fw-rule{width:19px;height:2px;background:#f48fb1;margin:2px 0;border-radius:2px}
    .fw-bot{font-size:1.05rem;color:#f48fb1}
    .fw-one{font-size:1.2rem;color:#e91e63}
    .fw-eq{font-size:.92rem;color:#7b1fa2}
    .gp-piece{width:13px;height:16px;border-radius:3px;border:1.5px solid #f48fb1;background:#fce4ec}
    .gp-piece.on{background:linear-gradient(160deg,#e91e63,#7b1fa2);border-color:#7b1fa2}

    /* ── SCORE ROW: VISIBLE FLOWER GARDEN ── */
    .score-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:740px;gap:10px;position:relative;z-index:1}
    .score-badge{background:linear-gradient(135deg,#fff,#fce4ec);border:2px solid #f48fb1;border-radius:50px;padding:5px 14px;font-size:.95rem;font-weight:900;color:#e91e63;box-shadow:0 3px 8px rgba(240,98,146,.2);white-space:nowrap}
    .score-badge span{color:#7b1fa2}
    .flower-garden{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:6px 8px;background:rgba(255,255,255,.84);border:2px solid #f8bbd0;border-radius:16px;box-shadow:0 3px 10px rgba(240,98,146,.12);max-width:336px;flex:1}
    .flower-slot{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
    .flower-slot.empty{opacity:.18;color:#c9a5c9;filter:grayscale(.45)}
    .flower-slot.filled{opacity:1;font-size:20px;background:rgba(252,228,236,.72);border-radius:50%;animation:flowerPop .35s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 3px rgba(123,31,162,.25))}
    .garden-full-badge{position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border:2px solid #f48fb1;border-radius:999px;padding:4px 10px;color:#e91e63;font-size:.78rem;font-weight:900;box-shadow:0 3px 0 #f48fb1}
    @keyframes flowerPop{from{transform:scale(0) rotate(-12deg)}to{transform:scale(1) rotate(0)}}
    @media (max-width:430px){
      .score-row{gap:6px}
      .score-badge{padding:5px 10px}
      .flower-garden{gap:2px;padding:5px 6px;max-width:286px}
      .flower-slot{width:21px;height:21px;font-size:16px}
    }

    /* ── BUTTONS ── */
    .check-btn{background:linear-gradient(160deg,#ba68c8,#6a1b9a);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #4a148c;transition:transform .1s;position:relative;z-index:1}
    .check-btn:active{transform:translateY(4px)}
    .new-num-btn{background:linear-gradient(160deg,#f48fb1,#c2185b);color:#fff;border:none;border-radius:50px;padding:12px 26px;font-family:inherit;font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #880e4f;transition:transform .1s;position:relative;z-index:1}
    .new-num-btn:active{transform:translateY(4px)}
    .next-btn{background:linear-gradient(160deg,#f06292,#ad1457);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #880e4f;transition:transform .1s;position:relative;z-index:1}
    .next-btn:active{transform:translateY(4px)}

    /* ── NUMBER LINE ── */
    .prompt-bubble{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 #f48fb1;font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#333;text-align:center;position:relative;z-index:1}
    .target-num{display:inline-block;color:#e91e63;font-size:1.3em;animation:pulse 1s infinite alternate}
    .start-num{display:inline-block;color:#7b1fa2;font-size:1.15em}
    .op-add{display:inline-block;color:#2e7d32;font-size:1.15em}
    .op-sub{display:inline-block;color:#c62828;font-size:1.15em}
    .eq-mark{color:#999}
    @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}
    .hop-counter{background:linear-gradient(135deg,#fff,#e8f5e9);border:2px solid #a5d6a7;border-radius:50px;padding:5px 16px;font-size:.9rem;font-weight:900;color:#2e7d32;position:relative;z-index:1}
    .char-inner{position:absolute;top:4px;transition:left .45s cubic-bezier(.34,1.56,.64,1);animation:float 2s ease-in-out infinite alternate;display:flex;align-items:flex-end}
    .char-inner img{width:76px;height:76px;object-fit:contain}
    .char-missing{width:76px;height:76px}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}
    .number-line-wrapper{width:100%;max-width:740px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
    .number-line{display:flex;align-items:center;min-width:max-content;padding:8px 16px;position:relative}
    .nl-track{position:absolute;top:50%;left:0;right:0;height:12px;background:linear-gradient(90deg,#f44336,#ff9800,#ffeb3b,#4caf50,#2196f3,#9c27b0,#e91e63);border-radius:6px;transform:translateY(-50%);box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:0}
    .nl-number{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;cursor:pointer;border:none;position:relative;z-index:1;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s;flex-shrink:0}
    .nl-number:active{transform:scale(.9) translateY(3px)}
    .nl-number.start-marker{background:#fff!important;color:#7b1fa2!important;font-size:1.25rem;width:54px;height:54px;box-shadow:0 0 0 4px #e91e63,0 5px 0 #880e4f!important;animation:startPulse 1.1s ease-in-out infinite;z-index:2}

    .nl-number.correct{animation:correctPop .5s ease}

    .hop-num-badge{font-size:.72rem;font-weight:900;padding:1px 3px;border-radius:4px;min-width:14px;text-align:center}
    .hop-num-add{color:#1b5e20;background:#c8e6c9}.hop-num-sub{color:#b71c1c;background:#ffcdd2}
    .hop-arrow-add{color:#2e7d32;font-size:1.35rem;font-weight:900;line-height:1}
    .hop-arrow-sub{color:#c62828;font-size:1.35rem;font-weight:900;line-height:1}
    .hop-dot{width:7px;height:7px;border-radius:50%;background:#e0e0e0;margin-bottom:4px}
    .start-flag{font-size:.65rem;font-weight:900;line-height:1;margin-bottom:4px;color:#7b1fa2}
    .inline-icon{width:1.05em;height:1.05em;object-fit:contain;vertical-align:-.14em}
    .home-cloud-row{display:flex;gap:96px;align-items:center;justify-content:center;min-height:72px;margin-bottom:-8px}
    .home-cloud{width:92px;object-fit:contain;opacity:.92;filter:drop-shadow(0 5px 10px rgba(156,39,176,.14))}
    .home-section-heading{display:flex;align-items:center;gap:8px}
    .section-icon{object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}

    /* ── MASCOT ── */
    .screen>.mascot-corner{position:fixed;left:22px;bottom:22px;width:116px;height:116px;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;isolation:isolate;filter:drop-shadow(0 7px 14px rgba(123,31,162,.32))}
    .screen>.mascot-corner::before{content:'';position:absolute;left:50%;bottom:2px;width:96%;height:82%;transform:translateX(-50%);border-radius:999px;background:radial-gradient(circle at 50% 54%,rgba(255,255,255,.96) 0 46%,rgba(255,245,253,.82) 58%,rgba(244,143,177,.38) 75%,rgba(244,143,177,0) 100%);box-shadow:0 0 0 3px rgba(255,255,255,.62),0 8px 22px rgba(123,31,162,.22);z-index:0}
    /* The button is the tap target. It fills the wrapper because the unicorn art already
       does — 116px on a tablet, 78px on a phone, both well past the 44px minimum. The
       wrapper stays pointer-events:none so only this button takes taps. */
    .screen>.mascot-corner .mascot-poke{pointer-events:auto;position:relative;z-index:1;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
    .screen>.mascot-corner .mascot-poke:active{transform:scale(.93)}
    .screen>.mascot-corner img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;animation:float 2.3s ease-in-out infinite alternate;transform-origin:center bottom;will-change:transform;filter:saturate(1.08) contrast(1.04) drop-shadow(0 3px 5px rgba(74,20,140,.22))}
    .screen>.mascot-corner.happy img{animation:mascotHappy 1s cubic-bezier(.34,1.56,.64,1)}
    .screen>.mascot-corner.oops img{animation:mascotOops .6s ease}
    @keyframes mascotHappy{0%{transform:translateY(0) rotate(0) scale(1)}30%{transform:translateY(-38px) rotate(-10deg) scale(1.15)}55%{transform:translateY(0) rotate(7deg)}75%{transform:translateY(-18px) rotate(-5deg) scale(1.08)}100%{transform:translateY(0) rotate(0) scale(1)}}
    @keyframes mascotOops{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateX(-4px)}50%{transform:rotate(7deg) translateX(4px)}75%{transform:rotate(-4deg)}}
    @media (max-width:430px){.screen>.mascot-corner{left:10px;bottom:12px;width:78px;height:78px}.screen>.mascot-corner::before{width:98%;height:84%}}
    .char-inner.oops{animation:mascotOops .6s ease}
    .char-inner.happy{animation:mascotHappy 1s cubic-bezier(.34,1.56,.64,1)}

    /* ── HINTS & GENTLE HELP ── */
    .ghost-hint{opacity:.35;color:#9c27b0}
    .nl-number.hint-glow{animation:hintGlow 1.1s ease-in-out infinite}
    @keyframes hintGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.16);box-shadow:0 0 0 8px #ffd54f,0 4px 0 rgba(0,0,0,.2)}}

    /* ── UNIFIED NUMBER LINE SCROLL ── */
    .line-stack{min-width:max-content;display:flex;flex-direction:column}
    .char-row{position:relative;height:90px}
    .char-row .char-inner{position:absolute;top:2px}

    /* ── CELEBRATE / WRONG TEXT ── */
    .celebrate-text{font-size:clamp(1.2rem,4.5vw,2rem);font-weight:900;text-align:center;color:#e91e63;text-shadow:0 3px 0 #9c27b0;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:1}
    .wrong-text{font-size:clamp(1.1rem,4vw,1.7rem);font-weight:900;text-align:center;color:#e91e63;animation:popIn .35s ease;position:relative;z-index:1}
    @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

    /* ── CONFETTI ── */
    .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
    .confetti-piece{position:absolute;animation:confettiFall linear forwards}
    @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
  </style>

<div id="root"></div>
<script>
function _extends() { return _extends = Object.assign ? Object.assign.bind() : function (n) { for (var e = 1; e < arguments.length; e++) { var t = arguments[e]; for (var r in t) ({}).hasOwnProperty.call(t, r) && (n[r] = t[r]); } return n; }, _extends.apply(null, arguments); }
const {
  useState,
  useCallback,
  useMemo,
  useRef,
  useEffect
} = React;

/* ══ SOUND ══ */
const Sound = (() => {
  let _ctx = null,
    _muted = false,
    _bus = null;
  const ctx = () => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!_ctx) _ctx = new AC();
    if (_ctx.state === 'suspended') _ctx.resume();
    return _ctx;
  };
  /* ── THE BUS ──
     Every cue used to connect its oscillator straight to c.destination, which is most
     of why the set read as a test-tone generator: pure sines, no room, and nothing
     between eight stacked partials and the speaker. The graph is now
         source -> [dry + reverb send] -> master -> compressor -> destination
     built once per context and cached.
     There is deliberately no compressor on this bus. One was tried, on the assumption
     that celebrate()'s twelve tones and seven noise bursts inside 900 ms would sum past
     full scale. Rendered offline they peak at 0.16, so there was nothing to catch — and
     a DynamicsCompressor across the whole set measured 6-9 dB OFF the short quiet cues
     (tap, hop) while lifting the loud ones, inverting the dynamic range the cue volumes
     were chosen to create. If you add one back, measure every cue before and after.
     The impulse response is generated here rather than fetched. Decaying white noise
     is a perfectly good small room, and a fetched .wav would be the first audio file in
     this repository — see AUDIO-DIRECTION.md for why we are not starting that for a
     reverb tail. Zero bytes shipped, nothing to record provenance for. */
  const bus = c => {
    if (_bus && _bus.c === c) return _bus;
    const master = c.createGain(),
      dry = c.createGain(),
      wet = c.createGain(),
      rev = c.createConvolver();
    master.gain.value = 1;
    dry.gain.value = 1;
    wet.gain.value = .32;
    const rate = c.sampleRate,
      len = Math.floor(rate * 1.1),
      ir = c.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    rev.buffer = ir;
    dry.connect(master);
    rev.connect(wet);
    wet.connect(master);
    master.connect(c.destination);
    _bus = {
      c,
      dry,
      rev,
      master
    };
    return _bus;
  };
  /* Signature is unchanged through `fe` on purpose: every existing call site in both
     skins — including the ones this file does not itself define — keeps working and
     gets the room for free. `send` is the only addition and defaults to a half-send;
     seam() is the one cue that passes 0, because reverb on the beat between two spoken
     lines would smear it into the next word, which is the single thing that cue exists
     to avoid.
     The attack ramp is new and is not cosmetic: jumping the gain straight to `vol` is a
     discontinuity, and at tap()'s 80 ms that click was audible as a tick in front of
     every button press. */
  const tone = (c, freq, type, t, dur, vol, fe, send) => {
    try {
      const b = bus(c),
        o = c.createOscillator(),
        g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (fe) o.frequency.exponentialRampToValueAtTime(fe, t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.012, dur * .3));
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);

      g.connect(b.dry);

      if (s > 0) {
        const sg = c.createGain();
        sg.gain.value = s;
        g.connect(sg);
        sg.connect(b.rev);
      }
      o.start(t);
      o.stop(t + dur);
    } catch (e) {}
  };
  /* Band-passed noise — the layer the old set had none of, and the rest of why it read
     as synthetic. A finger on a surface, a poof of dust and a rocket are all broadband;
     a sine can only ever be a beep. Band-passed rather than raw so each burst colours
     the cue it sits under instead of hissing across the whole spectrum. */
  const noise = (c, t, dur, vol, f0, f1, q) => {
    try {
      const b = bus(c),
        rate = c.sampleRate,
        len = Math.max(1, Math.floor(rate * dur)),
        buf = c.createBuffer(1, len, rate),
        d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(),
        f = c.createBiquadFilter(),
        g = c.createGain();
      src.buffer = buf;
      f.type = 'bandpass';
      f.Q.value = q || 1.2;
      f.frequency.setValueAtTime(f0, t);
      if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.01, dur * .25));
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(f);
      f.connect(g);
      g.connect(b.dry);
      const sg = c.createGain();
      sg.gain.value = .4;
      g.connect(sg);
      sg.connect(b.rev);
      src.start(t);
      src.stop(t + dur);
    } catch (e) {}
  };
  return {
    setMuted(v) {
      _muted = v;
    },
    /* A tap is a finger landing on a surface, so it needs a body and a click. The two
       sines are the body; the 18 ms noise chip at 2.6 kHz is the fingernail. 18 ms is
       short enough that the ear fuses it into the tone rather than hearing two events,
       and the send is cut to .3 so the most frequent cue in the app does not leave the
       room ringing after every keypress. */
    tap() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 880, 'sine', n, .08, .11, 0, .3);
      tone(c, 1320, 'sine', n + .04, .06, .07, 0, .3);
      noise(c, n, .018, .05, 2600, 1400, 1.6);
    },
    /* The beat between two spoken lines. Beside tap() because it is punctuation, not
       a reward: one triangle blip at 330 Hz gliding to 300, 45 ms, .05 gain, scheduled
       .08 s ahead on the audio clock so it clears the tail of the word that just ended.

       one falls, is a twelfth of ding()'s length and under half a tap in volume, and

     reason is url()'s role split below. The robot asks idFor(), which is the regexes. The
     companion asks exactFor(), which is the text map and the positional praise and NO
     REGEXES AT ALL. The second-miss line -- "8 groups of 7. Count them!" -- is the
     companion's, so a fifth regex would never be consulted for it; it needs a `texts`
     entry. And `times-tables` must never have one: an entry there resolves ungated in
     every mode, so feeding it 308 bare products would restore the 2026-08-20 bug the
     VOICED gate exists to end. A separate set gets the map for the 144 fixed sentences
     and leaves the products without it. Same voice and format, so crossing into it
     mid-chain is inaudible. */
  const SETS = ['times-tables', 'count-by', 'shared', 'times-tables-hint'];
  const PRAISE_PREFIX = 'tt-praise-u';
  let have = null; /* id -> set directory */
  let texts = null; /* exact line text -> id */
  /* ══ WHICH MODES MAY SPEAK IN THE RENDERED VOICE ══
     Owner's decision, 2026-08-20: a mode is either fully voiced or fully robot. Never
     both, because two voices inside one game is worse than one robot voice throughout.
      RESOLVING BY TEXT ALONE WAS NOT ENOUGH, and this set is the correction. `praise()` is
     called by all nine modes and `tt-praise-*` matched it everywhere, so a child in Carry
     Add already heard the real voice say "Mission complete!" after a robot said "fifty
     seven take away six is fifty one." Worse, `${answer}!` matches /^(\d+)!$/ and the
     bare-number clips are the 152 distinct PRODUCTS of two numbers up to 20 — which are
     not a range but do collide constantly with ordinary arithmetic answers. Measured:
     71% of Take Away answers, 57% of Carry Add answers and 42% of Big Carry answers hit a
     rendered clip. So the voice flipped mid-chain depending on whether the answer happened
     to be a times-table product, which is arbitrary and audible.
      A mode belongs here only when EVERY line reachable inside it is rendered — its
     prompts, its answer chain, its praise, its mascot and its journey arrivals. Adding a
     mode before that is what caused the bug above, so the test is coverage, not intent.
      Three qualify, as of 2026-08-20, and each was checked rather than assumed —
     `python3 tools/build-narration-manifest.py --verify` reports 518/518 lines rendered
     AND reachable, and it is the thing to re-run before adding a fourth:
        null  the home screen. Its only spoken lines are the ten card names.
       m1    Times Tables. Its arithmetic was already rendered; its picker prompt, the
             mascot and the journey arrivals were NOT, which is why it did not really
             qualify when this gate was first written.
       s1    Count By. Its answer chain always resolved, because its lines share the
             times table's shape; the 481 prompts and chants are what were missing.
      The other eight modes stay out permanently, not pending work: their spoken lines
     carry unbounded PAIRS of numbers up to 1000+, so whole-sentence coverage is
     impossible rather than expensive. Owner's decision, 2026-08-20.
      One accepted edge: tapping a card speaks its name in the rendered voice on the home
     screen and then drops into a game that may be all-robot. That is a screen change,
     not a flip inside a sentence, and the card name belongs to the home screen. */
  const VOICED = new Set([null, 'm1', 'm2', 's1']);
  /* ══ WHAT THE MODE GATE ACTUALLY GUARDS — REVISED 2026-08-21 ══
     The gate above used to apply to every line. It no longer does, and the distinction
     it now draws is the entire safety argument for the two-voice split:
        EXACT MATCHES resolve in EVERY mode. `texts` is emitted from the manifest that was
       rendered, so an entry existing is proof that we chose that exact sentence, paid for
       it, and encoded it. There is no unbounded space behind it and nothing to be
       surprised by. This is what lets the companion keep her own voice in Carry Add.
        PATTERN MATCHES stay behind the gate, unchanged. `tt-n-*` is 152 arbitrary
       products, `tt-q/tt-a` are 400 facts, and outside m1 and s1 an ordinary arithmetic
       answer hits one only by coincidence — which is exactly the bug of 2026-08-20.
      So: the companion asks for a line by its text and gets it anywhere; the robot asks
     for a number and gets a file only in the two modes where the whole number space was
     bought and verified. */
  const exactFor = text => {
    const s = String(text).trim();
    if (texts && texts[s]) return texts[s];
    /* Praise is positional rather than mapped, because the strings are skin-specific —
       see PRAISE above — and it is the companion's line in every mode that can say it. */
    const p = PRAISE.indexOf(s);
    if (p >= 0) return PRAISE_PREFIX + (p + 1);
    return null;
  };
  let mode = null;
  const idFor = text => {
    const s = String(text).trim();
    /* The map is exact and generated, so it wins over the patterns. */
    if (texts && texts[s]) return texts[s];
    let m;
    if (m = s.match(/^(\d+) times (\d+)\?$/)) return 'tt-q-' + m[1] + 'x' + m[2];
    if (m = s.match(/^(\d+) times (\d+) is (\d+)\.$/)) return 'tt-a-' + m[1] + 'x' + m[2];
    if (m = s.match(/^(\d+)!$/)) return 'tt-n-' + m[1];
    const p = PRAISE.indexOf(s);
    if (p >= 0) return PRAISE_PREFIX + (p + 1);
    return null;
  };
  return {
    load() {
      /* Each set is independent: one missing clips.json costs that set only, and the
         lines it would have covered fall back to the engine. */
      SETS.forEach(set => {
        try {
          fetch(ROOT + set + '/clips.json').then(r => r.ok ? r.json() : null).then(j => {
            if (!j || !j.clips || !j.clips.length) return;
            if (!have) have = {};
            j.clips.forEach(id => {
              have[id] = set;
            });
            if (j.texts) {
              if (!texts) texts = {};
              Object.keys(j.texts).forEach(t => {
                texts[t] = j.texts[t];
              });
            }
          }).catch(() => {});
        } catch (e) {}
      });
    },
    /* Called on every screen change, with null for the home screen. */
    setMode(key) {
      mode = key || null;
    },
    /* null means "no file for this line" — the caller falls back to the engine.
       `role` is COMPANION unless the caller says otherwise, and an unrecognised role is
       treated as the companion: the failure mode of guessing wrong here is a fixed string
       that stays on the engine, not a number that reaches for a clip it should not have. */
    url(text, role) {
      if (!have) return null;
      const id = role === 'robot' ? VOICED.has(mode) ? idFor(text) : null : exactFor(text);
      return id && have[id] ? ROOT + have[id] + '/' + id + '.m4a' : null;
    }
  };
})();

/* ══ MENU MUSIC ══
   Owner's call, 2026-08-20, made after hearing the track: music plays on the MENU and
   nowhere else. Not a global toggle that happens to default off — the games are silent
   by construction. Atmosphere belongs where the child is choosing; silence belongs where
   they are counting, and a background bed under mental arithmetic is a real cost that a
   preference switch only shifts onto whichever parent never finds it.

   It is also opt-in and remembered, because a menu that starts singing the first time
   the app opens is a thing you turn off, not a thing you enjoy.

   THE AUTOPLAY PROBLEM, AND WHY `armed` EXISTS. A browser will not let a page start audio
   before the user has interacted with it, so on a fresh load `play()` rejects even though
   the child turned music on last week. Silently swallowing that means the preference
   looks broken. Instead the rejection arms a one-shot listener on the next pointerdown,
   which is the first tap the child makes anyway.

   DUCKING IS POLLED, not wired into Voice. The alternative is a callback threaded through
   every path in Voice that starts and stops sound — four of them, each with its own
   cancellation rules — to serve one volume change on one screen. A 180 ms poll that only
   runs while music is actually playing is the smaller thing to be wrong about. */
const Music = (() => {
  const SRC = 'assets-runtime/audio/menu-bed.m4a';
  const KEY = 'sm_music';
  const FULL = 0.20; // resting level: present, and well under a spoken line
  const DUCKED = 0.055; // while anything is being said
  const RAMP_MS = 420,
    STEP_MS = 40,
    POLL_MS = 180;
  let el = null,
    wanted = false,
    muted = false;
  /* Read at module creation, not in init(). Home's useState initialiser runs before
     the App's mount effect, so a preference read inside init() arrives one render too
     late and the toggle renders "off" while the bed is already playing. */
  let pref = (() => {
    try {
      return localStorage.getItem(KEY) === '1';
    } catch (e) {
      return false;
    }
  })();
  let ramp = 0,
    poll = 0,
    armed = false;
  const want = () => pref && wanted && !muted;
  const fadeTo = (v, thenPause) => {
    if (!el) return;
    if (ramp) {
      clearInterval(ramp);
      ramp = 0;
    }
    const from = el.volume,
      steps = Math.max(1, Math.round(RAMP_MS / STEP_MS));
    let i = 0;
    ramp = setInterval(() => {
      i++;
      try {
        el.volume = Math.max(0, Math.min(1, from + (v - from) * (i / steps)));
      } catch (e) {}
      if (i >= steps) {
        clearInterval(ramp);
        ramp = 0;
        if (thenPause && el) {
          try {
            el.pause();
          } catch (e) {}
        }
      }
    }, STEP_MS);
  };
  const startPoll = () => {
    if (poll) return;
    poll = setInterval(() => {
      if (!el || el.paused) {
        clearInterval(poll);
        poll = 0;
        return;
      }
      const t = Voice.busy() ? DUCKED : FULL;
      if (Math.abs(el.volume - t) > 0.005 && !ramp) fadeTo(t, false);
    }, POLL_MS);
  };
  const arm = () => {
    if (armed) return;
    armed = true;
    const go = () => {
      window.removeEventListener('pointerdown', go, true);
      armed = false;
      apply();
    };
    window.addEventListener('pointerdown', go, true);
  };
  const apply = () => {
    if (!want()) {
      if (el && !el.paused) fadeTo(0, true);
      return;
    }
    if (!el) {
      try {
        el = new Audio(SRC);
      } catch (e) {
        return;
      }
      el.loop = true;
      el.preload = 'none';
      el.volume = 0;
    }
    el.volume = 0;
    let p;
    try {
      p = el.play();
    } catch (e) {
      arm();
      return;
    }
    if (p && p.then) p.then(() => {
      fadeTo(FULL, false);
      startPoll();
    }).catch(() => arm());else {
      fadeTo(FULL, false);
      startPoll();
    }
  };
  return {
    /* Read the stored preference once. Called from the app's mount effect. */
    init() {
      apply();
    },
    enabled() {
      return pref;
    },
    /* The toggle. Its own click is the user gesture, so this is the one path where
       play() is reliably allowed. */
    setEnabled(v) {
      pref = !!v;
      try {
        localStorage.setItem(KEY, pref ? '1' : '0');
      } catch (e) {}
      apply();
    },
    /* Which screen we are on. Home passes true; every game screen passes false. */
    setWanted(v) {
      wanted = !!v;
      apply();
    },
    /* The global sound toggle silences music too — one switch that means "quiet". */
    setMuted(v) {
      muted = !!v;
      apply();
    },
    /* Read-only, for verification. The element is never added to the document, so
       there is otherwise no way to observe from outside whether the bed is actually
       playing or merely intended to be. */
    state() {
      return {
        pref,
        wanted,
        muted,
        exists: !!el,
        playing: !!(el && !el.paused),
        volume: el ? +el.volume.toFixed(3) : null,
        armed
      };
    }
  };
})();

/* ══ APP ══ */
function App() {
  /* QA bootstrap: `#play-<modeId>` opens straight into a game. The menu is the only
     child-facing way in and stays so; this exists because automated browser QA of the
     2026-08-29 expansion had to reach cards below the menu's fold on a guest whose
     scroll input was broken, and because a deep link exercises a game's cold mount —
     the path a real child reaches only through the launch animation. Unknown ids fall
     through the routing to the home screen, so a stray hash can never blank the app. */
  const [mode, setMode] = useState(() => {
    try {
      const m = (location.hash.match(/^#play-([a-z]+\d)$/) || [])[1];
      return m || null;
    } catch (e) {
      return null;
    }
  });
  // Garden (30 flowers) is per-game by design: kids fill it fresh each game.
  // Full gardens convert to bouquets, which persist forever (localStorage).
  const [flowers, setFlowers] = useState(0);
  const [gardenFull, setGardenFull] = useState(false);
  const [scores, setScores] = useState({
    b1: 0,
    b2: 0,
    b3: 0,
    l2: 0,
    c1: 0,
    c2: 0,
    c3: 0,
    c4: 0,
    m1: 0,
    s1: 0,
    g1: 0,
