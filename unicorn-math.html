<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <!-- Plain name, deliberately. This read "Magic Math v7" from 7343cc3 until
       2026-08-17 — a version nobody maintained, which drifted out of step with
       CACHE_NAME and then collided with it. No other page carries a version, and
       a title that has to be edited on every publish will be wrong again by the
       next one. -->
  <title>Unicorn Math</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <meta name="theme-color" content="#0a0e2d"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Magic Math"/>
  <script src="./vendor/react-18.3.1.production.min.js"></script>
  <script src="./vendor/react-dom-18.3.1.production.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}

    /* ── BG DECO ── */
    .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .bg-deco img{position:absolute;object-fit:contain;animation:twinkleDeco ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(255,213,79,.35));will-change:transform,opacity}
    @keyframes twinkleDeco{
      0%{opacity:.06;transform:scale(.55) rotate(-12deg)}
      100%{opacity:var(--deco-opacity,.5);transform:scale(1.15) rotate(12deg)}
    }
    @media (prefers-reduced-motion: reduce){
      .bg-deco img{animation:none!important;opacity:.12!important}
    }
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

    /* ── HOME ── */
    .home{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;overflow:hidden}
    .home-bg{position:absolute;inset:0;background:url('assets-runtime/unicorn/bg-home.webp') center/cover no-repeat;z-index:0}
    .home-tint{position:absolute;inset:0;background:rgba(252,228,236,.42);z-index:0}
    .home>*:not(.home-bg):not(.home-tint){position:relative;z-index:1}
    .home-rainbow{font-size:clamp(.9rem,3vw,1.4rem);letter-spacing:4px;animation:bounce 1.4s ease-in-out infinite alternate}
    .home-title{font-size:clamp(1.8rem,7vw,3.2rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:clamp(.85rem,2.8vw,1.1rem);font-weight:900;color:#7b1fa2;background:rgba(255,255,255,.7);border-radius:50px;padding:6px 20px;box-shadow:0 2px 8px rgba(171,71,188,.2)}
    .mode-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:640px}
    .mode-section-label{font-size:.95rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:2px;background:rgba(255,255,255,.75);border-radius:50px;padding:5px 18px}
    .mode-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
    /* Only the row that holds a badged card opts out of stretch. Stretching it
       left a badge-sized hole under Column Add and Take Away that read as
       missing art; letting each card end where its content ends costs a ragged
       bottom edge and buys the badged card literally standing taller, which is
       the message. It stays scoped to this row because the others rely on
       stretch — Add & Subtract carries no subtitle and is 15px shorter than
       Times Tables beside it, so making this global went ragged where nothing
       was being said. */
    .mode-row.has-badge{align-items:flex-start}
    /* "Borrow Take Away" wraps to two lines at some widths and "Carry Add" never
       does, so without a reserved second line the two badges in this row sit at
       different heights — 270px against 286px, measured at 768px. Stretch used to
       hide that; opting out of stretch exposed it. Reserving the line costs the
       one-line cards a few pixels nobody sees and keeps the badges level. */
    .mode-row.has-badge .mode-card-label{min-height:2.4em;display:flex;align-items:center}
    .mode-card{flex:1;min-width:130px;max-width:185px;border-radius:26px;padding:18px 12px 14px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mode-card-label{font-size:.9rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);text-align:center}
    .mode-card-sub{font-size:.66rem;font-weight:900;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.25);text-align:center;margin-top:-5px}
    /* ── GAME PREVIEW ──
       A miniature of the screen the child is about to see, not a mascot. Six games is
       too many to tell apart by a decorative planet, and a pre-reader cannot use the
       label — so each card shows the game's own shape: blocks, a column sum, a number
       track, a times fact, a counting chain. The colours are lifted from each game, so
       the picture on the card and the screen it opens match. */
    .gp{width:104px;height:88px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 6px;border-radius:13px;background:linear-gradient(160deg,#fff,#fce4ec);border:2.5px solid #f48fb1;box-shadow:0 3px 0 #e57ca0,0 5px 10px rgba(4,8,30,.22)}
    .gp.gp-tight{gap:2px}
    .gp-row{display:flex;align-items:center;justify-content:center;gap:3px}
    .gp-blocks{display:flex;align-items:flex-end;justify-content:center;gap:3px}
    .gp-num{font-size:.92rem;font-weight:900;color:#7b1fa2;line-height:1}
    .gp-op{font-size:.8rem;font-weight:900;color:#e91e63;line-height:1}
    .gp-box{width:15px;height:18px;border-radius:4px;border:2px solid #e91e63;background:#fff}
    .gp-line{width:40px;height:2.5px;border-radius:2px;background:#e91e63}
    .gp-t{width:7px;height:20px;border-radius:2px;background:linear-gradient(180deg,#f48fb1,#e91e63);border:1.5px solid #c2185b}
    .gp-o{width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,#ffd54f,#f9a825);border:1.5px solid #e65100}
    .gp-o.gp-empty{background:none;border-style:dashed;border-color:#f48fb1}
    .gp-dot{width:7px;height:7px;border-radius:50%;background:#f8bbd0}
    .gp-dot.on{background:#e91e63;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
    .gp-chip{padding:1px 5px;border-radius:999px;border:1.5px solid #f48fb1;background:#fff;font-size:.62rem;font-weight:900;color:#e91e63;line-height:1.35}
    .gp-chip.q{border-style:dashed;color:#7b1fa2}
    .gp-arrow{font-size:.6rem;font-weight:900;color:#7b1fa2;opacity:.5}
    /* ── COLUMN MATHS PREVIEWS (c1-c4) ──
       Four column cards now sit side by side, so the picture has to carry both facts a
       pre-reader needs: which operation, and how hard. Operation is the loud one — a
       big plain glyph for adding, a filled coin for taking away — because the two are
       genuinely different games and a 7px difference between + and − is not a
       difference a four-year-old can use. Difficulty is the quiet one: the dashed box
       (and, on c4, the crossed digit) appears only on the carry/borrow cards. Card
       colour repeats the operation and the star count repeats the difficulty, so the
       two redundant channels carry different axes instead of the same one. */
    .gp-op.gp-big{font-size:1.45rem}
    .gp-take{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:900;line-height:1;color:#fff;background:#c62828}
    .gp-carry{width:12px;height:12px;border-radius:3px;border:1.5px dashed #ce93d8;background:#fff;font-size:.52rem;font-weight:900;color:#e65100;display:flex;align-items:center;justify-content:center;line-height:1}
    .gp-carry-row{margin-right:19px}
    .gp-small{font-size:.55rem;font-weight:900;color:#f4511e;line-height:1;align-self:flex-start}
    .gp-strike{position:relative;color:#a58bb8}
    .gp-strike::after{content:'';position:absolute;left:-2px;right:-2px;top:52%;height:2px;border-radius:1px;background:rgba(244,81,30,.85);transform:rotate(-15deg)}
    .mode-card-stars{height:24px;display:flex;align-items:center;justify-content:center;gap:2px}
    .mode-card-stars img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.16))}
    /* ── BIG-KID BADGE ──
       Worn only by Carry Add and Borrow Take Away. Stars say "hardest" in a
       convention a pre-reader has to be taught; two big children say it in a
       language they already read fluently, because "am I big or little?" is a
       question they think about daily. Both signals stay: same fact, two
       languages, the way card colour and star count already split operation
       from difficulty.
       72px is a floor, not a preference. Measured smaller, the head-to-body
       ratio that carries age collapses and it reads as two coloured smudges —
       the badge stops meaning anything and becomes decoration. */
    .mode-card-badge{height:72px;margin-top:-2px;display:flex;align-items:flex-end;justify-content:center}
    .mode-card-badge img{height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
    .mc-pink  {background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 7px 0 #ad1457,0 10px 20px rgba(233,30,99,.3)}
    .mc-purple{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 7px 0 #4a148c,0 10px 20px rgba(123,31,162,.3)}
    .mc-rose  {background:linear-gradient(160deg,#f06292,#c2185b);box-shadow:0 7px 0 #880e4f,0 10px 20px rgba(194,24,91,.3)}
    .mc-magic {background:linear-gradient(160deg,#ba68c8,#4a148c);box-shadow:0 7px 0 #311b92,0 10px 20px rgba(74,20,140,.3)}

    /* ── SCREEN ── */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 24px;gap:11px;background:transparent;overflow:hidden}
    .screen-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(255,245,255,.16),rgba(255,245,255,.16)),var(--game-bg),var(--screen-fallback,#fce4ec);background-size:cover,cover,cover;background-position:var(--game-bg-position,center center);background-repeat:no-repeat;z-index:0;pointer-events:none}
    /* Every :not() here adds specificity, so this rule outweighs a plain class rule on
       any child. The settings overlay is a child of .screen and must stay position:fixed
       to cover the viewport — without this exclusion it lays out inline in the column,
       squeezed to the flex width instead of centred over the game. */
    .screen>*:not(.screen-bg):not(.bg-deco):not(.confetti-container):not(.mascot-corner):not(.modal-overlay){position:relative;z-index:1}
    .blocks-screen {--game-bg:url('assets-runtime/unicorn/bg-what-number.webp');--screen-fallback:linear-gradient(160deg,#fce4ec,#f8bbd0,#fce4ec)}
    .choose-screen {--game-bg:url('assets-runtime/unicorn/bg-fill-right-block.webp');--screen-fallback:linear-gradient(160deg,#f3e5f5,#e1bee7,#f3e5f5)}
    .addsub-screen {--game-bg:url('assets-runtime/unicorn/bg-add-subtract.webp');--screen-fallback:linear-gradient(160deg,#fff3e0,#fce4ec,#f3e5f5)}

    /* ── TOP BAR ── */
    .top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:740px;gap:8px;position:relative;z-index:2}
    .back-btn{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:50px;padding:8px 14px;font-family:inherit;font-size:1.2rem;font-weight:900;color:#e91e63;cursor:pointer;box-shadow:0 4px 0 #f48fb1;transition:transform .1s;white-space:nowrap;line-height:1;min-width:52px}
    .back-btn:active{transform:translateY(3px)}
    .settings-btn,.sound-btn{background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:50px;padding:8px 13px;font-family:inherit;font-size:1.1rem;font-weight:900;color:#7b1fa2;cursor:pointer;box-shadow:0 4px 0 #ce93d8;transition:transform .1s;line-height:1;min-width:48px}
    .settings-btn:active,.sound-btn:active{transform:translateY(3px)}

    /* ── MODALS ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-box{background:#fff;border-radius:28px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px solid #f48fb1;max-height:90vh;overflow-y:auto}
    .modal-title{font-size:1.2rem;font-weight:900;color:#7b1fa2;text-align:center;margin-bottom:14px}
    .preset-btn{width:100%;padding:12px 16px;border-radius:14px;border:3px solid;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .1s;margin-bottom:7px}
    .preset-btn:active{transform:scale(.97)}
    .preset-btn.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .preset-btn.inactive{background:#fff;border-color:#f8bbd0;color:#7b1fa2}
    .preset-tag{font-size:1.2rem}
    .preset-info{text-align:left;flex:1}
    .preset-name{font-size:.95rem;font-weight:900}
    .preset-range{font-size:.74rem;opacity:.7;font-weight:700}
    .modal-close{margin-top:8px;width:100%;padding:11px;border-radius:50px;border:none;background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #ad1457}
    .modal-close:active{transform:translateY(3px)}
    /* custom range inputs */
    .custom-range-box{background:#fce4ec;border-radius:14px;padding:14px;margin-top:4px;border:2px solid #f48fb1}
    .custom-range-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .custom-range-row label{font-size:.85rem;font-weight:900;color:#7b1fa2;display:flex;align-items:center;gap:6px}
    .custom-input{width:68px;padding:6px 8px;border-radius:8px;border:2px solid #f48fb1;font-family:inherit;font-size:1rem;font-weight:900;color:#333;text-align:center}
    .custom-apply{background:linear-gradient(135deg,#ce93d8,#7b1fa2);color:#fff;border:none;border-radius:50px;padding:8px 18px;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #4a148c}
    .custom-error{font-size:.8rem;font-weight:900;color:#c62828;background:#ffcdd2;border-radius:8px;padding:5px 10px;margin-bottom:6px}
    /* add/sub custom op */
    .op-toggle-row{display:flex;gap:8px;margin-bottom:10px}
    .op-toggle{flex:1;padding:9px;border-radius:10px;border:2px solid #f8bbd0;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;background:#fff;color:#7b1fa2}
    .op-toggle.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .section-label{font-size:.78rem;font-weight:900;color:#9c27b0;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .mode-toggle-row{display:flex;gap:8px;margin-bottom:10px}

    /* ── EQUIVALENCE MODAL ── */
    .equiv-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
    .equiv-box{background:#fff;border-radius:28px;padding:28px 22px;max-width:360px;width:100%;border:4px solid #f48fb1;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .equiv-title{font-size:1.3rem;font-weight:900;color:#e91e63;margin-bottom:6px}
    .equiv-sub{font-size:1rem;font-weight:700;color:#7b1fa2;margin-bottom:18px}
    .equiv-visual{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .equiv-side{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:140px}
    .equiv-eq{font-size:2rem;font-weight:900;color:#9c27b0}
    .mini-h{width:34px;height:34px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:6px;border:2px solid #6a1b9a}
    .mini-t{width:13px;height:34px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:4px;border:2px solid #c2185b}
    .mini-o{width:13px;height:13px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:3px;border:2px solid #e65100}
    .equiv-next{background:linear-gradient(160deg,#f06292,#ad1457);color:#fff;border:none;border-radius:50px;padding:13px 32px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #880e4f}
    .equiv-next:active{transform:translateY(3px)}

    /* ── NUMBER DISPLAY ── */
    .number-display{display:flex;gap:8px;align-items:flex-end;justify-content:center;background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}
    .digit-box{display:flex;flex-direction:column;align-items:center;gap:3px}
    .digit-value{font-size:clamp(2rem,8.5vw,3.5rem);font-weight:900;line-height:1;min-width:42px;text-align:center}
    .digit-value.shake{animation:shake .35s ease}
    .digit-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .digit-hundreds{color:#9c27b0}.digit-tens{color:#e91e63}.digit-ones{color:#ff6f00}
    .simple-number-card{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(252,228,236,.9));border:2.5px solid #f48fb1;border-radius:20px;padding:12px 22px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}
    .simple-number-main{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;color:#7b1fa2;line-height:1}
    .simple-number-sub{font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#e91e63}
    .simple-number-divider{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:#d7b7df}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

    /* ── TAP-TO-SLOT ── */
    .tap-layout{width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .tap-hint{font-size:.82rem;font-weight:900;color:#9c27b0;text-align:center;background:rgba(255,255,255,.65);border-radius:50px;padding:5px 16px;border:1.5px solid #ce93d8}

    /* Pool */
    .pool-area{background:rgba(255,255,255,.55);border-radius:18px;padding:12px;border:2px solid #f8bbd0}
    .pool-label{font-size:.75rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center}
    .pool-blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}

    /* Pool block wrappers */
    .pool-block{cursor:pointer;border-radius:10px;transition:transform .1s;position:relative}
    .pool-block.selected{filter:drop-shadow(0 0 8px #e91e63) drop-shadow(0 0 4px #fff);transform:scale(1.12) translateY(-3px)}
    .pool-block.empty{opacity:.2;cursor:default;pointer-events:none}

    /* The actual block shapes (pool size) */
    .pb-hundred{width:72px;height:72px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:10px;border:3px solid #6a1b9a;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .pb-ten{width:30px;height:72px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:7px;border:3px solid #c2185b;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .pb-one{width:38px;height:38px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:9px;border:3px solid #e65100}

    /* Slots */
    .slots-area{display:flex;flex-direction:column;gap:8px}
    .slot-row{background:rgba(255,255,255,.65);border:3px dashed #f48fb1;border-radius:16px;padding:10px 12px;min-height:64px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
    .slot-row.can-accept{border-color:#e91e63;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(233,30,99,.2)}
    .slot-row.wrong-flash{animation:slotWrong .35s ease}
    @keyframes slotWrong{0%,100%{background:rgba(255,255,255,.65);border-color:#f48fb1}50%{background:#ffcdd2;border-color:#f44336;box-shadow:0 0 0 3px rgba(244,67,54,.3)}}
    .slot-header{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .slot-h-header{color:#7b1fa2}.slot-t-header{color:#c2185b}.slot-o-header{color:#e65100}
    .slot-blocks{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;min-height:28px}

    /* Mini blocks inside slots (tappable to return) */
    .sb-hundred{width:38px;height:38px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:7px;border:2.5px solid #6a1b9a;cursor:pointer;transition:transform .1s;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .sb-hundred:active{transform:scale(.88)}.sb-hundred .ic{background:rgba(255,255,255,.35);border-radius:1px}

    /* Column Add */
    .column-screen{--game-bg:url('assets-runtime/unicorn/bg-add-subtract.webp');--screen-fallback:linear-gradient(160deg,#fff3e0,#fce4ec,#f3e5f5)}
    .column-card{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(252,228,236,.9));border:3px solid #f48fb1;border-radius:22px;padding:18px 22px 20px;box-shadow:0 5px 0 #f48fb1,0 10px 24px rgba(240,98,146,.16);position:relative;z-index:1;min-width:min(92vw,360px)}
    .column-grid{display:grid;grid-template-columns:34px repeat(var(--col-count,3),54px);gap:7px;align-items:center;justify-content:center;font-family:'Nunito',system-ui,sans-serif}
    .column-digit,.column-plus,.column-answer-box{height:54px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,8vw,3rem);font-weight:900;line-height:1}
    .column-digit{color:#7b1fa2}
    .column-plus{color:#e91e63}

    .column-final-line{grid-column:1 / -1;height:8px;border-top:4px solid #e91e63;border-bottom:4px solid #e91e63;border-radius:99px;margin-top:5px}

    .column-answer-box.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .keypad{display:grid;grid-template-columns:repeat(5,62px);gap:10px;justify-content:center;position:relative;z-index:1}
    .key-btn{height:58px;border:none;border-radius:17px;background:linear-gradient(160deg,#fff,#fce4ec);border:2.5px solid #f48fb1;color:#7b1fa2;font-family:inherit;font-size:1.55rem;font-weight:900;box-shadow:0 4px 0 #f48fb1;cursor:pointer}

    /* ── COLUMN MATHS (modes c2, c3, c4) ──
       Mode c1 above shares the .column-* classes and must come out of this change
       pixel-identical, so nothing below edits a rule c1 reads — hence .cm-top rather
       than adding position:relative to .column-digit, and .cm-mark rather than reusing
       anything.

       The mark is ONE widget with one meaning: "the one that arrived into this column",
       from the right when adding and from the left when taking away. It holds a 1 or a
       typed 0 and nothing else, which is why "there was no carry" needed no new button
       and no new word. */
    .cm-mark-gap{height:30px}
    .cm-mark{justify-self:center;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px dashed #ce93d8;border-radius:9px;color:#e65100;font-size:1.1rem;font-weight:900;line-height:1}
    .cm-mark.active{border-style:solid;border-color:#e91e63;box-shadow:0 0 0 4px rgba(233,30,99,.16);animation:cmPulse 1.1s ease-in-out infinite}
    .cm-mark.wrong{animation:wrongShake .35s ease;border-color:#f44336}  /* must stay AFTER .active */
    .cm-mark.nudge{animation:cmNudge .3s ease}      /* a dimmed key: not a mistake, so not a shake */
    .cm-zero{opacity:.45}                            /* "nothing arrived" is quieter than a 1 */
    .cm-bad{color:#f44336}                           /* the digit just refused, shown then withdrawn */
    @keyframes cmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
    @keyframes cmNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

    /* Borrowing: the digit next door is crossed out and its new value written at its
       LEFT shoulder — the far side from the little box that has just been filled in, so
       the two small numerals are a whole cell apart and cannot be read as one two-digit
       number. The strike is thin and the struck digit stays dark enough to read,
       because "the 3 became a 2" is meaningless once the 3 has been destroyed. */
    .cm-top{position:relative}
    .cm-top.struck{color:#a58bb8}
    .cm-top.struck::after{content:'';position:absolute;left:14%;right:14%;top:50%;height:3px;border-radius:2px;background:rgba(244,81,30,.85);transform:rotate(-13deg)}
    .cm-new{position:absolute;top:1px;left:2px;font-size:.4em;color:#f4511e;font-weight:900;line-height:1;animation:cmPopIn .3s ease}
    @keyframes cmPopIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
    .cm-minus{color:#c62828}

    /* While a little box is live, 2-9 cannot be right. Dimming teaches the rule and
       leaks nothing — the box is 0-or-1 whatever the problem is. The keys stay tappable
       so nothing looks broken; a tap nudges the box and says the rule, and is NOT
       counted as a wrong answer. Punishing a tap on a control the app has already
       greyed out teaches a four-year-old only that the app is angry. */
    .key-btn.dim{opacity:.38}

    /* Four columns is a width c1 never renders — its widest no-carry sum is three — and
       the fixed 34px + 4x54px + 4x7px = 278px does not fit inside .column-card below a
       357px viewport: the card grows past the phone and .screen{overflow:hidden} clips
       the outer digits rather than scrolling them. Measured at 320px: card 328px on a
       320px screen. Fluid tracks instead, floored where a fingertip and a four-year-
       old's eye can both still use them (196px total at 320, 230px at 375, 278px at
       tablet width). */
    .cm-grid.cm-4{grid-template-columns:clamp(22px,8vw,34px) repeat(4,clamp(38px,12vw,54px));gap:clamp(4px,1.3vw,7px)}
    .cm-grid.cm-4 .column-answer-box{min-width:0}
    .cm-grid.cm-4 .cm-mark{width:clamp(22px,7vw,30px);height:clamp(22px,7vw,30px);font-size:clamp(.85rem,3.4vw,1.1rem)}

    /* Height budget, same idiom as .cb-ladder's clamp: spend the viewport, do not guess.
       Measured at 375x667 (iPhone SE/8, the smallest device in the house): c1's page is
       already 680px tall, and the mark row adds another 39, which puts the undo key
       28px below the fold and forces a child to scroll mid-problem. With these six
       rules the page comes back to exactly 667 with the keypad ending at 633. Scoped to
       .cm-screen, so c1 keeps its current metrics. */
    @media (max-height:740px){
      .cm-screen .column-card{padding:10px 18px 12px}
      .cm-screen .count-title{padding:5px 14px}
      .cm-grid{gap:5px}
      .cm-grid .column-digit,.cm-grid .column-plus,.cm-grid .column-answer-box,.cm-grid .column-blank{height:46px;font-size:clamp(1.5rem,7vw,2.4rem)}

      .cm-grid .cm-mark{width:26px;height:26px;font-size:.95rem}
    }

    /* Multiplication */

    .pick-box{max-width:440px}

    .pick-btn{height:60px;border-radius:18px;border:3px solid #f48fb1;background:linear-gradient(160deg,#fff,#fce4ec);color:#7b1fa2;font-family:inherit;font-size:1.6rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #f48fb1;transition:transform .1s}

    /* The difficulty pill in the top bar is the way back to the picker, so it has to
       look pressable — it is a wider target than the gear beside it. */
    .level-chip{display:flex;align-items:center;gap:5px;font-family:inherit;font-size:.85rem;font-weight:900;color:#e91e63;background:linear-gradient(160deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:50px;padding:6px 13px;cursor:pointer;box-shadow:0 3px 0 #f48fb1;white-space:nowrap}

    /* ── COUNT BY: the same numbers read two ways at once ──
       Top strip = the skip-counting chant (12, 24, 36, ?).
       Ladder below = the very same numbers written as the times table.
       The child types into the ladder, so filling in the table IS counting on. */
    .countby-screen{--game-bg:url('assets-runtime/unicorn/bg-hop-to-number.webp');--screen-fallback:linear-gradient(160deg,#f3e5f5,#fce4ec,#fff3e0)}
    /* max-width, not just min-width: the chant strip is one long flex row, and a row of
       20 chips reports that whole length as the card's intrinsic width — which dragged the
       card wider than the phone and clipped both ends of every rung. Pinning both bounds

    .countby-card{gap:10px;padding:15px 16px 17px;min-width:min(92vw,470px);max-width:min(92vw,470px)}
    .cb-chain{display:flex;align-items:center;gap:6px;width:100%;min-width:0;overflow-x:auto;padding:2px 2px 7px;scrollbar-width:none}

    /* Height is budgeted against the viewport, not guessed: everything else on this
