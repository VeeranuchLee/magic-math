<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magic Math</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <meta name="theme-color" content="#0a0e2d"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Magic Math"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;min-height:100vh;background:#0a0e2d;color:#fff}
    .bg{position:fixed;inset:0;background:linear-gradient(rgba(10,14,45,.35),rgba(10,14,45,.35)),url('assets-runtime/space/bg-nebula.webp') center/cover no-repeat #0a0e2d;z-index:0}
    .wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 20px}
    h1{font-weight:900;font-size:clamp(1.8rem,6vw,3rem);text-shadow:0 4px 12px rgba(0,0,0,.5);text-align:center}
    h1 span{color:#ffd54f}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;width:100%;max-width:960px}
    .card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 18px 22px;border-radius:28px;text-decoration:none;color:#fff;font-weight:900;font-size:1.15rem;text-align:center;transition:transform .15s ease,box-shadow .15s ease;text-shadow:0 2px 4px rgba(0,0,0,.35)}
    .card:hover{transform:translateY(-6px) scale(1.03)}
    .card:active{transform:translateY(2px)}
    .card img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
    .card small{font-weight:700;font-size:.8rem;opacity:.9}
    .c-space  {background:linear-gradient(160deg,#5b8cf8,#1f54d6);box-shadow:0 8px 0 #0f2e86,0 14px 28px rgba(31,84,214,.35)}
    .c-unicorn{background:linear-gradient(160deg,#f48fb1,#c2185b);box-shadow:0 8px 0 #880e4f,0 14px 28px rgba(194,24,91,.35)}
    footer{font-size:.8rem;font-weight:700;opacity:.75}

    /* ── Back to Children Games ──
       Top-left, which is where every game in this project puts its back arrow, and
       60px tall because the target device is a 9.7" iPad and this is a child's finger.
       It carries BOTH an arrow and the words: the arrow is for the child who cannot
       read yet and already knows what it does, the words are for the one who can and
       wants to know where it goes. This is the only page in the app that leaves it, so
       being unmistakable matters more here than being quiet. */
    .hub-btn{
      position:fixed;z-index:9;
      top:calc(14px + env(safe-area-inset-top));
      left:calc(14px + env(safe-area-inset-left));
      display:inline-flex;align-items:center;gap:9px;
      min-height:60px;padding:0 20px 0 16px;
      border-radius:50px;
      background:linear-gradient(135deg,#fff,#e8f0ff);
      border:2.5px solid #93b7fb;box-shadow:0 4px 0 #93b7fb;
      color:#2f6df6;text-decoration:none;
      font-family:inherit;font-weight:900;font-size:1rem;line-height:1;
      white-space:nowrap;-webkit-tap-highlight-color:transparent;
      transition:transform .1s;
    }
    .hub-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #93b7fb}
    .hub-btn:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .hub-btn svg{width:24px;height:24px;flex:none}
    /* Narrow phones get the arrow alone. The words are the first thing to go, not the
       target: the button keeps its height and the tap area with it. */
    @media (max-width:420px){
      .hub-btn{padding:0;width:60px;justify-content:center;gap:0}
      .hub-btn span{display:none}
    }
    /* The heading clears the button on a narrow screen, where they would otherwise
       share the top line. */
    .wrap{padding-top:max(32px,calc(86px + env(safe-area-inset-top)))}
    /* ── Menu music toggle ──
       The worlds' control, on the door they are behind: the same pill, the same 22px
       note, the same words in the label, and the same `sm_music` key underneath it.
       Top-right, opposite the back arrow, which is where both worlds put it.

       48px square rather than the worlds' 43px. Their padding and icon come out a
       whisker under the 44px a child's finger needs; the pill is copied, the target is
       not, because a tap target is the one measurement that never shrinks to match. */
    .music-btn{
      position:fixed;z-index:9;
      top:calc(14px + env(safe-area-inset-top));
      right:calc(14px + env(safe-area-inset-right));
      display:inline-flex;align-items:center;justify-content:center;
      min-width:48px;min-height:48px;padding:8px 13px;
      background:linear-gradient(135deg,#fff,#ecebff);
      border:2.5px solid #ab97f5;border-radius:50px;box-shadow:0 4px 0 #ab97f5;
      color:#5a2ed6;font-family:inherit;font-size:1.1rem;font-weight:900;line-height:1;
      cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s;
    }
    .music-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #ab97f5}
    .music-btn:focus-visible{outline:4px solid #ffd54f;outline-offset:3px}
    .music-btn.music-off{opacity:.45;filter:grayscale(1)}
    .music-btn svg{width:22px;height:22px;display:block}
    .music-btn .m-off{display:none}
    .music-btn.music-off .m-on{display:none}
    .music-btn.music-off .m-off{display:block}
    .sub{font-weight:800;font-size:clamp(1rem,3.4vw,1.3rem);opacity:.9;margin-top:-14px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  </style>
</head>
<body>
<div class="bg"></div>

<!-- Owner, 2026-09-09: "the Magic Math hub itself should have a clear way back to
     Children Games". The URL is absolute for the same reason the games' arrows are:
     published, the hub is a sibling of this app (/magic-math/ -> /children-apps/), but
     in the repo it lives under site/, so a relative link would work live and 404 in
     every local preview. -->
<a class="hub-btn" href="https://veeranuchlee.github.io/children-apps/" aria-label="Back to Children Games">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M15 5 8 12l7 7"/>
  </svg>
  <span>Children Games</span>
</a>

<!-- The two note glyphs are both in the button and CSS shows one, so turning music on
     and off never reaches for the DOM: it is one class on one element. Same drawings
     the worlds use, down to the stroke width. -->
<button class="music-btn" type="button" aria-label="Menu music off">
  <svg class="m-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6" fill="currentColor" stroke="none"/><circle cx="16.5" cy="16" r="2.6" fill="currentColor" stroke="none"/></svg>
  <svg class="m-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18V6l10-2v12" opacity=".45"/><circle cx="6.5" cy="18" r="2.6" fill="currentColor" stroke="none" opacity=".45"/><circle cx="16.5" cy="16" r="2.6" fill="currentColor" stroke="none" opacity=".45"/><path d="M3 3l18 18"/></svg>
</button>

<div class="wrap">
  <h1>Magic <span>Math</span></h1>
  <!-- The same words the Magic Math card on Children Games promises, so the page a
       child lands on says what the card they tapped said it would. -->
  <p class="sub">Pick your world and play</p>
  <!-- THE LIST IS THE POINT OF THIS PAGE. Since 2026-09-09 Children Games shows one
       Magic Math card instead of one card per world, and it links here rather than to a
       game. A third world -- Dinosaur is the one on the roadmap -- is a card added
       below and nothing else: the grid is auto-fit, and the hub does not have to be
       touched, republished or even know about it. -->
  <div class="cards">
    <a class="card c-space" href="space-math.html">
      <img src="assets-runtime/space/icons/rocket.webp" alt=""/>
      Space Math
      <small>Fly planet to planet with every answer</small>
    </a>
    <a class="card c-unicorn" href="unicorn-math.html">
      <img src="assets-runtime/unicorn/icons/unicorn-stand.webp" alt=""/>
      Unicorn Math
      <small>Grow a flower garden with every answer</small>
    </a>
    <!-- Owner, 2026-08-26: "the url say math app, so we only should list math there. we
         shouldn't have the spelling and music there". Magic Spelling and Classical Music
         are NOT deleted -- the pages are still here, still cached by the service worker,
         and Children Games still links straight to them
         (site/children-apps/index.html -> ../magic-math/magic-spelling.html). They are
         simply not listed on a front door that says Magic Math. -->
  </div>
  <footer>Made with love for little learners</footer>
</div>
<script>
/* ══ MENU MUSIC ══
   The bed the two worlds already play, on the door they are behind. Same file, same
   `sm_music` key, same 0.20 resting level, so music is ONE preference across Magic
   Math: a child who turns it off inside Unicorn Math does not walk back out to it
   playing here. Opt-in and remembered, exactly as in the worlds — a front door that
   starts singing the first time the app opens is a thing you turn off, not a thing you
   enjoy.

   NO DUCKING. The worlds drop the bed to 0.055 while a line is spoken, and poll every
   180 ms to know when. Nothing on this page speaks — there is no Voice here and nothing
   to duck under — so there is no second level and no poll. FULL is the only volume this
   module has.

   NO `wanted` EITHER. In a world that flag means "the child is on the menu screen, not
   in a game". This page IS the menu screen and has nowhere else to be.

   ── WHAT HAPPENS ON THE iPAD, HONESTLY ──
   A browser will not start audio before the child has touched the document, and this
   page is where the child LANDS: no tap has happened yet. So the bed does not play on
   arrival, and that is the decision, not an oversight.

   The worlds solve this by arming the next pointerdown, because in a world the next
   pointerdown is a mode card and the child stays to hear the result. Here almost every
   control LEAVES — two world cards and a back arrow — so arming is copied MINUS the
   taps that land on a link. Starting a 420 ms fade-in on the tap that unloads the
   document buys a swell cut off mid-breath, then a silent page load, then the same
   fade-in again on the other side. That is worse than silence, so a tap on a link is
   allowed through and the listener stays up for one that keeps the child here.

   What is left is the music button, a tap on the sky or the title, and browsers that
   permit autoplay outright (desktop Chrome does, once the child has used the site).
   On a 9.7" iPad that means: this page is quiet until the child presses the note, and
   the bed then plays on every Magic Math screen that wants it.

   ── AND WHY IT DOES NOT RESTART THE TRACK ──
   `menu-bed.m4a` is 52 seconds of written music, not a four-second loop. A fresh
   <audio> element starting at 0:00 every time a child crosses a page boundary means the
   same opening bars over and over, which is audibly broken and is the one way adding
   music here could make Magic Math WORSE than leaving the hub silent.

   So every Magic Math page now parks the playhead in `sm_music_t` on the way out and
   picks it up there on the way in. Hub → world → hub → world is one continuous piece.
   The two worlds carry the same few lines; this is not a hub-only trick, and it fixes
   world → hub → other world, which restarted the bed before today too. */
var Music=(function(){
  var SRC='assets-runtime/audio/menu-bed.m4a';
  var KEY='sm_music';
  var TKEY='sm_music_t';   // the shared playhead, in seconds
  var FULL=0.20;           // the worlds' resting level, unchanged
  var RAMP_MS=420, STEP_MS=40;
  var el=null, ramp=0, armed=false;
  var seekTo=0, posTaken=true;
  var pref=(function(){try{return localStorage.getItem(KEY)==='1';}catch(e){return false;}})();

  function fadeTo(v,thenPause){
    if(!el)return;
    if(ramp){clearInterval(ramp);ramp=0;}
    var from=el.volume, steps=Math.max(1,Math.round(RAMP_MS/STEP_MS)), i=0;
    ramp=setInterval(function(){
      i++;
      try{el.volume=Math.max(0,Math.min(1,from+(v-from)*(i/steps)));}catch(e){}
      if(i>=steps){
        clearInterval(ramp);ramp=0;
        if(thenPause&&el){try{el.pause();}catch(e){}}
      }
    },STEP_MS);
  }

  function readPos(){
    var t=0;try{t=parseFloat(localStorage.getItem(TKEY));}catch(e){}
    return (isFinite(t)&&t>0)?t:0;
  }
  /* Seeking needs metadata, and `preload:'none'` means there is none until something
     asks for it. So this is called both from the loadedmetadata event and after play()
     resolves, and does nothing until one of them has produced a duration. */
  function takePos(){
    if(posTaken||!el||!(el.readyState>=1))return;
    try{if(seekTo<el.duration)el.currentTime=seekTo;}catch(e){}
    posTaken=true;
  }
  /* `posTaken` is the guard that matters. If the child arrives, never touches the page
     and taps straight into a world, the element was built but never loaded a byte and
     its currentTime is 0 — writing that would throw away the position the world they
     came from left behind, and the restart this whole mechanism exists to prevent would
     happen anyway. A page that never took the playhead does not get to move it. */
  function savePos(){
    if(!el||!posTaken)return;
    try{localStorage.setItem(TKEY,String(el.currentTime||0));}catch(e){}
  }

  function arm(){
    if(armed)return;
    armed=true;
    var go=function(e){
      if(e.target&&e.target.closest&&e.target.closest('a'))return;
      window.removeEventListener('pointerdown',go,true);
      armed=false;
      apply();
    };
    window.addEventListener('pointerdown',go,true);
  }

  function apply(){
    if(!pref){
      if(el&&!el.paused)fadeTo(0,true);
      return;
    }
    if(!el){
      try{el=new Audio(SRC);}catch(e){return;}
      el.loop=true; el.preload='none'; el.volume=0;
      seekTo=readPos(); posTaken=(seekTo===0);
      el.addEventListener('loadedmetadata',takePos);
      takePos();
    }
    el.volume=0;
    var p;
    try{p=el.play();}catch(e){arm();return;}
    if(p&&p.then)p.then(function(){takePos();fadeTo(FULL,false);}).catch(arm);
    else{takePos();fadeTo(FULL,false);}
  }

  return{
    init:function(){apply();},
    enabled:function(){return pref;},
    /* The toggle. Its own click is the user gesture, so this is the one path on this
       page where play() is reliably allowed. */
    setEnabled:function(v){pref=!!v;try{localStorage.setItem(KEY,pref?'1':'0');}catch(e){}apply();},
    save:savePos,
    /* Read-only, for verification. The element is never added to the document, so there
       is otherwise no way to observe from outside whether the bed is actually playing or
       merely intended to be. */
    state:function(){return{pref:pref,exists:!!el,playing:!!(el&&!el.paused),
      volume:el?+el.volume.toFixed(3):null,readyState:el?el.readyState:null,
      currentTime:el?+el.currentTime.toFixed(2):null,armed:armed,posTaken:posTaken,src:SRC};}
  };
})();

(function(){
  var btn=document.querySelector('.music-btn');
  function paint(){
    btn.classList.toggle('music-off',!Music.enabled());
    btn.setAttribute('aria-label',Music.enabled()?'Menu music on':'Menu music off');
  }
  /* Turning it on starts the bed on this very click, which is the feedback: the worlds
     answer a tap with a blip from their Sound module, and this page has no Sound module
     to borrow. Music arriving says the button worked; the fade-out says so too. */
  btn.addEventListener('click',function(){Music.setEnabled(!Music.enabled());paint();});
  paint();
  Music.init();

  /* Park the playhead before this document goes. `pagehide` is the one that fires on
     iOS when the child taps into a world; `visibilitychange` catches the iPad being
     put to sleep or the app swapped away, where pagehide does not come. */
  window.addEventListener('pagehide',Music.save);
  document.addEventListener('visibilitychange',function(){if(document.hidden)Music.save();});
})();
</script>

<script>
  /* Offline support. Registration is best-effort: opened straight from a file
     the browser refuses it, and the games must still run. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function () {});
    });
  }
</script>
  <script>
  /* Pinch-zoom guard. iOS Safari ignores user-scalable=no (since iOS 10), so this is
     the only thing that stops two small hands zooming the page mid-play. gesturestart
     fires once per pinch; preventing it cancels the zoom and touches nothing else.
     Other browsers never fire it, so this is inert there. */
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  </script>
  </body>
</html>
