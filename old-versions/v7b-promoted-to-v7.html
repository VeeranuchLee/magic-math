<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Magic Math v7</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}

    /* ── BG DECO ── */
    .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .bg-deco img{position:absolute;object-fit:contain;animation:twinkleDeco ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(255,213,79,.35));will-change:transform,opacity}
    @keyframes twinkleDeco{
      0%{opacity:.06;transform:scale(.55) rotate(-12deg)}
      100%{opacity:var(--deco-opacity,.5);transform:scale(1.15) rotate(12deg)}
    }
    @media (prefers-reduced-motion: reduce){
      .bg-deco img{animation:none!important;opacity:.12!important}
    }
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

    /* ── HOME ── */
    .home{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;overflow:hidden}
    .home-bg{position:absolute;inset:0;background:url('bg-home.png') center/cover no-repeat;z-index:0}
    .home-tint{position:absolute;inset:0;background:rgba(252,228,236,.42);z-index:0}
    .home>*:not(.home-bg):not(.home-tint){position:relative;z-index:1}
    .home-rainbow{font-size:clamp(.9rem,3vw,1.4rem);letter-spacing:4px;animation:bounce 1.4s ease-in-out infinite alternate}
    .home-title{font-size:clamp(1.8rem,7vw,3.2rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:clamp(.85rem,2.8vw,1.1rem);font-weight:900;color:#7b1fa2;background:rgba(255,255,255,.7);border-radius:50px;padding:6px 20px;box-shadow:0 2px 8px rgba(171,71,188,.2)}
    .mode-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:640px}
    .mode-section-label{font-size:.95rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:2px;background:rgba(255,255,255,.75);border-radius:50px;padding:5px 18px}
    .mode-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
    .mode-card{flex:1;min-width:130px;max-width:185px;border-radius:26px;padding:18px 12px 14px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mode-card-icon{width:88px;height:76px;line-height:1;display:flex;align-items:center;justify-content:center;overflow:visible}
    .mode-card-art{display:block;object-fit:contain}
    .mode-card-art.princess-art{width:72px;height:72px}
    .mode-card-art.unicorn-art{width:76px;height:76px}
    .mode-card-art.large-art{width:84px;height:84px}
    .mode-card-label{font-size:.9rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);text-align:center}
    .mode-card-sub{font-size:.66rem;font-weight:900;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.25);text-align:center;margin-top:-5px}
    .mode-card-stars{height:24px;display:flex;align-items:center;justify-content:center;gap:2px}
    .mode-card-stars img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.16))}
    .mc-pink  {background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 7px 0 #ad1457,0 10px 20px rgba(233,30,99,.3)}
    .mc-purple{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 7px 0 #4a148c,0 10px 20px rgba(123,31,162,.3)}
    .mc-rose  {background:linear-gradient(160deg,#f06292,#c2185b);box-shadow:0 7px 0 #880e4f,0 10px 20px rgba(194,24,91,.3)}
    .mc-magic {background:linear-gradient(160deg,#ba68c8,#4a148c);box-shadow:0 7px 0 #311b92,0 10px 20px rgba(74,20,140,.3)}

    /* ── SCREEN ── */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 24px;gap:11px;background:transparent;overflow:hidden}
    .screen-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(255,245,255,.16),rgba(255,245,255,.16)),var(--game-bg),var(--screen-fallback,#fce4ec);background-size:cover,cover,cover;background-position:var(--game-bg-position,center center);background-repeat:no-repeat;z-index:0;pointer-events:none}
    .screen>*:not(.screen-bg):not(.bg-deco):not(.confetti-container):not(.mascot-corner){position:relative;z-index:1}
    .blocks-screen {--game-bg:url('bg-what-number.png');--screen-fallback:linear-gradient(160deg,#fce4ec,#f8bbd0,#fce4ec)}
    .choose-screen {--game-bg:url('bg-fill-right-block.png');--screen-fallback:linear-gradient(160deg,#f3e5f5,#e1bee7,#f3e5f5)}
    .addsub-screen {--game-bg:url('bg-add-subtract.png');--screen-fallback:linear-gradient(160deg,#fff3e0,#fce4ec,#f3e5f5)}

    /* ── TOP BAR ── */
    .top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:740px;gap:8px;position:relative;z-index:2}
    .back-btn{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:50px;padding:8px 14px;font-family:inherit;font-size:1.2rem;font-weight:900;color:#e91e63;cursor:pointer;box-shadow:0 4px 0 #f48fb1;transition:transform .1s;white-space:nowrap;line-height:1;min-width:52px}
    .back-btn:active{transform:translateY(3px)}
    .settings-btn,.sound-btn{background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:50px;padding:8px 13px;font-family:inherit;font-size:1.1rem;font-weight:900;color:#7b1fa2;cursor:pointer;box-shadow:0 4px 0 #ce93d8;transition:transform .1s;line-height:1;min-width:48px}
    .settings-btn:active,.sound-btn:active{transform:translateY(3px)}

    /* ── MODALS ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-box{background:#fff;border-radius:28px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px solid #f48fb1;max-height:90vh;overflow-y:auto}
    .modal-title{font-size:1.2rem;font-weight:900;color:#7b1fa2;text-align:center;margin-bottom:14px}
    .preset-btn{width:100%;padding:12px 16px;border-radius:14px;border:3px solid;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .1s;margin-bottom:7px}
    .preset-btn:active{transform:scale(.97)}
    .preset-btn.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .preset-btn.inactive{background:#fff;border-color:#f8bbd0;color:#7b1fa2}
    .preset-tag{font-size:1.2rem}
    .preset-info{text-align:left;flex:1}
    .preset-name{font-size:.95rem;font-weight:900}
    .preset-range{font-size:.74rem;opacity:.7;font-weight:700}
    .modal-close{margin-top:8px;width:100%;padding:11px;border-radius:50px;border:none;background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #ad1457}
    .modal-close:active{transform:translateY(3px)}
    /* custom range inputs */
    .custom-range-box{background:#fce4ec;border-radius:14px;padding:14px;margin-top:4px;border:2px solid #f48fb1}
    .custom-range-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .custom-range-row label{font-size:.85rem;font-weight:900;color:#7b1fa2;display:flex;align-items:center;gap:6px}
    .custom-input{width:68px;padding:6px 8px;border-radius:8px;border:2px solid #f48fb1;font-family:inherit;font-size:1rem;font-weight:900;color:#333;text-align:center}
    .custom-apply{background:linear-gradient(135deg,#ce93d8,#7b1fa2);color:#fff;border:none;border-radius:50px;padding:8px 18px;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #4a148c}
    .custom-error{font-size:.8rem;font-weight:900;color:#c62828;background:#ffcdd2;border-radius:8px;padding:5px 10px;margin-bottom:6px}
    /* add/sub custom op */
    .op-toggle-row{display:flex;gap:8px;margin-bottom:10px}
    .op-toggle{flex:1;padding:9px;border-radius:10px;border:2px solid #f8bbd0;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;background:#fff;color:#7b1fa2}
    .op-toggle.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .section-label{font-size:.78rem;font-weight:900;color:#9c27b0;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .mode-toggle-row{display:flex;gap:8px;margin-bottom:10px}

    /* ── EQUIVALENCE MODAL ── */
    .equiv-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
    .equiv-box{background:#fff;border-radius:28px;padding:28px 22px;max-width:360px;width:100%;border:4px solid #f48fb1;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .equiv-title{font-size:1.3rem;font-weight:900;color:#e91e63;margin-bottom:6px}
    .equiv-sub{font-size:1rem;font-weight:700;color:#7b1fa2;margin-bottom:18px}
    .equiv-visual{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .equiv-side{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:140px}
    .equiv-eq{font-size:2rem;font-weight:900;color:#9c27b0}
    .mini-h{width:34px;height:34px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:6px;border:2px solid #6a1b9a}
    .mini-t{width:13px;height:34px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:4px;border:2px solid #c2185b}
    .mini-o{width:13px;height:13px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:3px;border:2px solid #e65100}
    .equiv-next{background:linear-gradient(160deg,#f06292,#ad1457);color:#fff;border:none;border-radius:50px;padding:13px 32px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #880e4f}
    .equiv-next:active{transform:translateY(3px)}

    /* ── NUMBER DISPLAY ── */
    .number-display{display:flex;gap:8px;align-items:flex-end;justify-content:center;background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}
    .digit-box{display:flex;flex-direction:column;align-items:center;gap:3px}
    .digit-value{font-size:clamp(2rem,8.5vw,3.5rem);font-weight:900;line-height:1;min-width:42px;text-align:center}
    .digit-value.shake{animation:shake .35s ease}
    .digit-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .digit-hundreds{color:#9c27b0}.digit-tens{color:#e91e63}.digit-ones{color:#ff6f00}
    .simple-number-card{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(252,228,236,.9));border:2.5px solid #f48fb1;border-radius:20px;padding:12px 22px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}
    .simple-number-main{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;color:#7b1fa2;line-height:1}
    .simple-number-sub{font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#e91e63}
    .simple-number-divider{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:#d7b7df}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

    /* ── TAP-TO-SLOT ── */
    .tap-layout{width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .tap-hint{font-size:.82rem;font-weight:900;color:#9c27b0;text-align:center;background:rgba(255,255,255,.65);border-radius:50px;padding:5px 16px;border:1.5px solid #ce93d8}

    /* Pool */
    .pool-area{background:rgba(255,255,255,.55);border-radius:18px;padding:12px;border:2px solid #f8bbd0}
    .pool-label{font-size:.75rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center}
    .pool-blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}

    /* Pool block wrappers */
    .pool-block{cursor:pointer;border-radius:10px;transition:transform .1s;position:relative}
    .pool-block.selected{filter:drop-shadow(0 0 8px #e91e63) drop-shadow(0 0 4px #fff);transform:scale(1.12) translateY(-3px)}
    .pool-block.empty{opacity:.2;cursor:default;pointer-events:none}

    /* The actual block shapes (pool size) */
    .pb-hundred{width:72px;height:72px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:10px;border:3px solid #6a1b9a;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .pb-ten{width:30px;height:72px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:7px;border:3px solid #c2185b;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .pb-one{width:38px;height:38px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:9px;border:3px solid #e65100}

    /* Slots */
    .slots-area{display:flex;flex-direction:column;gap:8px}
    .slot-row{background:rgba(255,255,255,.65);border:3px dashed #f48fb1;border-radius:16px;padding:10px 12px;min-height:64px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
    .slot-row.can-accept{border-color:#e91e63;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(233,30,99,.2)}
    .slot-row.wrong-flash{animation:slotWrong .35s ease}
    @keyframes slotWrong{0%,100%{background:rgba(255,255,255,.65);border-color:#f48fb1}50%{background:#ffcdd2;border-color:#f44336;box-shadow:0 0 0 3px rgba(244,67,54,.3)}}
    .slot-header{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .slot-h-header{color:#7b1fa2}.slot-t-header{color:#c2185b}.slot-o-header{color:#e65100}
    .slot-blocks{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;min-height:28px}

    /* Mini blocks inside slots (tappable to return) */
    .sb-hundred{width:38px;height:38px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:7px;border:2.5px solid #6a1b9a;cursor:pointer;transition:transform .1s;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .sb-hundred:active{transform:scale(.88)}.sb-hundred .ic{background:rgba(255,255,255,.35);border-radius:1px}
    .sb-ten{width:16px;height:38px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:5px;border:2.5px solid #c2185b;cursor:pointer;transition:transform .1s}
    .sb-ten:active{transform:scale(.88)}
    .sb-one{width:18px;height:18px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:5px;border:2.5px solid #e65100;cursor:pointer;transition:transform .1s}
    .sb-one:active{transform:scale(.88)}
    .slot-empty-hint{font-size:.78rem;color:#bbb;font-weight:700;padding:4px 0}

    /* Place-value builder */
    .pv-goal-card{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 16px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1;min-width:min(92vw,430px)}
    .pv-visual-row{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
    .pv-unit-group{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.64);border:2px solid;border-radius:14px;padding:7px 9px;min-height:62px}
    .pv-unit-group.h{border-color:#ce93d8}.pv-unit-group.t{border-color:#f48fb1}.pv-unit-group.o{border-color:#ffd54f}
    .pv-goal-num{font-size:clamp(1.9rem,7vw,3.05rem);font-weight:900;line-height:1;min-width:.72em;text-align:center}
    .pv-goal-plus{font-size:1.55rem;color:#d7b7df;font-weight:900}
    .pv-expanded-form{font-size:clamp(1rem,4vw,1.45rem);font-weight:900;color:#7b1fa2;text-align:center;line-height:1.15}
    .gb-hundred{width:48px;height:48px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:8px;border:3px solid #6a1b9a;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .gb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .gb-ten{width:19px;height:52px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:6px;border:3px solid #c2185b;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .gb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .gb-one{width:28px;height:28px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:7px;border:3px solid #e65100}
    .pv-built-line{background:rgba(255,255,255,.72);border:2px solid #f8bbd0;border-radius:999px;padding:7px 16px;font-size:.9rem;font-weight:900;color:#7b1fa2;position:relative;z-index:1;text-align:center}
    .pv-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .pv-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .pv-zone{min-height:142px;border:3px dashed;border-radius:18px;background:rgba(255,255,255,.56);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px rgba(123,31,162,.08);transition:transform .12s,background .12s}
    .pv-zone:active{transform:scale(.98)}
    .pv-zone-h{border-color:#9c27b0;background:rgba(243,229,245,.68)}
    .pv-zone-t{border-color:#e91e63;background:rgba(252,228,236,.7)}
    .pv-zone-o{border-color:#f9a825;background:rgba(255,248,225,.72)}
    .pv-zone-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .pv-zone-title{font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .pv-zone-h .pv-zone-title{color:#7b1fa2}.pv-zone-t .pv-zone-title{color:#c2185b}.pv-zone-o .pv-zone-title{color:#e65100}
    .pv-zone-hint{font-size:.66rem;font-weight:900;color:#999;text-transform:uppercase;letter-spacing:.6px}
    .pv-zone-count{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:.9rem;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.12)}
    .pv-zone-h .pv-zone-count{color:#7b1fa2}.pv-zone-t .pv-zone-count{color:#c2185b}.pv-zone-o .pv-zone-count{color:#e65100}
    .pv-block-space{position:relative;min-height:66px;display:flex;align-items:flex-end;justify-content:center;gap:5px;flex-wrap:wrap;flex:1}
    .pv-placeholder{opacity:.2;pointer-events:none}
    .pv-placed{cursor:pointer;animation:blockIn .18s ease}
    .pv-bank{background:rgba(255,255,255,.68);border:2px solid #f8bbd0;border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
    .pv-bank-title{width:100%;text-align:center;font-size:.78rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px}
    .pv-bank-btn{border:none;border-radius:16px;background:#fff;min-width:104px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .12s}
    .pv-bank-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}

};

const decompose = (n, counting) => {
  if (counting) return {h:0,t:0,o:n};
  if (n === 1000) return {h:10,t:0,o:0};
  return {h:Math.floor(n/100),t:Math.floor((n%100)/10),o:n%10};
};

function useFlowerReward(flowers, setFlowers, setGardenFull, muted, onBouquet) {
  return useCallback(() => {
    Sound.setMuted(muted);
    setFlowers(f => {
      if (f >= MAX_FLOWERS && onBouquet) onBouquet();
      const nf = f >= MAX_FLOWERS ? 1 : f + 1;
      if (nf === MAX_FLOWERS) {
        setGardenFull(true);
        setTimeout(() => Sound.allFlowers(), 300);
      } else {
        setGardenFull(false);
      }
      if (nf % 10 === 0) {
        setTimeout(() => Sound.heart(), 200);
      }
      return nf;
    });
  }, [muted, setFlowers, setGardenFull, onBouquet]);
}

/* ══ SETTINGS MODAL: NUMBER LINE + ADD/SUB ══ */
function LineSettings({current, onChange, customOp, onCustomOp, isAddSub, lineMax, onClose}){
  const [showLineCustom,setShowLineCustom]=useState(current.id==='lcustom');
  const [lcMin,setLcMin]=useState(current.id==='lcustom'?current.min??1:1);
  const [lcMax,setLcMax]=useState(current.id==='lcustom'?current.max??20:20);
  const [lcErr,setLcErr]=useState('');
  const [opMode,setOpMode]=useState(customOp?'custom':'random');
  const [cop,setCop]=useState(customOp?.op||'+');
  const [bMin,setBMin]=useState(customOp?.baseMin??1);
  const [bMax,setBMax]=useState(customOp?.baseMax??10);
  const [aMin,setAMin]=useState(customOp?.amtMin??1);
  const [aMax,setAMax]=useState(customOp?.amtMax??5);
  const [opErr,setOpErr]=useState('');

  const applyLine=()=>{
    const mn=parseInt(lcMin),mx=parseInt(lcMax);
    if(isNaN(mn)||isNaN(mx)||mn<1||mx>30||mx<=mn){setLcErr('Min ≥ 1, Max ≤ 30, Max > Min');return;}
    onChange({id:'lcustom',emoji:'✏️',tag:`${mn}–${mx}`,min:mn,max:mx,desc:'Custom'});
    setLcErr('');
    if(!isAddSub)onClose();
  };
  const applyOp=()=>{
    const activeLine=current.id==='lcustom'?{min:parseInt(lcMin),max:parseInt(lcMax)}:{min:current.min,max:current.max};
    const mn=activeLine.min,mx=activeLine.max;
    const bm=parseInt(bMin),bx=parseInt(bMax),am=parseInt(aMin),ax=parseInt(aMax);
    if([mn,mx,bm,bx,am,ax].some(Number.isNaN)||bm>bx||am>ax){setOpErr('Check the from-to ranges.');return;}
    const valid=[];
    for(let s=bm;s<=bx;s++){
      for(let a=am;a<=ax;a++){
        if(cop==='+'&&s+a<=mx&&s+a>=mn)valid.push(1);
        if(cop==='-'&&s-a>=mn&&s-a<=mx)valid.push(1);
      }
    }
    if(valid.length===0){setOpErr('No valid problems in this range. Try smaller numbers.');return;}
    onCustomOp(opMode==='custom'?{op:cop,baseMin:bm,baseMax:bx,amtMin:am,amtMax:ax}:null);
    onClose();
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Settings</div>
        <div className="section-label">Number Range</div>
        {LINE_PRESETS.filter(p=>p.id!=='lcustom').map(p=>(
          <button key={p.id} className={`preset-btn ${current.id===p.id?'active':'inactive'}`} onClick={()=>{Sound.tap();onChange(p);}}>
            <span className="preset-tag">{p.emoji}</span>
            <div className="preset-info"><div className="preset-name">{p.tag}</div><div className="preset-range">{p.desc}</div></div>
            {current.id===p.id&&<span>✓</span>}
          </button>
        ))}
        <button className={`preset-btn ${current.id==='lcustom'?'active':'inactive'}`} onClick={()=>{Sound.tap();setShowLineCustom(true);}}>
          <span className="preset-tag">✏️</span>
          <div className="preset-info"><div className="preset-name">Custom</div><div className="preset-range">Set your own</div></div>
          {current.id==='lcustom'&&<span>✓</span>}
        </button>
        {showLineCustom&&(
          <div className="custom-range-box">
            {lcErr&&<div className="custom-error">{lcErr}</div>}
            <div className="custom-range-row">
              <label>From: <input className="custom-input" type="number" value={lcMin} onChange={e=>setLcMin(e.target.value)} min="1" max="29"/></label>
              <label>To: <input className="custom-input" type="number" value={lcMax} onChange={e=>setLcMax(e.target.value)} min="2" max="30"/></label>
              <button className="custom-apply" onClick={applyLine}>Set ✓</button>
            </div>
          </div>
        )}
        {isAddSub&&<>
          <div className="section-label" style={{marginTop:12}}>Problem Type</div>
          <div className="mode-toggle-row">
            <button className={`op-toggle ${opMode==='random'?'active':''}`} onClick={()=>setOpMode('random')}>🎲 Random</button>
            <button className={`op-toggle ${opMode==='custom'?'active':''}`} onClick={()=>setOpMode('custom')}>✏️ Custom Range</button>
          </div>
          {opMode==='custom'&&(
            <div className="custom-range-box">
              {opErr&&<div className="custom-error">{opErr}</div>}
              <div className="op-toggle-row">
                <button className={`op-toggle ${cop==='+'?'active':''}`} onClick={()=>setCop('+')}>➕ Add</button>
                <button className={`op-toggle ${cop==='-'?'active':''}`} onClick={()=>setCop('-')}>➖ Subtract</button>
              </div>
              <div className="section-label">Start number: from – to</div>
              <div className="custom-range-row" style={{marginBottom:8}}>
                <input className="custom-input" type="number" value={bMin} onChange={e=>setBMin(e.target.value)}/><span style={{color:'#9c27b0',fontWeight:900}}>–</span>
                <input className="custom-input" type="number" value={bMax} onChange={e=>setBMax(e.target.value)}/>
              </div>
              <div className="section-label">{cop==='+'?'Add':'Subtract'} amount: from – to</div>
              <div className="custom-range-row">
                <input className="custom-input" type="number" value={aMin} onChange={e=>setAMin(e.target.value)}/><span style={{color:'#9c27b0',fontWeight:900}}>–</span>
                <input className="custom-input" type="number" value={aMax} onChange={e=>setAMax(e.target.value)}/>
              </div>
            </div>
          )}
          <button className="modal-close" style={{marginTop:10}} onClick={applyOp}>Apply</button>
        </>}
        {!isAddSub&&<button className="modal-close" onClick={onClose}>Done</button>}
      </div>
    </div>
  );
}

function TopBar({onBack,onSettings,muted,onToggleMute,label}){

  const startHold=()=>{
    if(!onSettings)return;
    firedRef.current=false;
    clearTimeout(holdT.current);
    holdT.current=setTimeout(()=>{firedRef.current=true;Sound.tap();onSettings();},1200);
  };

      setHint(true);

function makeProbFromPreset(preset, customOp){
  const{min,max}=preset;
  if(customOp){
    const{op,baseMin,baseMax,amtMin,amtMax}=customOp;
    const valid=[];
    for(let s=baseMin;s<=baseMax;s++){
      for(let a=amtMin;a<=amtMax;a++){
        if(op==='+'&&s+a<=max&&s+a>=min)valid.push({start:s,op:'+',amount:a,answer:s+a});
        if(op==='-'&&s-a>=min&&s-a<=max)valid.push({start:s,op:'-',amount:a,answer:s-a});
      }
    }
    if(valid.length>0)return valid[rand(0,valid.length-1)];
    return makeProbFromPreset(preset,null); // fallback
  }
  const range=max-min,maxHop=Math.min(5,Math.max(1,Math.floor(range/3)));
  const op=Math.random()<.5?'+':'-';
  if(op==='+'){const s=rand(min,max-1),a=rand(1,Math.min(maxHop,max-s));return{start:s,op:'+',amount:a,answer:s+a};}
  else{const s=rand(min+1,max),a=rand(1,Math.min(maxHop,s-min));return{start:s,op:'-',amount:a,answer:s-a};}
}

/* ══ MODE c1: COLUMN ADD ══ */
const ones=n=>n%10;
const tens=n=>Math.floor((n%100)/10);

function isNoCarry(a,b){
  return ones(a)+ones(b)<=9 && tens(a)+tens(b)<=9;
}

function buildColumnAddProblems(preset){
  const valid=[];
  const ranges={
    tiny:{aMin:1,aMax:9,bMin:1,bMax:9},
    small20:{aMin:1,aMax:19,bMin:1,bMax:19},
    twoDigit:{aMin:1,aMax:99,bMin:1,bMax:99},
    big:{aMin:100,aMax:999,bMin:1,bMax:99},
  };
  const r=ranges[preset.id]||ranges.big;
  for(let a=r.aMin;a<=r.aMax;a++){
    for(let b=r.bMin;b<=r.bMax;b++){
      if(preset.id==='tiny'&&a+b>9) continue;
      if(preset.id!=='tiny'&&!isNoCarry(a,b)) continue;
      valid.push({a,b,answer:a+b});
    }
  }
  return valid;
}

function makeColumnAddProblem(preset=COLUMN_ADD_PRESETS[0]){
  const valid=buildColumnAddProblems(preset);
  return valid[rand(0,valid.length-1)];
}

function toColumnDigits(n,colCount){
  const chars=String(n).split('');
  return [...Array(Math.max(0,colCount-chars.length)).fill(''),...chars];
}

            <div className="preset-info"><div className="preset-name">{p.tag}</div><div className="preset-range">{p.desc}</div></div>
            {current.id===p.id&&<span>✓</span>}
          </button>
        ))}
        <button className="modal-close" onClick={onClose}>Done</button>
      </div>
    </div>
  );
}

  const colCount=useMemo(()=>Math.max(String(problem.a).length,String(problem.b).length,String(problem.answer).length),[problem]);

  const nextIndex=digits.findIndex(d=>d==='');

  const resetForProblem=useCallback(p=>{

  const applyPreset=useCallback(p=>{

  const clear=useCallback(()=>{

    setDigits(Array(colCount).fill(''));

  },[muted,won,colCount]);

  const tapDigit=useCallback(n=>{
    Sound.setMuted(muted); Sound.tap();
    if(won) return;
    setDigits(prev=>{
      const idx=prev.findIndex(d=>d==='');
      if(idx<0) return prev;
      const out=[...prev];
      out[idx]=String(n);
      return out;
    });
  },[muted,won]);

  useEffect(()=>{
    if(won || digits.some(d=>d==='')) return;
    const guess=digits.join('');
    Sound.setMuted(muted);
    if(guess===String(problem.answer)){
      setWon(true); setWrong(false); setConf(true);
      Sound.ding(); setTimeout(()=>Sound.celebrate(),200);
      mascot.happy();
      Voice.say(`${problem.a} plus ${problem.b} is ${problem.answer}! ${praise()}`);
      setScore(s=>s+1); addFlower();
      setTimeout(()=>setConf(false),2500);
    }else{
      setWrong(true); Sound.wrong(); mascot.oops(); setMisses(m=>m+1);
      const ansStr=String(problem.answer);
      setTimeout(()=>{setDigits(prev=>prev.map((d,i)=>d===ansStr[i]?d:''));setWrong(false);},650);
    }
  },[digits,won,muted,problem,setScore,addFlower,colCount]);

  return(
    <div className="screen column-screen">
      <div className="screen-bg"/>
      {showSettings&&<ColumnAddSettings current={preset} onChange={applyPreset} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={onToggleMute} label={preset.tag}/>
      <ScoreRow score={score} flowers={flowers} bouquets={bouquets}/>
      <Mascot kind="unicorn" mood={mascot.mood} stamp={mascot.stamp}/>
      <div className="count-title"><div className="count-title-main">Column Add</div><div className="count-title-sub">Tap the answer!</div></div>
      <div className="column-card">
        <div className="column-grid" style={{'--col-count':colCount}}>
          <div className="column-blank"/>
          {aDigits.map((d,i)=><div key={`a${i}`} className="column-digit">{d}</div>)}
          <div className="column-plus">+</div>
          {bDigits.map((d,i)=><div key={`b${i}`} className="column-digit">{d}</div>)}
          <div className="column-line"/>
          <div className="column-blank"/>
          {digits.map((d,i)=>(
            <div key={`ans${i}`} className={`column-answer-box ${nextIndex===i&&!won?'active':''} ${wrong?'wrong':''}`}>{d || (misses>=3?<span className="ghost-hint">{String(problem.answer)[i]}</span>:'_')}</div>
          ))}
          <div className="column-final-line"/>
        </div>
      </div>
      {won&&<div className="column-celebrate">{problem.a} + {problem.b} = {problem.answer}!</div>}
      {!won&&(
        <div className="keypad">
          {[1,2,3,4,5,6,7,8,9,0].map(n=><button key={n} className="key-btn" onClick={()=>tapDigit(n)}>{n}</button>)}
          <button className="key-btn clear" onClick={clear}>Clear</button>
        </div>
      )}
      {won&&<button className="next-btn" onClick={next}>Next</button>}
    </div>
  );
}

/* ══ MODE m1: TIMES TABLES ══ */
function timesRangeLabel(range){
  return `${range.rowMax} × ${range.colMax}`;
}

function makeMultiplicationProblem(range=DEFAULT_TIMES_RANGE){
  const a=rand(1,range.rowMax);
  const b=rand(1,range.colMax);
  return {a,b,answer:a*b};
}

function MultiplicationSettings({range,onChange,onClose}){
  const [rowMax,setRowMax]=useState(range.rowMax);
  const [colMax,setColMax]=useState(range.colMax);
  const apply=()=>onChange({rowMax,colMax});
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Times Tables</div>
        <div className="times-range-preview">
          <span>Up to</span>
          <span className="times-value-box">{rowMax}</span>
          <span>×</span>
          <span className="times-value-box">{colMax}</span>
        </div>
        <div className="times-picker-label">Rows</div>
        <div className="times-option-grid">
          {TIMES_MAX_OPTIONS.map(n=>(
            <button key={`r${n}`} className={`times-option-btn ${rowMax===n?'active':''}`} onClick={()=>{Sound.tap();setRowMax(n);}}>{n}</button>
          ))}
        </div>
        <div className="times-picker-label">Columns</div>
        <div className="times-option-grid">
          {TIMES_MAX_OPTIONS.map(n=>(
            <button key={`c${n}`} className={`times-option-btn ${colMax===n?'active':''}`} onClick={()=>{Sound.tap();setColMax(n);}}>{n}</button>
          ))}
        </div>
        <button className="modal-close" onClick={apply}>Done</button>
      </div>
    </div>
  );
}

function MultiplicationGame({onBack, flowers, gardenFull, setFlowers, setGardenFull, score, setScore, bouquets, addBouquet, muted, onToggleMute}){
  const [range,setRange]=useState(DEFAULT_TIMES_RANGE);
  const [showSettings,setShowSettings]=useState(false);
  const [problem,setProblem]=useState(()=>makeMultiplicationProblem(DEFAULT_TIMES_RANGE));
  const answerLength=String(problem.answer).length;
  const mascot=useMascot();
  const [misses,setMisses]=useState(0);
  const [digits,setDigits]=useState(()=>Array(answerLength).fill(''));
  const [won,setWon]=useState(false);
  const [wrong,setWrong]=useState(false);
  const [confetti,setConf]=useState(false);
  const addFlower=useFlowerReward(flowers,setFlowers,setGardenFull,muted,addBouquet);
  const nextIndex=digits.findIndex(d=>d==='');

  const resetForProblem=useCallback(p=>{
    setProblem(p);
    setDigits(Array(String(p.answer).length).fill(''));
    setWon(false);
    setWrong(false);
    setMisses(0);
  },[]);

  useEffect(()=>{Voice.say(`${problem.a} times ${problem.b}?`);},[problem]);

  const next=useCallback(()=>{
    if(flowers===MAX_FLOWERS){setFlowers(0);setGardenFull(false);addBouquet();}
    resetForProblem(makeMultiplicationProblem(range));
  },[flowers,setFlowers,setGardenFull,range,resetForProblem]);

  const applyRange=useCallback(nextRange=>{
    setRange(nextRange);
    resetForProblem(makeMultiplicationProblem(nextRange));
    setShowSettings(false);
  },[resetForProblem]);

  const clear=useCallback(()=>{
    Sound.setMuted(muted); Sound.tap();
    if(won) return;
    setDigits(Array(answerLength).fill(''));
    setWrong(false);
  },[muted,won,answerLength]);

  const tapDigit=useCallback(n=>{
    Sound.setMuted(muted); Sound.tap();
    if(won) return;
    setDigits(prev=>{
      const idx=prev.findIndex(d=>d==='');
      if(idx<0) return prev;
      const out=[...prev];
      out[idx]=String(n);
      return out;
    });
  },[muted,won]);

  useEffect(()=>{
    if(won || digits.some(d=>d==='')) return;
    const guess=digits.join('');
    Sound.setMuted(muted);
    if(guess===String(problem.answer)){
      setWon(true); setWrong(false); setConf(true);
      Sound.ding(); setTimeout(()=>Sound.celebrate(),200);
      mascot.happy();
      Voice.say(`${problem.a} times ${problem.b} is ${problem.answer}! ${praise()}`);
      setScore(s=>s+1); addFlower();
      setTimeout(()=>setConf(false),2500);
    }else{
      setWrong(true); Sound.wrong(); mascot.oops(); setMisses(m=>m+1);
      const ansStr=String(problem.answer);
      setTimeout(()=>{setDigits(prev=>prev.map((d,i)=>d===ansStr[i]?d:''));setWrong(false);},650);
    }
  },[digits,won,muted,problem,setScore,addFlower,answerLength]);

  return(
    <div className="screen multiply-screen">
      <div className="screen-bg"/>
      {showSettings&&<MultiplicationSettings range={range} onChange={applyRange} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={onToggleMute} label={timesRangeLabel(range)}/>
      <ScoreRow score={score} flowers={flowers} bouquets={bouquets}/>
      <Mascot kind="princess" mood={mascot.mood} stamp={mascot.stamp}/>
      <div className="count-title"><div className="count-title-main">Times Tables</div><div className="count-title-sub">Tap the answer!</div></div>
      <div className="multiply-card">
        <div className="multiply-problem">
          <span>{problem.a}</span>
          <span className="times-symbol">×</span>
          <span>{problem.b}</span>
          <span className="equals-symbol">=</span>
          <span>?</span>
        </div>
        <div className="multiply-answer-row">
          {digits.map((d,i)=>(
            <div key={i} className={`multiply-answer-box ${nextIndex===i&&!won?'active':''} ${wrong?'wrong':''}`}>{d || (misses>=3?<span className="ghost-hint">{String(problem.answer)[i]}</span>:'_')}</div>
          ))}
        </div>
      </div>
      {won&&<div className="multiply-celebrate">{problem.a} × {problem.b} = {problem.answer}!</div>}
      {!won&&(
        <div className="keypad">
          {[1,2,3,4,5,6,7,8,9,0].map(n=><button key={n} className="key-btn" onClick={()=>tapDigit(n)}>{n}</button>)}
          <button className="key-btn clear" onClick={clear}>Clear</button>
        </div>
      )}
      {won&&<button className="next-btn" onClick={next}>Next</button>}
    </div>
  );
}

/* ══ APP ══ */
function App(){
  const [mode,setMode]=useState(null);
  // Garden (30 flowers) is per-game by design: kids fill it fresh each game.
  // Full gardens convert to bouquets, which persist forever (localStorage).
  const [flowers,setFlowers]=useState(0);
  const [gardenFull,setGardenFull]=useState(false);
  const [scores,setScores]=useState({b1:0,b2:0,l2:0,c1:0,m1:0});
  const [bouquets,setBouquets]=useState(()=>{try{return parseInt(localStorage.getItem('mm_bouquets')||'0',10)||0;}catch(e){return 0;}});
  const [muted,setMutedState]=useState(()=>{try{return localStorage.getItem('mm_muted')==='1';}catch(e){return false;}});
  useEffect(()=>{Sound.setMuted(muted);Voice.muted=muted;},[]);
  const onToggleMute=useCallback(()=>setMutedState(m=>{const n=!m;Sound.setMuted(n);Voice.muted=n;try{localStorage.setItem('mm_muted',n?'1':'0');}catch(e){}return n;}),[]);
  const addBouquet=useCallback(()=>setBouquets(b=>{const n=b+1;try{localStorage.setItem('mm_bouquets',String(n));}catch(e){}return n;}),[]);
  const setScore=useCallback(mode=>fn=>setScores(s=>({...s,[mode]:fn(s[mode])})),[]);
  const goHome=useCallback(()=>{
    if(flowers===MAX_FLOWERS)addBouquet();
    setFlowers(0);setGardenFull(false);setMode(null);
  },[flowers,addBouquet]);

  const shared={onBack:goHome,flowers,gardenFull,setFlowers,setGardenFull,bouquets,addBouquet,muted,onToggleMute};
  if(mode==='b1')return<BlocksGuided {...shared} score={scores.b1} setScore={setScore('b1')}/>;
  if(mode==='b2')return<BlocksFill {...shared} score={scores.b2} setScore={setScore('b2')}/>;
  if(mode==='l2')return<NumberLineAddSub {...shared} score={scores.l2} setScore={setScore('l2')}/>;
  if(mode==='c1')return<ColumnAdd {...shared} score={scores.c1} setScore={setScore('c1')}/>;
  if(mode==='m1')return<MultiplicationGame {...shared} score={scores.m1} setScore={setScore('m1')}/>;
  return<Home onSelect={setMode} bouquets={bouquets}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
