<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Space Math</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <meta name="theme-color" content="#0a0e2d"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Magic Math"/>
  <script src="./vendor/react-18.3.1.production.min.js"></script>
  <script src="./vendor/react-dom-18.3.1.production.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;background:#0a0e2d}

    /* ── BG DECO ── */
    .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .bg-deco img{position:absolute;display:inline-block;object-fit:contain;animation:twinkleDeco ease-in-out infinite alternate;filter:drop-shadow(0 0 7px rgba(140,190,255,.5));will-change:transform,opacity}
    @keyframes twinkleDeco{
      0%{opacity:.06;transform:scale(.55) rotate(-12deg)}
      100%{opacity:var(--deco-opacity,.5);transform:scale(1.15) rotate(12deg)}
    }
    @media (prefers-reduced-motion: reduce){
      .bg-deco img{animation:none!important;opacity:.12!important}
    }
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

    /* ── HOME ── */
    .home{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;overflow:hidden}
    .home-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(10,14,45,.32),rgba(10,14,45,.32)),url('assets-runtime/space/bg-nebula.webp');background-size:cover,cover;background-position:center,center;background-color:#0a0e2d;z-index:0}
    .home-tint{position:absolute;inset:0;background:rgba(8,12,40,.1);z-index:0}
    .home>*:not(.home-bg):not(.home-tint):not(.music-btn):not(.hub-btn){position:relative;z-index:1}
    .ai-note{margin:2px auto 18px;max-width:34rem;padding:0 16px;text-align:center;
      font-size:.72rem;font-weight:700;line-height:1.5;color:#eaf1ff;opacity:.75}
    .home-rainbow{font-size:clamp(.9rem,3vw,1.4rem);letter-spacing:4px;animation:bounce 1.4s ease-in-out infinite alternate}
    .home-title{font-size:clamp(1.8rem,7vw,3.2rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:clamp(.85rem,2.8vw,1.1rem);font-weight:900;color:#5a2ed6;background:rgba(255,255,255,.7);border-radius:50px;padding:6px 20px;box-shadow:0 2px 8px rgba(171,71,188,.2)}
    .mode-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:640px}
    .mode-section-label{font-size:.95rem;font-weight:900;color:#5a2ed6;text-transform:uppercase;letter-spacing:2px;background:rgba(255,255,255,.75);border-radius:50px;padding:5px 18px}
    .mode-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
    /* Only the row that holds a badged card opts out of stretch. Stretching it
       left a badge-sized hole under Column Add and Take Away that read as
       missing art; letting each card end where its content ends costs a ragged
       bottom edge and buys the badged card literally standing taller, which is
       the message. It stays scoped to this row to match Unicorn Math, where the
       rows genuinely rely on stretch — Add & Subtract carries no subtitle there
       and is 15px shorter than Times Tables beside it. */
    .mode-row.has-badge{align-items:flex-start}
    /* "Borrow Take Away" wraps to two lines at some widths and "Carry Add" never
       does, so without a reserved second line the two badges in this row sit at
       different heights — 270px against 286px, measured at 768px. Stretch used to
       hide that; opting out of stretch exposed it. Reserving the line costs the
       one-line cards a few pixels nobody sees and keeps the badges level. */
    .mode-row.has-badge .mode-card-label{min-height:2.4em;display:flex;align-items:center}
    .mode-card{flex:1;min-width:130px;max-width:185px;border-radius:26px;padding:18px 12px 14px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mode-card-label{font-size:.78rem;font-weight:900;color:rgba(255,255,255,.92);text-shadow:0 2px 4px rgba(0,0,0,.3);text-align:center}
    /* ── GAME PREVIEW ──
       A miniature of the screen the child is about to see, not a mascot. Six games is
       too many to tell apart by a decorative planet, and a pre-reader cannot use the
       label — so each card shows the game's own shape: blocks, a column sum, a number
       track, a times fact, a counting chain. The colours are lifted from each game, so
       the picture on the card and the screen it opens match. */
    .gp{width:104px;height:88px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 6px;border-radius:13px;background:linear-gradient(160deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;box-shadow:0 3px 0 #6d9bf5,0 5px 10px rgba(4,8,30,.22)}
    .gp.gp-tight{gap:2px}
    .gp-row{display:flex;align-items:center;justify-content:center;gap:3px}
    .gp-blocks{display:flex;align-items:flex-end;justify-content:center;gap:3px}
    .gp-num{font-size:.92rem;font-weight:900;color:#5a2ed6;line-height:1}
    .gp-op{font-size:.8rem;font-weight:900;color:#2f6df6;line-height:1}
    .gp-box{width:15px;height:18px;border-radius:4px;border:2px solid #2f6df6;background:#fff}
    .gp-line{width:40px;height:2.5px;border-radius:2px;background:#2f6df6}
    .gp-t{width:7px;height:20px;border-radius:2px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border:1.5px solid #1f54d6}
    .gp-o{width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,#ffd54f,#f9a825);border:1.5px solid #e65100}
    .gp-o.gp-empty{background:none;border-style:dashed;border-color:#93b7fb}
    .gp-dot{width:7px;height:7px;border-radius:50%;background:#c4d7fd}
    .gp-dot.on{background:#2f6df6;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
    .gp-chip{padding:1px 5px;border-radius:999px;border:1.5px solid #93b7fb;background:#fff;font-size:.62rem;font-weight:900;color:#2f6df6;line-height:1.35}
    .gp-chip.q{border-style:dashed;color:#5a2ed6}
    .gp-arrow{font-size:.6rem;font-weight:900;color:#5a2ed6;opacity:.5}
    /* ── COLUMN MATHS PREVIEWS (c1-c4) ──
       Four column cards now sit side by side, so the picture has to carry both facts a
       pre-reader needs: which operation, and how hard. Operation is the loud one — a
       big plain glyph for adding, a filled coin for taking away — because the two are
       genuinely different games and a 7px difference between + and − is not a
       difference a four-year-old can use. Difficulty is the quiet one: the dashed box
       (and, on c4, the crossed digit) appears only on the carry/borrow cards. Card
       colour repeats the operation and the star count repeats the difficulty, so the
       two redundant channels carry different axes instead of the same one. */
    .gp-op.gp-big{font-size:1.45rem}
    .gp-take{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:900;line-height:1;color:#fff;background:#c62828}
    .gp-carry{width:12px;height:12px;border-radius:3px;border:1.5px dashed #ab97f5;background:#fff;font-size:.52rem;font-weight:900;color:#e65100;display:flex;align-items:center;justify-content:center;line-height:1}
    .gp-carry-row{margin-right:19px}
    .gp-small{font-size:.55rem;font-weight:900;color:#f4511e;line-height:1;align-self:flex-start}
    .gp-strike{position:relative;color:#7b88a8}
    .gp-strike::after{content:'';position:absolute;left:-2px;right:-2px;top:52%;height:2px;border-radius:1px;background:rgba(244,81,30,.85);transform:rotate(-15deg)}
    .mode-card-stars{height:24px;display:flex;align-items:center;justify-content:center;gap:2px}
    .mode-card-stars img{width:17px;height:17px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
    /* ── BIG-KID BADGE ──
       Worn only by Carry Add and Borrow Take Away. Stars say "hardest" in a
       convention a pre-reader has to be taught; two big children say it in a
       language they already read fluently, because "am I big or little?" is a
       question they think about daily. Both signals stay: same fact, two
       languages, the way card colour and star count already split operation
       from difficulty.
       72px is a floor, not a preference. Measured smaller, the head-to-body
       ratio that carries age collapses and it reads as two coloured smudges —
       the badge stops meaning anything and becomes decoration. */
    .mode-card-badge{height:72px;margin-top:-2px;display:flex;align-items:flex-end;justify-content:center}
    .mode-card-badge img{height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
    .mc-pink  {background:linear-gradient(160deg,#93b7fb,#2f6df6);box-shadow:0 7px 0 #1746b8,0 10px 20px rgba(47,109,246,.3)}
    .mc-purple{background:linear-gradient(160deg,#ab97f5,#5a2ed6);box-shadow:0 7px 0 #371a92,0 10px 20px rgba(90,46,214,.3)}
    .mc-rose  {background:linear-gradient(160deg,#5b8cf8,#1f54d6);box-shadow:0 7px 0 #0f2e86,0 10px 20px rgba(31,84,214,.3)}
    .mc-magic {background:linear-gradient(160deg,#8f6cee,#371a92);box-shadow:0 7px 0 #311b92,0 10px 20px rgba(55,26,146,.3)}

    /* ── SCREEN ── */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 24px;gap:11px;background:transparent;overflow:hidden}
    .screen-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(6,9,30,.26),rgba(6,9,30,.26)),var(--game-bg,url('assets-runtime/space/bg-earth.webp'));background-size:cover,cover;background-position:center,center;background-color:#0a0e2d;z-index:0;pointer-events:none;transition:opacity .4s}
    /* Every :not() here adds specificity, so this rule outweighs a plain class rule on
       any child. The settings overlay is a child of .screen and must stay position:fixed
       to cover the viewport — without this exclusion it lays out inline in the column,
       squeezed to the flex width instead of centred over the game. */
    .screen>*:not(.screen-bg):not(.bg-deco):not(.confetti-container):not(.mascot-corner):not(.modal-overlay):not(.tc-panel){position:relative;z-index:1}

    /* ── TOP BAR ── */
    .top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:740px;gap:8px;position:relative;z-index:2}
    .back-btn{background:linear-gradient(135deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:50px;padding:8px 14px;font-family:inherit;font-size:1.2rem;font-weight:900;color:#2f6df6;cursor:pointer;box-shadow:0 4px 0 #93b7fb;transition:transform .1s;white-space:nowrap;line-height:1;min-width:52px}
    .back-btn:active{transform:translateY(3px)}
    .music-btn{position:fixed;top:14px;right:14px;z-index:9}
    .hub-btn{position:fixed;top:14px;left:14px;z-index:9;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
    .settings-btn,.sound-btn,.music-btn{background:linear-gradient(135deg,#fff,#ecebff);border:2.5px solid #ab97f5;border-radius:50px;padding:8px 13px;font-family:inherit;font-size:1.1rem;font-weight:900;color:#5a2ed6;cursor:pointer;box-shadow:0 4px 0 #ab97f5;transition:transform .1s;line-height:1;min-width:48px}
    .settings-btn:active,.sound-btn:active,.music-btn:active{transform:translateY(3px)}

    /* ── MODALS ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-box{background:#fff;border-radius:28px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px solid #93b7fb;max-height:90vh;overflow-y:auto}
    .modal-title{font-size:1.2rem;font-weight:900;color:#5a2ed6;text-align:center;margin-bottom:14px}
    .preset-btn{width:100%;padding:12px 16px;border-radius:14px;border:3px solid;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .1s;margin-bottom:7px}
    .preset-btn:active{transform:scale(.97)}
    .preset-btn.active{background:linear-gradient(135deg,#93b7fb,#2f6df6);border-color:#2f6df6;color:#fff}
    .preset-btn.inactive{background:#fff;border-color:#c4d7fd;color:#5a2ed6}
    .preset-tag{font-size:1.2rem}
    .preset-info{text-align:left;flex:1}
    .preset-name{font-size:.95rem;font-weight:900}
    .preset-range{font-size:.74rem;opacity:.7;font-weight:700}
    .modal-close{margin-top:8px;width:100%;padding:11px;border-radius:50px;border:none;background:linear-gradient(135deg,#93b7fb,#2f6df6);color:#fff;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #1746b8}
    .modal-close:active{transform:translateY(3px)}
    /* custom range inputs */
    .custom-range-box{background:#e8f0ff;border-radius:14px;padding:14px;margin-top:4px;border:2px solid #93b7fb}
    .custom-range-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .custom-range-row label{font-size:.85rem;font-weight:900;color:#5a2ed6;display:flex;align-items:center;gap:6px}
    .custom-input{width:68px;padding:6px 8px;border-radius:8px;border:2px solid #93b7fb;font-family:inherit;font-size:1rem;font-weight:900;color:#333;text-align:center}
    .custom-apply{background:linear-gradient(135deg,#ab97f5,#5a2ed6);color:#fff;border:none;border-radius:50px;padding:8px 18px;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #371a92}
    .custom-error{font-size:.8rem;font-weight:900;color:#c62828;background:#ffcdd2;border-radius:8px;padding:5px 10px;margin-bottom:6px}
    /* add/sub custom op */
    .op-toggle-row{display:flex;gap:8px;margin-bottom:10px}
    .op-toggle{flex:1;padding:9px;border-radius:10px;border:2px solid #c4d7fd;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;background:#fff;color:#5a2ed6}
    .op-toggle.active{background:linear-gradient(135deg,#93b7fb,#2f6df6);border-color:#2f6df6;color:#fff}
    .section-label{font-size:.78rem;font-weight:900;color:#6d3ff0;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .mode-toggle-row{display:flex;gap:8px;margin-bottom:10px}

    /* ── EQUIVALENCE MODAL ── */
    .equiv-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
    .equiv-box{background:#fff;border-radius:28px;padding:28px 22px;max-width:360px;width:100%;border:4px solid #93b7fb;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .equiv-title{font-size:1.3rem;font-weight:900;color:#2f6df6;margin-bottom:6px}
    .equiv-sub{font-size:1rem;font-weight:700;color:#5a2ed6;margin-bottom:18px}
    .equiv-visual{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .equiv-side{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:140px}
    .equiv-eq{font-size:2rem;font-weight:900;color:#6d3ff0}
    .mini-h{width:34px;height:34px;background:linear-gradient(135deg,#ab97f5,#6236e0);border-radius:6px;border:2px solid #4a25b5}
    .mini-t{width:13px;height:34px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border-radius:4px;border:2px solid #1f54d6}
    .mini-o{width:13px;height:13px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:3px;border:2px solid #e65100}
    .equiv-next{background:linear-gradient(160deg,#5b8cf8,#1746b8);color:#fff;border:none;border-radius:50px;padding:13px 32px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0f2e86}
    .equiv-next:active{transform:translateY(3px)}

    /* ── NUMBER DISPLAY ── */
    .number-display{display:flex;gap:8px;align-items:flex-end;justify-content:center;background:linear-gradient(135deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1}
    .digit-box{display:flex;flex-direction:column;align-items:center;gap:3px}
    .digit-value{font-size:clamp(2rem,8.5vw,3.5rem);font-weight:900;line-height:1;min-width:42px;text-align:center}
    .digit-value.shake{animation:shake .35s ease}
    .digit-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .digit-hundreds{color:#6d3ff0}.digit-tens{color:#2f6df6}.digit-ones{color:#ff6f00}
    .simple-number-card{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(232,240,255,.9));border:2.5px solid #93b7fb;border-radius:20px;padding:12px 22px;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1}
    .simple-number-main{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;color:#5a2ed6;line-height:1}
    .simple-number-sub{font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#2f6df6}
    .simple-number-divider{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:#d7b7df}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

    /* ── TAP-TO-SLOT ── */
    .tap-layout{width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .tap-hint{font-size:.82rem;font-weight:900;color:#6d3ff0;text-align:center;background:rgba(255,255,255,.65);border-radius:50px;padding:5px 16px;border:1.5px solid #ab97f5}

    /* Pool */
    .pool-area{background:rgba(255,255,255,.55);border-radius:18px;padding:12px;border:2px solid #c4d7fd}
    .pool-label{font-size:.75rem;font-weight:900;color:#5a2ed6;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center}
    .pool-blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}

    /* Pool block wrappers */
    .pool-block{cursor:pointer;border-radius:10px;transition:transform .1s;position:relative}
    .pool-block.selected{filter:drop-shadow(0 0 8px #2f6df6) drop-shadow(0 0 4px #fff);transform:scale(1.12) translateY(-3px)}
    .pool-block.empty{opacity:.2;cursor:default;pointer-events:none}

    /* The actual block shapes (pool size) */
    .pb-hundred{width:72px;height:72px;background:linear-gradient(135deg,#ab97f5,#6236e0);border-radius:10px;border:3px solid #4a25b5;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .pb-ten{width:30px;height:72px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border-radius:7px;border:3px solid #1f54d6;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .pb-one{width:38px;height:38px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:9px;border:3px solid #e65100}

    /* Slots */
    .slots-area{display:flex;flex-direction:column;gap:8px}
    .slot-row{background:rgba(255,255,255,.65);border:3px dashed #93b7fb;border-radius:16px;padding:10px 12px;min-height:64px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
    .slot-row.can-accept{border-color:#2f6df6;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(47,109,246,.2)}
    .slot-row.wrong-flash{animation:slotWrong .35s ease}
    @keyframes slotWrong{0%,100%{background:rgba(255,255,255,.65);border-color:#93b7fb}50%{background:#ffcdd2;border-color:#f44336;box-shadow:0 0 0 3px rgba(244,67,54,.3)}}
    .slot-header{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .slot-h-header{color:#5a2ed6}.slot-t-header{color:#1f54d6}.slot-o-header{color:#e65100}
    .slot-blocks{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;min-height:28px}

    /* Mini blocks inside slots (tappable to return) */
    .sb-hundred{width:38px;height:38px;background:linear-gradient(135deg,#ab97f5,#6236e0);border-radius:7px;border:2.5px solid #4a25b5;cursor:pointer;transition:transform .1s;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .sb-hundred:active{transform:scale(.88)}.sb-hundred .ic{background:rgba(255,255,255,.35);border-radius:1px}
    .sb-ten{width:16px;height:38px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border-radius:5px;border:2.5px solid #1f54d6;cursor:pointer;transition:transform .1s}
    .sb-ten:active{transform:scale(.88)}

    /* Direct v4-style place-value picker */
    .direct-progress{background:linear-gradient(135deg,#fff,#ecebff);border:2.5px solid #ab97f5;border-radius:999px;padding:8px 28px;font-size:clamp(1.2rem,4vw,1.9rem);font-weight:900;color:#5a2ed6;box-shadow:0 4px 0 #ab97f5;position:relative;z-index:1;min-width:150px;text-align:center}
    .direct-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
    .direct-section{background:rgba(255,255,255,.62);border:2px solid #c4d7fd;border-radius:18px;padding:12px 12px 14px;box-shadow:0 5px 18px rgba(90,46,214,.08)}
    .direct-label{font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}

    .direct-block.on .pb-hundred{box-shadow:0 0 0 3px #fff,0 0 0 6px #ab97f5}

    .direct-nav-gap{height:34px}

    /* Count the blocks */
    .count-title{background:rgba(255,255,255,.72);border:2px solid #c4d7fd;border-radius:18px;padding:8px 18px;text-align:center;position:relative;z-index:1;box-shadow:0 4px 14px rgba(90,46,214,.08)}
    .count-title-main{font-size:1.05rem;font-weight:900;color:#5a2ed6;text-transform:uppercase;letter-spacing:1px}
    .count-title-sub{font-size:.78rem;font-weight:900;color:#2f6df6;margin-top:2px}
    .count-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .count-section{background:rgba(255,255,255,.62);border:2px solid #c4d7fd;border-radius:18px;padding:12px 12px 14px;box-shadow:0 5px 18px rgba(90,46,214,.08)}
    .count-label{font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
    .count-label.h{color:#5a2ed6}.count-label.t{color:#1f54d6}.count-label.o{color:#e65100}
    .count-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;max-width:470px;margin:0 auto}
    .count-block{cursor:pointer;transition:transform .12s,filter .12s,opacity .12s;position:relative;flex-shrink:0}
    .count-block:active{transform:scale(.92) translateY(3px)}
    .count-block.off{opacity:.85;filter:saturate(.95)}
    .count-block.on{opacity:1;transform:translateY(-3px);filter:drop-shadow(0 4px 8px rgba(90,46,214,.2))}
    .count-block.on .pb-hundred,.count-block.on .pb-ten,.count-block.on .pb-one{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(91,140,248,.8)}

    /* ── WHICH IS BIGGER? (g1) ──
       Two panels with a slot between them, and the answer is a mouth that opens
       towards the bigger side. The blocks in the panels are the SAME .pb-ten and
       .pb-one art the child already counts in What Number?, deliberately: at the
       easy end this game is "compare two of the thing you already know", not a
       new set of pictures to learn. */
    /* stretch, so the two panels are always the same height even when one pile of
       blocks wraps onto an extra row. The blocks are what should say "this side has
       more" — a taller box saying it as well is chrome doing the teaching. */
    .cmp-row{display:flex;align-items:stretch;justify-content:center;gap:clamp(6px,2.5vw,18px);width:100%;max-width:740px;position:relative;z-index:1}
    .cmp-side{flex:1;min-width:0;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.66);border:3px solid #c4d7fd;border-radius:22px;padding:12px 8px;box-shadow:0 5px 18px rgba(90,46,214,.1);transition:transform .2s,border-color .2s,box-shadow .2s}
    /* The winning side lifts and glows. On an equals the class goes on BOTH sides,
       so "the same" is shown as sameness rather than as neither side winning. */
    .cmp-side.chosen{border-color:#2f6df6;box-shadow:0 0 0 4px rgba(47,109,246,.22),0 8px 22px rgba(47,109,246,.25);transform:translateY(-4px)}
    .cmp-blocks{display:flex;flex-wrap:wrap;gap:2px 9px;justify-content:center;align-items:flex-end}
    /* One group per place value. The gap between groups is wider than the gap
       inside one, so hundreds, rods and ones read as three piles to be counted
       rather than one wrapped mass. */
    .cmp-place{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:flex-end}
    /* Two panels of blocks side by side is half the width of one, so the block art is
       scaled down here rather than allowed to wrap into an uncountable pile. */
    .cmp-blocks .pb-hundred{width:40px;height:40px;border-width:2px;border-radius:6px;padding:2px}
    .cmp-blocks .pb-ten{width:21px;height:50px;border-width:2px;border-radius:5px;padding:2px}
    /* display:block is load-bearing, not tidying. .pb-one sets no display of its own,
       and it used to be a direct flex child here, which blockified it. Wrapping it in
       a tappable .count-block made it a plain inline span again, and width/height do
       not apply to those — every block silently collapsed to 4px wide. */
    .cmp-blocks .pb-one{display:block;width:26px;height:26px;border-width:2px;border-radius:6px}
    /* The blocks are a control now, not a picture, so the tap target is padded out
       well past the art. Measured before this: 17px for a rod, which is a decorative
       size — a four-year-old counting ten of them cannot reliably hit it, and a miss
       costs them their place in the count. The padding grows the target without
       moving the art, and the flex gap shrinks by the same amount so the pile is no
       wider than it was. */
    .cmp-blocks .count-block{display:block;padding:4px}
    /* Counting reuses What Number?'s .count-block wholesale, because it IS that
       interaction — tap a block and it marks itself. Two things could not be reused.
       Its ring is drawn OUTSIDE the block: 6px of ring each side of a 23px block, in a
       6px gap, made ten counted blocks merge into one striped mass with no countable
       units left in it — so this ring is inset instead. And its lift is on the wrapper,
       which here would shrink the tap target every time a block was counted, so the
       lift moves the art inside a target that never changes size. */
    .cmp-blocks .count-block.on{transform:none}
    .cmp-blocks .count-block .pb-hundred,.cmp-blocks .count-block .pb-ten,.cmp-blocks .count-block .pb-one{transition:transform .12s,box-shadow .12s}
    .cmp-blocks .count-block.on .pb-hundred,.cmp-blocks .count-block.on .pb-ten,.cmp-blocks .count-block.on .pb-one{box-shadow:inset 0 0 0 3px rgba(255,255,255,.96);transform:translateY(-4px) scale(.9)}
    .cmp-blocks .count-block.still{cursor:default}
    .cmp-blocks .count-block.still:active{transform:none}
    .cmp-num{font-size:clamp(1.9rem,9vw,3.4rem);font-weight:900;color:#5a2ed6;line-height:1}
    .cmp-num.small{font-size:clamp(1.1rem,4.5vw,1.6rem);color:#1f54d6}
    /* The empty slot is the same dashed box as the carry box in Carry Add: in this
       app a dashed outline always means "you put something here". */
    .cmp-slot{flex:0 0 auto;align-self:center;width:clamp(58px,17vw,86px);height:clamp(58px,17vw,86px);display:flex;align-items:center;justify-content:center;border-radius:20px;border:3px dashed #93b7fb;background:rgba(255,255,255,.55);color:#2f6df6}
    .cmp-slot.filled{border-style:solid;border-color:#2f6df6;background:linear-gradient(160deg,#fff,#e8f0ff);box-shadow:0 4px 0 #93b7fb}
    .cmp-slot-q{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:900;color:#93b7fb}
    .cmp-mouth-svg{width:78%;height:78%;display:block;overflow:visible}
    /* The chomp. Squashing the whole <svg> closes the jaws and reopens them, which
       is the one way to animate this that needs nothing from SVG transform-origin —
       the app still supports Safari 14, where transform-box is not reliable. */
    .cmp-slot.biting .cmp-mouth-svg{animation:cmpBite .5s ease-in-out}
    .cmp-slot.biting.same .cmp-mouth-svg{animation:cmpNod .5s ease-in-out}
    @keyframes cmpBite{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.28)}70%{transform:scaleY(1.08)}}
    @keyframes cmpNod{0%,100%{transform:translateY(0)}40%{transform:translateY(5px) scaleY(.9)}}
    .cmp-keys{display:flex;gap:clamp(8px,3vw,16px);justify-content:center;position:relative;z-index:1}
    .cmp-key{width:clamp(78px,23vw,104px);height:clamp(78px,23vw,104px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px 5px;border-radius:24px;border:3px solid #93b7fb;background:linear-gradient(160deg,#fff,#e8f0ff);color:#2f6df6;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #93b7fb;transition:transform .1s}
    .cmp-key:active{transform:translateY(4px);box-shadow:0 1px 0 #93b7fb}
    .cmp-key .cmp-mouth-svg{width:clamp(40px,12vw,54px);height:clamp(30px,9vw,40px)}
    /* The real notation, printed under the picture. The mouth is how a pre-reader
       gets in; this is the thing they are actually learning to read, so it is on
       screen from the first tap rather than introduced later. */
    .cmp-key-glyph{font-size:.95rem;font-weight:900;color:#5a2ed6;line-height:1}
    .cmp-key.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .cmp-key.hint-glow{animation:hintGlow 1.1s ease-in-out infinite}
    @media (max-width:430px){
      .cmp-side{min-height:100px;padding:10px 4px}
      .cmp-blocks{gap:0 6px}
    }
    /* A phone is not the target device — the owner's children play on 9.7 inches and up
       (2026-08-18) — but the hundreds rung must not be broken there, and it was:
       measured at 375px, nine flats, nine rods and nine ones pushed the three answer
       keys to 917px down an 812px screen, so the child could not reach the answer
       without scrolling. The art shrinks; the question does not change, because a
       game that asks something different depending on the device is a worse thing
       than small blocks. The tap target keeps padding of its own at every size. */
    @media (max-width:600px){
      .cmp-blocks .pb-hundred{width:24px;height:24px;border-width:1.5px;border-radius:4px;padding:1px}
      .cmp-blocks .pb-ten{width:13px;height:31px;border-width:1.5px;border-radius:4px;padding:1px}
      .cmp-blocks .pb-one{width:16px;height:16px;border-width:1.5px;border-radius:4px}
      .cmp-blocks .count-block{padding:3px}
    }
    /* The two panels were capped at 740px on every screen, so a 9.7-inch iPad drew the
       phone layout with margins either side and the extra width was thrown away. The
       owner's children play on 9.7 inches and up (2026-08-18), and the hundreds rung
       wants that room: at 740px a side holds five flats to a line, at 1000px it holds
       eight, which is one line for almost every pile. */
    @media (min-width:768px){
      .cmp-row{max-width:min(96vw,1000px)}
    }

    /* ── WHAT'S MISSING? (b3) ──
       Two sides of blocks with an equals between them, and one pile on one side is
       hidden. Each side is ONE grid, ten cells wide, and the ten is doing work: every
       row is a ten-frame, so on the first rung the answer blocks are seen finishing a
       row the given blocks left part-built. The columns of the two sides line up as a
       consequence, which is what turns "the same amount" into "the same shape".
       Every cell is the same size and worth one. Rods cannot appear in this game: two
       rods and three ones is wider than three rods, so equal amounts would have unequal
       footprints and the balance would stop being readable. */
    .ms-screen .count-title-main{text-transform:none}
    /* One knob for the art. --ms-base is the width tier, --ms-scale the row-count tier
       set in JS (see `density` in MissingGame): a pile many rows deep has to keep the
       Next button on screen, because .screen does not scroll. */
    .ms-row{display:flex;align-items:flex-start;justify-content:center;gap:clamp(5px,2vw,14px);width:100%;position:relative;z-index:1;--ms-base:20px;--ms-gap:3px;--ms-scale:1;--ms-cell:calc(var(--ms-base)*var(--ms-scale))}
    .ms-row.tight{--ms-scale:.8}
    .ms-row.dense{--ms-scale:.62}
    .ms-side{display:flex;flex-direction:column;align-items:center;gap:7px;background:rgba(255,255,255,.66);border:3px solid #c4d7fd;border-radius:20px;padding:11px 9px;box-shadow:0 5px 18px rgba(90,46,214,.1);transition:border-color .2s,box-shadow .2s}
    /* Both sides light up, never one: the statement being made is that they are equal. */
    .ms-side.balanced{border-color:#00a05a;box-shadow:0 0 0 4px rgba(0,160,90,.2),0 8px 22px rgba(0,160,90,.25)}
    .ms-grid{display:grid;grid-template-columns:repeat(10,var(--ms-cell));gap:calc(var(--ms-gap) + 1px) var(--ms-gap);justify-content:center}
    .ms-cell{width:var(--ms-cell);height:var(--ms-cell);border-radius:5px;box-sizing:border-box;cursor:pointer;transition:box-shadow .12s,transform .12s}
    /* A given amount, and BOTH sides draw it the same. Equal amounts have to look
       equal, so nothing distinguishes "what we have" from "what we want" except which
       side of the equals it stands on. It is the same yellow as the ones blocks the
       child already counts in What Number?. */
    .ms-cell.have{background:linear-gradient(135deg,#ffd54f,#f9a825);border:2px solid #e65100}
    /* The pile that went away, on the "? − 8 = 23" rung. It still counts towards the
       amount being built — what we started with is what went away plus what stayed,
       which is that rung's whole idea — so it is a solid block that is marked, not a
       gap where a block used to be. */
    .ms-cell.gone{background:linear-gradient(135deg,#ffe0b2,#ffb74d);border:2px dashed #bf360c;position:relative;opacity:.9}
    .ms-cell.gone::after{content:'';position:absolute;left:12%;right:12%;top:48%;height:2px;border-radius:2px;background:rgba(191,54,12,.8);transform:rotate(-32deg)}
    /* What the child added: the answer. A colour belonging to neither given pile, so
       the amount that was missing can be seen afterwards as a group. */
    .ms-cell.add{background:linear-gradient(135deg,#69f0ae,#00a05a);border:2px solid #00713f}
    /* Empty. Hollow and dashed so it reads as "nothing here yet" rather than as a pale
       block — the child is comparing the solids on one side with the solids on the
       other, and a socket that looked like a block would break that. */
    .ms-cell.socket{background:rgba(255,255,255,.32);border:2px dashed #93b7fb}
    .ms-cell:active{transform:scale(.88)}
    .ms-cell.still{cursor:default}
    .ms-cell.still:active{transform:none}
    /* Counted. The ring is drawn INSIDE the block, which is the lesson Which is Bigger?
       already paid for: at this size a ring outside merges neighbouring blocks into one
       striped mass with no countable units left in it. */
    .ms-cell.on{box-shadow:inset 0 0 0 3px rgba(255,255,255,.96);transform:translateY(-2px) scale(.88)}
    .ms-side-num{font-size:clamp(1.1rem,4.5vw,1.7rem);font-weight:900;color:#1f54d6;line-height:1}
    .ms-eq-sign{flex:0 0 auto;align-self:center;font-size:clamp(1.5rem,6vw,2.6rem);font-weight:900;color:#93b7fb;transition:color .2s,transform .2s}
    .ms-eq-sign.balanced{color:#00a05a;transform:scale(1.3)}
    /* The notation, above the picture. The box is the same dashed outline as Carry
       Add's carry box and Which is Bigger?'s empty slot: a dashed edge in this app
       always means "you put something here". */
    .ms-eq{display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.72);border:2px solid #c4d7fd;border-radius:18px;padding:7px 16px;position:relative;z-index:1;box-shadow:0 4px 14px rgba(90,46,214,.08)}
    .ms-eq-num{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:900;color:#5a2ed6;line-height:1}
    .ms-eq-op{font-size:clamp(1.1rem,4vw,1.6rem);font-weight:900;color:#2f6df6;line-height:1}
    .ms-eq-box{min-width:clamp(36px,9vw,50px);text-align:center;font-size:clamp(1.3rem,5vw,1.9rem);font-weight:900;line-height:1;padding:3px 7px;border-radius:12px;border:3px dashed #93b7fb;background:rgba(255,255,255,.55);color:#93b7fb}
    .ms-eq-box.filled{color:#00a05a;border-color:#00a05a}
    .ms-eq-box.won{border-style:solid;background:linear-gradient(160deg,#fff,#e6faf0);box-shadow:0 3px 0 #00a05a}
    /* Ten cells twice over, plus the equals, has to fit the width — and a phone is not
       the target device (the owner's children play on 9.7 inches and up, 2026-08-18) but
       must not be broken either. Measured: two grids at the tier below plus the sign
       need 440px, so 375px gets its own tier rather than a horizontal scrollbar. The art
       shrinks; the question is the same one. */
    @media (max-width:599px){
      .ms-row{--ms-base:15px;--ms-gap:2px}
      .ms-cell{border-radius:3px}
      .ms-cell.have,.ms-cell.gone,.ms-cell.add,.ms-cell.socket{border-width:1.5px}
      .ms-cell.on{box-shadow:inset 0 0 0 2px rgba(255,255,255,.96)}
      .ms-side{padding:8px 5px;border-width:2px;border-radius:16px}
    }
    @media (max-width:430px){
      .ms-row{--ms-base:13px;--ms-gap:1px}
    }
    /* The design floor is a 9.7-inch iPad, so the biggest tier is the normal one rather
       than a bonus: 26px cells make a row of ten a hand's width, which is the size a
       four-year-old actually counts at. */
    @media (min-width:768px){
      .ms-row{--ms-base:26px;--ms-gap:4px}
    }

    /* Column Add */
    .column-card{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(232,240,255,.9));border:3px solid #93b7fb;border-radius:22px;padding:18px 22px 20px;box-shadow:0 5px 0 #93b7fb,0 10px 24px rgba(91,140,248,.16);position:relative;z-index:1;min-width:min(92vw,360px)}
    .column-grid{display:grid;grid-template-columns:34px repeat(var(--col-count,3),54px);gap:7px;align-items:center;justify-content:center;font-family:'Nunito',system-ui,sans-serif}
    .column-digit,.column-plus,.column-answer-box{height:54px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,8vw,3rem);font-weight:900;line-height:1}
    .column-digit{color:#5a2ed6}
    .column-plus{color:#2f6df6}
    .column-blank{height:54px}
    .column-line{grid-column:1 / -1;height:4px;background:#6d3ff0;border-radius:99px;margin:3px 0}
    .column-final-line{grid-column:1 / -1;height:8px;border-top:4px solid #2f6df6;border-bottom:4px solid #2f6df6;border-radius:99px;margin-top:5px}
    .column-answer-box{background:#fff;border:3px solid #ab97f5;border-radius:14px;color:#2f6df6;box-shadow:0 3px 0 #ab97f5;min-width:54px}
    .column-answer-box.active{border-color:#2f6df6;box-shadow:0 0 0 4px rgba(47,109,246,.16),0 3px 0 #1746b8}
    .column-answer-box.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .keypad{display:grid;grid-template-columns:repeat(5,62px);gap:10px;justify-content:center;position:relative;z-index:1}
    .key-btn{height:58px;border:none;border-radius:17px;background:linear-gradient(160deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;color:#5a2ed6;font-family:inherit;font-size:1.55rem;font-weight:900;box-shadow:0 4px 0 #93b7fb;cursor:pointer}
    .key-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #93b7fb}
    .key-btn.clear{color:#2f6df6;grid-column:span 2;display:flex;align-items:center;justify-content:center}
    .key-btn.clear .btn-svg{width:26px;height:26px}
    .column-celebrate{background:rgba(255,255,255,.9);border:2.5px solid #93b7fb;border-radius:999px;padding:8px 18px;color:#2f6df6;font-size:clamp(1.05rem,4vw,1.55rem);font-weight:900;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1}

    /* ── COLUMN MATHS (modes c2, c3, c4) ──
       Mode c1 above shares the .column-* classes and must come out of this change
       pixel-identical, so nothing below edits a rule c1 reads — hence .cm-top rather
       than adding position:relative to .column-digit, and .cm-mark rather than reusing
       anything.

       The mark is ONE widget with one meaning: "the one that arrived into this column",
       from the right when adding and from the left when taking away. It holds a 1 or a
       typed 0 and nothing else, which is why "there was no carry" needed no new button
       and no new word. */
    .cm-mark-gap{height:30px}
    .cm-mark{justify-self:center;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px dashed #ab97f5;border-radius:9px;color:#e65100;font-size:1.1rem;font-weight:900;line-height:1}
    .cm-mark.active{border-style:solid;border-color:#2f6df6;box-shadow:0 0 0 4px rgba(47,109,246,.16);animation:cmPulse 1.1s ease-in-out infinite}
    .cm-mark.wrong{animation:wrongShake .35s ease;border-color:#f44336}  /* must stay AFTER .active */
    .cm-mark.nudge{animation:cmNudge .3s ease}      /* a dimmed key: not a mistake, so not a shake */
    .cm-zero{opacity:.45}                            /* "nothing arrived" is quieter than a 1 */
    .cm-bad{color:#f44336}                           /* the digit just refused, shown then withdrawn */
    @keyframes cmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
    @keyframes cmNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

    /* Borrowing: the digit next door is crossed out and its new value written at its
       LEFT shoulder — the far side from the little box that has just been filled in, so
       the two small numerals are a whole cell apart and cannot be read as one two-digit
       number. The strike is thin and the struck digit stays dark enough to read,
       because "the 3 became a 2" is meaningless once the 3 has been destroyed. */
    .cm-top{position:relative}
    .cm-top.struck{color:#7b88a8}
    .cm-top.struck::after{content:'';position:absolute;left:14%;right:14%;top:50%;height:3px;border-radius:2px;background:rgba(244,81,30,.85);transform:rotate(-13deg)}
    .cm-new{position:absolute;top:1px;left:2px;font-size:.4em;color:#f4511e;font-weight:900;line-height:1;animation:cmPopIn .3s ease}
    @keyframes cmPopIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
    .cm-minus{color:#c62828}

    /* While a little box is live, 2-9 cannot be right. Dimming teaches the rule and
       leaks nothing — the box is 0-or-1 whatever the problem is. The keys stay tappable
       so nothing looks broken; a tap nudges the box and says the rule, and is NOT
       counted as a wrong answer. Punishing a tap on a control the app has already
       greyed out teaches a four-year-old only that the app is angry. */
    .key-btn.dim{opacity:.38}

    /* Four columns is a width c1 never renders — its widest no-carry sum is three — and
       the fixed 34px + 4x54px + 4x7px = 278px does not fit inside .column-card below a
       357px viewport: the card grows past the phone and .screen{overflow:hidden} clips
       the outer digits rather than scrolling them. Measured at 320px: card 328px on a
       320px screen. Fluid tracks instead, floored where a fingertip and a four-year-
       old's eye can both still use them (196px total at 320, 230px at 375, 278px at
       tablet width). */
    .cm-grid.cm-4{grid-template-columns:clamp(22px,8vw,34px) repeat(4,clamp(38px,12vw,54px));gap:clamp(4px,1.3vw,7px)}
    .cm-grid.cm-4 .column-answer-box{min-width:0}
    .cm-grid.cm-4 .cm-mark{width:clamp(22px,7vw,30px);height:clamp(22px,7vw,30px);font-size:clamp(.85rem,3.4vw,1.1rem)}

    /* Height budget, same idiom as .cb-ladder's clamp: spend the viewport, do not guess.
       Measured at 375x667 (iPhone SE/8, the smallest device in the house): c1's page is
       already 680px tall, and the mark row adds another 39, which puts the undo key
       28px below the fold and forces a child to scroll mid-problem. With these six
       rules the page comes back to exactly 667 with the keypad ending at 633. Scoped to
       .cm-screen, so c1 keeps its current metrics. */
    @media (max-height:740px){
      .cm-screen .column-card{padding:10px 18px 12px}
      .cm-screen .count-title{padding:5px 14px}
      .cm-grid{gap:5px}
      .cm-grid .column-digit,.cm-grid .column-plus,.cm-grid .column-answer-box,.cm-grid .column-blank{height:46px;font-size:clamp(1.5rem,7vw,2.4rem)}
      .cm-grid .cm-mark-gap{height:26px}
      .cm-grid .cm-mark{width:26px;height:26px;font-size:.95rem}
    }

    /* Multiplication */
    .multiply-card{display:flex;flex-direction:column;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(232,240,255,.9));border:3px solid #93b7fb;border-radius:24px;padding:20px 24px;box-shadow:0 5px 0 #93b7fb,0 10px 24px rgba(91,140,248,.16);position:relative;z-index:1;min-width:min(92vw,430px)}
    .multiply-problem{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:#5a2ed6;font-size:clamp(2.1rem,9vw,4.1rem);font-weight:900;line-height:1}
    .times-symbol,.equals-symbol{color:#2f6df6}
    .multiply-answer-row{display:flex;align-items:center;justify-content:center;gap:8px}
    .multiply-answer-box{width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #ab97f5;border-radius:15px;color:#2f6df6;font-size:clamp(1.8rem,8vw,3rem);font-weight:900;box-shadow:0 3px 0 #ab97f5}
    .multiply-answer-box.active{border-color:#2f6df6;box-shadow:0 0 0 4px rgba(47,109,246,.16),0 3px 0 #1746b8}
    .multiply-answer-box.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .multiply-celebrate{background:rgba(255,255,255,.9);border:2.5px solid #93b7fb;border-radius:999px;padding:8px 18px;color:#2f6df6;font-size:clamp(1.05rem,4vw,1.55rem);font-weight:900;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1}
    .times-picker-label{font-size:.82rem;font-weight:900;color:#6d3ff0;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;text-align:center}

    /* ── PICK YOUR NUMBER ──
       The child chooses the difficulty, so the choice is the biggest thing on screen:
       one tap on a number IS the setting, no confirm step and no grown-up gesture.
       Tiles are 60px so a 4-year-old's fingertip cannot miss between them. */
    .pick-box{max-width:440px}
    .pick-question{font-size:clamp(1.25rem,5.5vw,1.7rem);font-weight:900;color:#5a2ed6;text-align:center;line-height:1.15}
    .pick-question span{color:#2f6df6}
    .pick-hint{font-size:.9rem;font-weight:900;color:#6d3ff0;opacity:.75;text-align:center;margin-top:3px}
    .pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
    .pick-btn{height:60px;border-radius:18px;border:3px solid #93b7fb;background:linear-gradient(160deg,#fff,#e8f0ff);color:#5a2ed6;font-family:inherit;font-size:1.6rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #93b7fb;transition:transform .1s}
    .pick-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #93b7fb}
    .pick-btn.active{background:linear-gradient(135deg,#93b7fb,#2f6df6);border-color:#2f6df6;color:#fff;box-shadow:0 4px 0 #1746b8}
    @media (max-width:430px){.pick-grid{grid-template-columns:repeat(4,1fr)}}
    /* The difficulty pill in the top bar is the way back to the picker, so it has to
       look pressable — it is a wider target than the gear beside it. */
    .level-chip{display:flex;align-items:center;gap:5px;font-family:inherit;font-size:.85rem;font-weight:900;color:#2f6df6;background:linear-gradient(160deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:50px;padding:6px 13px;cursor:pointer;box-shadow:0 3px 0 #93b7fb;white-space:nowrap}
    .level-chip:active{transform:translateY(2px);box-shadow:0 1px 0 #93b7fb}
    .level-chip-caret{font-size:.7rem;opacity:.8}
    .level-chip.static{background:rgba(255,255,255,.65);border-color:transparent;box-shadow:none;color:#6d3ff0;cursor:default}

    /* ── COUNT BY: the same numbers read two ways at once ──
       Top strip = the skip-counting chant (12, 24, 36, ?).
       Ladder below = the very same numbers written as the times table.
       The child types into the ladder, so filling in the table IS counting on. */
    /* max-width, not just min-width: the chant strip is one long flex row, and a row of
       20 chips reports that whole length as the card's intrinsic width — which dragged the
       card wider than the phone and clipped both ends of every rung. Pinning both bounds
       fixes the card to the screen and lets .cb-chain scroll inside it, which is what its
       overflow-x was always for. */
    .countby-card{gap:10px;padding:15px 16px 17px;min-width:min(92vw,470px);max-width:min(92vw,470px)}
    .cb-chain{display:flex;align-items:center;gap:6px;width:100%;min-width:0;overflow-x:auto;padding:2px 2px 7px;scrollbar-width:none}
    .cb-chain::-webkit-scrollbar{display:none}
    .cb-chip{flex:0 0 auto;min-width:46px;padding:6px 11px;border-radius:999px;background:linear-gradient(160deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;color:#2f6df6;font-size:1.05rem;font-weight:900;text-align:center;box-shadow:0 3px 0 #93b7fb}
    .cb-chip.next{border-style:dashed;border-color:#2f6df6;color:#5a2ed6;animation:cbPulse 1.2s ease-in-out infinite}
    .cb-arrow{flex:0 0 auto;color:#5a2ed6;font-weight:900;opacity:.5}
    /* Height is budgeted against the viewport, not guessed: everything else on this
       screen (bars, title, chain, keypad) plus the corner mascot's fixed footprint
       costs ~620px, and the keypad must stay clear of the mascot on a phone. */
    .cb-ladder{display:flex;flex-direction:column;gap:6px;width:100%;max-height:clamp(140px,calc(100vh - 620px),290px);overflow-y:auto;padding:2px}
    .cb-rung{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:5px 12px;border-radius:14px;border:2.5px solid #c4d7fd;background:#fff;overflow:hidden}
    .cb-rung::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--fill,0%);background:linear-gradient(90deg,rgba(147,183,251,.5),rgba(47,109,246,.2));transition:width .35s ease}
    .cb-rung>*{position:relative;z-index:1}
    .cb-fact{font-size:1rem;font-weight:900;color:#5a2ed6;white-space:nowrap}
    .cb-fact b{color:#2f6df6;font-size:1.2rem}
    .cb-val{font-size:1.4rem;font-weight:900;color:#2f6df6;min-width:62px;text-align:right}
    .cb-rung.todo{opacity:.42;border-style:dashed}
    .cb-rung.todo .cb-val{color:#93b7fb}
    .cb-rung.active{border-color:#2f6df6;box-shadow:0 0 0 4px rgba(47,109,246,.16)}
    .cb-rung.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .cb-rung.fresh{animation:correctPop .5s ease}
    .cb-answer{display:flex;gap:5px}
    .cb-box{width:34px;height:40px;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid #ab97f5;border-radius:11px;color:#2f6df6;font-size:1.3rem;font-weight:900;box-shadow:0 2px 0 #ab97f5}
    .cb-box.active{border-color:#2f6df6;box-shadow:0 0 0 3px rgba(47,109,246,.18),0 2px 0 #1746b8}
    @keyframes cbPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.09);opacity:.72}}


    .gp-cellx{width:11px;height:11px;border-radius:2px;border:1.5px solid #93b7fb;background:#fff}
    .gp-cellx.on{background:linear-gradient(135deg,#93b7fb,#2f6df6);border-color:#2f6df6}

    .gp-gap{width:7px}
    .gp-speak{font-size:.95rem;line-height:1}
    /* ── READ BIG NUMBERS (r1) ── */
    .rb-card{gap:10px;padding:14px 16px 16px;min-width:min(94vw,700px);max-width:min(94vw,700px)}
    .rb-robot{width:104px;flex:0 0 auto}
    .rb-robot svg{width:100%;height:auto;overflow:visible}
    .rb-ant{stroke:#93b7fb;stroke-width:4;stroke-linecap:round}
    .rb-bulb{fill:#e8f0ff}
    .rb-head,.rb-base{fill:#fff;stroke:#93b7fb;stroke-width:3.5}
    .rb-eye{fill:#2f6df6}
    .rb-mouth{fill:#5a2ed6;transform-origin:60px 66px}
    /* Talking is a mouth that moves and a lamp that answers it. Both are cheap, and
       together they say "this one is speaking" without a word of explanation. */
    .rb-robot.talking .rb-mouth{animation:rbTalk .34s ease-in-out infinite}
    .rb-robot.talking .rb-bulb{animation:rbBlink .34s ease-in-out infinite}
    .rb-robot.talking .rb-eye{animation:rbLook 1.6s ease-in-out infinite}
    @keyframes rbTalk{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1.5)}}
    @keyframes rbBlink{0%,100%{fill:#e8f0ff}50%{fill:#2f6df6}}
    @keyframes rbLook{0%,100%{opacity:1}45%{opacity:.55}}

    /* The gaps between groups ARE the lesson -- they are where the child sees thousands
       part from hundreds -- so the grouping is drawn in space, not with a comma glyph
       a pre-reader cannot decode. */
    .rb-number{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:nowrap;width:100%;min-height:74px}
    .rb-group{display:flex;flex-direction:column;align-items:center;gap:3px}
    .rb-scale{font-size:.6rem;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#2f6df6;opacity:.65}
    .rb-digits{display:flex;gap:4px}
    .rb-slot{width:var(--box);height:calc(var(--box) * 1.18);display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid #c4d7fd;border-radius:11px;color:#2f6df6;font-size:calc(var(--box) * .62);font-weight:900;box-shadow:0 2px 0 #c4d7fd}
    .rb-slot.next{border-style:dashed;border-color:#2f6df6;animation:cbPulse 1.2s ease-in-out infinite}
    .rb-read{background:linear-gradient(135deg,#93b7fb,#2f6df6);color:#fff;border:none;border-radius:50px;padding:11px 38px;font-family:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #5a2ed6}
    .rb-read:active{transform:translateY(3px);box-shadow:0 1px 0 #5a2ed6}
    .rb-read.off{opacity:.4;box-shadow:0 4px 0 #c4d7fd;cursor:default}
    .rb-pad{margin-top:2px}
    .rb-titlerow{display:flex;align-items:center;justify-content:center;gap:12px;position:relative;z-index:1}
    .rb-restart{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff,#ecebff);border:2.5px solid #ab97f5;border-radius:50px;padding:10px 16px;font-family:inherit;font-size:1rem;font-weight:900;color:#5a2ed6;cursor:pointer;box-shadow:0 4px 0 #ab97f5;transition:transform .1s;line-height:1}
    .rb-restart:active{transform:translateY(3px);box-shadow:0 1px 0 #ab97f5}
    .rb-restart.off{opacity:.35;box-shadow:0 4px 0 #d6cdf7;cursor:default}
    .rb-restart .btn-svg{width:23px;height:23px}
    .rb-pad .key-btn.clear{grid-column:2/span 3}

    /* ── TIMES TABLE CHART (m2): the whole field at once, one cell explained ──
       A chart, not a quiz. Every product is printed, because the patterns a child
       actually learns from a times table -- the square numbers running down the
       diagonal, the 5s column ending in 0 and 5 -- exist only when the whole field is
       visible. Tapping does not test anything; it explains one cell.
       Sized so 15 x 15 plus its two header strips fits a 9.7" iPad without scrolling:
       16 tracks in a 760px card is ~45px a cell. */
    .tc-card{gap:8px;padding:12px;min-width:min(96vw,760px);max-width:min(96vw,760px)}
    .tc-grid{display:grid;grid-template-columns:repeat(calc(var(--n) + 1),1fr);gap:2px;width:100%}
    .tc-corner{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:1rem;font-weight:900;color:#2f6df6;opacity:.55}
    .tc-head{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:6px;background:linear-gradient(160deg,#fff,#e8f0ff);border:1.5px solid #93b7fb;color:#2f6df6;font-weight:900;font-size:clamp(.6rem,1.55vw,1rem)}
    /* The lit header strips are how a four-year-old keeps their place: the row and the
       column leading to the tapped cell stay marked while the panel is open. */
    .tc-head.lit{background:linear-gradient(135deg,#93b7fb,#2f6df6);color:#fff}
    .tc-cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:6px;border:1.5px solid #c4d7fd;background:#fff;color:#5a2ed6;font-family:inherit;font-weight:900;font-size:clamp(.5rem,1.35vw,.9rem);cursor:pointer;padding:0;line-height:1}
    .tc-cell.lead{background:#e8f0ff}
    .tc-cell.sel{background:linear-gradient(135deg,#93b7fb,#2f6df6);color:#fff;box-shadow:0 0 0 3px rgba(47,109,246,.22);position:relative;z-index:1}
    .tc-cell:active{transform:scale(.92)}

    /* A group is a button now. Uncounted ones breathe, which is how a child finds out
       they are tappable without anyone reading them an instruction. */
    .tc-group{position:relative;cursor:pointer;font-family:inherit;animation:tcBreathe 2.2s ease-in-out infinite}
    .tc-group.counted{animation:none;border-style:solid;background:linear-gradient(160deg,#fff,#e8f0ff);box-shadow:0 3px 0 #93b7fb}
    .tc-group .tc-sq{background:#c4d7fd}
    .tc-group.counted .tc-sq{background:linear-gradient(160deg,#2f6df6,#5a2ed6)}
    /* The running total sits ON the group that reached it, so the child can read the
       count back along the row afterwards -- 7, 14, 21 stays on screen. */
    .tc-tally{position:absolute;top:-9px;right:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:linear-gradient(135deg,#93b7fb,#2f6df6);color:#fff;font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(20,30,90,.3)}
    .tc-done.lit{animation:hintGlow 1.1s ease-in-out infinite}
    @keyframes tcBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

    /* The panel covers the lower grid rather than shrinking it. The chart is the home
       surface of this screen and is never rebuilt underneath the child -- the same
       reason What's Missing? sizes its blocks off the side that cannot change. */
    .tc-panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid #93b7fb;border-radius:26px 26px 0 0;padding:14px 16px 20px;box-shadow:0 -12px 34px rgba(20,30,90,.28);z-index:6;max-height:54vh;overflow-y:auto;animation:tcUp .24s ease}
    @keyframes tcUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .tc-fact{font-size:1.5rem;font-weight:900;color:#5a2ed6;text-align:center;line-height:1.1}
    .tc-fact b{color:#2f6df6}
    .tc-sub{font-size:1rem;font-weight:900;color:#2f6df6;text-align:center;margin-top:3px;opacity:.85}
    .tc-groups{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:12px}
    .tc-group{display:grid;grid-template-columns:repeat(var(--cols),var(--sq));gap:3px;padding:5px;border:2px dashed #93b7fb;border-radius:10px;background:#e8f0ff}
    .tc-sq{width:var(--sq);height:var(--sq);border-radius:3px;background:linear-gradient(160deg,#2f6df6,#5a2ed6);animation:correctPop .35s ease}
    .tc-done{display:block;margin:14px auto 0;background:linear-gradient(135deg,#93b7fb,#2f6df6);color:#fff;border:none;border-radius:50px;padding:11px 40px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #5a2ed6}
    .tc-done:active{transform:translateY(3px);box-shadow:0 1px 0 #5a2ed6}
    /* ── READ FRACTIONS (f1): the wall ──
       Sized so the whole wall is on screen at once on a 9.7" iPad without scrolling,
       because a wall you scroll is not a wall. Twelfths land at roughly 40px a piece,
       under the usual tap minimum -- which is safe here and nowhere else: the pieces
       touch, and ANY piece is the right piece, so a tap that lands between two of them
       still takes one. */
    .fw-card{gap:6px;padding:14px 16px;min-width:min(96vw,760px);max-width:min(96vw,760px)}
    .fw-wall{display:flex;flex-direction:column;gap:7px;width:100%}
    .fw-row{display:grid;grid-template-columns:76px 1fr 88px;align-items:center;gap:9px}
    .fw-name{font-size:.68rem;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#2f6df6;opacity:.65;text-align:right}
    .fw-row.full .fw-name{opacity:1;color:#5a2ed6}
    .fw-bar{display:grid;grid-template-columns:repeat(var(--d),1fr);gap:3px;height:40px}
    .fw-piece{border:2px solid #93b7fb;border-radius:7px;background:#e8f0ff;cursor:pointer;padding:0;font-family:inherit}
    .fw-piece:active{transform:scale(.94)}
    .fw-piece.on{background:linear-gradient(160deg,#2f6df6,#5a2ed6);border-color:#5a2ed6;animation:correctPop .3s ease}
    .fw-read{display:flex;align-items:center;gap:6px;font-weight:900}
    .fw-frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
    /* The numerator wears the colour of a TAKEN piece and the denominator the colour of an
       EMPTY one. That is the whole explanation of which number means what, and it needs no
       words -- which matters on a screen aimed at a child who cannot read a caption. */
    .fw-top{font-size:1.05rem;color:#2f6df6}
    .fw-rule{width:19px;height:2px;background:#93b7fb;margin:2px 0;border-radius:2px}
    .fw-bot{font-size:1.05rem;color:#93b7fb}
    .fw-one{font-size:1.2rem;color:#2f6df6}
    .fw-eq{font-size:.92rem;color:#5a2ed6}
    .gp-piece{width:13px;height:16px;border-radius:3px;border:1.5px solid #93b7fb;background:#e8f0ff}
    .gp-piece.on{background:linear-gradient(160deg,#2f6df6,#5a2ed6);border-color:#5a2ed6}

    /* ── SCORE ROW: SPACE JOURNEY TRACK ── */
    .score-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:740px;gap:10px;position:relative;z-index:1}
    .score-badge{background:linear-gradient(135deg,#fff,#e8f0ff);border:2px solid #93b7fb;border-radius:50px;padding:5px 14px;font-size:.95rem;font-weight:900;color:#2f6df6;box-shadow:0 3px 8px rgba(91,140,248,.2);white-space:nowrap;display:flex;align-items:center;gap:4px}
    .score-badge span{color:#5a2ed6}
    .score-badge img{width:20px;height:20px;object-fit:contain}
    .journey-track{display:flex;align-items:center;gap:5px;padding:6px 10px;background:rgba(255,255,255,.88);border:2px solid #c4d7fd;border-radius:18px;box-shadow:0 3px 10px rgba(91,140,248,.12);flex:1;max-width:360px;min-width:0}
    .journey-node{width:36px;height:36px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 3px rgba(20,30,90,.25))}
    .journey-node.to{animation:destPulse 1.5s ease-in-out infinite alternate}
    @keyframes destPulse{from{transform:scale(1)}to{transform:scale(1.14)}}
    .journey-dots{flex:1;display:flex;align-items:center;justify-content:space-between;min-width:0;padding:0 2px}
    .journey-dot{width:9px;height:9px;border-radius:50%;background:#d3ddf5;flex-shrink:0}
    .journey-star{width:16px;height:16px;object-fit:contain;flex-shrink:0;animation:starPop .35s cubic-bezier(.34,1.56,.64,1)}
    .journey-rocket{width:30px;height:30px;object-fit:contain;transform:rotate(42deg);flex-shrink:0;animation:rocketPop .45s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 4px rgba(20,30,90,.3))}
    @keyframes starPop{from{transform:scale(0) rotate(-12deg)}to{transform:scale(1) rotate(0)}}
    @keyframes rocketPop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(42deg)}}
    @media (max-width:430px){
      .score-row{gap:6px}
      .score-badge{padding:5px 10px}
      .journey-track{gap:3px;padding:5px 7px}
      .journey-node{width:30px;height:30px}
      .journey-rocket{width:26px;height:26px}
      .journey-star{width:13px;height:13px}
      .journey-dot{width:7px;height:7px}
    }

    /* ── BUTTONS ── */
    .check-btn{background:linear-gradient(160deg,#8f6cee,#4a25b5);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #371a92;transition:transform .1s;position:relative;z-index:1}
    .check-btn:active{transform:translateY(4px)}
    .new-num-btn{background:linear-gradient(160deg,#93b7fb,#1f54d6);color:#fff;border:none;border-radius:50px;padding:12px 26px;font-family:inherit;font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0f2e86;transition:transform .1s;position:relative;z-index:1}
    .new-num-btn:active{transform:translateY(4px)}
    .next-btn{background:linear-gradient(160deg,#5b8cf8,#1746b8);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0f2e86;transition:transform .1s;position:relative;z-index:1}
    .next-btn:active{transform:translateY(4px)}

    /* ── NUMBER LINE ── */
    .prompt-bubble{background:linear-gradient(135deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 #93b7fb;font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#333;text-align:center;position:relative;z-index:1}
    .target-num{display:inline-block;color:#2f6df6;font-size:1.3em;animation:pulse 1s infinite alternate}
    .start-num{display:inline-block;color:#5a2ed6;font-size:1.15em}
    .op-add{display:inline-block;color:#2e7d32;font-size:1.15em}
    .op-sub{display:inline-block;color:#c62828;font-size:1.15em}
    .eq-mark{color:#999}
    @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}
    .hop-counter{background:linear-gradient(135deg,#fff,#e8f5e9);border:2px solid #a5d6a7;border-radius:50px;padding:5px 16px;font-size:.9rem;font-weight:900;color:#2e7d32;position:relative;z-index:1}
    .char-inner{position:absolute;top:4px;transition:left .45s cubic-bezier(.34,1.56,.64,1);animation:float 2s ease-in-out infinite alternate;display:flex;align-items:flex-end}
    .char-inner .char-img{width:72px;height:72px;object-fit:contain;transform:rotate(42deg);filter:drop-shadow(0 4px 8px rgba(10,16,50,.4))}
    .char-missing{width:76px;height:76px}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}
    .number-line-wrapper{width:100%;max-width:740px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
    .number-line{display:flex;align-items:center;min-width:max-content;padding:8px 16px;position:relative}
    .nl-track{position:absolute;top:50%;left:0;right:0;height:12px;background:linear-gradient(90deg,#f44336,#ff9800,#ffeb3b,#4caf50,#2196f3,#6d3ff0,#2f6df6);border-radius:6px;transform:translateY(-50%);box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:0}
    .nl-number{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;cursor:pointer;border:none;position:relative;z-index:1;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s;flex-shrink:0}
    .nl-number:active{transform:scale(.9) translateY(3px)}
    .nl-number.start-marker{background:#fff!important;color:#5a2ed6!important;font-size:1.25rem;width:54px;height:54px;box-shadow:0 0 0 4px #2f6df6,0 5px 0 #0f2e86!important;animation:startPulse 1.1s ease-in-out infinite;z-index:2}
    @keyframes startPulse{0%,100%{box-shadow:0 0 0 4px #2f6df6,0 5px 0 #0f2e86;transform:scale(1)}50%{box-shadow:0 0 0 7px #5b8cf8,0 5px 0 #0f2e86;transform:scale(1.07)}}
    .nl-number.hop-path{outline:3px solid rgba(255,255,255,.75);outline-offset:2px}
    .nl-number.correct{animation:correctPop .5s ease}
    .nl-number.wrong{animation:wrongShake .35s ease}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.55) rotate(-8deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
    .hop-arrows{display:flex;align-items:flex-end;min-width:max-content;gap:0;padding:0 16px}
    .hop-cell{width:50px;display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0}
    .hop-cell.start-cell{width:54px}
    .hop-num-badge{font-size:.72rem;font-weight:900;padding:1px 3px;border-radius:4px;min-width:14px;text-align:center}
    .hop-num-add{color:#1b5e20;background:#c8e6c9}.hop-num-sub{color:#b71c1c;background:#ffcdd2}
    .hop-arrow-add{color:#2e7d32;font-size:1.35rem;font-weight:900;line-height:1}
    .hop-arrow-sub{color:#c62828;font-size:1.35rem;font-weight:900;line-height:1}
    .hop-dot{width:7px;height:7px;border-radius:50%;background:#e0e0e0;margin-bottom:4px}
    .start-flag{font-size:.65rem;font-weight:900;line-height:1;margin-bottom:4px;color:#5a2ed6}
    .inline-icon{width:1.05em;height:1.05em;object-fit:contain;vertical-align:-.14em}
    .home-cloud-row{display:flex;gap:96px;align-items:center;justify-content:center;min-height:72px;margin-bottom:-8px}
    .home-cloud{width:62px;height:62px;object-fit:contain;opacity:.97;filter:drop-shadow(0 5px 12px rgba(20,30,90,.4))}
    .home-section-heading{display:flex;align-items:center;gap:8px}
    .section-icon{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}

    /* ── MASCOT ── */
    .screen>.mascot-corner{position:fixed;left:22px;bottom:22px;width:116px;height:116px;z-index:6;pointer-events:none;display:flex;align-items:center;justify-content:center;isolation:isolate;filter:drop-shadow(0 7px 14px rgba(90,46,214,.32))}
    .screen>.mascot-corner::before{content:'';position:absolute;left:50%;bottom:2px;width:96%;height:82%;transform:translateX(-50%);border-radius:999px;background:radial-gradient(circle at 50% 54%,rgba(255,255,255,.96) 0 46%,rgba(240,246,255,.82) 58%,rgba(130,177,255,.38) 75%,rgba(130,177,255,0) 100%);box-shadow:0 0 0 3px rgba(255,255,255,.62),0 8px 22px rgba(90,46,214,.22);z-index:0}
    /* The button is the tap target and carries the size the art used to carry, so the
       mascot looks identical and only the art itself is tappable. 78% of 116px is 90px,
       and 78% of the 78px phone size is 61px — both comfortably past the 44px minimum,
       which is what allows the wrapper to stay pointer-events:none and keep the keypad
       reachable where the two are closest. */
    .screen>.mascot-corner .mascot-poke{pointer-events:auto;position:relative;z-index:1;width:78%;height:78%;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
    .screen>.mascot-corner .mascot-poke:active{transform:scale(.93)}
    .screen>.mascot-corner .mascot-img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;animation:float 2.3s ease-in-out infinite alternate;transform-origin:center bottom;will-change:transform;filter:saturate(1.08) contrast(1.04) drop-shadow(0 3px 5px rgba(55,26,146,.22))}
    .screen>.mascot-corner.happy .mascot-img{animation:mascotHappy 1s cubic-bezier(.34,1.56,.64,1)}
    .screen>.mascot-corner.oops .mascot-img{animation:mascotOops .6s ease}
    @keyframes mascotHappy{0%{transform:translateY(0) rotate(0) scale(1)}30%{transform:translateY(-38px) rotate(-10deg) scale(1.15)}55%{transform:translateY(0) rotate(7deg)}75%{transform:translateY(-18px) rotate(-5deg) scale(1.08)}100%{transform:translateY(0) rotate(0) scale(1)}}
    @keyframes mascotOops{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateX(-4px)}50%{transform:rotate(7deg) translateX(4px)}75%{transform:rotate(-4deg)}}
    @media (max-width:430px){.screen>.mascot-corner{left:10px;bottom:12px;width:78px;height:78px}.screen>.mascot-corner::before{width:98%;height:84%}}
    .char-inner.oops{animation:mascotOops .6s ease}
    .char-inner.happy{animation:mascotHappy 1s cubic-bezier(.34,1.56,.64,1)}

    /* ── HINTS & GENTLE HELP ── */
    .ghost-hint{opacity:.35;color:#6d3ff0}
    .nl-number.hint-glow{animation:hintGlow 1.1s ease-in-out infinite}
    @keyframes hintGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.16);box-shadow:0 0 0 8px #ffd54f,0 4px 0 rgba(0,0,0,.2)}}

    /* ── UNIFIED NUMBER LINE SCROLL ── */
    .line-stack{min-width:max-content;display:flex;flex-direction:column}
    .char-row{position:relative;height:90px}
    .char-row .char-inner{position:absolute;top:2px}

    /* ── CELEBRATE / WRONG TEXT ── */
    .celebrate-text{font-size:clamp(1.2rem,4.5vw,2rem);font-weight:900;text-align:center;color:#2f6df6;text-shadow:0 3px 0 #6d3ff0;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:1}
    .wrong-text{font-size:clamp(1.1rem,4vw,1.7rem);font-weight:900;text-align:center;color:#2f6df6;animation:popIn .35s ease;position:relative;z-index:1}
    @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

    /* ── CONFETTI ── */
    .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
    .confetti-piece{position:absolute;animation:confettiFall linear forwards}
    @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

    /* ── ICON BUTTONS (SVG) ── */
    .icon-svg{width:22px;height:22px;display:block}
    .btn-svg{width:30px;height:30px;display:block}
    .next-btn .btn-svg,.new-num-btn .btn-svg{margin:0 auto}

    .preset-tag-img{width:28px;height:28px;object-fit:contain;display:block;flex-shrink:0}

    /* ── CARD LAUNCH (menu tap feedback) ── */
    .mode-card.launching{animation:cardLaunch 1s ease forwards;position:relative;z-index:5}
    @keyframes cardLaunch{0%{transform:scale(1)}35%{transform:scale(1.13)}100%{transform:scale(1.18);filter:brightness(1.18)}}
    .mode-card.dimmed{opacity:.45;filter:saturate(.6)}

    /* ── PLANET ARRIVAL ── */
    .arrival-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(4,7,26,.78);animation:fadeIn .35s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .arrival-box{position:relative;background:linear-gradient(180deg,#131b52,#1d2467);border:4px solid #93b7fb;border-radius:32px;padding:16px 18px 22px;max-width:430px;width:100%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
    .arrival-photo{width:100%;height:150px;object-fit:cover;border-radius:22px;border:3px solid rgba(147,183,251,.55);display:block}
    .arrival-planet{width:112px;height:112px;object-fit:contain;margin:-64px auto 4px;position:relative;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));animation:arrivalPlanet .8s cubic-bezier(.34,1.56,.64,1)}
    @keyframes arrivalPlanet{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
    .arrival-title{color:#fff;font-size:clamp(1.25rem,5vw,1.7rem);font-weight:900;margin:2px 0 12px;text-shadow:0 3px 8px rgba(0,0,0,.4)}
    .arrival-fact-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.13);border:2px solid rgba(147,183,251,.4);border-radius:18px;padding:12px 14px;margin-bottom:16px}
    .arrival-fact{flex:1;color:#eaf1ff;font-size:clamp(.95rem,3.6vw,1.08rem);font-weight:700;line-height:1.45;text-align:left;min-height:4.35em;animation:factIn .34s ease}
    @keyframes factIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){.arrival-fact{animation:none}}
    .arrival-more-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
    /* Sized as a child's tap target first and a label second: 46px tall, which is why the
       padding looks generous for the type size. */
    .arrival-more{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;background:rgba(255,255,255,.16);border:2.5px solid rgba(147,183,251,.5);border-radius:50px;padding:10px 20px;font-family:inherit;font-size:.92rem;font-weight:900;color:#eaf1ff;cursor:pointer;box-shadow:0 4px 0 rgba(147,183,251,.32);transition:transform .1s}
    .arrival-more:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(147,183,251,.32)}
    .arrival-more img{width:21px;height:21px;object-fit:contain}
    .arrival-fact-dots{display:flex;align-items:center;gap:6px}
    .arrival-fact-dot{width:8px;height:8px;border-radius:50%;background:rgba(234,241,255,.26);transition:background .2s,transform .2s}
    .arrival-fact-dot.on{background:#ffd54f;transform:scale(1.35)}
    .arrival-replay{background:linear-gradient(135deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:50%;width:46px;height:46px;min-width:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 #93b7fb;color:#2f6df6;transition:transform .1s}
    .arrival-replay:active{transform:translateY(3px);box-shadow:0 1px 0 #93b7fb}
    .arrival-btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(160deg,#ffd54f,#f9a825);color:#5a2100;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.15rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #c17900,0 10px 24px rgba(249,168,37,.35);transition:transform .1s}
    .arrival-btn:active{transform:translateY(4px)}
    .arrival-btn img{width:30px;height:30px;object-fit:contain;transform:rotate(42deg)}
    .arrival-trophy{width:74px;height:74px;object-fit:contain;margin:2px auto 6px;display:block;animation:arrivalPlanet .6s cubic-bezier(.34,1.56,.64,1)}
    @media (max-width:430px){.arrival-photo{height:118px}.arrival-planet{width:92px;height:92px;margin-top:-54px}}

    /* ── SPACE THEME OVERRIDES ── */
    .home-sub,.home-section-heading{color:#eaf1ff!important;text-shadow:0 2px 6px rgba(4,8,30,.7)}
    .home-rainbow{filter:drop-shadow(0 0 8px rgba(140,190,255,.35))}
    .screen>.mascot-corner::before{background:radial-gradient(circle at 50% 54%,rgba(255,255,255,.95) 0 46%,rgba(230,240,255,.8) 58%,rgba(130,177,255,.35) 75%,rgba(130,177,255,0) 100%)!important;box-shadow:0 0 0 3px rgba(255,255,255,.5),0 8px 22px rgba(20,30,90,.45)!important}
  </style>
