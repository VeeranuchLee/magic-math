    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!_ctx) _ctx = new AC();
    if (_ctx.state === 'suspended') _ctx.resume();
    return _ctx;
  };
  /* ── THE BUS ──
     Every cue used to connect its oscillator straight to c.destination, which is most
     of why the set read as a test-tone generator: pure sines, no room, and nothing
     between eight stacked partials and the speaker. The graph is now
         source -> [dry + reverb send] -> master -> compressor -> destination
     built once per context and cached.
     There is deliberately no compressor on this bus. One was tried, on the assumption
     that celebrate()'s twelve tones and seven noise bursts inside 900 ms would sum past
     full scale. Rendered offline they peak at 0.16, so there was nothing to catch — and
     a DynamicsCompressor across the whole set measured 6-9 dB OFF the short quiet cues
     (tap, hop) while lifting the loud ones, inverting the dynamic range the cue volumes
     were chosen to create. If you add one back, measure every cue before and after.
     The impulse response is generated here rather than fetched. Decaying white noise
     is a perfectly good small room, and a fetched .wav would be the first audio file in
     this repository — see AUDIO-DIRECTION.md for why we are not starting that for a
     reverb tail. Zero bytes shipped, nothing to record provenance for. */
  const bus = c => {
    if (_bus && _bus.c === c) return _bus;
    const master = c.createGain(),
      dry = c.createGain(),
      wet = c.createGain(),
      rev = c.createConvolver();
    master.gain.value = 1;
    dry.gain.value = 1;
    wet.gain.value = .32;
    const rate = c.sampleRate,
      len = Math.floor(rate * 1.1),
      ir = c.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    rev.buffer = ir;
    dry.connect(master);
    rev.connect(wet);
    wet.connect(master);
    master.connect(c.destination);
    _bus = {
      c,
      dry,
      rev,
      master
    };
    return _bus;
  };
  /* Signature is unchanged through `fe` on purpose: every existing call site in both
     skins — including the ones this file does not itself define — keeps working and
     gets the room for free. `send` is the only addition and defaults to a half-send;
     seam() is the one cue that passes 0, because reverb on the beat between two spoken
     lines would smear it into the next word, which is the single thing that cue exists
     to avoid.
     The attack ramp is new and is not cosmetic: jumping the gain straight to `vol` is a
     discontinuity, and at tap()'s 80 ms that click was audible as a tick in front of
     every button press. */
  const tone = (c, freq, type, t, dur, vol, fe, send) => {
    try {
      const b = bus(c),
        o = c.createOscillator(),
        g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (fe) o.frequency.exponentialRampToValueAtTime(fe, t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.012, dur * .3));
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g);
      g.connect(b.dry);
      const s = send === undefined ? .5 : send;
      if (s > 0) {
        const sg = c.createGain();
        sg.gain.value = s;
        g.connect(sg);
        sg.connect(b.rev);
      }
      o.start(t);
      o.stop(t + dur);
    } catch (e) {}
  };
  /* Band-passed noise — the layer the old set had none of, and the rest of why it read
     as synthetic. A finger on a surface, a poof of dust and a rocket are all broadband;
     a sine can only ever be a beep. Band-passed rather than raw so each burst colours
     the cue it sits under instead of hissing across the whole spectrum. */
  const noise = (c, t, dur, vol, f0, f1, q) => {
    try {
      const b = bus(c),
        rate = c.sampleRate,
        len = Math.max(1, Math.floor(rate * dur)),
        buf = c.createBuffer(1, len, rate),
        d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(),
        f = c.createBiquadFilter(),
        g = c.createGain();
      src.buffer = buf;
      f.type = 'bandpass';
      f.Q.value = q || 1.2;
      f.frequency.setValueAtTime(f0, t);
      if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.01, dur * .25));
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      src.connect(f);
      f.connect(g);
      g.connect(b.dry);
      const sg = c.createGain();
      sg.gain.value = .4;
      g.connect(sg);
      sg.connect(b.rev);
      src.start(t);
      src.stop(t + dur);
    } catch (e) {}
  };
  return {
    setMuted(v) {
      _muted = v;
    },
    /* A tap is a finger landing on a surface, so it needs a body and a click. The two
       sines are the body; the 18 ms noise chip at 2.6 kHz is the fingernail. 18 ms is
       short enough that the ear fuses it into the tone rather than hearing two events,
       and the send is cut to .3 so the most frequent cue in the app does not leave the
       room ringing after every keypress. */
    tap() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 880, 'sine', n, .08, .11, 0, .3);
      tone(c, 1320, 'sine', n + .04, .06, .07, 0, .3);
      noise(c, n, .018, .05, 2600, 1400, 1.6);
    },
    /* The beat between two spoken lines. Beside tap() because it is punctuation, not
       a reward: one triangle blip at 330 Hz gliding to 300, 45 ms, .05 gain, scheduled
       .08 s ahead on the audio clock so it clears the tail of the word that just ended.
       Every celebratory cue in this module RISES in pitch and runs 200 ms or more; this
       one falls, is a twelfth of ding()'s length and under half a tap in volume, and
       sits in an empty band between wrong()'s 240 Hz ceiling and hop()'s 400 Hz floor.
       It self-guards on _muted, which is what makes it safe to fire from a timer
       seconds after its call site ran.
       It is also the only cue that sends nothing to the reverb: a tail on the beat
       between two lines would bleed into the word that follows it. */
    seam() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 330, 'triangle', n + .08, .045, .05, 300, 0);
    },
    twinkle() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      [523, 659, 784, 1047, 1319].forEach((f, i) => {
        tone(c, f, 'sine', n + i * .07, .18, .12);
        noise(c, n + i * .07, .03, .022, f * 2.6, f * 3.4, 2.6);
      });
    },
    /* Two things a struck bell has that a stack of sines does not. A 25 ms noise chip
       at 4 kHz on the first note only, which is the hammer; and an octave partial
       detuned by two thousandths under every note, so the long .55 s tails beat slowly
       against each other instead of sitting perfectly still. */
    ding() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      [[523, 0], [659, .06], [784, .12], [1047, .22], [1319, .32]].forEach(([f, t], i) => {
        tone(c, f, 'sine', n + t, .55, .16);
        tone(c, f * 2.002, 'sine', n + t, .4, .05);
        if (!i) noise(c, n, .025, .06, 4000, 2200, 2);
      });
    },
    /* Was a single sawtooth sweep — the harshest wave in the module, aimed at the one
       moment the child is already disappointed. Same falling two-step contour so it
       still reads as "not that one", but a triangle body and a soft low thud instead of
       a buzz. Kept under 240 Hz so it stays clear of seam()'s band above it. */
    wrong() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 240, 'triangle', n, .16, .09, 180);
      tone(c, 180, 'triangle', n + .13, .26, .08, 135);
      noise(c, n, .09, .028, 300, 170, 1);
    },
    /* The tune is unchanged. What is new is the seven-burst sparkle wash scattered
       across it at randomised centre frequencies — the confetti the melody was always
       implying and never had. */
    celebrate() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      [[523, 0], [659, .1], [784, .2], [1047, .32], [784, .46], [1047, .58], [1319, .68], [1047, .82]].forEach(([f, t]) => tone(c, f, 'sine', n + t, .2, .18));
      [1047, 1319, 1568, 2093].forEach((f, i) => tone(c, f, 'sine', n + .9 + i * .08, .15, .09));
      for (let i = 0; i < 7; i++) noise(c, n + .05 + i * .13, .05, .034, 3000 + Math.random() * 2600, 1500, 3.2);
    },
    hop() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 400, 'sine', n, .12, .11, 600);
      noise(c, n, .05, .028, 900, 2200, 1.4);
    },
    /* Landing somewhere new, and the one cue in the app allowed to be big. The rising
       sines were doing all the work alone; the half-second noise sweep under them is
       the engine, and the five late bursts are the sparkle of the place resolving. */
    arrive() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 180, 'sine', n, .55, .15, 900);
      tone(c, 90, 'triangle', n, .5, .11, 300);
      noise(c, n, .5, .05, 140, 900, .8);
      [[784, .4], [988, .5], [1175, .6], [1568, .72], [2093, .86]].forEach(([f, t]) => tone(c, f, 'sine', n + t, .3, .16));
      for (let i = 0; i < 5; i++) noise(c, n + .42 + i * .11, .06, .03, 3200 + Math.random() * 2000, 1600, 3);
    },
    /* ── THE SHIP'S COMPUTER CLEARS ITS THROAT ──
       Two 30 ms square blips a fifth apart, in front of every number the robot voice
       reads. It is not decoration. Two voices in one game was rejected on 2026-08-20
       because the seam was an accident — an answer that happened to be a times-table
       product spoke in the rendered voice and its neighbour did not. The seam is now a
       COSTUME: the companion talks, and the computer is heard switching on before it
       reads a value out. Square, because the whole point is that it does not belong to
       the same family as the eight musical cues above, and 50 ms apart so it reads as
       data rather than as a chime. Alone in this module it sends nothing to the reverb
       and no noise layer: a tail here would smear into the first digit, which is the one
       word in the app that must arrive clean. */
    readout() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 1568, 'square', n, .03, .032, 0, 0);
      tone(c, 2093, 'square', n + .05, .03, .024, 0, 0);
    },
    /* A fact turning over, when the child taps for another one. Deliberately SMALLER
       than ding() — three rising notes at half its gain and a third of its length —
       because tapping to see more is curiosity, not achievement, and a cue as big as the
       one for a correct answer would quietly tell the child that reading is worth as much
       as counting. */
    discover() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      [[1047, 0], [1319, .07], [1760, .15]].forEach(([f, t]) => tone(c, f, 'sine', n + t, .18, .075));
      noise(c, n + .02, .05, .02, 4200, 2400, 3);
    },
    /* The gentlest thing in the module: one soft sine, no noise chip, a third of a tap.
       It marks the fact panel changing under a finger and nothing more. */
    reveal() {
      if (_muted) return;
      const c = ctx();
      if (!c) return;
      const n = c.currentTime;
      tone(c, 1175, 'sine', n, .07, .04, 1480, .25);
    },
    /* ── ARRIVAL AMBIENCE ──
       The one sustained sound in the app, and it exists only while the arrival card is
       open. That boundary is the whole of why it is allowed: "silence belongs where they
       are counting" (MENU MUSIC, 2026-08-20) is untouched, because this cannot sound on a
       screen where anything is being counted.
        Three detuned partials under a lowpass, plus a breath of band-passed noise, plus a
       0.09 Hz LFO on the output gain so the bed moves instead of sitting perfectly still.
       `root` and `cut` come from the stop, so Earth is warm and low and the Milky Way is
       thin and high — the place is audible before the fact is read.
        PEAK IS .03, and rendered offline it measures 0.033: a third of a tap (0.108) and an
       eighth of ding() (0.263). It has to be that small, because the companion narrates
       the fact over the top of it, and a bed loud enough to need ducking would need the
       same polling machinery Music has, to serve a sound that lasts eight seconds.
        The three stops measured, as zero crossings per second over the steady part: the
       Moon 176, Earth 282, the Milky Way 543. A three-fold spread, which is the number
       behind the claim that the place is audible.
        Returns its own stop function rather than taking an id, because the caller is a
       React effect and a cleanup closure is exactly what an effect wants. Calling it
       twice is harmless — `stopped` latches. */
    ambience(spec) {
      if (_muted) return () => {};
      const c = ctx();
      if (!c) return () => {};
      let b;
      try {
        b = bus(c);
      } catch (e) {
        return () => {};
      }
      const PEAK = .03,
        FLOOR = .0001,
        FADE = 1.2,
        n = c.currentTime;
      const root = spec && spec.root || 110,
        cut = spec && spec.cut || 620;
      const parts = [];
      try {
        const g = c.createGain();
        g.gain.setValueAtTime(FLOOR, n);
        g.gain.exponentialRampToValueAtTime(PEAK, n + FADE);
        const lp = c.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = cut;
        lp.Q.value = .7;
        lp.connect(g);
        g.connect(b.dry);
        const sg = c.createGain();
        sg.gain.value = .55;
        g.connect(sg);
        sg.connect(b.rev);
        [[1, 'triangle', .5], [1.5, 'sine', .2], [2.005, 'sine', .13]].forEach(([mult, type, vol]) => {
          const o = c.createOscillator();
          o.type = type;
          o.frequency.value = root * mult;
          const og = c.createGain();
          og.gain.value = vol;
          o.connect(og);
          og.connect(lp);
          o.start(n);
          parts.push(o);
        });
        /* Stardust. Two seconds of noise on loop is cheaper than scheduling bursts for a
           sound whose length nobody knows in advance. */
        const rate = c.sampleRate,
          len = rate * 2,
          buf = c.createBuffer(1, len, rate),
          d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        const bf = c.createBiquadFilter();
        bf.type = 'bandpass';
        bf.frequency.value = cut * 3.2;
        bf.Q.value = .9;
        const ng = c.createGain();
        ng.gain.value = .05;
        src.connect(bf);
        bf.connect(ng);
        ng.connect(g);
        src.start(n);
        parts.push(src);
        const lfo = c.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = .09;
        const la = c.createGain();
        la.gain.value = PEAK * .34;
        lfo.connect(la);
        la.connect(g.gain);
        lfo.start(n);
        parts.push(lfo);
        let stopped = false;
        return () => {
          if (stopped) return;
          stopped = true;
          const t = c.currentTime;
          /* FADE FROM A COMPUTED LEVEL, NEVER FROM g.gain.value — and this is the one
             thing in the cue that was measurably wrong. cancelScheduledValues() drops the
             ramps, and the getter then falls back to the param's INTRINSIC value, which is
             1: this gain was only ever driven by scheduled events, so nothing ever set it.
             So "fade from wherever we are" set it to full scale first. Rendered offline it
             peaked at 0.68 — twenty times the bed's own level — a bang, in the exact case a
             child hits by tapping Keep Flying the moment the card opens. Measured
             2026-08-21.
             The fade-in is an exponential from FLOOR to PEAK over FADE, so its value at
             any instant is closed-form; computing it is exact and needs no getter. */
          try {
            const el = Math.max(0, Math.min(1, (t - n) / FADE));
            const from = Math.max(FLOOR, FLOOR * Math.pow(PEAK / FLOOR, el));
            g.gain.cancelScheduledValues(t);
            g.gain.setValueAtTime(from, t);
            g.gain.exponentialRampToValueAtTime(FLOOR, t + .7);
          } catch (e) {}
          parts.forEach(o => {
            try {
              o.stop(t + .8);
            } catch (e) {}
          });
        };
      } catch (e) {
        parts.forEach(o => {
          try {
            o.stop();
          } catch (e2) {}
        });
        return () => {};
      }
    }
  };
})();

/* ══ VOICE ══
   ── TWO ROLES, AND WHY THAT IS NOT THE THING WE REJECTED ──

   Owner decision, 2026-08-21. It replaces the rule of 2026-08-20 — "a mode is either
   fully voiced or fully robot, never both" — and it is worth being precise about what
   changed, because the old conclusion is written down in three places and an agent who
   reads only the conclusion will revert this.

   What was rejected was a seam that fell WHERE THE DATA HAPPENED TO LAND. `${answer}!`
   matched the bare-number clips, and those clips are the 152 distinct products of two
   numbers up to 20 — so in Carry Add roughly half the answers spoke in the rendered
   voice and half in the browser's, decided by whether the child's answer happened to be
   a times-table product. That is not two voices; that is one voice with a fault.

   What is here instead is a CAST. Two roles, assigned by what a line IS, never by which
   clip we happen to own:

     COMPANION  the character travelling with the child. Instructions, encouragement,
                reactions, hints, arrival lines, planet facts, praise. Fixed strings, so
                the whole set is enumerable and renderable, and it resolves to the
                rendered voice IN EVERY MODE — which is the capability this unlocks.

     ROBOT      the ship's computer reading a value out. Numbers and the sentences that
                are nothing but arithmetic. Unbounded, so it can never be fully rendered,
                and it does not need to be: flat, low, and announced by Sound.readout().

   THE ONE HARD RULE: the seam only ever falls at a SENTENCE boundary. Never inside one.
   Splicing a number clip onto the end of a rendered phrase was rejected on its own
   merits — a number at the end of a spoken sentence falls in pitch and a standalone clip
   is flat, so the join is audible — and nothing here does it. A mixed sentence such as
   "Can you build 47?" stays whole and belongs to the companion; it is her line, with a
   number in it, not two lines glued together.

   Numbers still play in the rendered voice in the two modes where the entire number
   space was bought and verified (see Clips's VOICED set), so the 965 clips already paid
   for are not thrown away. A child in Times Tables therefore hears one voice and a child
   in Carry Add hears two. That is a screen change, not a flip inside a sentence, and it
   is the same accepted edge already documented for the home-screen card names. */
const ROBOT = 'robot',
  COMPANION = 'companion';
const Voice = {
  muted: false,
  /* Bumped by every new request. Every callback in a running chain checks it before it
     speaks, ticks or schedules, so an interrupted sequence cannot finish talking over
     whatever replaced it — cancel() alone does not stop a part that has not started
     yet. Bumped BEFORE cancel(), so the end/error events cancel() fires for the
     outgoing chain already read as stale. Note: until this rewrite `gen` was written
     and never read anywhere, so the guarantee the old comment described did not
     actually exist. live() below is its first reader. */
  gen: 0,
  /* The one pending timer of the active chain: either the safety net waiting on the
     line being spoken, or the gap before the next line. Never both at once. */
  _t: 0,
  /* Handed to the next chain that starts, and called once that chain has finished
     speaking. The space journey uses it: addProgress() runs one line before the
     Voice.lines() that speaks the answer, so it arms this and the arrival overlay
     appears the moment the explanation ends. The alternative — a fixed timer — has to
     guess how long "nine hundred and fifty plus ninety nine is one thousand and forty
     nine" takes, and guesses wrong on one answer in five.
     Consumed unconditionally by the next say()/lines()/stop(), muted or not, so a
     stale callback can never leak onto a later chain; the caller keeps its own ceiling
     timer for the muted and cancelled cases.
     unicorn-math has no journey and never arms it. That is deliberate: this object is
     byte-identical in both files, and an unused hook is cheaper than a divergence. */
  _pending: null,
  /* The rendered clip currently playing, or null. Separate from the speechSynthesis
     bookkeeping above because the two engines fail differently: the browser engine has
     to be polled and second-guessed, an <audio> element does not. */
  _a: null,
  notifyNextChain(fn) {
    this._pending = fn;
  },
  /* True while anything is still being said or waited on. Tapping the mascot uses it to
     stand down, because the one piece of speech in this app that is actually teaching
     something is the explanation of an answer, and a poke must never cut it off.
     Both sources are needed and neither is sufficient alone: `_t` covers the gaps
     between lines of a chain, when the engine is legitimately silent but the chain is
     not finished, and `speaking` covers a lone say(), which schedules no timer at all. */
  busy() {
    if (this._t || this._a) return true;
    try {
      const s = window.speechSynthesis;
      return !!(s && (s.speaking || s.pending));
    } catch (e) {
      return false;
    }
  },
  RATE: .95,
  /* The robot is slower and much lower than the companion, and both numbers were chosen
     to be unmistakable rather than subtle: a listener has to know within one syllable
     which of the two is speaking, or the split reads as a glitch. Slower also genuinely
     helps, because what this voice says is digits. */
  RATE_ROBOT: .86,
  PITCH: 1.15,
  PITCH_ROBOT: .7,
  /* The gap after the FIRST line is the long one: that line is the number the child
     just typed, and it is the one the owner reported never lands. Later seams are
     shorter so the praise does not feel like it arrives in the next post. Both sit
     either side of the 426 ms that measured well in the probe. */
  GAP_FIRST: 480,
  GAP_REST: 380,
  /* How many 250 ms beats to allow past the estimate while the engine still reports
     itself speaking. Generous on purpose — see advance()'s `queued` path for what
     giving up costs. */
  POLL_MAX: 24,
  utterance(text, role) {
    const u = new SpeechSynthesisUtterance(text);
    const robot = role === ROBOT;
    u.rate = robot ? this.RATE_ROBOT : this.RATE;
    u.pitch = robot ? this.PITCH_ROBOT : this.PITCH;
    u.lang = 'en-US';
    return u;
  },
  /* The blip has to CLEAR before the first digit does, and on the opening line of a
     chain there is no gap in front of it to hide in. 140 ms is the cue's 80 ms plus
     room. Anywhere else in a chain the blip replaces the seam tick at the top of a
     380 ms gap and costs nothing at all. */
  LEAD_ROBOT: 140,
  _reset() {
    this.gen++;
    if (this._t) {
      clearTimeout(this._t);
      this._t = 0;
    }
    /* Detach the handlers BEFORE pausing. pause() can fire events, and a stale onended
       arriving here would advance a chain that no longer exists — the same class of bug
       the gen counter guards against on the speech path. */
    if (this._a) {
      const a = this._a;
      this._a = null;
      a.onended = null;
      a.onerror = null;
      try {
        a.pause();
      } catch (e) {}
    }
    try {
      const s = window.speechSynthesis;
      if (s) s.cancel();
    } catch (e) {}
  },
  /* Back button, unmount and muting. Kills the chain, its pending timer, anything
     mid-sentence, and any arrival waiting on the chain. Always call it as
     Voice.stop() — it uses `this`. */
  stop() {
    this._pending = null;
    this._reset();
  },
  /* `role` defaults to COMPANION, and that default is the safe direction: a line nobody
     tagged is spoken by the character in her own voice, exactly as every line was before
     this change. Forgetting to tag a number costs the console blip, not a bug. */
  say(part, role) {
    this._pending = null;
    if (this.muted) return;
    /* Accepts either a bare string plus an optional role, or the tagged object `num()`
       returns — so one spelling marks a robot line everywhere, whether it is a lone
       readout or one line of a chain. */
    const tagged = part && typeof part === 'object';
    const text = tagged ? part.t : part;
    const r = (tagged ? part.r : role) === ROBOT ? ROBOT : COMPANION;
    const src = Clips.url(text, r);
    if (src) {
      this._reset();
      const a = new Audio(src);
      this._a = a;
      const clear = () => {
        if (this._a === a) this._a = null;
      };
      a.onended = clear;
      a.onerror = clear;
      const p = a.play();
      if (p && p.catch) p.catch(clear);
      return;
    }
    try {
      const s = window.speechSynthesis;
      if (!s) return;
      this._reset();
      if (r === ROBOT) {
        /* `_t` is the chain's one timer slot and say() has no chain, so it is free — and
           holding it also makes busy() true across the lead-in, which is correct:
           something IS about to be said, and a mascot poke must not land on top of it. */
        const V = this,
          gen = this.gen;
        Sound.readout();
        this._t = setTimeout(() => {
          if (gen !== V.gen || V.muted) return;
          V._t = 0;
          try {
            window.speechSynthesis.speak(V.utterance(text, ROBOT));
          } catch (e) {}
        }, this.LEAD_ROBOT);
        return;
      }
      s.speak(this.utterance(text, r));
    } catch (e) {}
  },
  /* Rough spoken length, used only by the safety net below. Digits are read as whole
     words — "26" is "twenty six" — so a character count badly under-counts these
     lines, which are mostly numbers. One word per digit, one per ordinary word,
     ~330 ms a word at rate 1. */
  _estimate(text, role) {
    let words = 0;
    String(text).trim().split(/\\s+/).forEach(w => {
      if (!w) return;
      const d = (w.match(/\\d/g) || []).length;
      words += d || 1;
    });
    return 350 + words * 330 / (role === ROBOT ? this.RATE_ROBOT : this.RATE);
  },
  /* Several short lines instead of one long string, spoken one at a time with a real
     gap between them.
      "26! 2 times 13 is 26. You did it!" as a single utterance comes out as one
     breathless run — the number the child just typed never lands (owner, 2026-08-15).
     Splitting into separate utterances is necessary but not sufficient: queueing them
     all up front leaves a 4-5 ms seam, because the engine speaks its queue back to
     back. A trailing full stop buys nothing either. Both measured in the in-app
     Chromium, 2026-08-16.
      So each line is spoken only once the one before it has finished. The chain advances
     on whichever of onend or an estimated-duration safety net fires first, and a quiet
     Sound.seam() tick marks the join. onend DOES fire reliably in Chromium — the old
     comment here claiming it never fired was wrong — but that is not evidence about
     iOS Safari, which is where these games are actually played. Hence the net, and
     hence `settled`, which makes onend and the net mutually exclusive so a line can
     never be advanced twice. */
  lines(parts) {
    const done = this._pending;
    this._pending = null;
    if (this.muted) return;
    /* A part is either a plain string — the companion, as every call site meant before
       roles existed — or `num('47!')`, which tags it for the ship's computer. Nulls are
       dropped first, because several call sites pass `arrived?null:praise()`. */
    const list = parts.filter(Boolean).map(part => {
      const o = typeof part === 'string' ? {
        t: part,
        r: COMPANION
      } : part;
      const t = String(o && o.t != null ? o.t : '').trim();
      return t ? {
        t,
        r: o.r === ROBOT ? ROBOT : COMPANION
      } : null;
    }).filter(Boolean);
    if (!list.length) return;
    /* Resolved once, up front, because two separate decisions need the answer: which
       engine speaks the line, and which tick marks the join in front of it. Asking twice
       invites the two to disagree. */
    list.forEach(l => {
      l.src = Clips.url(l.t, l.r);
    });
    /* The long gap goes after the line that has to LAND, and roles moved which line that
       is. It used to be line one, because line one was always the number the child had
       just typed. Line one is now usually the companion reacting and the number is line
       two, so the rule follows the role instead of the position: a value read out gets
       the long gap after it, and so does the opening line whatever it is. */
    const gapAfter = i => i === 0 || list[i].r === ROBOT ? this.GAP_FIRST : this.GAP_REST;
    let s;
    try {
      s = window.speechSynthesis;
    } catch (e) {
      return;
    }
    if (!s) return;
    this._reset();
    const V = this,
      gen = this.gen;
    /* Re-read, never captured: the chain runs seconds after the call site, and the
       child may have muted or walked away in between. */
    const live = () => gen === V.gen && !V.muted;
    const speakFrom = i => {
      if (!live()) return;
      let settled = false,
        polls = 0;
      /* queued=true means "the engine is still talking and we stopped waiting". The
         next utterance will then be spoken back to back whatever we do, so: no tick
         (it would land inside a word) and no gap (it would buy nothing). That path is
         the graceful degradation to the old behaviour, not the design — which is why
         POLL_MAX is generous rather than tight. */
      const advance = queued => {
        if (settled) return;
        settled = true;
        /* live() BEFORE touching _t: by now _t may belong to a newer chain, and
           zeroing another chain's handle would make it uncancellable. */
        if (!live()) return;
        if (V._t) {
          clearTimeout(V._t);
          V._t = 0;
        }
        if (i + 1 >= list.length) {
          if (done) done();
          return;
        } // the chain is finished
        if (queued) {
          speakFrom(i + 1);
          return;
        }
        /* WHICH tick, because the tick now announces who speaks next. A line the robot
           will actually deliver gets the console blip; everything else — including a
           number that resolved to a rendered clip, which is the companion's own voice —
           gets the neutral seam. */
        const nxt = list[i + 1];
        if (nxt.r === ROBOT && !nxt.src) Sound.readout();else Sound.seam();
        V._t = setTimeout(() => {
          if (!live()) return;
          V._t = 0;
          speakFrom(i + 1);
        }, gapAfter(i));
      };
      const net = () => {
        if (settled || !live()) return;
        V._t = 0;
        /* The estimate has run out. If the engine still says it is speaking, give it
           another beat rather than ticking over the tail — but cap the waiting,
           because iOS Safari can leave `speaking` true after the voice stops. */
        let busy = false;
        try {
          busy = !!s.speaking;
        } catch (e) {}
        if (busy && polls < V.POLL_MAX) {
          polls++;
          V._t = setTimeout(net, 250);
          return;
        }
        advance(busy);
      };
      /* A rendered clip for this line, if one exists. Everything below this block —
         the length estimate, the 250 ms poll, POLL_MAX — exists because
         speechSynthesis cannot be trusted to tell us when it stopped. An <audio>
         element can: it has a real duration and a reliable `ended`. So the clip path
         needs none of it, and deliberately schedules no timer.
         A clip that fails to load advances the chain rather than stalling it, which is
         the same contract as u.onerror on the speech path below. */
      const src = list[i].src;
      if (src) {
        const a = new Audio(src);
        V._a = a;
        const fin = () => {
          if (V._a === a) V._a = null;
          advance(false);
        };
        a.onended = fin;
        a.onerror = fin;
        const pr = a.play();
        if (pr && pr.catch) pr.catch(fin);
        return;
      }
      let u;
      try {
        u = V.utterance(list[i].t, list[i].r);
      } catch (e) {
        advance(false);
        return;
      }
      const go = () => {
        u.onend = () => advance(false);
        u.onerror = () => advance(false); // a dropped line must not stall the chain
        V._t = setTimeout(net, V._estimate(list[i].t, list[i].r) + 400);
        try {
          s.speak(u);
        } catch (e) {
          advance(false);
        }
      };
      /* Only the OPENING line needs its own lead-in; every later robot line already has
         a 380 ms gap in front of it with the blip at the top of it. */
      if (i === 0 && list[i].r === ROBOT) {
        Sound.readout();
        V._t = setTimeout(() => {
          if (!live()) return;
          V._t = 0;
          go();
        }, V.LEAD_ROBOT);
        return;
      }
      go();
    };
    speakFrom(0);
  }
};
/* Tag a line for the ship's computer. Deliberately three characters long and used at
   every call site that speaks a value, because the alternative — sniffing the text for
   digits — would guess wrong on "Can you build 47?" and split a sentence that must stay
   whole. The role is a decision about the line, so it is stated where the line is written. */
const num = t => ({
  t,
  r: ROBOT
});
const PRAISE = ['Blast off!', 'Out of this world!', 'You did it!', 'Stellar!', 'Super nova!', 'Mission complete!', 'To the stars!', 'Perfect landing!', 'Cosmic!', 'Well flown!', 'You are a natural!', 'Full speed ahead!'];
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];

/* ══ THE STUCK LINE ══
   Owner's call, 2026-08-26: *"no need for sound on miss until 3 times."* A child who has
   just got it wrong is still trying; talking at them on the first miss interrupts the
   retry rather than helping it. So nothing is said until the THIRD miss — which is
   already the moment the faint ghost answer appears, and until now it appeared in
   silence.

   REPEATS EVERY THIRD MISS rather than firing once, copying ColumnMath's hint schedule
   (`nextMiss>=tries&&(nextMiss-tries)%tries===0`) so a child on their sixth attempt is
   not left in silence either.

   SHARED BETWEEN THE SKINS, unlike PRAISE. Praise is themed because arriving somewhere
   is themed; being stuck is not, and a warm line does not get warmer for being about
   space. Identical text in both pages renders once. */
const MISS_HINT = ['Here is a little help.', 'Look. I will show you this one.', 'That one is tricky. Here is a peek.', 'Nearly! Here is a hint.', 'Let me help you with this one.', 'You are close. Look here.'];
const missHint = () => MISS_HINT[Math.floor(Math.random() * MISS_HINT.length)];

/* ══ NARRATION CLIPS ══
   Rendered speech for Times Tables, replacing the browser's robot voice on the lines we
   have files for. Everything else in the app keeps speechSynthesis until it is rendered
   too, which is why this resolves by TEXT rather than being wired into call sites: the
   game still says `Voice.say(`${a} times ${b}?`)` and neither knows nor cares whether a
   file exists. One resolver, no call-site churn, and a half-rendered app degrades line by
   line instead of mode by mode.

   THE INDEX IS FETCHED, NOT GUESSED. Without clips.json the only way to discover a
   missing clip is to request it and get a 404 — the child hears silence, then a robot
   voice a beat later, on every line the render missed. `have` stays null until the index
   lands, and a null `have` means "use the engine", so the first seconds after launch are
   merely un-upgraded rather than broken.

   IDS ARE DERIVED FROM THE TEXT, so the mapping is checkable against the manifest by
   reading it: "7 times 8?" is tt-q-7x8, "7 times 8 is 56." is tt-a-7x8, "56!" is
   tt-n-56. Praise is positional because the strings are skin-specific — see PRAISE
   above, which is themed in space-math and not in unicorn-math. */
const Clips = (() => {
  const ROOT = 'assets-runtime/narration/';
  /* THREE SETS, RESOLVED TWO DIFFERENT WAYS, and the split is deliberate.
      `times-tables` is PATTERNS. "7 times 8?" and 964 siblings are covered by four
     regexes, which is why 965 clips need no lookup table at all.
      `count-by` and `shared` are mostly FIXED STRINGS -- mascot lines, home cards,
     journey facts. A regex cannot cover those, and a hand-written lookup would recreate
     the exact failure that shipped `tt-card` paid-for and silent: two hand-maintained
     lists of the same strings, quietly disagreeing. So their `clips.json` carries a
     text->id map emitted from the manifest that was rendered. Every clip present is
     reachable by construction, and one that failed to encode is missing from both the
     id list and the map together, so it falls back to the engine instead of 404ing. */
  const SETS = ['times-tables', 'count-by', 'shared'];
  const PRAISE_PREFIX = 'tt-praise-';
  let have = null; /* id -> set directory */
  let texts = null; /* exact line text -> id */
  /* ══ WHICH MODES MAY SPEAK IN THE RENDERED VOICE ══
     Owner's decision, 2026-08-20: a mode is either fully voiced or fully robot. Never
     both, because two voices inside one game is worse than one robot voice throughout.
      RESOLVING BY TEXT ALONE WAS NOT ENOUGH, and this set is the correction. `praise()` is
     called by all nine modes and `tt-praise-*` matched it everywhere, so a child in Carry
     Add already heard the real voice say "Mission complete!" after a robot said "fifty
     seven take away six is fifty one." Worse, `${answer}!` matches /^(\d+)!$/ and the
     bare-number clips are the 152 distinct PRODUCTS of two numbers up to 20 — which are
     not a range but do collide constantly with ordinary arithmetic answers. Measured:
     71% of Take Away answers, 57% of Carry Add answers and 42% of Big Carry answers hit a
     rendered clip. So the voice flipped mid-chain depending on whether the answer happened
     to be a times-table product, which is arbitrary and audible.
      A mode belongs here only when EVERY line reachable inside it is rendered — its
     prompts, its answer chain, its praise, its mascot and its journey arrivals. Adding a
     mode before that is what caused the bug above, so the test is coverage, not intent.
      Three qualify, as of 2026-08-20, and each was checked rather than assumed —
     `python3 tools/build-narration-manifest.py --verify` reports 518/518 lines rendered
     AND reachable, and it is the thing to re-run before adding a fourth:
        null  the home screen. Its only spoken lines are the ten card names.
       m1    Times Tables. Its arithmetic was already rendered; its picker prompt, the
             mascot and the journey arrivals were NOT, which is why it did not really
             qualify when this gate was first written.
       s1    Count By. Its answer chain always resolved, because its lines share the
             times table's shape; the 481 prompts and chants are what were missing.
      The other eight modes stay out permanently, not pending work: their spoken lines
     carry unbounded PAIRS of numbers up to 1000+, so whole-sentence coverage is
     impossible rather than expensive. Owner's decision, 2026-08-20.
      One accepted edge: tapping a card speaks its name in the rendered voice on the home
     screen and then drops into a game that may be all-robot. That is a screen change,
     not a flip inside a sentence, and the card name belongs to the home screen. */
  const VOICED = new Set([null, 'm1', 'm2', 's1']);
  /* ══ WHAT THE MODE GATE ACTUALLY GUARDS — REVISED 2026-08-21 ══
     The gate above used to apply to every line. It no longer does, and the distinction
     it now draws is the entire safety argument for the two-voice split:
        EXACT MATCHES resolve in EVERY mode. `texts` is emitted from the manifest that was
       rendered, so an entry existing is proof that we chose that exact sentence, paid for
       it, and encoded it. There is no unbounded space behind it and nothing to be
       surprised by. This is what lets the companion keep her own voice in Carry Add.
        PATTERN MATCHES stay behind the gate, unchanged. `tt-n-*` is 152 arbitrary
       products, `tt-q/tt-a` are 400 facts, and outside m1 and s1 an ordinary arithmetic
       answer hits one only by coincidence — which is exactly the bug of 2026-08-20.
      So: the companion asks for a line by its text and gets it anywhere; the robot asks
     for a number and gets a file only in the two modes where the whole number space was
     bought and verified. */
  const exactFor = text => {
    const s = String(text).trim();
    if (texts && texts[s]) return texts[s];
    /* Praise is positional rather than mapped, because the strings are skin-specific —
       see PRAISE above — and it is the companion's line in every mode that can say it. */
    const p = PRAISE.indexOf(s);
    if (p >= 0) return PRAISE_PREFIX + (p + 1);
    return null;
  };
  let mode = null;
  const idFor = text => {
    const s = String(text).trim();
    /* The map is exact and generated, so it wins over the patterns. */
    if (texts && texts[s]) return texts[s];
    let m;
    if (m = s.match(/^(\d+) times (\d+)\?$/)) return 'tt-q-' + m[1] + 'x' + m[2];
    if (m = s.match(/^(\d+) times (\d+) is (\d+)\.$/)) return 'tt-a-' + m[1] + 'x' + m[2];
    if (m = s.match(/^(\d+)!$/)) return 'tt-n-' + m[1];
    const p = PRAISE.indexOf(s);
    if (p >= 0) return PRAISE_PREFIX + (p + 1);
    /* The home-screen card line. Rendered, so it must be claimed here — a clip that
       exists but that nothing resolves to is worse than one that was never made: it is
       paid for, shipped, and silent. unicorn-math has no CARD_VOICE and so has no
       equivalent rule. */
    if (s === CARD_VOICE.m1) return 'tt-card';
    return null;
  };
  return {
    load() {
      /* Each set is independent: one missing clips.json costs that set only, and the
         lines it would have covered fall back to the engine. */
      SETS.forEach(set => {
        try {
          fetch(ROOT + set + '/clips.json').then(r => r.ok ? r.json() : null).then(j => {
            if (!j || !j.clips || !j.clips.length) return;
            if (!have) have = {};
            j.clips.forEach(id => {
              have[id] = set;
            });
            if (j.texts) {
              if (!texts) texts = {};
              Object.keys(j.texts).forEach(t => {
                texts[t] = j.texts[t];
              });
            }
          }).catch(() => {});
        } catch (e) {}
      });
    },
    /* Called on every screen change, with null for the home screen. */
    setMode(key) {
      mode = key || null;
    },
    /* null means "no file for this line" — the caller falls back to the engine.
       `role` is COMPANION unless the caller says otherwise, and an unrecognised role is
       treated as the companion: the failure mode of guessing wrong here is a fixed string
       that stays on the engine, not a number that reaches for a clip it should not have. */
    url(text, role) {
      if (!have) return null;
      const id = role === 'robot' ? VOICED.has(mode) ? idFor(text) : null : exactFor(text);
      return id && have[id] ? ROOT + have[id] + '/' + id + '.m4a' : null;
    }
  };
})();

/* ══ MENU MUSIC ══
   Owner's call, 2026-08-20, made after hearing the track: music plays on the MENU and
   nowhere else. Not a global toggle that happens to default off — the games are silent
   by construction. Atmosphere belongs where the child is choosing; silence belongs where
   they are counting, and a background bed under mental arithmetic is a real cost that a
   preference switch only shifts onto whichever parent never finds it.

   It is also opt-in and remembered, because a menu that starts singing the first time
   the app opens is a thing you turn off, not a thing you enjoy.

   THE AUTOPLAY PROBLEM, AND WHY `armed` EXISTS. A browser will not let a page start audio
   before the user has interacted with it, so on a fresh load `play()` rejects even though
   the child turned music on last week. Silently swallowing that means the preference
   looks broken. Instead the rejection arms a one-shot listener on the next pointerdown,
   which is the first tap the child makes anyway.

   DUCKING IS POLLED, not wired into Voice. The alternative is a callback threaded through
   every path in Voice that starts and stops sound — four of them, each with its own
   cancellation rules — to serve one volume change on one screen. A 180 ms poll that only
   runs while music is actually playing is the smaller thing to be wrong about. */
const Music = (() => {
  const SRC = 'assets-runtime/audio/menu-bed.m4a';
  const KEY = 'sm_music';
  const FULL = 0.20; // resting level: present, and well under a spoken line
  const DUCKED = 0.055; // while anything is being said
  const RAMP_MS = 420,
    STEP_MS = 40,
    POLL_MS = 180;
  let el = null,
    wanted = false,
    muted = false;
  /* Read at module creation, not in init(). Home's useState initialiser runs before
     the App's mount effect, so a preference read inside init() arrives one render too
     late and the toggle renders "off" while the bed is already playing. */
  let pref = (() => {
    try {
      return localStorage.getItem(KEY) === '1';
    } catch (e) {
      return false;
    }
  })();
  let ramp = 0,
    poll = 0,
    armed = false;
  const want = () => pref && wanted && !muted;
  const fadeTo = (v, thenPause) => {
    if (!el) return;
    if (ramp) {
      clearInterval(ramp);
      ramp = 0;
    }
    const from = el.volume,
      steps = Math.max(1, Math.round(RAMP_MS / STEP_MS));
    let i = 0;
    ramp = setInterval(() => {
      i++;
      try {
        el.volume = Math.max(0, Math.min(1, from + (v - from) * (i / steps)));
      } catch (e) {}
      if (i >= steps) {
        clearInterval(ramp);
        ramp = 0;
        if (thenPause && el) {
          try {
            el.pause();
          } catch (e) {}
        }
      }
    }, STEP_MS);
  };
  const startPoll = () => {
    if (poll) return;
    poll = setInterval(() => {
      if (!el || el.paused) {
        clearInterval(poll);
        poll = 0;
        return;
      }
      const t = Voice.busy() ? DUCKED : FULL;
      if (Math.abs(el.volume - t) > 0.005 && !ramp) fadeTo(t, false);
    }, POLL_MS);
  };
  const arm = () => {
    if (armed) return;
    armed = true;
    const go = () => {
      window.removeEventListener('pointerdown', go, true);
      armed = false;
      apply();
    };
    window.addEventListener('pointerdown', go, true);
  };
  const apply = () => {
    if (!want()) {
      if (el && !el.paused) fadeTo(0, true);
      return;
    }
    if (!el) {
      try {
        el = new Audio(SRC);
      } catch (e) {
        return;
      }
      el.loop = true;
      el.preload = 'none';
      el.volume = 0;
    }
    el.volume = 0;
    let p;
    try {
      p = el.play();
    } catch (e) {
      arm();
      return;
    }
    if (p && p.then) p.then(() => {
      fadeTo(FULL, false);
      startPoll();
    }).catch(() => arm());else {
      fadeTo(FULL, false);
      startPoll();
    }
  };
  return {
    /* Read the stored preference once. Called from the app's mount effect. */
    init() {
      apply();
    },
    enabled() {
      return pref;
    },
    /* The toggle. Its own click is the user gesture, so this is the one path where
       play() is reliably allowed. */
    setEnabled(v) {
      pref = !!v;
      try {
        localStorage.setItem(KEY, pref ? '1' : '0');
      } catch (e) {}
      apply();
    },
    /* Which screen we are on. Home passes true; every game screen passes false. */
    setWanted(v) {
      wanted = !!v;
      apply();
    },
    /* The global sound toggle silences music too — one switch that means "quiet". */
    setMuted(v) {
      muted = !!v;
      apply();
    },
    /* Read-only, for verification. The element is never added to the document, so
       there is otherwise no way to observe from outside whether the bed is actually
       playing or merely intended to be. */
    state() {
      return {
        pref,
        wanted,
        muted,
        exists: !!el,
        playing: !!(el && !el.paused),
        volume: el ? +el.volume.toFixed(3) : null,
        armed
      };
    }
  };
})();

/* ══ CONSTANTS ══ */
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

/* ── THE SPACE JOURNEY ──
   Every correct answer flies the rocket one step further.
   Every LEG_LEN steps the rocket arrives somewhere new: the game background
   changes to that place and a fact is read aloud (Usborne style).
   Finishing the whole journey earns a trophy, then a new journey begins.

   ── FACTS ARE A LIST, NOT A LINE — owner request, 2026-08-21 ──
   A stop is meant to be a small reward, and a reward that says the same sentence every
   time stops being one. Sixty correct answers is a long way for a five-year-old, and
   the child who gets there four times has heard about Mars's rusty dust four times.

   So each stop carries several, ONE IS SHOWN AT A TIME, and the arrival card offers a
   tap for another. Showing all four at once would turn the reward into a page of text,
   which is the opposite of the intent, and would also make the card unreadable to the
   pre-reader it is aimed at — the facts are written to be HEARD.

   THE FIRST FACT OF EACH STOP IS UNCHANGED, DOWN TO THE PUNCTUATION, and that is not
   conservatism: `sh-fact-0` .. `sh-fact-6` are already rendered, and the resolver matches
