<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Space Math</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="stylesheet" href="./fonts.css"/>
  <meta name="theme-color" content="#0a0e2d"/>
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Magic Math"/>
  <script src="./vendor/react-18.3.1.production.min.js"></script>
  <script src="./vendor/react-dom-18.3.1.production.min.js"></script>
  <script src="./vendor/babel-7.26.4.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;background:#0a0e2d}

    /* ── BG DECO ── */
    .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .bg-deco img{position:absolute;display:inline-block;object-fit:contain;animation:twinkleDeco ease-in-out infinite alternate;filter:drop-shadow(0 0 7px rgba(140,190,255,.5));will-change:transform,opacity}
    @keyframes twinkleDeco{
      0%{opacity:.06;transform:scale(.55) rotate(-12deg)}
      100%{opacity:var(--deco-opacity,.5);transform:scale(1.15) rotate(12deg)}
    }
    @media (prefers-reduced-motion: reduce){
      .bg-deco img{animation:none!important;opacity:.12!important}
    }
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

    /* ── HOME ── */
    .home{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;overflow:hidden}
    .home-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(10,14,45,.32),rgba(10,14,45,.32)),url('assets/space/bg-nebula.png');background-size:cover,cover;background-position:center,center;background-color:#0a0e2d;z-index:0}
    .home-tint{position:absolute;inset:0;background:rgba(8,12,40,.1);z-index:0}
    .home>*:not(.home-bg):not(.home-tint){position:relative;z-index:1}
    .home-rainbow{font-size:clamp(.9rem,3vw,1.4rem);letter-spacing:4px;animation:bounce 1.4s ease-in-out infinite alternate}
    .home-title{font-size:clamp(1.8rem,7vw,3.2rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:clamp(.85rem,2.8vw,1.1rem);font-weight:900;color:#5a2ed6;background:rgba(255,255,255,.7);border-radius:50px;padding:6px 20px;box-shadow:0 2px 8px rgba(171,71,188,.2)}
    .mode-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:640px}
    .mode-section-label{font-size:.95rem;font-weight:900;color:#5a2ed6;text-transform:uppercase;letter-spacing:2px;background:rgba(255,255,255,.75);border-radius:50px;padding:5px 18px}
    .mode-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
    .mode-card{flex:1;min-width:130px;max-width:185px;border-radius:26px;padding:18px 12px 14px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mode-card-icon{width:100px;height:88px;line-height:1;display:flex;align-items:center;justify-content:center;overflow:visible}
    .mode-card-art{display:block;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(4,8,30,.35))}
    .mode-card-art.planet-art{width:80px;height:80px}
    .mode-card-art.rocket-art{width:84px;height:84px}
    .mode-card-art.large-art{width:92px;height:92px}
    .mode-card-label{font-size:.78rem;font-weight:900;color:rgba(255,255,255,.92);text-shadow:0 2px 4px rgba(0,0,0,.3);text-align:center}
    /* Pictogram row: how a pre-reader "reads" what the game is (digits + symbols + mini blocks) */
    .mode-card-pict{display:flex;align-items:center;justify-content:center;gap:5px;background:rgba(255,255,255,.24);border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:6px 12px;min-height:34px}
    .mode-card-pict.pict-col{flex-direction:column;gap:2px;padding:5px 14px}
    .pict-num{font-size:1.15rem;font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4);line-height:1}
    .pict-col .pict-num{font-size:.85rem}
    .pict-line{width:26px;height:3px;background:#fff;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
    .pict-block{width:13px;height:13px;background:linear-gradient(135deg,#ffd54f,#f9a825);border:2px solid #e65100;border-radius:3px;flex-shrink:0}
    .pict-ten{width:9px;height:24px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border:2px solid #1f54d6;border-radius:2px;flex-shrink:0}
    .mode-card-stars{height:24px;display:flex;align-items:center;justify-content:center;gap:2px}
    .mode-card-stars img{width:17px;height:17px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
    .mc-pink  {background:linear-gradient(160deg,#93b7fb,#2f6df6);box-shadow:0 7px 0 #1746b8,0 10px 20px rgba(47,109,246,.3)}
    .mc-purple{background:linear-gradient(160deg,#ab97f5,#5a2ed6);box-shadow:0 7px 0 #371a92,0 10px 20px rgba(90,46,214,.3)}
    .mc-rose  {background:linear-gradient(160deg,#5b8cf8,#1f54d6);box-shadow:0 7px 0 #0f2e86,0 10px 20px rgba(31,84,214,.3)}
    .mc-magic {background:linear-gradient(160deg,#8f6cee,#371a92);box-shadow:0 7px 0 #311b92,0 10px 20px rgba(55,26,146,.3)}

    /* ── SCREEN ── */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 24px;gap:11px;background:transparent;overflow:hidden}
    .screen-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(6,9,30,.26),rgba(6,9,30,.26)),var(--game-bg,url('assets/space/bg-earth.png'));background-size:cover,cover;background-position:center,center;background-color:#0a0e2d;z-index:0;pointer-events:none;transition:opacity .4s}
    /* Every :not() here adds specificity, so this rule outweighs a plain class rule on
       any child. The settings overlay is a child of .screen and must stay position:fixed
       to cover the viewport — without this exclusion it lays out inline in the column,
       squeezed to the flex width instead of centred over the game. */
    .screen>*:not(.screen-bg):not(.bg-deco):not(.confetti-container):not(.mascot-corner):not(.modal-overlay){position:relative;z-index:1}

    /* ── TOP BAR ── */
    .top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:740px;gap:8px;position:relative;z-index:2}
    .back-btn{background:linear-gradient(135deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:50px;padding:8px 14px;font-family:inherit;font-size:1.2rem;font-weight:900;color:#2f6df6;cursor:pointer;box-shadow:0 4px 0 #93b7fb;transition:transform .1s;white-space:nowrap;line-height:1;min-width:52px}
    .back-btn:active{transform:translateY(3px)}
    .settings-btn,.sound-btn{background:linear-gradient(135deg,#fff,#ecebff);border:2.5px solid #ab97f5;border-radius:50px;padding:8px 13px;font-family:inherit;font-size:1.1rem;font-weight:900;color:#5a2ed6;cursor:pointer;box-shadow:0 4px 0 #ab97f5;transition:transform .1s;line-height:1;min-width:48px}
    .settings-btn:active,.sound-btn:active{transform:translateY(3px)}

    /* ── MODALS ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-box{background:#fff;border-radius:28px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px solid #93b7fb;max-height:90vh;overflow-y:auto}
    .modal-title{font-size:1.2rem;font-weight:900;color:#5a2ed6;text-align:center;margin-bottom:14px}
    .preset-btn{width:100%;padding:12px 16px;border-radius:14px;border:3px solid;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .1s;margin-bottom:7px}
    .preset-btn:active{transform:scale(.97)}
    .preset-btn.active{background:linear-gradient(135deg,#93b7fb,#2f6df6);border-color:#2f6df6;color:#fff}
    .preset-btn.inactive{background:#fff;border-color:#c4d7fd;color:#5a2ed6}
    .preset-tag{font-size:1.2rem}
    .preset-info{text-align:left;flex:1}
    .preset-name{font-size:.95rem;font-weight:900}
    .preset-range{font-size:.74rem;opacity:.7;font-weight:700}
    .modal-close{margin-top:8px;width:100%;padding:11px;border-radius:50px;border:none;background:linear-gradient(135deg,#93b7fb,#2f6df6);color:#fff;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #1746b8}
    .modal-close:active{transform:translateY(3px)}
    /* custom range inputs */
    .custom-range-box{background:#e8f0ff;border-radius:14px;padding:14px;margin-top:4px;border:2px solid #93b7fb}
    .custom-range-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .custom-range-row label{font-size:.85rem;font-weight:900;color:#5a2ed6;display:flex;align-items:center;gap:6px}
    .custom-input{width:68px;padding:6px 8px;border-radius:8px;border:2px solid #93b7fb;font-family:inherit;font-size:1rem;font-weight:900;color:#333;text-align:center}
    .custom-apply{background:linear-gradient(135deg,#ab97f5,#5a2ed6);color:#fff;border:none;border-radius:50px;padding:8px 18px;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #371a92}
    .custom-error{font-size:.8rem;font-weight:900;color:#c62828;background:#ffcdd2;border-radius:8px;padding:5px 10px;margin-bottom:6px}
    /* add/sub custom op */
    .op-toggle-row{display:flex;gap:8px;margin-bottom:10px}
    .op-toggle{flex:1;padding:9px;border-radius:10px;border:2px solid #c4d7fd;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;background:#fff;color:#5a2ed6}
    .op-toggle.active{background:linear-gradient(135deg,#93b7fb,#2f6df6);border-color:#2f6df6;color:#fff}
    .section-label{font-size:.78rem;font-weight:900;color:#6d3ff0;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .mode-toggle-row{display:flex;gap:8px;margin-bottom:10px}

    /* ── EQUIVALENCE MODAL ── */
    .equiv-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
    .equiv-box{background:#fff;border-radius:28px;padding:28px 22px;max-width:360px;width:100%;border:4px solid #93b7fb;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .equiv-title{font-size:1.3rem;font-weight:900;color:#2f6df6;margin-bottom:6px}
    .equiv-sub{font-size:1rem;font-weight:700;color:#5a2ed6;margin-bottom:18px}
    .equiv-visual{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .equiv-side{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:140px}
    .equiv-eq{font-size:2rem;font-weight:900;color:#6d3ff0}
    .mini-h{width:34px;height:34px;background:linear-gradient(135deg,#ab97f5,#6236e0);border-radius:6px;border:2px solid #4a25b5}
    .mini-t{width:13px;height:34px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border-radius:4px;border:2px solid #1f54d6}
    .mini-o{width:13px;height:13px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:3px;border:2px solid #e65100}
    .equiv-next{background:linear-gradient(160deg,#5b8cf8,#1746b8);color:#fff;border:none;border-radius:50px;padding:13px 32px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0f2e86}
    .equiv-next:active{transform:translateY(3px)}

    /* ── NUMBER DISPLAY ── */
    .number-display{display:flex;gap:8px;align-items:flex-end;justify-content:center;background:linear-gradient(135deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1}
    .digit-box{display:flex;flex-direction:column;align-items:center;gap:3px}
    .digit-value{font-size:clamp(2rem,8.5vw,3.5rem);font-weight:900;line-height:1;min-width:42px;text-align:center}
    .digit-value.shake{animation:shake .35s ease}
    .digit-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .digit-hundreds{color:#6d3ff0}.digit-tens{color:#2f6df6}.digit-ones{color:#ff6f00}
    .simple-number-card{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(232,240,255,.9));border:2.5px solid #93b7fb;border-radius:20px;padding:12px 22px;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1}
    .simple-number-main{font-size:clamp(2rem,8vw,3.4rem);font-weight:900;color:#5a2ed6;line-height:1}
    .simple-number-sub{font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#2f6df6}
    .simple-number-divider{font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:#d7b7df}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

    /* ── TAP-TO-SLOT ── */
    .tap-layout{width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .tap-hint{font-size:.82rem;font-weight:900;color:#6d3ff0;text-align:center;background:rgba(255,255,255,.65);border-radius:50px;padding:5px 16px;border:1.5px solid #ab97f5}

    /* Pool */
    .pool-area{background:rgba(255,255,255,.55);border-radius:18px;padding:12px;border:2px solid #c4d7fd}
    .pool-label{font-size:.75rem;font-weight:900;color:#5a2ed6;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center}
    .pool-blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}

    /* Pool block wrappers */
    .pool-block{cursor:pointer;border-radius:10px;transition:transform .1s;position:relative}
    .pool-block.selected{filter:drop-shadow(0 0 8px #2f6df6) drop-shadow(0 0 4px #fff);transform:scale(1.12) translateY(-3px)}
    .pool-block.empty{opacity:.2;cursor:default;pointer-events:none}

    /* The actual block shapes (pool size) */
    .pb-hundred{width:72px;height:72px;background:linear-gradient(135deg,#ab97f5,#6236e0);border-radius:10px;border:3px solid #4a25b5;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .pb-ten{width:30px;height:72px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border-radius:7px;border:3px solid #1f54d6;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .pb-one{width:38px;height:38px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:9px;border:3px solid #e65100}

    /* Slots */
    .slots-area{display:flex;flex-direction:column;gap:8px}
    .slot-row{background:rgba(255,255,255,.65);border:3px dashed #93b7fb;border-radius:16px;padding:10px 12px;min-height:64px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
    .slot-row.can-accept{border-color:#2f6df6;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(47,109,246,.2)}
    .slot-row.wrong-flash{animation:slotWrong .35s ease}
    @keyframes slotWrong{0%,100%{background:rgba(255,255,255,.65);border-color:#93b7fb}50%{background:#ffcdd2;border-color:#f44336;box-shadow:0 0 0 3px rgba(244,67,54,.3)}}
    .slot-header{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .slot-h-header{color:#5a2ed6}.slot-t-header{color:#1f54d6}.slot-o-header{color:#e65100}
    .slot-blocks{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;min-height:28px}

    /* Mini blocks inside slots (tappable to return) */
    .sb-hundred{width:38px;height:38px;background:linear-gradient(135deg,#ab97f5,#6236e0);border-radius:7px;border:2.5px solid #4a25b5;cursor:pointer;transition:transform .1s;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .sb-hundred:active{transform:scale(.88)}.sb-hundred .ic{background:rgba(255,255,255,.35);border-radius:1px}
    .sb-ten{width:16px;height:38px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border-radius:5px;border:2.5px solid #1f54d6;cursor:pointer;transition:transform .1s}
    .sb-ten:active{transform:scale(.88)}
    .sb-one{width:18px;height:18px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:5px;border:2.5px solid #e65100;cursor:pointer;transition:transform .1s}
    .sb-one:active{transform:scale(.88)}
    .slot-empty-hint{font-size:.78rem;color:#bbb;font-weight:700;padding:4px 0}

    /* Place-value builder */
    .pv-goal-card{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:20px;padding:10px 16px;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1;min-width:min(92vw,430px)}
    .pv-visual-row{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
    .pv-unit-group{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.64);border:2px solid;border-radius:14px;padding:7px 9px;min-height:62px}
    .pv-unit-group.h{border-color:#ab97f5}.pv-unit-group.t{border-color:#93b7fb}.pv-unit-group.o{border-color:#ffd54f}
    .pv-goal-num{font-size:clamp(1.9rem,7vw,3.05rem);font-weight:900;line-height:1;min-width:.72em;text-align:center}
    .pv-goal-plus{font-size:1.55rem;color:#d7b7df;font-weight:900}
    .pv-expanded-form{font-size:clamp(1rem,4vw,1.45rem);font-weight:900;color:#5a2ed6;text-align:center;line-height:1.15}
    .gb-hundred{width:48px;height:48px;background:linear-gradient(135deg,#ab97f5,#6236e0);border-radius:8px;border:3px solid #4a25b5;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .gb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .gb-ten{width:19px;height:52px;background:linear-gradient(180deg,#93b7fb,#2f6df6);border-radius:6px;border:3px solid #1f54d6;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .gb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .gb-one{width:28px;height:28px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:7px;border:3px solid #e65100}
    .pv-built-line{background:rgba(255,255,255,.72);border:2px solid #c4d7fd;border-radius:999px;padding:7px 16px;font-size:.9rem;font-weight:900;color:#5a2ed6;position:relative;z-index:1;text-align:center}
    .pv-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .pv-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .pv-zone{min-height:142px;border:3px dashed;border-radius:18px;background:rgba(255,255,255,.56);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px rgba(90,46,214,.08);transition:transform .12s,background .12s}
    .pv-zone:active{transform:scale(.98)}
    .pv-zone-h{border-color:#6d3ff0;background:rgba(243,229,245,.68)}
    .pv-zone-t{border-color:#2f6df6;background:rgba(232,240,255,.7)}
    .pv-zone-o{border-color:#f9a825;background:rgba(255,248,225,.72)}
    .pv-zone-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .pv-zone-title{font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .pv-zone-h .pv-zone-title{color:#5a2ed6}.pv-zone-t .pv-zone-title{color:#1f54d6}.pv-zone-o .pv-zone-title{color:#e65100}
    .pv-zone-hint{font-size:.66rem;font-weight:900;color:#999;text-transform:uppercase;letter-spacing:.6px}
    .pv-zone-count{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:.9rem;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.12)}
    .pv-zone-h .pv-zone-count{color:#5a2ed6}.pv-zone-t .pv-zone-count{color:#1f54d6}.pv-zone-o .pv-zone-count{color:#e65100}
    .pv-block-space{position:relative;min-height:66px;display:flex;align-items:flex-end;justify-content:center;gap:5px;flex-wrap:wrap;flex:1}
    .pv-placeholder{opacity:.2;pointer-events:none}
    .pv-placed{cursor:pointer;animation:blockIn .18s ease}
    .pv-bank{background:rgba(255,255,255,.68);border:2px solid #c4d7fd;border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
    .pv-bank-title{width:100%;text-align:center;font-size:.78rem;font-weight:900;color:#5a2ed6;text-transform:uppercase;letter-spacing:1px}
    .pv-bank-btn{border:none;border-radius:16px;background:#fff;min-width:104px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .12s}
    .pv-bank-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
    .pv-bank-btn.h{color:#5a2ed6;border:2px solid #ab97f5}.pv-bank-btn.t{color:#1f54d6;border:2px solid #93b7fb}.pv-bank-btn.o{color:#e65100;border:2px solid #ffd54f}

    /* Direct v4-style place-value picker */
    .direct-progress{background:linear-gradient(135deg,#fff,#ecebff);border:2.5px solid #ab97f5;border-radius:999px;padding:8px 28px;font-size:clamp(1.2rem,4vw,1.9rem);font-weight:900;color:#5a2ed6;box-shadow:0 4px 0 #ab97f5;position:relative;z-index:1;min-width:150px;text-align:center}
    .direct-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
    .direct-section{background:rgba(255,255,255,.62);border:2px solid #c4d7fd;border-radius:18px;padding:12px 12px 14px;box-shadow:0 5px 18px rgba(90,46,214,.08)}
    .direct-label{font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
    .direct-label.tens{color:#1f54d6}.direct-label.ones{color:#e65100}
    .direct-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end}
    .direct-block{cursor:pointer;transition:transform .12s,filter .12s,opacity .12s;position:relative;flex-shrink:0}
    .direct-block:active{transform:scale(.92) translateY(3px)}
    .direct-block.off{opacity:.55;filter:saturate(.8)}
    .direct-block.on{opacity:1;transform:translateY(-3px);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 4px 8px rgba(47,109,246,.22))}
    .direct-block.on .pb-hundred{box-shadow:0 0 0 3px #fff,0 0 0 6px #ab97f5}
    .direct-block.on .pb-ten{box-shadow:0 0 0 3px #fff,0 0 0 6px #5b8cf8}
    .direct-block.on .pb-one{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffd54f}
    .direct-too-many{font-size:.9rem;font-weight:900;color:#1f54d6;background:rgba(255,255,255,.72);border:2px solid #c4d7fd;border-radius:999px;padding:6px 14px;text-align:center;position:relative;z-index:1}
    .direct-nav-gap{height:34px}

    /* Count the blocks */
    .count-title{background:rgba(255,255,255,.72);border:2px solid #c4d7fd;border-radius:18px;padding:8px 18px;text-align:center;position:relative;z-index:1;box-shadow:0 4px 14px rgba(90,46,214,.08)}
    .count-title-main{font-size:1.05rem;font-weight:900;color:#5a2ed6;text-transform:uppercase;letter-spacing:1px}
    .count-title-sub{font-size:.78rem;font-weight:900;color:#2f6df6;margin-top:2px}
    .count-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .count-section{background:rgba(255,255,255,.62);border:2px solid #c4d7fd;border-radius:18px;padding:12px 12px 14px;box-shadow:0 5px 18px rgba(90,46,214,.08)}
    .count-label{font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
    .count-label.h{color:#5a2ed6}.count-label.t{color:#1f54d6}.count-label.o{color:#e65100}
    .count-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;max-width:470px;margin:0 auto}
    .count-block{cursor:pointer;transition:transform .12s,filter .12s,opacity .12s;position:relative;flex-shrink:0}
    .count-block:active{transform:scale(.92) translateY(3px)}
    .count-block.off{opacity:.85;filter:saturate(.95)}
    .count-block.on{opacity:1;transform:translateY(-3px);filter:drop-shadow(0 4px 8px rgba(90,46,214,.2))}
    .count-block.on .pb-hundred,.count-block.on .pb-ten,.count-block.on .pb-one{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(91,140,248,.8)}

    /* Column Add */
    .column-card{background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(232,240,255,.9));border:3px solid #93b7fb;border-radius:22px;padding:18px 22px 20px;box-shadow:0 5px 0 #93b7fb,0 10px 24px rgba(91,140,248,.16);position:relative;z-index:1;min-width:min(92vw,360px)}
    .column-grid{display:grid;grid-template-columns:34px repeat(var(--col-count,3),54px);gap:7px;align-items:center;justify-content:center;font-family:'Nunito',system-ui,sans-serif}
    .column-digit,.column-plus,.column-answer-box{height:54px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,8vw,3rem);font-weight:900;line-height:1}
    .column-digit{color:#5a2ed6}
    .column-plus{color:#2f6df6}
    .column-blank{height:54px}
    .column-line{grid-column:1 / -1;height:4px;background:#6d3ff0;border-radius:99px;margin:3px 0}
    .column-final-line{grid-column:1 / -1;height:8px;border-top:4px solid #2f6df6;border-bottom:4px solid #2f6df6;border-radius:99px;margin-top:5px}
    .column-answer-box{background:#fff;border:3px solid #ab97f5;border-radius:14px;color:#2f6df6;box-shadow:0 3px 0 #ab97f5;min-width:54px}
    .column-answer-box.active{border-color:#2f6df6;box-shadow:0 0 0 4px rgba(47,109,246,.16),0 3px 0 #1746b8}
    .column-answer-box.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .keypad{display:grid;grid-template-columns:repeat(5,62px);gap:10px;justify-content:center;position:relative;z-index:1}
    .key-btn{height:58px;border:none;border-radius:17px;background:linear-gradient(160deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;color:#5a2ed6;font-family:inherit;font-size:1.55rem;font-weight:900;box-shadow:0 4px 0 #93b7fb;cursor:pointer}
    .key-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #93b7fb}
    .key-btn.clear{color:#2f6df6;grid-column:span 2;display:flex;align-items:center;justify-content:center}
    .key-btn.clear .btn-svg{width:26px;height:26px}
    .column-celebrate{background:rgba(255,255,255,.9);border:2.5px solid #93b7fb;border-radius:999px;padding:8px 18px;color:#2f6df6;font-size:clamp(1.05rem,4vw,1.55rem);font-weight:900;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1}

    /* Multiplication */
    .multiply-card{display:flex;flex-direction:column;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(232,240,255,.9));border:3px solid #93b7fb;border-radius:24px;padding:20px 24px;box-shadow:0 5px 0 #93b7fb,0 10px 24px rgba(91,140,248,.16);position:relative;z-index:1;min-width:min(92vw,430px)}
    .multiply-problem{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:#5a2ed6;font-size:clamp(2.1rem,9vw,4.1rem);font-weight:900;line-height:1}
    .times-symbol,.equals-symbol{color:#2f6df6}
    .multiply-answer-row{display:flex;align-items:center;justify-content:center;gap:8px}
    .multiply-answer-box{width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #ab97f5;border-radius:15px;color:#2f6df6;font-size:clamp(1.8rem,8vw,3rem);font-weight:900;box-shadow:0 3px 0 #ab97f5}
    .multiply-answer-box.active{border-color:#2f6df6;box-shadow:0 0 0 4px rgba(47,109,246,.16),0 3px 0 #1746b8}
    .multiply-answer-box.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .multiply-celebrate{background:rgba(255,255,255,.9);border:2.5px solid #93b7fb;border-radius:999px;padding:8px 18px;color:#2f6df6;font-size:clamp(1.05rem,4vw,1.55rem);font-weight:900;box-shadow:0 4px 0 #93b7fb;position:relative;z-index:1}
    .times-picker-label{font-size:.82rem;font-weight:900;color:#6d3ff0;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;text-align:center}

    /* ── PICK YOUR NUMBER ──
       The child chooses the difficulty, so the choice is the biggest thing on screen:
       one tap on a number IS the setting, no confirm step and no grown-up gesture.
       Tiles are 60px so a 4-year-old's fingertip cannot miss between them. */
    .pick-box{max-width:440px}
    .pick-question{font-size:clamp(1.25rem,5.5vw,1.7rem);font-weight:900;color:#5a2ed6;text-align:center;line-height:1.15}
    .pick-question span{color:#2f6df6}
    .pick-hint{font-size:.9rem;font-weight:900;color:#6d3ff0;opacity:.75;text-align:center;margin-top:3px}
    .pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
    .pick-btn{height:60px;border-radius:18px;border:3px solid #93b7fb;background:linear-gradient(160deg,#fff,#e8f0ff);color:#5a2ed6;font-family:inherit;font-size:1.6rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #93b7fb;transition:transform .1s}
    .pick-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #93b7fb}
    .pick-btn.active{background:linear-gradient(135deg,#93b7fb,#2f6df6);border-color:#2f6df6;color:#fff;box-shadow:0 4px 0 #1746b8}
    /* Second choice, deliberately quieter than the number tiles: a child can ignore it. */
    .pick-second{margin-top:16px;padding-top:12px;border-top:2.5px dashed #c4d7fd}
    .pick-second-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
    .pick-small-btn{height:34px;border-radius:11px;border:2px solid #c4d7fd;background:#fff;color:#5a2ed6;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer}
    .pick-small-btn.active{background:linear-gradient(135deg,#93b7fb,#2f6df6);border-color:#2f6df6;color:#fff;box-shadow:0 3px 0 #1746b8}
    @media (max-width:430px){.pick-grid{grid-template-columns:repeat(4,1fr)}.pick-second-grid{grid-template-columns:repeat(5,1fr)}}
    /* The difficulty pill in the top bar is the way back to the picker, so it has to
       look pressable — it is a wider target than the gear beside it. */
    .level-chip{display:flex;align-items:center;gap:5px;font-family:inherit;font-size:.85rem;font-weight:900;color:#2f6df6;background:linear-gradient(160deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:50px;padding:6px 13px;cursor:pointer;box-shadow:0 3px 0 #93b7fb;white-space:nowrap}
    .level-chip:active{transform:translateY(2px);box-shadow:0 1px 0 #93b7fb}
    .level-chip-caret{font-size:.7rem;opacity:.8}
    .level-chip.static{background:rgba(255,255,255,.65);border-color:transparent;box-shadow:none;color:#6d3ff0;cursor:default}

    /* ── COUNT BY: the same numbers read two ways at once ──
       Top strip = the skip-counting chant (12, 24, 36, ?).
       Ladder below = the very same numbers written as the times table.
       The child types into the ladder, so filling in the table IS counting on. */
    /* max-width, not just min-width: the chant strip is one long flex row, and a row of
       20 chips reports that whole length as the card's intrinsic width — which dragged the
       card wider than the phone and clipped both ends of every rung. Pinning both bounds
       fixes the card to the screen and lets .cb-chain scroll inside it, which is what its
       overflow-x was always for. */
    .countby-card{gap:10px;padding:15px 16px 17px;min-width:min(92vw,470px);max-width:min(92vw,470px)}
    .cb-chain{display:flex;align-items:center;gap:6px;width:100%;min-width:0;overflow-x:auto;padding:2px 2px 7px;scrollbar-width:none}
    .cb-chain::-webkit-scrollbar{display:none}
    .cb-chip{flex:0 0 auto;min-width:46px;padding:6px 11px;border-radius:999px;background:linear-gradient(160deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;color:#2f6df6;font-size:1.05rem;font-weight:900;text-align:center;box-shadow:0 3px 0 #93b7fb}
    .cb-chip.next{border-style:dashed;border-color:#2f6df6;color:#5a2ed6;animation:cbPulse 1.2s ease-in-out infinite}
    .cb-arrow{flex:0 0 auto;color:#5a2ed6;font-weight:900;opacity:.5}
    /* Height is budgeted against the viewport, not guessed: everything else on this
       screen (bars, title, chain, keypad) plus the corner mascot's fixed footprint
       costs ~620px, and the keypad must stay clear of the mascot on a phone. */
    .cb-ladder{display:flex;flex-direction:column;gap:6px;width:100%;max-height:clamp(140px,calc(100vh - 620px),290px);overflow-y:auto;padding:2px}
    .cb-rung{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:5px 12px;border-radius:14px;border:2.5px solid #c4d7fd;background:#fff;overflow:hidden}
    .cb-rung::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--fill,0%);background:linear-gradient(90deg,rgba(147,183,251,.5),rgba(47,109,246,.2));transition:width .35s ease}
    .cb-rung>*{position:relative;z-index:1}
    .cb-fact{font-size:1rem;font-weight:900;color:#5a2ed6;white-space:nowrap}
    .cb-fact b{color:#2f6df6;font-size:1.2rem}
    .cb-val{font-size:1.4rem;font-weight:900;color:#2f6df6;min-width:62px;text-align:right}
    .cb-rung.todo{opacity:.42;border-style:dashed}
    .cb-rung.todo .cb-val{color:#93b7fb}
    .cb-rung.active{border-color:#2f6df6;box-shadow:0 0 0 4px rgba(47,109,246,.16)}
    .cb-rung.wrong{animation:wrongShake .35s ease;border-color:#f44336}
    .cb-rung.fresh{animation:correctPop .5s ease}
    .cb-answer{display:flex;gap:5px}
    .cb-box{width:34px;height:40px;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid #ab97f5;border-radius:11px;color:#2f6df6;font-size:1.3rem;font-weight:900;box-shadow:0 2px 0 #ab97f5}
    .cb-box.active{border-color:#2f6df6;box-shadow:0 0 0 3px rgba(47,109,246,.18),0 2px 0 #1746b8}
    @keyframes cbPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.09);opacity:.72}}

    /* ── SCORE ROW: SPACE JOURNEY TRACK ── */
    .score-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:740px;gap:10px;position:relative;z-index:1}
    .score-badge{background:linear-gradient(135deg,#fff,#e8f0ff);border:2px solid #93b7fb;border-radius:50px;padding:5px 14px;font-size:.95rem;font-weight:900;color:#2f6df6;box-shadow:0 3px 8px rgba(91,140,248,.2);white-space:nowrap;display:flex;align-items:center;gap:4px}
    .score-badge span{color:#5a2ed6}
    .score-badge img{width:20px;height:20px;object-fit:contain}
    .journey-track{display:flex;align-items:center;gap:5px;padding:6px 10px;background:rgba(255,255,255,.88);border:2px solid #c4d7fd;border-radius:18px;box-shadow:0 3px 10px rgba(91,140,248,.12);flex:1;max-width:360px;min-width:0}
    .journey-node{width:36px;height:36px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 3px rgba(20,30,90,.25))}
    .journey-node.to{animation:destPulse 1.5s ease-in-out infinite alternate}
    @keyframes destPulse{from{transform:scale(1)}to{transform:scale(1.14)}}
    .journey-dots{flex:1;display:flex;align-items:center;justify-content:space-between;min-width:0;padding:0 2px}
    .journey-dot{width:9px;height:9px;border-radius:50%;background:#d3ddf5;flex-shrink:0}
    .journey-star{width:16px;height:16px;object-fit:contain;flex-shrink:0;animation:starPop .35s cubic-bezier(.34,1.56,.64,1)}
    .journey-rocket{width:30px;height:30px;object-fit:contain;transform:rotate(42deg);flex-shrink:0;animation:rocketPop .45s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 4px rgba(20,30,90,.3))}
    @keyframes starPop{from{transform:scale(0) rotate(-12deg)}to{transform:scale(1) rotate(0)}}
    @keyframes rocketPop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(42deg)}}
    @media (max-width:430px){
      .score-row{gap:6px}
      .score-badge{padding:5px 10px}
      .journey-track{gap:3px;padding:5px 7px}
      .journey-node{width:30px;height:30px}
      .journey-rocket{width:26px;height:26px}
      .journey-star{width:13px;height:13px}
      .journey-dot{width:7px;height:7px}
    }

    /* ── BUTTONS ── */
    .check-btn{background:linear-gradient(160deg,#8f6cee,#4a25b5);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #371a92;transition:transform .1s;position:relative;z-index:1}
    .check-btn:active{transform:translateY(4px)}
    .new-num-btn{background:linear-gradient(160deg,#93b7fb,#1f54d6);color:#fff;border:none;border-radius:50px;padding:12px 26px;font-family:inherit;font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0f2e86;transition:transform .1s;position:relative;z-index:1}
    .new-num-btn:active{transform:translateY(4px)}
    .next-btn{background:linear-gradient(160deg,#5b8cf8,#1746b8);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0f2e86;transition:transform .1s;position:relative;z-index:1}
    .next-btn:active{transform:translateY(4px)}

    /* ── NUMBER LINE ── */
    .prompt-bubble{background:linear-gradient(135deg,#fff,#e8f0ff);border:2.5px solid #93b7fb;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 #93b7fb;font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#333;text-align:center;position:relative;z-index:1}
    .target-num{display:inline-block;color:#2f6df6;font-size:1.3em;animation:pulse 1s infinite alternate}
    .start-num{display:inline-block;color:#5a2ed6;font-size:1.15em}
    .op-add{display:inline-block;color:#2e7d32;font-size:1.15em}
    .op-sub{display:inline-block;color:#c62828;font-size:1.15em}
    .eq-mark{color:#999}
    @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}
    .hop-counter{background:linear-gradient(135deg,#fff,#e8f5e9);border:2px solid #a5d6a7;border-radius:50px;padding:5px 16px;font-size:.9rem;font-weight:900;color:#2e7d32;position:relative;z-index:1}
    .char-inner{position:absolute;top:4px;transition:left .45s cubic-bezier(.34,1.56,.64,1);animation:float 2s ease-in-out infinite alternate;display:flex;align-items:flex-end}
    .char-inner .char-img{width:72px;height:72px;object-fit:contain;transform:rotate(42deg);filter:drop-shadow(0 4px 8px rgba(10,16,50,.4))}
    .char-missing{width:76px;height:76px}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}
    .number-line-wrapper{width:100%;max-width:740px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
    .number-line{display:flex;align-items:center;min-width:max-content;padding:8px 16px;position:relative}
    .nl-track{position:absolute;top:50%;left:0;right:0;height:12px;background:linear-gradient(90deg,#f44336,#ff9800,#ffeb3b,#4caf50,#2196f3,#6d3ff0,#2f6df6);border-radius:6px;transform:translateY(-50%);box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:0}
    .nl-number{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;cursor:pointer;border:none;position:relative;z-index:1;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s;flex-shrink:0}
    .nl-number:active{transform:scale(.9) translateY(3px)}
    .nl-number.start-marker{background:#fff!important;color:#5a2ed6!important;font-size:1.25rem;width:54px;height:54px;box-shadow:0 0 0 4px #2f6df6,0 5px 0 #0f2e86!important;animation:startPulse 1.1s ease-in-out infinite;z-index:2}
    @keyframes startPulse{0%,100%{box-shadow:0 0 0 4px #2f6df6,0 5px 0 #0f2e86;transform:scale(1)}50%{box-shadow:0 0 0 7px #5b8cf8,0 5px 0 #0f2e86;transform:scale(1.07)}}
    .nl-number.hop-path{outline:3px solid rgba(255,255,255,.75);outline-offset:2px}

/* ══ SOUND ══ */
const Sound = (() => {
  let _ctx=null,_muted=false;
  const ctx=()=>{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!_ctx)_ctx=new AC();if(_ctx.state==='suspended')_ctx.resume();return _ctx;};
  const tone=(c,freq,type,t,dur,vol,fe)=>{try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(freq,t);if(fe)o.frequency.exponentialRampToValueAtTime(fe,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}};
  return{
    setMuted(v){_muted=v;},
    tap(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;tone(c,880,'sine',n,.08,.12);tone(c,1320,'sine',n+.04,.06,.08);},
    twinkle(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;[523,659,784,1047,1319].forEach((f,i)=>tone(c,f,'sine',n+i*.07,.18,.14));},
    ding(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;[[523,0],[659,.06],[784,.12],[1047,.22],[1319,.32]].forEach(([f,t])=>tone(c,f,'sine',n+t,.55,.18));},
    wrong(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;tone(c,220,'sawtooth',n,.28,.1,100);},
    celebrate(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;[[523,0],[659,.1],[784,.2],[1047,.32],[784,.46],[1047,.58],[1319,.68],[1047,.82]].forEach(([f,t])=>tone(c,f,'sine',n+t,.2,.2));[1047,1319,1568,2093].forEach((f,i)=>tone(c,f,'sine',n+.9+i*.08,.15,.1));},
    hop(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;tone(c,400,'sine',n,.12,.12,600);},
    arrive(){if(_muted)return;const c=ctx();if(!c)return;const n=c.currentTime;tone(c,180,'sine',n,.55,.16,900);tone(c,90,'triangle',n,.5,.12,300);[[784,.4],[988,.5],[1175,.6],[1568,.72],[2093,.86]].forEach(([f,t])=>tone(c,f,'sine',n+t,.3,.18));}
  };
})();

/* ══ VOICE (Web Speech) ══ */

/* ══ UTILITIES ══ */
const getVisiblePlacesForRange = (min, max) => {
  if (max <= 10) return {h:false,t:false,o:true,counting:true};
  if (max <= 100) return {h:false,t:true,o:true,counting:false};
  return {h:true,t:true,o:true,counting:false};
};
const getVisiblePlaces = preset => getVisiblePlacesForRange(preset.min ?? 1, preset.max ?? 1000);
const isCounting = preset => getVisiblePlaces(preset).counting;
const decompose = (n, counting) => {
  if (counting) return {h:0,t:0,o:n};
  if (n === 1000) return {h:10,t:0,o:0};
  return {h:Math.floor(n/100),t:Math.floor((n%100)/10),o:n%10};
};
const calcTotal = (p, counting) => counting ? p.o : p.h*100+p.t*10+p.o;

/* ══ MASCOT ══ */
const MASCOTS={
  rocket:{idle:'assets/space/icons/rocket.png',happy:'assets/space/icons/rocket.png',oops:'assets/space/icons/comet.png'},
  star:{idle:'assets/space/icons/star.png',happy:'assets/space/icons/star.png',oops:'assets/space/icons/comet.png'},
};
function useMascot(){
  const [mood,setMood]=useState('idle');
  const [stamp,setStamp]=useState(0);
  const tRef=useRef(null);
  const trigger=useCallback((m,revertMs)=>{
    clearTimeout(tRef.current);
    setMood(m); setStamp(x=>x+1);
    if(revertMs) tRef.current=setTimeout(()=>setMood('idle'),revertMs);
  },[]);
  const happy=useCallback(()=>trigger('happy',2600),[trigger]);
  const oops=useCallback(()=>trigger('oops',1100),[trigger]);
  return {mood,stamp,happy,oops};
}
function Mascot({kind='rocket',mood,stamp}){
  const set=MASCOTS[kind]||MASCOTS.rocket;
  const src=mood==='happy'?set.happy:mood==='oops'?set.oops:set.idle;
  return(
    <div key={stamp} className={`mascot-corner ${mood!=='idle'?mood:''}`} aria-hidden="true">
      <img className="mascot-img" src={src} alt=""/>
    </div>
  );
}

/* ══ JOURNEY TRACK ══
   Shows the current leg: where we left, stars earned so far, the rocket,
   and the destination we are flying to. */
function JourneyTrack({progress}){
  const legIdx=Math.min(Math.floor(progress/LEG_LEN),JOURNEY_LEGS-1);
  const inLeg=Math.min(progress-legIdx*LEG_LEN,LEG_LEN);
  const from=JOURNEY_STOPS[legIdx],to=JOURNEY_STOPS[legIdx+1];
  const cells=[];
  for(let i=0;i<LEG_LEN;i++){
    if(i<inLeg)cells.push(<img key={`s${i}`} className="journey-star" src="assets/space/icons/fourstar-gold.png" alt=""/>);
    else cells.push(<span key={`d${i}`} className="journey-dot"/>);
  }
  cells.splice(inLeg,0,<img key={`r${inLeg}`} className="journey-rocket" src="assets/space/icons/rocket.png" alt=""/>);
  return(
    <div className="journey-track" aria-label={`Flying from ${from.title} to ${to.title}, ${inLeg} of ${LEG_LEN} stars`}>
      <img className="journey-node" src={from.icon} alt={from.title}/>
      <div className="journey-dots">{cells}</div>
      <img className="journey-node to" src={to.icon} alt={to.title}/>
    </div>
  );
}

/* ══ SETTINGS MODAL: NUMBER LINE + ADD/SUB ══ */
function LineSettings({current, onChange, customOp, onCustomOp, isAddSub, lineMax, onClose}){
  const [showLineCustom,setShowLineCustom]=useState(current.id==='lcustom');
  const [lcMin,setLcMin]=useState(current.id==='lcustom'?current.min??1:1);
  const [lcMax,setLcMax]=useState(current.id==='lcustom'?current.max??20:20);
  const [lcErr,setLcErr]=useState('');
  const [opMode,setOpMode]=useState(customOp?'custom':'random');
  const [cop,setCop]=useState(customOp?.op||'+');
  const [bMin,setBMin]=useState(customOp?.baseMin??1);
  const [bMax,setBMax]=useState(customOp?.baseMax??10);
  const [aMin,setAMin]=useState(customOp?.amtMin??1);
  const [aMax,setAMax]=useState(customOp?.amtMax??5);
  const [opErr,setOpErr]=useState('');
  const typedPanelOpen=showLineCustom||opMode==='custom';

  const applyLine=()=>{
    const mn=parseInt(lcMin),mx=parseInt(lcMax);
    if(isNaN(mn)||isNaN(mx)||mn<1||mx>30||mx<=mn){setLcErr('Min ≥ 1, Max ≤ 30, Max > Min');return;}
    onChange({id:'lcustom',icon:ICON_CUSTOM,tag:`${mn}–${mx}`,min:mn,max:mx,desc:'Custom'});
    setLcErr('');
    if(!isAddSub)onClose();
  };
  const applyOp=()=>{
    const activeLine=current.id==='lcustom'?{min:parseInt(lcMin),max:parseInt(lcMax)}:{min:current.min,max:current.max};
    const mn=activeLine.min,mx=activeLine.max;
    const bm=parseInt(bMin),bx=parseInt(bMax),am=parseInt(aMin),ax=parseInt(aMax);
    if([mn,mx,bm,bx,am,ax].some(Number.isNaN)||bm>bx||am>ax){setOpErr('Check the from-to ranges.');return;}
    const valid=[];
    for(let s=bm;s<=bx;s++){
      for(let a=am;a<=ax;a++){
        if(cop==='+'&&s+a<=mx&&s+a>=mn)valid.push(1);
        if(cop==='-'&&s-a>=mn&&s-a<=mx)valid.push(1);
      }
    }
    if(valid.length===0){setOpErr('No valid problems in this range. Try smaller numbers.');return;}
    onCustomOp(opMode==='custom'?{op:cop,baseMin:bm,baseMax:bx,amtMin:am,amtMax:ax}:null);
    onClose();
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Settings</div>
        <div className="section-label">Number Range</div>
        {/* One tap on a picture picks the range and gets straight back to playing —
            unless a grown-up has one of the typed panels open below, where the tap is
            a step in a longer edit and closing would throw their work away. */}
        {LINE_PRESETS.filter(p=>p.id!=='lcustom').map(p=>(
          <button key={p.id} className={`preset-btn ${current.id===p.id?'active':'inactive'}`} onClick={()=>{Sound.tap();onChange(p);if(!typedPanelOpen)onClose();}}>
            <img className="preset-tag-img" src={p.icon} alt=""/>
            <div className="preset-info"><div className="preset-name">{p.tag}</div><div className="preset-range">{p.desc}</div></div>
            {current.id===p.id&&<span>✓</span>}
          </button>
        ))}
        <button className={`preset-btn ${current.id==='lcustom'?'active':'inactive'}`} onClick={()=>{Sound.tap();setShowLineCustom(true);}}>
          <img className="preset-tag-img" src={ICON_CUSTOM} alt=""/>
          <div className="preset-info"><div className="preset-name">Custom</div><div className="preset-range">Set your own</div></div>
          {current.id==='lcustom'&&<span>✓</span>}
        </button>
        {showLineCustom&&(
          <div className="custom-range-box">
            {lcErr&&<div className="custom-error">{lcErr}</div>}
            <div className="custom-range-row">
              <label>From: <input className="custom-input" type="number" value={lcMin} onChange={e=>setLcMin(e.target.value)} min="1" max="29"/></label>
              <label>To: <input className="custom-input" type="number" value={lcMax} onChange={e=>setLcMax(e.target.value)} min="2" max="30"/></label>
              <button className="custom-apply" onClick={applyLine}>Set ✓</button>
            </div>
          </div>
        )}
        {isAddSub&&<>
          <div className="section-label" style={{marginTop:12}}>Problem Type</div>
          <div className="mode-toggle-row">
            <button className={`op-toggle ${opMode==='random'?'active':''}`} onClick={()=>setOpMode('random')}>Random</button>
            <button className={`op-toggle ${opMode==='custom'?'active':''}`} onClick={()=>setOpMode('custom')}>Custom Range</button>
          </div>
          {opMode==='custom'&&(
            <div className="custom-range-box">
              {opErr&&<div className="custom-error">{opErr}</div>}
              <div className="op-toggle-row">
                <button className={`op-toggle ${cop==='+'?'active':''}`} onClick={()=>setCop('+')}>+ Add</button>
                <button className={`op-toggle ${cop==='-'?'active':''}`} onClick={()=>setCop('-')}>− Subtract</button>
              </div>
              <div className="section-label">Start number: from – to</div>
              <div className="custom-range-row" style={{marginBottom:8}}>
                <input className="custom-input" type="number" value={bMin} onChange={e=>setBMin(e.target.value)}/><span style={{color:'#6d3ff0',fontWeight:900}}>–</span>
                <input className="custom-input" type="number" value={bMax} onChange={e=>setBMax(e.target.value)}/>
              </div>
              <div className="section-label">{cop==='+'?'Add':'Subtract'} amount: from – to</div>
              <div className="custom-range-row">
                <input className="custom-input" type="number" value={aMin} onChange={e=>setAMin(e.target.value)}/><span style={{color:'#6d3ff0',fontWeight:900}}>–</span>
                <input className="custom-input" type="number" value={aMax} onChange={e=>setAMax(e.target.value)}/>
              </div>
            </div>
          )}
          <button className="modal-close" style={{marginTop:10}} onClick={applyOp}>Apply</button>
        </>}
        {!isAddSub&&<button className="modal-close" onClick={onClose}>Done</button>}
      </div>
    </div>
  );
}

/* ══ MODE b1: WHAT NUMBER? ══ */
function BlocksGuided({onBack, journey, addProgress, trophies, journeyBg, score, setScore, muted, onToggleMute}){
  // Defaults start at the hardest preset in every game (owner rule, 2026-08-14):
  // BLOCKS_PRESETS[3] is 'Full 1 – 1000', the counterpart of Times Tables' 12 × 12.
  const [preset,setPreset]=useState(BLOCKS_PRESETS[3]);
  const visiblePlaces = useMemo(()=>getVisiblePlaces(preset),[preset]);
  const makeProblem = useCallback((p=BLOCKS_PRESETS[3])=>{
    const max=Math.min(999,p.max);
    const min=Math.min(Math.max(1,p.min),max);
    const n=rand(min,max);
    return decompose(n,isCounting(p));
  },[]);
  const [showSettings,setShowSettings]=useState(false);
  const [problem,setProblem]=useState(()=>makeProblem(BLOCKS_PRESETS[3]));
  const [selectedH,setSelectedH]=useState(()=>Array(problem.h).fill(false));
  const [selectedT,setSelectedT]=useState(()=>Array(problem.t).fill(false));
  const [selectedO,setSelectedO]=useState(()=>Array(problem.o).fill(false));
  const mascot=useMascot();
  const [confirmNew,setConfirmNew]=useState(false);
  const confirmT=useRef(null);
  const [won,setWon]=useState(false);
  const [confetti,setConf]=useState(false);
  const hCount=selectedH.filter(Boolean).length;
  const tCount=selectedT.filter(Boolean).length;
  const oCount=selectedO.filter(Boolean).length;
  const currentNumber=visiblePlaces.counting ? oCount : hCount*100+tCount*10+oCount;
  const correctNumber=calcTotal(problem,visiblePlaces.counting);
  const resetForProblem = useCallback((p)=>{
    setProblem(p); setSelectedH(Array(p.h).fill(false)); setSelectedT(Array(p.t).fill(false)); setSelectedO(Array(p.o).fill(false)); setWon(false);

function makeProbFromPreset(preset, customOp){
  const{min,max}=preset;
  if(customOp){
    const{op,baseMin,baseMax,amtMin,amtMax}=customOp;
    const valid=[];
    for(let s=baseMin;s<=baseMax;s++){
      for(let a=amtMin;a<=amtMax;a++){
        if(op==='+'&&s+a<=max&&s+a>=min)valid.push({start:s,op:'+',amount:a,answer:s+a});
        if(op==='-'&&s-a>=min&&s-a<=max)valid.push({start:s,op:'-',amount:a,answer:s-a});
      }
    }
    if(valid.length>0)return valid[rand(0,valid.length-1)];
    return makeProbFromPreset(preset,null); // fallback
  }
  const range=max-min,maxHop=Math.min(5,Math.max(1,Math.floor(range/3)));
  const op=Math.random()<.5?'+':'-';
  if(op==='+'){const s=rand(min,max-1),a=rand(1,Math.min(maxHop,max-s));return{start:s,op:'+',amount:a,answer:s+a};}
  else{const s=rand(min+1,max),a=rand(1,Math.min(maxHop,s-min));return{start:s,op:'-',amount:a,answer:s-a};}
}

              </div>);
            })}

            {Array.from({length:count},(_,i)=>{const n=min+i;return<button key={n} className={`nl-number ${n===prob.start&&!celebrating?'start-marker':''} ${n===prob.answer&&celebrating?'correct':''} ${pathSet.has(n)&&!celebrating?'hop-path':''} ${n===wrongId?'wrong':''} ${misses>=3&&n===prob.answer&&!celebrating?'hint-glow':''}`} style={nlColor(n)} onClick={()=>tap(n)}>{n}</button>;})}

/* ══ MODE c1: COLUMN ADD ══ */
const ones=n=>n%10;
const tens=n=>Math.floor((n%100)/10);

function isNoCarry(a,b){
  return ones(a)+ones(b)<=9 && tens(a)+tens(b)<=9;
}

function buildColumnAddProblems(preset){
  const valid=[];
  const ranges={
    tiny:{aMin:1,aMax:9,bMin:1,bMax:9},
    small20:{aMin:1,aMax:19,bMin:1,bMax:19},
    twoDigit:{aMin:1,aMax:99,bMin:1,bMax:99},
    big:{aMin:100,aMax:999,bMin:1,bMax:99},
  };
  const r=ranges[preset.id]||ranges.big;
  for(let a=r.aMin;a<=r.aMax;a++){
    for(let b=r.bMin;b<=r.bMax;b++){
      if(preset.id==='tiny'&&a+b>9) continue;
      if(preset.id!=='tiny'&&!isNoCarry(a,b)) continue;
      valid.push({a,b,answer:a+b});
    }
  }
  return valid;
}

function makeColumnAddProblem(preset=COLUMN_ADD_PRESETS[3]){
  const valid=buildColumnAddProblems(preset);
  return valid[rand(0,valid.length-1)];
}

function toColumnDigits(n,colCount){
  const chars=String(n).split('');
  return [...Array(Math.max(0,colCount-chars.length)).fill(''),...chars];
}

            {current.id===p.id&&<span>✓</span>}
          </button>
        ))}
        <button className="modal-close" onClick={onClose}>Done</button>
      </div>
    </div>
  );
}

          <div className="column-blank"/>
          {aDigits.map((d,i)=><div key={`a${i}`} className="column-digit">{d}</div>)}
          <div className="column-plus">+</div>
          {bDigits.map((d,i)=><div key={`b${i}`} className="column-digit">{d}</div>)}
          <div className="column-line"/>
          <div className="column-blank"/>
          {digits.map((d,i)=>(
            <div key={`ans${i}`} className={`column-answer-box ${nextIndex===i&&!won?'active':''} ${wrong?'wrong':''}`}>{d || (misses>=3?<span className="ghost-hint">{String(problem.answer)[i]}</span>:'_')}</div>
          ))}
          <div className="column-final-line"/>
        </div>
      </div>
      {won&&<div className="column-celebrate">{problem.a} + {problem.b} = {problem.answer}!</div>}
      {!won&&(
        <div className="keypad">
          {[1,2,3,4,5,6,7,8,9,0].map(n=><button key={n} className="key-btn" onClick={()=>tapDigit(n)}>{n}</button>)}
          <button className="key-btn clear" onClick={clear} aria-label="Clear"><BackspaceIcon/></button>
        </div>
      )}
      {won&&<button className="next-btn" onClick={next} aria-label="Next"><NextIcon/></button>}
    </div>
  );
}

/* ══ MODE m1: TIMES TABLES ══ */
function timesRangeLabel(range){
  return `${range.rowMax} × ${range.colMax}`;
}

function makeMultiplicationProblem(range=DEFAULT_TIMES_RANGE){
  const a=rand(1,range.rowMax);
  const b=rand(1,range.colMax);
  return {a,b,answer:a*b};
}

/* One number, tapped once. This used to be two grids (Rows and Columns) behind a
   Done button; a child asked for "the twelves" does not think in rows and columns,
   they think "how big". The tap sets both sides of the table and starts the game. */
function MultiplicationPicker({range,onChange,onClose}){
  useEffect(()=>{Voice.say('How big shall we go? Tap a number!');},[]);
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box pick-box" onClick={e=>e.stopPropagation()}>
        <div className="pick-question">How big? <span>{range.rowMax} × {range.colMax}</span></div>
        <div className="pick-hint">Tap a number</div>
        <div className="pick-grid">
          {TIMES_MAX_OPTIONS.map(n=>(
            <button key={n} className={`pick-btn ${range.rowMax===n&&range.colMax===n?'active':''}`}
              onClick={()=>{Sound.tap();onChange({rowMax:n,colMax:n});}}>{n}</button>
          ))}
        </div>
        <button className="modal-close" onClick={onClose}>Play!</button>
      </div>
    </div>
  );
}

function MultiplicationGame({onBack, journey, addProgress, trophies, journeyBg, score, setScore, muted, onToggleMute}){
  const [range,setRange]=useState(DEFAULT_TIMES_RANGE);
  // Opens on the picker: the child chooses how big before the first question.
  // Tapping "Play!" without choosing keeps the 12 × 12 default they arrived with.
  const [showSettings,setShowSettings]=useState(true);
  const [problem,setProblem]=useState(()=>makeMultiplicationProblem(DEFAULT_TIMES_RANGE));
  const answerLength=String(problem.answer).length;
  const mascot=useMascot();
  const [misses,setMisses]=useState(0);
  const [digits,setDigits]=useState(()=>Array(answerLength).fill(''));
  const [won,setWon]=useState(false);
  const [wrong,setWrong]=useState(false);
  const [confetti,setConf]=useState(false);
  const nextIndex=digits.findIndex(d=>d==='');

  const resetForProblem=useCallback(p=>{
    setProblem(p);
    setDigits(Array(String(p.answer).length).fill(''));
    setWon(false);
    setWrong(false);
    setMisses(0);
  },[]);

  // Silent while the picker is up, so it does not talk over "How big shall we go?".
  useEffect(()=>{if(showSettings)return;Voice.say(`${problem.a} times ${problem.b}?`);},[problem,showSettings]);

  const next=useCallback(()=>{
    resetForProblem(makeMultiplicationProblem(range));
  },[range,resetForProblem]);

  const applyRange=useCallback(nextRange=>{
    setRange(nextRange);
    resetForProblem(makeMultiplicationProblem(nextRange));
    setShowSettings(false);
  },[resetForProblem]);

  const clear=useCallback(()=>{
    Sound.setMuted(muted); Sound.tap();
    if(won) return;
    setDigits(Array(answerLength).fill(''));
    setWrong(false);
  },[muted,won,answerLength]);

  const tapDigit=useCallback(n=>{
    Sound.setMuted(muted); Sound.tap();
    if(won) return;
    setDigits(prev=>{
      const idx=prev.findIndex(d=>d==='');
      if(idx<0) return prev;
      const out=[...prev];
      out[idx]=String(n);
      return out;
    });
  },[muted,won]);

  useEffect(()=>{
    if(won || digits.some(d=>d==='')) return;
    const guess=digits.join('');
    Sound.setMuted(muted);
    if(guess===String(problem.answer)){
      setWon(true); setWrong(false); setConf(true);
      Sound.ding(); setTimeout(()=>Sound.celebrate(),200);
      mascot.happy();
      const arrived=addProgress();
      Voice.say(arrived?`${problem.a} times ${problem.b} is ${problem.answer}!`:`${problem.a} times ${problem.b} is ${problem.answer}! ${praise()}`);
      setScore(s=>s+1);
      setTimeout(()=>setConf(false),2500);
    }else{
      setWrong(true); Sound.wrong(); mascot.oops(); setMisses(m=>m+1);
      const ansStr=String(problem.answer);
      setTimeout(()=>{setDigits(prev=>prev.map((d,i)=>d===ansStr[i]?d:''));setWrong(false);},650);
    }
  },[digits,won,muted,problem,setScore,addProgress,answerLength]);

  return(
    <div className="screen multiply-screen" style={{'--game-bg':`url('${journeyBg}')`}}>
      <div className="screen-bg"/>
      {showSettings&&<MultiplicationPicker range={range} onChange={applyRange} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={onToggleMute} label={timesRangeLabel(range)}/>
      <ScoreRow score={score} journey={journey} trophies={trophies}/>
      <Mascot kind="star" mood={mascot.mood} stamp={mascot.stamp}/>
      <div className="count-title"><div className="count-title-main">Times Tables</div><div className="count-title-sub">Tap the answer!</div></div>
      <div className="multiply-card">
        <div className="multiply-problem">
          <span>{problem.a}</span>
          <span className="times-symbol">×</span>
          <span>{problem.b}</span>
          <span className="equals-symbol">=</span>
          <span>?</span>
        </div>
        <div className="multiply-answer-row">
          {digits.map((d,i)=>(
            <div key={i} className={`multiply-answer-box ${nextIndex===i&&!won?'active':''} ${wrong?'wrong':''}`}>{d || (misses>=3?<span className="ghost-hint">{String(problem.answer)[i]}</span>:'_')}</div>
          ))}
        </div>
      </div>
      {won&&<div className="multiply-celebrate">{problem.a} × {problem.b} = {problem.answer}!</div>}
      {!won&&(
        <div className="keypad">
          {[1,2,3,4,5,6,7,8,9,0].map(n=><button key={n} className="key-btn" onClick={()=>tapDigit(n)}>{n}</button>)}
          <button className="key-btn clear" onClick={clear} aria-label="Clear"><BackspaceIcon/></button>
        </div>
      )}
      {won&&<button className="next-btn" onClick={next} aria-label="Next"><NextIcon/></button>}
    </div>
  );
}

/* ══ MODE s1: COUNT BY ══
   Counting by 3 and the 3 times table are the same list of numbers. This game
   puts both on screen at once: the chant runs along the top (3 › 6 › 9 › ?) and
   the very same numbers are written underneath as multiplication. The child
   types the missing number straight into the table, so "count on one more jump"
   and "one more group of 3" are the same action. */
const countByLabel=cfg=>`Count by ${cfg.step}`;

/* "The child should be able to click the number they want to count, then get that
   setting" (owner, 2026-08-14). So the number tiles are the whole screen and the tap
   is the whole interaction — no Done button to find, no hold gesture to learn.
   How many jumps stays available underneath, quieter, for whoever wants it; changing
   it does not close the picker, so the number tap is always the last thing tapped. */
function CountByPicker({config,onChange}){
  const [upTo,setUpTo]=useState(config.upTo);
  // Leaving by any route keeps the jumps the child just set; onChange is a no-op
  // when nothing actually changed, so dismissing never wipes a ladder in progress.
  const done=()=>onChange({step:config.step,upTo});
  useEffect(()=>{Voice.say('Which number shall we count by? Tap it!');},[]);
  return(
    <div className="modal-overlay" onClick={done}>
      <div className="modal-box pick-box" onClick={e=>e.stopPropagation()}>
        <div className="pick-question">Count by…</div>
        <div className="pick-hint">Tap your number</div>
        <div className="pick-grid">
          {COUNT_BY_STEP_OPTIONS.map(n=>(
            <button key={n} className={`pick-btn ${config.step===n?'active':''}`}
              onClick={()=>{Sound.tap();Voice.say(`Count by ${n}!`);onChange({step:n,upTo});}}>{n}</button>
          ))}
        </div>
        <div className="pick-second">
          <div className="times-picker-label" style={{marginTop:0}}>How many jumps</div>
          <div className="pick-second-grid">
            {COUNT_BY_UPTO_OPTIONS.map(n=>(
              <button key={n} className={`pick-small-btn ${upTo===n?'active':''}`} onClick={()=>{Sound.tap();setUpTo(n);}}>{n}</button>
            ))}
          </div>
        </div>
        <button className="modal-close" onClick={done}>Play!</button>
      </div>
    </div>
  );
}

function CountByGame({onBack, journey, addProgress, trophies, journeyBg, score, setScore, muted, onToggleMute}){
  const [cfg,setCfg]=useState(DEFAULT_COUNT_BY);
  // Opens on the picker: the child names their number before the first rung.
  const [showSettings,setShowSettings]=useState(true);
  const [filled,setFilled]=useState(0);   // rungs finished and moved past
  const [won,setWon]=useState(false);     // current rung solved, waiting for Next
  const [digits,setDigits]=useState(()=>Array(String(DEFAULT_COUNT_BY.step).length).fill(''));
  const [misses,setMisses]=useState(0);
  const [wrong,setWrong]=useState(false);
  const [confetti,setConf]=useState(false);
  const mascot=useMascot();
  const ladderRef=useRef(null);
  const chainRef=useRef(null);

  const k=filled+1;                       // which multiple is being asked for
  const target=k*cfg.step;
  const shown=filled+(won?1:0);           // rungs drawn as complete
  const tableDone=won&&k>=cfg.upTo;
  const nextIndex=digits.findIndex(d=>d==='');

  /* One place moves the live rung, so the answer boxes always match it.
     Doing it in a single batch (not an effect) means there is never a render
     where the old digits sit against the new target. */
  const goToRung=useCallback((nextFilled,nextCfg)=>{
    const c=nextCfg||cfg;
    setFilled(nextFilled);
    setWon(false); setWrong(false); setMisses(0);
    setDigits(Array(String((nextFilled+1)*c.step).length).fill(''));
  },[cfg]);

  const next=useCallback(()=>{
    Sound.setMuted(muted); Sound.tap();
    goToRung(tableDone?0:filled+1);
  },[muted,tableDone,filled,goToRung]);

  /* Only restart the ladder when the numbers really moved — closing the picker on
     the same settings must not throw away the rungs already counted. */
  const applyConfig=useCallback(nextCfg=>{
    setShowSettings(false);
    if(nextCfg.step===cfg.step&&nextCfg.upTo===cfg.upTo)return;
    setCfg(nextCfg);
    goToRung(0,nextCfg);
  },[cfg,goToRung]);

  const clear=useCallback(()=>{
    Sound.setMuted(muted); Sound.tap();
    if(won) return;
    setDigits(prev=>prev.map(()=>''));
    setWrong(false);
  },[muted,won]);

  const tapDigit=useCallback(n=>{
    Sound.setMuted(muted); Sound.tap();
    if(won) return;
    setDigits(prev=>{
      const idx=prev.findIndex(d=>d==='');
      if(idx<0) return prev;
      const out=[...prev];
      out[idx]=String(n);
      return out;
    });
  },[muted,won]);

  /* Ask by chanting what is already on the ladder: "12, 24, 36. What comes next?"
     Silent while the picker is up, so it does not talk over the choosing prompt. */
  useEffect(()=>{
    if(showSettings)return;
    if(filled===0){Voice.say(`Let's count by ${cfg.step}. What number comes first?`);return;}
    const back=Math.min(3,filled);
    const tail=Array.from({length:back},(_,i)=>(filled-back+1+i)*cfg.step);
    Voice.say(`${tail.join(', ')}. What comes next?`);
  },[filled,cfg,showSettings]);

  useEffect(()=>{
    if(won||digits.some(d=>d==='')) return;
    Sound.setMuted(muted);
    if(digits.join('')===String(target)){
      setWon(true); setWrong(false);
      Sound.ding(); setTimeout(()=>Sound.celebrate(),200);
      mascot.happy();
      const arrived=addProgress();
      setScore(s=>s+1);
      if(k>=cfg.upTo){
        setConf(true); setTimeout(()=>setConf(false),2500);
        Voice.say(`${target}! You counted by ${cfg.step} all the way to ${target}. That is the ${cfg.step} times table!`);
      }else{
        // The bridge sentence: the number they just counted to, named as a times fact.
        Voice.say(arrived?`${target}! ${k} times ${cfg.step} is ${target}.`:`${target}! ${k} times ${cfg.step} is ${target}. ${praise()}`);
      }
    }else{
      setWrong(true); Sound.wrong(); mascot.oops(); setMisses(m=>m+1);
      const ansStr=String(target);
      setTimeout(()=>{setDigits(prev=>prev.map((d,i)=>d===ansStr[i]?d:''));setWrong(false);},650);
    }
  },[digits,won,muted,target,k,cfg,setScore,addProgress]);

  /* Keep the live rung and the tail of the chant on screen. 'nearest' scrolls only
     when the rung has actually left the window, so the numbers already counted stay
     in view for as long as they fit — that list is the lesson. It targets the rung
     the child is answering (`filled`), while the chant follows `shown`; re-running
     on an already-visible rung is a no-op, so the two never fight. */
  useEffect(()=>{
    const el=ladderRef.current;
    const row=el&&el.children[Math.min(filled,cfg.upTo-1)];
    /* Instant, not smooth: the chain's smooth scroll on the next line lands in the same
       frame and Chrome drops the ladder's animation, so the live rung silently stayed
       off-screen. Cheap to see with 12 rungs, unplayable with 20. */
    if(row) row.scrollIntoView({block:'nearest'});
    const chain=chainRef.current;
    if(chain) chain.scrollTo({left:chain.scrollWidth,behavior:'smooth'});
  },[filled,shown,cfg]);

  const chainNodes=[];
  for(let n=1;n<=shown;n++){
    if(n>1)chainNodes.push(<span key={`a${n}`} className="cb-arrow" aria-hidden="true">›</span>);
    chainNodes.push(<span key={`c${n}`} className="cb-chip">{n*cfg.step}</span>);
  }
  if(!tableDone){
    if(shown>0)chainNodes.push(<span key="aq" className="cb-arrow" aria-hidden="true">›</span>);
    chainNodes.push(<span key="cq" className="cb-chip next">?</span>);
  }
  const rungs=Array.from({length:cfg.upTo},(_,i)=>i+1);

  return(
    <div className="screen countby-screen" style={{'--game-bg':`url('${journeyBg}')`}}>
      <div className="screen-bg"/>
      {showSettings&&<CountByPicker config={cfg} onChange={applyConfig}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={onToggleMute} label={countByLabel(cfg)}/>
      <ScoreRow score={score} journey={journey} trophies={trophies}/>
      <Mascot kind="star" mood={mascot.mood} stamp={mascot.stamp}/>
      <div className="count-title"><div className="count-title-main">Count by {cfg.step}</div><div className="count-title-sub">same as the {cfg.step} times table</div></div>
      <div className="multiply-card countby-card">
        <div className="cb-chain" ref={chainRef} aria-label={`Counting by ${cfg.step}`}>{chainNodes}</div>
        <div className="cb-ladder" ref={ladderRef}>
          {rungs.map(n=>{
            const isDone=n<=shown;
            const isActive=!won&&n===k;
            const cls=isDone?`cb-rung done ${won&&n===shown?'fresh':''}`:isActive?`cb-rung active ${wrong?'wrong':''}`:'cb-rung todo';
            return(
              <div key={n} className={cls} style={{'--fill':`${isDone?Math.round(n/cfg.upTo*100):0}%`}}>
                <span className="cb-fact"><b>{n}</b> × {cfg.step} =</span>
                {isActive
                  ? <span className="cb-answer">{digits.map((d,i)=>(
                      <span key={i} className={`cb-box ${nextIndex===i?'active':''}`}>{d||(misses>=3?<span className="ghost-hint">{String(target)[i]}</span>:'_')}</span>
                    ))}</span>
                  : <span className="cb-val">{isDone?n*cfg.step:'?'}</span>}
              </div>
            );
          })}
        </div>
      </div>
      {tableDone&&<div className="multiply-celebrate">Counted by {cfg.step} to {cfg.step*cfg.upTo}!</div>}
      {!won&&(
        <div className="keypad">
          {[1,2,3,4,5,6,7,8,9,0].map(n=><button key={n} className="key-btn" onClick={()=>tapDigit(n)}>{n}</button>)}
          <button className="key-btn clear" onClick={clear} aria-label="Clear"><BackspaceIcon/></button>
        </div>
      )}
      {won&&<button className="next-btn" onClick={next} aria-label={tableDone?'Play again':'Next'}><NextIcon/></button>}
    </div>
  );
}

/* ══ APP ══ */
function App(){
  const [mode,setMode]=useState(null);
  // The journey (0..JOURNEY_TOTAL) is shared by every game and persists,
  // so the rocket keeps flying no matter which game is played.
  // Finished journeys become trophies (localStorage).
  const [journey,setJourneyState]=useState(()=>{try{const v=parseInt(localStorage.getItem('sm_journey')||'0',10)||0;return v>=JOURNEY_TOTAL||v<0?0:v;}catch(e){return 0;}});
  const [trophies,setTrophies]=useState(()=>{try{return parseInt(localStorage.getItem('sm_trophies')||'0',10)||0;}catch(e){return 0;}});
  const [arrivalIdx,setArrivalIdx]=useState(null);
  const arrivalT=useRef(null);
  const [scores,setScores]=useState({b1:0,b2:0,l2:0,c1:0,m1:0,s1:0});
  const [muted,setMutedState]=useState(()=>{try{return localStorage.getItem('sm_muted')==='1';}catch(e){return false;}});
  useEffect(()=>{Sound.setMuted(muted);Voice.muted=muted;},[]);
  useEffect(()=>()=>clearTimeout(arrivalT.current),[]);
  // Preload every journey background + icon so arriving somewhere new never flashes.
  useEffect(()=>{JOURNEY_STOPS.forEach(s=>{const a=new Image();a.src=s.bg;const b=new Image();b.src=s.icon;});},[]);
  const onToggleMute=useCallback(()=>setMutedState(m=>{const n=!m;Sound.setMuted(n);Voice.muted=n;try{localStorage.setItem('sm_muted',n?'1':'0');}catch(e){}return n;}),[]);
  const setScore=useCallback(mode=>fn=>setScores(s=>({...s,[mode]:fn(s[mode])})),[]);

  /* One correct answer = one step of the journey.
     Returns true when this step lands on a new stop (arrival overlay follows). */
  const addProgress=useCallback(()=>{
    const nj=Math.min(journey+1,JOURNEY_TOTAL);
    if(nj===journey)return false;
    setJourneyState(nj);
    try{localStorage.setItem('sm_journey',String(nj));}catch(e){}
    const arrived=nj%LEG_LEN===0;
    if(arrived){
      const stopIdx=nj/LEG_LEN;
      if(nj===JOURNEY_TOTAL){
        setTrophies(t=>{const n=t+1;try{localStorage.setItem('sm_trophies',String(n));}catch(e){}return n;});
      }
      clearTimeout(arrivalT.current);
      arrivalT.current=setTimeout(()=>{
        setArrivalIdx(stopIdx);
        Sound.arrive();
        const s=JOURNEY_STOPS[stopIdx];
        Voice.say(`${nj===JOURNEY_TOTAL?'Journey complete! ':''}You reached ${s.name}! ${s.fact}`);
      },1700);
    }
    return arrived;
  },[journey]);

  const journeyComplete=journey>=JOURNEY_TOTAL;
  const closeArrival=useCallback(()=>{
    Sound.tap();
    setArrivalIdx(null);
    if(journeyComplete){
      setJourneyState(0);
      try{localStorage.setItem('sm_journey','0');}catch(e){}
      Voice.say('A brand new journey begins. Blast off!');
    }else{
      Voice.say('Off we go!');
    }
  },[journeyComplete]);

  const locIdx=Math.min(Math.floor(journey/LEG_LEN),JOURNEY_LEGS);
  const journeyBg=JOURNEY_STOPS[locIdx].bg;
  const goHome=useCallback(()=>setMode(null),[]);

  const shared={onBack:goHome,journey,addProgress,trophies,journeyBg,muted,onToggleMute};
  let screen;
  if(mode==='b1')screen=<BlocksGuided {...shared} score={scores.b1} setScore={setScore('b1')}/>;
  else if(mode==='b2')screen=<BlocksFill {...shared} score={scores.b2} setScore={setScore('b2')}/>;
  else if(mode==='l2')screen=<NumberLineAddSub {...shared} score={scores.l2} setScore={setScore('l2')}/>;
  else if(mode==='c1')screen=<ColumnAdd {...shared} score={scores.c1} setScore={setScore('c1')}/>;
  else if(mode==='m1')screen=<MultiplicationGame {...shared} score={scores.m1} setScore={setScore('m1')}/>;
  else if(mode==='s1')screen=<CountByGame {...shared} score={scores.s1} setScore={setScore('s1')}/>;
  else screen=<Home onSelect={setMode} trophies={trophies} journey={journey}/>;
  return<>{screen}{arrivalIdx!=null&&<ArrivalOverlay stopIdx={arrivalIdx} complete={journeyComplete} onClose={closeArrival}/>}</>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  /* Offline support. Registration is best-effort: opened straight from a file
     the browser refuses it, and the games must still run. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function () {});
    });
  }
</script>
</body>
</html>
