<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Magic Math!</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
    body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}

    /* ── BG DECO ── */
    .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .bg-deco img{position:absolute;object-fit:contain;opacity:.3;animation:floatDeco linear infinite;filter:drop-shadow(0 2px 5px rgba(233,30,99,.16))}
    @keyframes floatDeco{0%{transform:translateY(110vh) translateX(0) rotate(0);opacity:0}12%{opacity:.34}86%{opacity:.28}100%{transform:translateY(-12vh) translateX(18px) rotate(360deg);opacity:0}}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

    /* ── HOME ── */
    .home{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;overflow:hidden}
    .home-bg{position:absolute;inset:0;background:url('bg-home.png') center/cover no-repeat;z-index:0}
    .home-tint{position:absolute;inset:0;background:rgba(252,228,236,.42);z-index:0}
    .home>*:not(.home-bg):not(.home-tint){position:relative;z-index:1}
    .home-rainbow{font-size:clamp(.9rem,3vw,1.4rem);letter-spacing:4px;animation:bounce 1.4s ease-in-out infinite alternate}
    .home-title{font-size:clamp(1.8rem,7vw,3.2rem);font-weight:900;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
    .home-title span{display:inline-block;animation:bounce 1.2s infinite alternate}
    .home-sub{font-size:clamp(.85rem,2.8vw,1.1rem);font-weight:900;color:#7b1fa2;background:rgba(255,255,255,.7);border-radius:50px;padding:6px 20px;box-shadow:0 2px 8px rgba(171,71,188,.2)}
    .mode-section{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:640px}
    .mode-section-label{font-size:.95rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:2px;background:rgba(255,255,255,.75);border-radius:50px;padding:5px 18px}
    .mode-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
    .mode-card{flex:1;min-width:130px;max-width:185px;border-radius:26px;padding:18px 12px 14px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
    .mode-card:active{transform:translateY(5px) scale(.96)}
    .mode-card-icon{width:88px;height:76px;line-height:1;display:flex;align-items:center;justify-content:center;overflow:visible}
    .mode-card-art{display:block;object-fit:contain}
    .mode-card-art.princess-art{width:72px;height:72px}
    .mode-card-art.unicorn-art{width:76px;height:76px}
    .mode-card-art.large-art{width:84px;height:84px}
    .mode-card-label{font-size:.9rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);text-align:center}
    .mode-card-sub{font-size:.66rem;font-weight:900;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.25);text-align:center;margin-top:-5px}
    .mode-card-stars{height:24px;display:flex;align-items:center;justify-content:center;gap:2px}
    .mode-card-stars img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.16))}
    .mc-pink  {background:linear-gradient(160deg,#f48fb1,#e91e63);box-shadow:0 7px 0 #ad1457,0 10px 20px rgba(233,30,99,.3)}
    .mc-purple{background:linear-gradient(160deg,#ce93d8,#7b1fa2);box-shadow:0 7px 0 #4a148c,0 10px 20px rgba(123,31,162,.3)}
    .mc-rose  {background:linear-gradient(160deg,#f06292,#c2185b);box-shadow:0 7px 0 #880e4f,0 10px 20px rgba(194,24,91,.3)}
    .mc-magic {background:linear-gradient(160deg,#ba68c8,#4a148c);box-shadow:0 7px 0 #311b92,0 10px 20px rgba(74,20,140,.3)}

    /* ── SCREEN ── */
    .screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 24px;gap:11px}
    .screen-bg{position:fixed;inset:0;background:url('bg-game.png') center/cover no-repeat;opacity:.07;z-index:0;pointer-events:none}
    .blocks-screen {background:linear-gradient(160deg,#fce4ec,#f8bbd0,#fce4ec)}
    .choose-screen {background:linear-gradient(160deg,#f3e5f5,#e1bee7,#f3e5f5)}
    .line-screen   {background:linear-gradient(160deg,#e8eaf6,#f3e5f5,#fce4ec)}
    .addsub-screen {background:linear-gradient(160deg,#fff3e0,#fce4ec,#f3e5f5)}

    /* ── TOP BAR ── */
    .top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:740px;gap:8px;position:relative;z-index:2}
    .back-btn{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:50px;padding:8px 14px;font-family:inherit;font-size:1.2rem;font-weight:900;color:#e91e63;cursor:pointer;box-shadow:0 4px 0 #f48fb1;transition:transform .1s;white-space:nowrap;line-height:1;min-width:52px}
    .back-btn:active{transform:translateY(3px)}
    .settings-btn,.sound-btn{background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:50px;padding:8px 13px;font-family:inherit;font-size:1.1rem;font-weight:900;color:#7b1fa2;cursor:pointer;box-shadow:0 4px 0 #ce93d8;transition:transform .1s;line-height:1;min-width:48px}
    .settings-btn:active,.sound-btn:active{transform:translateY(3px)}

    /* ── MODALS ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal-box{background:#fff;border-radius:28px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);border:3px solid #f48fb1;max-height:90vh;overflow-y:auto}
    .modal-title{font-size:1.2rem;font-weight:900;color:#7b1fa2;text-align:center;margin-bottom:14px}
    .preset-btn{width:100%;padding:12px 16px;border-radius:14px;border:3px solid;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .1s;margin-bottom:7px}
    .preset-btn:active{transform:scale(.97)}
    .preset-btn.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .preset-btn.inactive{background:#fff;border-color:#f8bbd0;color:#7b1fa2}
    .preset-tag{font-size:1.2rem}
    .preset-info{text-align:left;flex:1}
    .preset-name{font-size:.95rem;font-weight:900}
    .preset-range{font-size:.74rem;opacity:.7;font-weight:700}
    .modal-close{margin-top:8px;width:100%;padding:11px;border-radius:50px;border:none;background:linear-gradient(135deg,#f48fb1,#e91e63);color:#fff;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #ad1457}
    .modal-close:active{transform:translateY(3px)}
    /* custom range inputs */
    .custom-range-box{background:#fce4ec;border-radius:14px;padding:14px;margin-top:4px;border:2px solid #f48fb1}
    .custom-range-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
    .custom-range-row label{font-size:.85rem;font-weight:900;color:#7b1fa2;display:flex;align-items:center;gap:6px}
    .custom-input{width:68px;padding:6px 8px;border-radius:8px;border:2px solid #f48fb1;font-family:inherit;font-size:1rem;font-weight:900;color:#333;text-align:center}
    .custom-apply{background:linear-gradient(135deg,#ce93d8,#7b1fa2);color:#fff;border:none;border-radius:50px;padding:8px 18px;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #4a148c}
    .custom-error{font-size:.8rem;font-weight:900;color:#c62828;background:#ffcdd2;border-radius:8px;padding:5px 10px;margin-bottom:6px}
    /* add/sub custom op */
    .op-toggle-row{display:flex;gap:8px;margin-bottom:10px}
    .op-toggle{flex:1;padding:9px;border-radius:10px;border:2px solid #f8bbd0;font-family:inherit;font-size:.9rem;font-weight:900;cursor:pointer;background:#fff;color:#7b1fa2}
    .op-toggle.active{background:linear-gradient(135deg,#f48fb1,#e91e63);border-color:#e91e63;color:#fff}
    .section-label{font-size:.78rem;font-weight:900;color:#9c27b0;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .mode-toggle-row{display:flex;gap:8px;margin-bottom:10px}

    /* ── EQUIVALENCE MODAL ── */
    .equiv-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
    .equiv-box{background:#fff;border-radius:28px;padding:28px 22px;max-width:360px;width:100%;border:4px solid #f48fb1;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
    .equiv-title{font-size:1.3rem;font-weight:900;color:#e91e63;margin-bottom:6px}
    .equiv-sub{font-size:1rem;font-weight:700;color:#7b1fa2;margin-bottom:18px}
    .equiv-visual{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .equiv-side{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;max-width:140px}
    .equiv-eq{font-size:2rem;font-weight:900;color:#9c27b0}
    .mini-h{width:34px;height:34px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:6px;border:2px solid #6a1b9a}
    .mini-t{width:13px;height:34px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:4px;border:2px solid #c2185b}
    .mini-o{width:13px;height:13px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:3px;border:2px solid #e65100}
    .equiv-next{background:linear-gradient(160deg,#f06292,#ad1457);color:#fff;border:none;border-radius:50px;padding:13px 32px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #880e4f}
    .equiv-next:active{transform:translateY(3px)}

    /* ── NUMBER DISPLAY ── */
    .number-display{display:flex;gap:8px;align-items:flex-end;justify-content:center;background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 18px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1}
    .digit-box{display:flex;flex-direction:column;align-items:center;gap:3px}
    .digit-value{font-size:clamp(2rem,8.5vw,3.5rem);font-weight:900;line-height:1;min-width:42px;text-align:center}
    .digit-value.shake{animation:shake .35s ease}
    .digit-label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .digit-hundreds{color:#9c27b0}.digit-tens{color:#e91e63}.digit-ones{color:#ff6f00}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

    /* ── TAP-TO-SLOT ── */
    .tap-layout{width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .tap-hint{font-size:.82rem;font-weight:900;color:#9c27b0;text-align:center;background:rgba(255,255,255,.65);border-radius:50px;padding:5px 16px;border:1.5px solid #ce93d8}

    /* Pool */
    .pool-area{background:rgba(255,255,255,.55);border-radius:18px;padding:12px;border:2px solid #f8bbd0}
    .pool-label{font-size:.75rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center}
    .pool-blocks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}

    /* Pool block wrappers */
    .pool-block{cursor:pointer;border-radius:10px;transition:transform .1s;position:relative}
    .pool-block.selected{filter:drop-shadow(0 0 8px #e91e63) drop-shadow(0 0 4px #fff);transform:scale(1.12) translateY(-3px)}
    .pool-block.empty{opacity:.2;cursor:default;pointer-events:none}

    /* The actual block shapes (pool size) */
    .pb-hundred{width:64px;height:64px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:10px;border:3px solid #6a1b9a;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-hundred .ic{background:rgba(255,255,255,.38);border-radius:1px}
    .pb-ten{width:24px;height:64px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:7px;border:3px solid #c2185b;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .pb-ten .ic{background:rgba(255,255,255,.38);border-radius:2px}
    .pb-one{width:24px;height:24px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:6px;border:3px solid #e65100}

    /* Slots */
    .slots-area{display:flex;flex-direction:column;gap:8px}
    .slot-row{background:rgba(255,255,255,.65);border:3px dashed #f48fb1;border-radius:16px;padding:10px 12px;min-height:64px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
    .slot-row.can-accept{border-color:#e91e63;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(233,30,99,.2)}
    .slot-row.wrong-flash{animation:slotWrong .35s ease}
    @keyframes slotWrong{0%,100%{background:rgba(255,255,255,.65);border-color:#f48fb1}50%{background:#ffcdd2;border-color:#f44336;box-shadow:0 0 0 3px rgba(244,67,54,.3)}}
    .slot-header{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .slot-h-header{color:#7b1fa2}.slot-t-header{color:#c2185b}.slot-o-header{color:#e65100}
    .slot-blocks{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;min-height:28px}

    /* Mini blocks inside slots (tappable to return) */
    .sb-hundred{width:38px;height:38px;background:linear-gradient(135deg,#ce93d8,#8e24aa);border-radius:7px;border:2.5px solid #6a1b9a;cursor:pointer;transition:transform .1s;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:1px;padding:3px}
    .sb-hundred:active{transform:scale(.88)}.sb-hundred .ic{background:rgba(255,255,255,.35);border-radius:1px}
    .sb-ten{width:16px;height:38px;background:linear-gradient(180deg,#f48fb1,#e91e63);border-radius:5px;border:2.5px solid #c2185b;cursor:pointer;transition:transform .1s}
    .sb-ten:active{transform:scale(.88)}
    .sb-one{width:18px;height:18px;background:linear-gradient(135deg,#ffd54f,#f9a825);border-radius:5px;border:2.5px solid #e65100;cursor:pointer;transition:transform .1s}
    .sb-one:active{transform:scale(.88)}
    .slot-empty-hint{font-size:.78rem;color:#bbb;font-weight:700;padding:4px 0}

    /* Place-value builder */
    .pv-goal-card{display:flex;gap:8px;align-items:flex-end;justify-content:center;background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 16px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1;flex-wrap:wrap}
    .pv-goal-piece{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px}
    .pv-goal-num{font-size:clamp(1.7rem,7vw,3rem);font-weight:900;line-height:1}
    .pv-goal-label{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .pv-goal-divider{font-size:1.5rem;color:#d7b7df;font-weight:900;padding-bottom:4px}
    .pv-built-line{background:rgba(255,255,255,.72);border:2px solid #f8bbd0;border-radius:999px;padding:7px 16px;font-size:.9rem;font-weight:900;color:#7b1fa2;position:relative;z-index:1;text-align:center}
    .pv-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .pv-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .pv-zone{min-height:142px;border:3px dashed;border-radius:18px;background:rgba(255,255,255,.56);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px rgba(123,31,162,.08);transition:transform .12s,background .12s}
    .pv-zone:active{transform:scale(.98)}
    .pv-zone-h{border-color:#9c27b0;background:rgba(243,229,245,.68)}
    .pv-zone-t{border-color:#e91e63;background:rgba(252,228,236,.7)}
    .pv-zone-o{border-color:#f9a825;background:rgba(255,248,225,.72)}
    .pv-zone-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .pv-zone-title{font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
    .pv-zone-h .pv-zone-title{color:#7b1fa2}.pv-zone-t .pv-zone-title{color:#c2185b}.pv-zone-o .pv-zone-title{color:#e65100}
    .pv-zone-hint{font-size:.66rem;font-weight:900;color:#999;text-transform:uppercase;letter-spacing:.6px}
    .pv-zone-count{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:.9rem;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.12)}
    .pv-zone-h .pv-zone-count{color:#7b1fa2}.pv-zone-t .pv-zone-count{color:#c2185b}.pv-zone-o .pv-zone-count{color:#e65100}
    .pv-block-space{position:relative;min-height:66px;display:flex;align-items:flex-end;justify-content:center;gap:5px;flex-wrap:wrap;flex:1}
    .pv-placeholder{opacity:.2;pointer-events:none}
    .pv-placed{cursor:pointer;animation:blockIn .18s ease}
    .pv-bank{background:rgba(255,255,255,.68);border:2px solid #f8bbd0;border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
    .pv-bank-title{width:100%;text-align:center;font-size:.78rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px}
    .pv-bank-btn{border:none;border-radius:16px;background:#fff;min-width:104px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .12s}
    .pv-bank-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
    .pv-bank-btn.h{color:#7b1fa2;border:2px solid #ce93d8}.pv-bank-btn.t{color:#c2185b;border:2px solid #f48fb1}.pv-bank-btn.o{color:#e65100;border:2px solid #ffd54f}

    /* Direct v4-style place-value picker */
    .direct-progress{background:linear-gradient(135deg,#fff,#f3e5f5);border:2.5px solid #ce93d8;border-radius:999px;padding:8px 28px;font-size:clamp(1.2rem,4vw,1.9rem);font-weight:900;color:#7b1fa2;box-shadow:0 4px 0 #ce93d8;position:relative;z-index:1;min-width:150px;text-align:center}
    .direct-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
    .direct-section{background:rgba(255,255,255,.62);border:2px solid #f8bbd0;border-radius:18px;padding:12px 12px 14px;box-shadow:0 5px 18px rgba(123,31,162,.08)}
    .direct-label{font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
    .direct-label.tens{color:#c2185b}.direct-label.ones{color:#e65100}
    .direct-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end}
    .direct-block{cursor:pointer;transition:transform .12s,filter .12s,opacity .12s;position:relative;flex-shrink:0}
    .direct-block:active{transform:scale(.92) translateY(3px)}
    .direct-block.off{opacity:.28;filter:saturate(.55)}
    .direct-block.on{opacity:1;transform:translateY(-3px);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 4px 8px rgba(233,30,99,.22))}
    .direct-block.on .pb-hundred{box-shadow:0 0 0 3px #fff,0 0 0 6px #ce93d8}
    .direct-block.on .pb-ten{box-shadow:0 0 0 3px #fff,0 0 0 6px #f06292}
    .direct-block.on .pb-one{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffd54f}
    .direct-too-many{font-size:.9rem;font-weight:900;color:#c2185b;background:rgba(255,255,255,.72);border:2px solid #f8bbd0;border-radius:999px;padding:6px 14px;text-align:center;position:relative;z-index:1}
    .direct-nav-gap{height:34px}

    /* Count the blocks */
    .count-title{background:rgba(255,255,255,.72);border:2px solid #f8bbd0;border-radius:18px;padding:8px 18px;text-align:center;position:relative;z-index:1;box-shadow:0 4px 14px rgba(123,31,162,.08)}
    .count-title-main{font-size:1.05rem;font-weight:900;color:#7b1fa2;text-transform:uppercase;letter-spacing:1px}
    .count-title-sub{font-size:.78rem;font-weight:900;color:#e91e63;margin-top:2px}
    .count-answer-card{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:10px 16px;box-shadow:0 4px 0 #f48fb1;position:relative;z-index:1;display:flex;flex-direction:column;gap:7px;align-items:center;min-width:min(92vw,390px)}
    .count-place-row{display:flex;gap:14px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
    .count-place{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px}
    .count-place-num{font-size:clamp(1.5rem,6vw,2.5rem);font-weight:900;line-height:1}
    .count-place-label{font-size:.58rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px}
    .count-number{font-size:clamp(1.1rem,4vw,1.65rem);font-weight:900;color:#7b1fa2}
    .count-layout{width:100%;max-width:740px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
    .count-section{background:rgba(255,255,255,.62);border:2px solid #f8bbd0;border-radius:18px;padding:12px 12px 14px;box-shadow:0 5px 18px rgba(123,31,162,.08)}
    .count-label{font-size:.86rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center}
    .count-label.h{color:#7b1fa2}.count-label.t{color:#c2185b}.count-label.o{color:#e65100}
    .count-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;max-width:420px;margin:0 auto}
    .count-block{cursor:pointer;transition:transform .12s,filter .12s,opacity .12s;position:relative;flex-shrink:0}
    .count-block:active{transform:scale(.92) translateY(3px)}
    .count-block.off{opacity:.35;filter:saturate(.65)}
    .count-block.on{opacity:1;transform:translateY(-3px);filter:drop-shadow(0 4px 8px rgba(123,31,162,.2))}
    .count-block.on .pb-hundred,.count-block.on .pb-ten,.count-block.on .pb-one{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(240,98,146,.8)}

    /* ── SCORE ROW: FLOWER PROGRESS BAR ── */
    .score-row{display:flex;align-items:center;width:100%;max-width:740px;gap:10px;position:relative;z-index:1}
    .score-badge{background:linear-gradient(135deg,#fff,#fce4ec);border:2px solid #f48fb1;border-radius:50px;padding:5px 14px;font-size:.95rem;font-weight:900;color:#e91e63;box-shadow:0 3px 8px rgba(240,98,146,.2);white-space:nowrap}
    .score-badge span{color:#7b1fa2}
    .flower-progress{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:1}
    .hearts-row{display:flex;gap:3px}
    .heart-ico{font-size:1rem;transition:transform .2s}
    .heart-ico.lit{animation:heartPop .4s cubic-bezier(.34,1.56,.64,1)}
    @keyframes heartPop{from{transform:scale(0)}to{transform:scale(1)}}
    .flower-bar-track{position:relative;width:100%;max-width:180px;height:16px;background:rgba(255,255,255,.55);border-radius:999px;border:2px solid #f48fb1;overflow:visible}
    .flower-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#f48fb1,#ce93d8,#f48fb1);background-size:200% 100%;animation:barShimmer 2s linear infinite;transition:width .4s ease;min-width:0}
    @keyframes barShimmer{0%{background-position:0%}100%{background-position:200%}}
    .bar-flower{position:absolute;top:50%;transform:translate(-50%,-50%);opacity:.34;transition:opacity .3s,transform .3s;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(123,31,162,.22))}
    .bar-flower.lit{opacity:1;transform:translate(-50%,-66%) scale(1.34)}
    .flower-count{font-size:.7rem;font-weight:900;color:#9c27b0}

    /* ── BUTTONS ── */
    .check-btn{background:linear-gradient(160deg,#ba68c8,#6a1b9a);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #4a148c;transition:transform .1s;position:relative;z-index:1}
    .check-btn:active{transform:translateY(4px)}
    .new-num-btn{background:linear-gradient(160deg,#f48fb1,#c2185b);color:#fff;border:none;border-radius:50px;padding:12px 26px;font-family:inherit;font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #880e4f;transition:transform .1s;position:relative;z-index:1}
    .new-num-btn:active{transform:translateY(4px)}
    .next-btn{background:linear-gradient(160deg,#f06292,#ad1457);color:#fff;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:1.1rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #880e4f;transition:transform .1s;position:relative;z-index:1}
    .next-btn:active{transform:translateY(4px)}

    /* ── NUMBER LINE ── */
    .prompt-bubble{background:linear-gradient(135deg,#fff,#fce4ec);border:2.5px solid #f48fb1;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 #f48fb1;font-size:clamp(1.05rem,4vw,1.6rem);font-weight:900;color:#333;text-align:center;position:relative;z-index:1}
    .target-num{display:inline-block;color:#e91e63;font-size:1.3em;animation:pulse 1s infinite alternate}
    .start-num{display:inline-block;color:#7b1fa2;font-size:1.15em}
    .op-add{display:inline-block;color:#2e7d32;font-size:1.15em}
    .op-sub{display:inline-block;color:#c62828;font-size:1.15em}
    .eq-mark{color:#999}
    @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.22)}}
    .hop-counter{background:linear-gradient(135deg,#fff,#e8f5e9);border:2px solid #a5d6a7;border-radius:50px;padding:5px 16px;font-size:.9rem;font-weight:900;color:#2e7d32;position:relative;z-index:1}
    .char-wrap{width:100%;max-width:740px;position:relative;height:92px;overflow:visible;z-index:1}
    .char-inner{position:absolute;top:4px;transition:left .45s cubic-bezier(.34,1.56,.64,1);animation:float 2s ease-in-out infinite alternate;display:flex;align-items:flex-end}
    .char-inner img{width:76px;height:76px;object-fit:contain}
    .char-missing{width:76px;height:76px}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}
    .number-line-wrapper{width:100%;max-width:740px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
    .number-line{display:flex;align-items:center;min-width:max-content;padding:8px 16px;position:relative}
    .nl-track{position:absolute;top:50%;left:0;right:0;height:12px;background:linear-gradient(90deg,#f44336,#ff9800,#ffeb3b,#4caf50,#2196f3,#9c27b0,#e91e63);border-radius:6px;transform:translateY(-50%);box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:0}
    .nl-number{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;cursor:pointer;border:none;position:relative;z-index:1;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s;flex-shrink:0}
    .nl-number:active{transform:scale(.9) translateY(3px)}
    .nl-number.start-marker{background:#fff!important;color:#7b1fa2!important;font-size:1.25rem;width:54px;height:54px;box-shadow:0 0 0 4px #e91e63,0 5px 0 #880e4f!important;animation:startPulse 1.1s ease-in-out infinite;z-index:2}
    @keyframes startPulse{0%,100%{box-shadow:0 0 0 4px #e91e63,0 5px 0 #880e4f;transform:scale(1)}50%{box-shadow:0 0 0 7px #f06292,0 5px 0 #880e4f;transform:scale(1.07)}}
    .nl-number.hop-path{outline:3px solid rgba(255,255,255,.75);outline-offset:2px}
    .nl-number.correct{animation:correctPop .5s ease}
    .nl-number.wrong{animation:wrongShake .35s ease}
    @keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.55) rotate(-8deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
    .hop-strip{width:100%;max-width:740px;overflow-x:auto;padding:0 16px;-webkit-overflow-scrolling:touch;display:flex;min-width:0;position:relative;z-index:1}
    .hop-arrows{display:flex;align-items:flex-end;min-width:max-content;gap:0;padding:0 16px}
    .hop-cell{width:50px;display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0}
    .hop-cell.start-cell{width:54px}
    .hop-num-badge{font-size:.72rem;font-weight:900;padding:1px 3px;border-radius:4px;min-width:14px;text-align:center}
    .hop-num-add{color:#1b5e20;background:#c8e6c9}.hop-num-sub{color:#b71c1c;background:#ffcdd2}
    .hop-arrow-add{color:#2e7d32;font-size:1.35rem;font-weight:900;line-height:1}
    .hop-arrow-sub{color:#c62828;font-size:1.35rem;font-weight:900;line-height:1}
    .hop-dot{width:7px;height:7px;border-radius:50%;background:#e0e0e0;margin-bottom:4px}
    .start-flag{font-size:.65rem;font-weight:900;line-height:1;margin-bottom:4px;color:#7b1fa2}
    .inline-icon{width:1.05em;height:1.05em;object-fit:contain;vertical-align:-.14em}
    .home-cloud-row{display:flex;gap:96px;align-items:center;justify-content:center;min-height:72px;margin-bottom:-8px}
    .home-cloud{width:92px;object-fit:contain;opacity:.92;filter:drop-shadow(0 5px 10px rgba(156,39,176,.14))}
    .home-section-heading{display:flex;align-items:center;gap:8px}
    .section-icon{object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}

    /* ── CELEBRATE / WRONG TEXT ── */
    .celebrate-text{font-size:clamp(1.2rem,4.5vw,2rem);font-weight:900;text-align:center;color:#e91e63;text-shadow:0 3px 0 #9c27b0;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:1}
    .wrong-text{font-size:clamp(1.1rem,4vw,1.7rem);font-weight:900;text-align:center;color:#e91e63;animation:popIn .35s ease;position:relative;z-index:1}
    @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

    /* ── CONFETTI ── */
    .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
    .confetti-piece{position:absolute;animation:confettiFall linear forwards}
    @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useMemo, useRef, useEffect } = React;

/* ══ SOUND ══ */
const Sound = (() => {
  let _ctx=null,_muted=false;
  const ctx=()=>{if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();if(_ctx.state==='suspended')_ctx.resume();return _ctx;};
  const tone=(c,freq,type,t,dur,vol,fe)=>{try{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=type;o.frequency.setValueAtTime(freq,t);if(fe)o.frequency.exponentialRampToValueAtTime(fe,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}};
  return{
    setMuted(v){_muted=v;},
    tap(){if(_muted)return;const c=ctx(),n=c.currentTime;tone(c,880,'sine',n,.08,.12);tone(c,1320,'sine',n+.04,.06,.08);},
    twinkle(){if(_muted)return;const c=ctx(),n=c.currentTime;[523,659,784,1047,1319].forEach((f,i)=>tone(c,f,'sine',n+i*.07,.18,.14));},
    ding(){if(_muted)return;const c=ctx(),n=c.currentTime;[[523,0],[659,.06],[784,.12],[1047,.22],[1319,.32]].forEach(([f,t])=>tone(c,f,'sine',n+t,.55,.18));},
    wrong(){if(_muted)return;const c=ctx(),n=c.currentTime;tone(c,220,'sawtooth',n,.28,.1,100);},
    celebrate(){if(_muted)return;const c=ctx(),n=c.currentTime;[[523,0],[659,.1],[784,.2],[1047,.32],[784,.46],[1047,.58],[1319,.68],[1047,.82]].forEach(([f,t])=>tone(c,f,'sine',n+t,.2,.2));[1047,1319,1568,2093].forEach((f,i)=>tone(c,f,'sine',n+.9+i*.08,.15,.1));},
    hop(){if(_muted)return;const c=ctx(),n=c.currentTime;tone(c,400,'sine',n,.12,.12,600);},
    allFlowers(){if(_muted)return;const c=ctx(),n=c.currentTime;[523,659,784,1047,1319,1568,2093,1568,1319,1047].forEach((f,i)=>tone(c,f,'sine',n+i*.1,.2,.25));},
    heart(){if(_muted)return;const c=ctx(),n=c.currentTime;[[784,0],[1047,.12],[1319,.22]].forEach(([f,t])=>tone(c,f,'sine',n+t,.28,.2));}
  };
})();

/* ══ CONSTANTS ══ */
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const MAX_FLOWERS=50;
const CONFETTI_C=['#e91e63','#f06292','#9c27b0','#ce93d8','#ffd54f','#fff176','#f48fb1','#ba68c8','#ff8f00','#fff','#f8bbd0','#e1bee7'];
const NL_COLORS=[['#e91e63','#880e4f'],['#9c27b0','#4a148c'],['#673ab7','#311b92'],['#3f51b5','#1a237e'],['#2196f3','#0d47a1'],['#00bcd4','#006064'],['#4caf50','#1b5e20'],['#ff9800','#e65100'],['#f44336','#b71c1c'],['#e91e63','#880e4f']];
const TITLE_COLORS=['#e91e63','#f06292','#9c27b0','#7b1fa2','#3f51b5','#2196f3','#00bcd4','#4caf50','#ffeb3b','#ff9800','#e91e63','#9c27b0','#f06292','#ffd54f','#ab47bc','#e91e63'];
// Image-based bg deco sources
// Petals + sparkles float upward like magic dust
const BG_IMGS=[
  'icons/petal-pink.png','icons/petal-purple.png','icons/petal-yellow.png',
  'icons/sparkle.png','icons/star.png','icons/petal-pink.png',
  'icons/sparkle.png','icons/petal-purple.png','icons/star.png',
  'icons/petal-yellow.png','icons/sparkle.png','icons/petal-pink.png',
  'icons/star.png','icons/petal-purple.png','icons/sparkle.png'
];

const BLOCKS_PRESETS=[
  {id:'b10',  emoji:'🌸',tag:'1 – 10',   min:1,  max:10,  desc:'Counting mode'},
  {id:'b100', emoji:'🌷',tag:'11 – 100', min:11, max:100, desc:'Tens & ones'},
  {id:'b1000',emoji:'🌺',tag:'101 – 1000',min:101,max:1000,desc:'Hundreds'},
  {id:'bfull',emoji:'💜',tag:'Full',      min:1,  max:1000,desc:'1 – 1000'},
  {id:'bcustom',emoji:'✏️',tag:'Custom',  min:null,max:null,desc:'Set your own'},
];
const LINE_PRESETS=[
  {id:'l10', emoji:'🌸',tag:'1 – 10', min:1, max:10,desc:'First ten'},
  {id:'l20', emoji:'🌷',tag:'11 – 20',min:11,max:20,desc:'Teen numbers'},
  {id:'l30', emoji:'🌺',tag:'21 – 30',min:21,max:30,desc:'Twenties'},
  {id:'lfull',emoji:'💜',tag:'Full',  min:1, max:30,desc:'1 – 30'},
  {id:'lcustom',emoji:'✏️',tag:'Custom',min:null,max:null,desc:'Set your own'},
];
const CARD_ASSETS={
  b1:{src:'icons/unicorn-card-fixed.png',kind:'unicorn-art',label:'Build It character'},
  b2:{src:'icons/princess-card-clean.png',kind:'princess-art',label:'Fill the Right Block character'},
  l1:{src:'unicorn-fixed.png',kind:'unicorn-art large-art',label:'Hop to a Number character'},
  l2:{src:'princess.png',kind:'princess-art large-art',label:'Add and Subtract character'},
};

/* ══ UTILITIES ══ */
const isCounting = preset => preset.max <= 10 && preset.min >= 1 && preset.id !== 'bcustom';
const decompose = (n, counting) => {
  if (counting) return {h:0,t:0,o:n};
  if (n === 1000) return {h:10,t:0,o:0};
  return {h:Math.floor(n/100),t:Math.floor((n%100)/10),o:n%10};
};
const calcTotal = (p, counting) => counting ? p.o : p.h*100+p.t*10+p.o;

/* ══ SHARED COMPONENTS ══ */
function BgDeco(){
  const items=useMemo(()=>BG_IMGS.map((src,i)=>({src,id:i,left:rand(2,95),dur:rand(12,26),delay:rand(0,18),size:rand(18,36)})),[]);
  return(
    <div className="bg-deco">
      {items.map(it=>(
        <img key={it.id} src={it.src} alt=""
          style={{
            position:'absolute',left:`${it.left}%`,
            width:it.size,height:it.size,
            animation:`floatDeco ${it.dur}s ${it.delay}s linear infinite`
          }}/>
      ))}
    </div>
  );
}
function Confetti({active}){
  const p=useMemo(()=>Array.from({length:90},(_,i)=>({id:i,left:rand(0,100),delay:rand(0,900),dur:rand(1200,2400),color:CONFETTI_C[i%CONFETTI_C.length],size:rand(7,15),shape:i%4===0?'50%':i%4===1?'2px':'0',isF:i%6===0})),[]);
  if(!active)return null;
  return<div className="confetti-container">{p.map(x=><div key={x.id} className="confetti-piece" style={{left:`${x.left}%`,width:x.isF?'auto':x.size,height:x.isF?'auto':x.size,fontSize:x.isF?x.size+4:undefined,borderRadius:x.isF?undefined:x.shape,background:x.isF?'none':x.color,animationDuration:`${x.dur}ms`,animationDelay:`${x.delay}ms`}}>{x.isF?['🌸','🌺','🌷','⭐','💜'][x.id%5]:null}</div>)}</div>;
}

/* Character with image fallback */
function CharImg({src,fallback='' }){
  const [failed,setFailed]=useState(false);
  return failed?<span className="char-missing" aria-hidden="true"></span>:<img src={src} alt={fallback} style={{}} onError={()=>setFailed(true)}/>;
}

function Stars({count}){
  return <div className="mode-card-stars">{Array.from({length:count},(_,i)=><img key={i} src="icons/star.png" alt=""/>)}</div>;
}

function CardArt({id}){
  const asset=CARD_ASSETS[id];
  return <img className={`mode-card-art ${asset.kind}`} src={asset.src} alt={asset.label}/>;
}

/* ══ SCORE ROW ══ */
function ScoreRow({score,flowers,hearts}){
  const pct=(flowers/MAX_FLOWERS)*100;
  const milestones=[10,20,30,40,50];
  return(
    <div className="score-row">
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <img src="icons/star.png" alt="★" style={{width:34,height:34,objectFit:'contain',filter:'drop-shadow(0 2px 4px rgba(0,0,0,.2))'}}/>
        <div className="score-badge"><span>{score}</span></div>
      </div>
      <div className="flower-progress">
        <div className="hearts-row">
          {Array.from({length:5},(_,i)=>(
            <img key={i} src={i<hearts?'icons/heart-gem.png':'icons/heart-purple.png'} alt="♥"
              className={`heart-ico ${i<hearts?'lit':''}`}
              style={{width:22,height:22,objectFit:'contain',opacity:i<hearts?1:.2}}/>
          ))}
        </div>
        <div className="flower-bar-track">
          <div className="flower-bar-fill" style={{width:`${pct}%`}}/>
          {milestones.map(m=>(
            <img key={m} src="icons/star-purple.png" alt=""
              className={`bar-flower ${flowers>=m?'lit':''}`}
              style={{left:`${(m/MAX_FLOWERS)*100}%`,width:22,height:22,objectFit:'contain'}}/>
          ))}
        </div>
        <div className="flower-count">{flowers}/{MAX_FLOWERS}</div>
      </div>
    </div>
  );
}

/* Flower reward logic (shared) */
function useFlowerReward(flowers, setFlowers, hearts, setHearts, muted) {
  return useCallback(() => {
    Sound.setMuted(muted);
    setFlowers(f => {
      const nf = f + 1;
      if (nf === MAX_FLOWERS) {
        setHearts(5);
        setTimeout(() => Sound.allFlowers(), 300);
        return nf; // show 50/50 — reset on next round
      }
      if (nf % 10 === 0) {
        setHearts(h => Math.min(h + 1, 5));
        setTimeout(() => Sound.heart(), 200);
      }
      return nf;
    });
  }, [muted, setFlowers, setHearts]);
}

/* ══ SETTINGS MODAL: BLOCKS ══ */
function BlocksSettings({current, onChange, onClose}){
  const [showCustom,setShowCustom]=useState(current.id==='bcustom');
  const [cMin,setCMin]=useState(current.id==='bcustom'?current.min??1:1);
  const [cMax,setCMax]=useState(current.id==='bcustom'?current.max??100:100);
  const [err,setErr]=useState('');
  const apply=()=>{
    const mn=parseInt(cMin),mx=parseInt(cMax);
    if(isNaN(mn)||isNaN(mx)||mn<1||mx>1000||mx<=mn){setErr('Min ≥ 1, Max ≤ 1000, Max > Min');return;}
    onChange({id:'bcustom',emoji:'✏️',tag:`${mn}–${mx}`,min:mn,max:mx,desc:'Custom range'});
    onClose();
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Number Range</div>
        {BLOCKS_PRESETS.filter(p=>p.id!=='bcustom').map(p=>(
          <button key={p.id} className={`preset-btn ${current.id===p.id?'active':'inactive'}`} onClick={()=>{Sound.tap();onChange(p);onClose();}}>
            <span className="preset-tag">{p.emoji}</span>
            <div className="preset-info"><div className="preset-name">{p.tag}</div><div className="preset-range">{p.desc}</div></div>
            {current.id===p.id&&<span>✓</span>}
          </button>
        ))}

/* ══ SETTINGS MODAL: NUMBER LINE + ADD/SUB ══ */
function LineSettings({current, onChange, customOp, onCustomOp, isAddSub, lineMax, onClose}){
  const [showLineCustom,setShowLineCustom]=useState(current.id==='lcustom');
  const [lcMin,setLcMin]=useState(current.id==='lcustom'?current.min??1:1);
  const [lcMax,setLcMax]=useState(current.id==='lcustom'?current.max??20:20);
  const [lcErr,setLcErr]=useState('');
  const [opMode,setOpMode]=useState(customOp?'custom':'random');
  const [cop,setCop]=useState(customOp?.op||'+');
  const [bMin,setBMin]=useState(customOp?.baseMin??1);
  const [bMax,setBMax]=useState(customOp?.baseMax??10);
  const [aMin,setAMin]=useState(customOp?.amtMin??1);
  const [aMax,setAMax]=useState(customOp?.amtMax??5);
  const [opErr,setOpErr]=useState('');

  const applyLine=()=>{
    const mn=parseInt(lcMin),mx=parseInt(lcMax);
    if(isNaN(mn)||isNaN(mx)||mn<1||mx>30||mx<=mn){setLcErr('Min ≥ 1, Max ≤ 30, Max > Min');return;}
    onChange({id:'lcustom',emoji:'✏️',tag:`${mn}–${mx}`,min:mn,max:mx,desc:'Custom'});
    setLcErr('');
    if(!isAddSub)onClose();
  };
  const applyOp=()=>{
    const activeLine=current.id==='lcustom'?{min:parseInt(lcMin),max:parseInt(lcMax)}:{min:current.min,max:current.max};
    const mn=activeLine.min,mx=activeLine.max;
    const bm=parseInt(bMin),bx=parseInt(bMax),am=parseInt(aMin),ax=parseInt(aMax);
    if([mn,mx,bm,bx,am,ax].some(Number.isNaN)||bm>bx||am>ax){setOpErr('Check the from-to ranges.');return;}
    const valid=[];
    for(let s=bm;s<=bx;s++){
      for(let a=am;a<=ax;a++){
        if(cop==='+'&&s+a<=mx&&s+a>=mn)valid.push(1);
        if(cop==='-'&&s-a>=mn&&s-a<=mx)valid.push(1);
      }
    }
    if(valid.length===0){setOpErr('No valid problems in this range. Try smaller numbers.');return;}
    onCustomOp(opMode==='custom'?{op:cop,baseMin:bm,baseMax:bx,amtMin:am,amtMax:ax}:null);
    onClose();
  };
  return(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">Settings</div>
        <div className="section-label">Number Range</div>
        {LINE_PRESETS.filter(p=>p.id!=='lcustom').map(p=>(
          <button key={p.id} className={`preset-btn ${current.id===p.id?'active':'inactive'}`} onClick={()=>{Sound.tap();onChange(p);}}>
            <span className="preset-tag">{p.emoji}</span>
            <div className="preset-info"><div className="preset-name">{p.tag}</div><div className="preset-range">{p.desc}</div></div>
            {current.id===p.id&&<span>✓</span>}
          </button>
        ))}
        <button className={`preset-btn ${current.id==='lcustom'?'active':'inactive'}`} onClick={()=>{Sound.tap();setShowLineCustom(true);}}>
          <span className="preset-tag">✏️</span>
          <div className="preset-info"><div className="preset-name">Custom</div><div className="preset-range">Set your own</div></div>
          {current.id==='lcustom'&&<span>✓</span>}
        </button>
        {showLineCustom&&(
          <div className="custom-range-box">
            {lcErr&&<div className="custom-error">{lcErr}</div>}
            <div className="custom-range-row">
              <label>From: <input className="custom-input" type="number" value={lcMin} onChange={e=>setLcMin(e.target.value)} min="1" max="29"/></label>
              <label>To: <input className="custom-input" type="number" value={lcMax} onChange={e=>setLcMax(e.target.value)} min="2" max="30"/></label>
              <button className="custom-apply" onClick={applyLine}>Set ✓</button>
            </div>
          </div>
        )}
        {isAddSub&&<>
          <div className="section-label" style={{marginTop:12}}>Problem Type</div>
          <div className="mode-toggle-row">
            <button className={`op-toggle ${opMode==='random'?'active':''}`} onClick={()=>setOpMode('random')}>🎲 Random</button>
            <button className={`op-toggle ${opMode==='custom'?'active':''}`} onClick={()=>setOpMode('custom')}>✏️ Custom Range</button>
          </div>
          {opMode==='custom'&&(
            <div className="custom-range-box">
              {opErr&&<div className="custom-error">{opErr}</div>}
              <div className="op-toggle-row">
                <button className={`op-toggle ${cop==='+'?'active':''}`} onClick={()=>setCop('+')}>➕ Add</button>
                <button className={`op-toggle ${cop==='-'?'active':''}`} onClick={()=>setCop('-')}>➖ Subtract</button>
              </div>
              <div className="section-label">Start number: from – to</div>
              <div className="custom-range-row" style={{marginBottom:8}}>
                <input className="custom-input" type="number" value={bMin} onChange={e=>setBMin(e.target.value)}/><span style={{color:'#9c27b0',fontWeight:900}}>–</span>
                <input className="custom-input" type="number" value={bMax} onChange={e=>setBMax(e.target.value)}/>
              </div>
              <div className="section-label">{cop==='+'?'Add':'Subtract'} amount: from – to</div>
              <div className="custom-range-row">
                <input className="custom-input" type="number" value={aMin} onChange={e=>setAMin(e.target.value)}/><span style={{color:'#9c27b0',fontWeight:900}}>–</span>
                <input className="custom-input" type="number" value={aMax} onChange={e=>setAMax(e.target.value)}/>
              </div>
            </div>
          )}
          <button className="modal-close" style={{marginTop:10}} onClick={applyOp}>Apply</button>
        </>}
        {!isAddSub&&<button className="modal-close" onClick={onClose}>Done</button>}
      </div>
    </div>
  );
}

/* ══ TAP-TO-SLOT SHARED LOGIC ══ */
function useBlockGame({target, isCnt, isGuided, maxPool, onWin}) {
  const [selected, setSelected] = useState(null);
  const [placed, setPlaced] = useState({h:0,t:0,o:0});
  const [wrongSlot, setWrongSlot] = useState(null);

  const reset = useCallback((newTarget, newCounting) => {
    setSelected(null); setPlaced({h:0,t:0,o:0}); setWrongSlot(null);
  }, []);

  const tapPool = useCallback((type) => {
    Sound.tap();
    setSelected(p => p === type ? null : type);
  }, []);

  const tapSlot = useCallback((slotType) => {
    if (!selected) return;
    if (selected === slotType) {
      const maxForSlot = isGuided ? decompose(target, isCnt)[slotType] : maxPool[slotType];
      if (placed[slotType] >= maxForSlot) return;
      const np = {...placed, [slotType]: placed[slotType]+1};
      const total = calcTotal(np, isCnt);
      if (total > target) {
        Sound.wrong();
        setWrongSlot(slotType); setTimeout(()=>setWrongSlot(null), 360);
        return;
      }
      Sound.twinkle();
      setPlaced(np); setSelected(null);
      if (total === target) onWin(np);
    } else {
      Sound.wrong();
      setWrongSlot(slotType); setTimeout(()=>setWrongSlot(null), 360);
    }
  }, [selected, placed, target, isCnt, isGuided, maxPool, onWin]);

  const returnBlock = useCallback((type) => {
    if (placed[type] <= 0) return;
    Sound.tap();
    setPlaced(p => ({...p, [type]: p[type]-1}));
    setSelected(null);
  }, [placed]);

  return { selected, placed, wrongSlot, tapPool, tapSlot, returnBlock, reset };
}

/* ══ MODE b1: WHAT NUMBER? ══ */
function BlocksGuided({onBack, flowers, hearts, setFlowers, setHearts, score, setScore}){
  const [preset,setPreset]=useState(BLOCKS_PRESETS[1]);
  const makeProblem = useCallback((p=BLOCKS_PRESETS[1])=>{
    const max=Math.min(999,p.max);
    const min=Math.min(Math.max(1,p.min),max);
    const n=rand(min,max);
    return decompose(n,false);
  },[]);
  const [showSettings,setShowSettings]=useState(false);
  const [muted,setMuted]=useState(false);
  const [problem,setProblem]=useState(()=>makeProblem(BLOCKS_PRESETS[1]));
  const [selectedH,setSelectedH]=useState(()=>Array(problem.h).fill(false));
  const [selectedT,setSelectedT]=useState(()=>Array(problem.t).fill(false));
  const [selectedO,setSelectedO]=useState(()=>Array(problem.o).fill(false));
  const [won,setWon]=useState(false);
  const [confetti,setConf]=useState(false);
  const addFlower = useFlowerReward(flowers,setFlowers,hearts,setHearts,muted);
  const hCount=selectedH.filter(Boolean).length;
  const tCount=selectedT.filter(Boolean).length;
  const oCount=selectedO.filter(Boolean).length;
  const currentNumber=hCount*100+tCount*10+oCount;
  const correctNumber=problem.h*100+problem.t*10+problem.o;
  const resetForProblem = useCallback((p)=>{
    setProblem(p); setSelectedH(Array(p.h).fill(false)); setSelectedT(Array(p.t).fill(false)); setSelectedO(Array(p.o).fill(false)); setWon(false);
  },[]);
  const nextProblem = useCallback(()=>{
    if(flowers===MAX_FLOWERS){setFlowers(0);setHearts(0);}
    resetForProblem(makeProblem(preset));
  },[flowers,setFlowers,setHearts,resetForProblem,makeProblem,preset]);
  const applyPreset = p => { setPreset(p); resetForProblem(makeProblem(p)); setShowSettings(false); };
  const toggle = useCallback((type,i)=>{
    Sound.tap();
    if(won) return;
    const setter = type==='h'?setSelectedH:type==='t'?setSelectedT:setSelectedO;
    setter(prev=>prev.map((v,idx)=>idx===i?!v:v));
  },[won]);

  useEffect(()=>{
    if(won) return;
    if(hCount===problem.h&&tCount===problem.t&&oCount===problem.o){
      setWon(true); setConf(true); Sound.setMuted(muted); Sound.ding(); setTimeout(()=>Sound.celebrate(),200);
      setScore(s=>s+1); addFlower();
      setTimeout(()=>setConf(false),2600);
    }
  },[hCount,tCount,oCount,problem,won,muted,setScore,addFlower]);

  const renderCountSection = (type,label,count,selected) => {
    if(count<=0) return null;
    return(
      <div className="count-section">
        <div className={`count-label ${type}`}>{label}</div>
        <div className="count-row">
          {selected.map((isOn,i)=>(
            <div key={i} className={`count-block ${isOn?'on':'off'}`} onClick={()=>toggle(type,i)}>
              {type==='h'&&<div className="pb-hundred">{Array.from({length:100},(_,j)=><div key={j} className="ic"/>)}</div>}
              {type==='t'&&<div className="pb-ten">{Array.from({length:10},(_,j)=><div key={j} className="ic"/>)}</div>}
              {type==='o'&&<div className="pb-one"/>}
            </div>
          ))}
        </div>
      </div>
    );
  };

  return(
    <div className="screen blocks-screen">
      <div className="screen-bg"/>
      {showSettings&&<BlocksSettings current={preset} onChange={applyPreset} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={()=>setMuted(m=>{Sound.setMuted(!m);return !m;})} label={preset.tag}/>
      <ScoreRow score={score} flowers={flowers} hearts={hearts}/>

          <div className="count-place"><div className="count-place-num digit-tens">{tCount}</div><div className="count-place-label digit-tens">tens</div></div>
          <div className="count-place"><div className="count-place-num digit-ones">{oCount}</div><div className="count-place-label digit-ones">ones</div></div>
        </div>

        <div className="count-layout">

/* ══ MODE b2: FILL THE RIGHT BLOCK ══ */
function BlocksFill({onBack, flowers, hearts, setFlowers, setHearts, score, setScore}){
  const [preset,setPreset]=useState(BLOCKS_PRESETS[1]);
  const [showSettings,setShowSettings]=useState(false);
  const [muted,setMuted]=useState(false);
  const makeFillTarget = useCallback((p)=>{
    const max=Math.min(999,p.max);
    const min=Math.min(Math.max(1,p.min),max);
    return rand(min,max);
  },[]);
  const [target,setTarget]=useState(()=>rand(11,99));
  const [won,setWon]=useState(false);
  const [confetti,setConf]=useState(false);
  const [selectedHundreds,setSelectedHundreds]=useState(()=>Array(10).fill(false));
  const [selectedTens,setSelectedTens]=useState(()=>Array(10).fill(false));
  const [selectedOnes,setSelectedOnes]=useState(()=>Array(10).fill(false));
  const addFlower = useFlowerReward(flowers,setFlowers,hearts,setHearts,muted);
  const targetParts = useMemo(()=>decompose(target,false),[target]);
  const hundredsCount = selectedHundreds.filter(Boolean).length;
  const tensCount = selectedTens.filter(Boolean).length;
  const onesCount = selectedOnes.filter(Boolean).length;
  const built = hundredsCount*100 + tensCount*10 + onesCount;
  const showH = targetParts.h > 0;

  const resetSelection = useCallback(()=>{
    setSelectedHundreds(Array(10).fill(false));
    setSelectedTens(Array(10).fill(false));
    setSelectedOnes(Array(10).fill(false));
  },[]);

  const startNextRound = useCallback(() => {
    if(flowers===MAX_FLOWERS){setFlowers(0);setHearts(0);}
    setTarget(makeFillTarget(preset)); setWon(false); resetSelection();
  },[preset,flowers,setFlowers,setHearts,resetSelection,makeFillTarget]);

  const newNum = () => {
    setTarget(makeFillTarget(preset)); setWon(false); resetSelection();
  };
  const applyPreset=p=>{setPreset(p);setTarget(makeFillTarget(p));setWon(false);resetSelection();};
  const toggleHundred = useCallback((i)=>{
    Sound.tap();
    if(won) return;
    setSelectedHundreds(prev=>{
      const nextOn = !prev[i];
      return prev.map((_,idx)=>nextOn ? idx<=i : idx<i);
    });
  },[won]);
  const toggleTen = useCallback((i)=>{
    Sound.tap();
    if(won) return;
    setSelectedTens(prev=>{
      const nextOn = !prev[i];
      return prev.map((_,idx)=>nextOn ? idx<=i : idx<i);
    });
  },[won]);
  const toggleOne = useCallback((i)=>{
    Sound.tap();
    if(won) return;
    setSelectedOnes(prev=>{
      const nextOn = !prev[i];
      return prev.map((_,idx)=>nextOn ? idx<=i : idx<i);
    });
  },[won]);

  useEffect(()=>{
    if(won || built !== target) return;
    setWon(true); setConf(true); Sound.setMuted(muted); Sound.ding(); setTimeout(()=>Sound.celebrate(),200);
    setScore(s=>s+1); addFlower();
    setTimeout(()=>setConf(false),2600);
  },[built,target,won,muted,setScore,addFlower]);

  return(
    <div className="screen choose-screen">
      <div className="screen-bg"/>
      {showSettings&&<BlocksSettings current={preset} onChange={applyPreset} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={()=>setMuted(m=>{Sound.setMuted(!m);return !m;})} label={preset.tag}/>
      <ScoreRow score={score} flowers={flowers} hearts={hearts}/>
      <PlaceValueGoal target={target} parts={targetParts} showH={showH} showT={true}/>
      <div className="direct-progress">{built} / {target}</div>
      {built>target&&!won&&<div className="direct-too-many">Too many! Tap one to remove.</div>}
      {!won&&<div className="tap-hint">Tap blocks to build the number</div>}
      {!won&&(
        <div className="direct-layout">
          {showH&&<div className="direct-section">
            <div className="direct-label" style={{color:'#7b1fa2'}}>Hundreds — tap to pick!</div>
            <div className="direct-row">
              {selectedHundreds.map((isOn,i)=>(
                <div key={i} className={`direct-block ${isOn?'on':'off'}`} onClick={()=>toggleHundred(i)}>
                  <div className="pb-hundred">{Array.from({length:100},(_,j)=><div key={j} className="ic"/>)}</div>
                </div>
              ))}
            </div>
          </div>}
          <div className="direct-section">
            <div className="direct-label tens">Tens — tap to pick!</div>
            <div className="direct-row">
              {selectedTens.map((isOn,i)=>(
                <div key={i} className={`direct-block ${isOn?'on':'off'}`} onClick={()=>toggleTen(i)}>
                  <div className="pb-ten">{Array.from({length:10},(_,j)=><div key={j} className="ic"/>)}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="direct-section">
            <div className="direct-label ones">Ones — tap to pick!</div>
            <div className="direct-row">
              {selectedOnes.map((isOn,i)=>(
                <div key={i} className={`direct-block ${isOn?'on':'off'}`} onClick={()=>toggleOne(i)}>
                  <div className="pb-one"/>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      {won&&<div className="celebrate-text">You built it!</div>}
      <div className="direct-nav-gap"/>
      <button className={won?'next-btn':'new-num-btn'} onClick={won?startNextRound:newNum}>{won?'Next Number':'New Number'}</button>
    </div>
  );
}

/* ══ MODE l1: HOP TO A NUMBER ══ */
function NumberLineHop({onBack, flowers, hearts, setFlowers, setHearts, score, setScore}){
  const [preset,setPreset]=useState(LINE_PRESETS[0]);
  const [showSettings,setShowSettings]=useState(false);
  const [muted,setMuted]=useState(false);
  const [pos,setPos]=useState(LINE_PRESETS[0].min);
  const [target,setTarget]=useState(()=>rand(LINE_PRESETS[0].min+1,LINE_PRESETS[0].max));
  const [celebrating,setCel]=useState(false);
  const [confetti,setConf]=useState(false);
  const [correctId,setCorrId]=useState(null);
  const [hops,setHops]=useState(0);
  const startRef=useRef(LINE_PRESETS[0].min);
  const addFlower=useFlowerReward(flowers,setFlowers,hearts,setHearts,muted);

  const next=useCallback(()=>{
    if(flowers===MAX_FLOWERS){setFlowers(0);setHearts(0);}
    const{min,max}=preset;const p=rand(min,max-1);
    startRef.current=p;setPos(p);setTarget(rand(p+1,max));setCel(false);setCorrId(null);setHops(0);
  },[preset,flowers,setFlowers,setHearts]);
  const applyPreset=p=>{setPreset(p);const st=rand(p.min,p.max-1);startRef.current=st;setPos(st);setTarget(rand(st+1,p.max));setCel(false);setCorrId(null);setHops(0);};
  const tap=useCallback((n)=>{
    Sound.setMuted(muted);if(celebrating)return;
    if(n===target){
      setPos(n);setCorrId(n);setCel(true);setConf(true);
      Sound.ding();setTimeout(()=>Sound.celebrate(),200);
      setScore(s=>s+1);addFlower();
      setHops(Math.abs(n-startRef.current));
      setTimeout(()=>setConf(false),2500);
    }else{Sound.hop();setPos(n);setHops(Math.abs(n-startRef.current));}
  },[target,celebrating,muted,addFlower,setScore]);

  const{min,max}=preset;const count=max-min+1;
  const nlColor=n=>{const[bg,sh]=NL_COLORS[(n-min)%NL_COLORS.length];return{background:bg,boxShadow:`0 4px 0 ${sh}`};};
  const charIdx=pos-min;const charPct=count>1?(charIdx/(count-1))*100*(count/(count+1)):0;

  return(
    <div className="screen line-screen">
      <div className="screen-bg"/>
      {showSettings&&<LineSettings current={preset} onChange={applyPreset} customOp={null} onCustomOp={()=>{}} isAddSub={false} lineMax={max} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={()=>setMuted(m=>{Sound.setMuted(!m);return !m;})} label={preset.tag}/>
      <ScoreRow score={score} flowers={flowers} hearts={hearts}/>
      {celebrating?<div className="celebrate-text">You hopped to {target}! {hops} hops!</div>:<div className="prompt-bubble">Hop to <span className="target-num">{target}</span>!</div>}
      {hops>0&&!celebrating&&<div className="hop-counter">{pos>startRef.current?'→':'←'} {hops} hop{hops!==1?'s':''} from {startRef.current}</div>}
      <div className="char-wrap">
        <div className="char-inner" style={{left:`clamp(0px, calc(${charPct}% - 38px), calc(100% - 76px))`}}>
          <CharImg src="unicorn-fixed.png"/>
        </div>
      </div>
      <div className="number-line-wrapper">
        <div className="number-line">
          <div className="nl-track"/>
          {Array.from({length:count},(_,i)=>{const n=min+i;return<button key={n} className={`nl-number ${n===pos&&!celebrating&&n===startRef.current?'start-marker':n===pos&&!celebrating?'current':''} ${n===correctId?'correct':''}`} style={nlColor(n)} onClick={()=>tap(n)}>{n}</button>;})}
        </div>
      </div>
      {celebrating&&<button className="next-btn" onClick={next}>Next</button>}
    </div>
  );
}

/* ══ MODE l2: ADD & SUBTRACT ══ */
function makeProbFromPreset(preset, customOp){
  const{min,max}=preset;
  if(customOp){
    const{op,baseMin,baseMax,amtMin,amtMax}=customOp;
    const valid=[];
    for(let s=baseMin;s<=baseMax;s++){
      for(let a=amtMin;a<=amtMax;a++){
        if(op==='+'&&s+a<=max&&s+a>=min)valid.push({start:s,op:'+',amount:a,answer:s+a});
        if(op==='-'&&s-a>=min&&s-a<=max)valid.push({start:s,op:'-',amount:a,answer:s-a});
      }
    }
    if(valid.length>0)return valid[rand(0,valid.length-1)];
    return makeProbFromPreset(preset,null); // fallback
  }
  const range=max-min,maxHop=Math.min(5,Math.max(1,Math.floor(range/3)));
  const op=Math.random()<.5?'+':'-';
  if(op==='+'){const s=rand(min,max-1),a=rand(1,Math.min(maxHop,max-s));return{start:s,op:'+',amount:a,answer:s+a};}
  else{const s=rand(min+1,max),a=rand(1,Math.min(maxHop,s-min));return{start:s,op:'-',amount:a,answer:s-a};}
}

function NumberLineAddSub({onBack, flowers, hearts, setFlowers, setHearts, score, setScore}){
  const [preset,setPreset]=useState(LINE_PRESETS[0]);
  const [customOp,setCustomOp]=useState(null);
  const [showSettings,setShowSettings]=useState(false);
  const [muted,setMuted]=useState(false);
  const [prob,setProb]=useState(()=>makeProbFromPreset(LINE_PRESETS[0],null));
  const [celebrating,setCel]=useState(false);
  const [wrongId,setWrong]=useState(null);
  const [confetti,setConf]=useState(false);
  const addFlower=useFlowerReward(flowers,setFlowers,hearts,setHearts,muted);

  const next=useCallback(()=>{
    if(flowers===MAX_FLOWERS){setFlowers(0);setHearts(0);}
    setProb(makeProbFromPreset(preset,customOp));setCel(false);setWrong(null);
  },[preset,customOp,flowers,setFlowers,setHearts]);

  const applyPreset=p=>{setPreset(p);setProb(makeProbFromPreset(p,customOp));setCel(false);setWrong(null);};
  const applyCustomOp=op=>{setCustomOp(op);setProb(makeProbFromPreset(preset,op));setCel(false);setWrong(null);};

  const tap=useCallback((n)=>{
    Sound.setMuted(muted);if(celebrating)return;
    if(n===prob.answer){setCel(true);setConf(true);Sound.ding();setTimeout(()=>Sound.celebrate(),200);setScore(s=>s+1);addFlower();setTimeout(()=>setConf(false),2500);}
    else{setWrong(n);Sound.wrong();setTimeout(()=>setWrong(null),400);}
  },[prob,celebrating,muted,addFlower,setScore]);

  const{min,max}=preset;const count=max-min+1;
  const nlColor=n=>{const[bg,sh]=NL_COLORS[(n-min)%NL_COLORS.length];return{background:bg,boxShadow:`0 4px 0 ${sh}`};};
  const pathSet=new Set();
  if(prob.op==='+'){for(let i=prob.start+1;i<=prob.answer;i++)pathSet.add(i);}
  else{for(let i=prob.answer;i<prob.start;i++)pathSet.add(i);}
  const ordPath=prob.op==='+'?Array.from({length:prob.amount},(_,i)=>prob.start+1+i):Array.from({length:prob.amount},(_,i)=>prob.start-1-i);
  const charPos=celebrating?prob.answer:prob.start;
  const charIdx=charPos-min;const charPct=count>1?(charIdx/(count-1))*100*(count/(count+1)):0;
  const topLabel=customOp?`Custom ✏️`:preset.tag;

  return(
    <div className="screen addsub-screen">
      <div className="screen-bg"/>
      {showSettings&&<LineSettings current={preset} onChange={applyPreset} customOp={customOp} onCustomOp={applyCustomOp} isAddSub={true} lineMax={max} onClose={()=>setShowSettings(false)}/>}
      <Confetti active={confetti}/>
      <BgDeco/>
      <TopBar onBack={onBack} onSettings={()=>setShowSettings(true)} muted={muted} onToggleMute={()=>setMuted(m=>{Sound.setMuted(!m);return !m;})} label={topLabel}/>
      <ScoreRow score={score} flowers={flowers} hearts={hearts}/>
      {celebrating?<div className="celebrate-text">{prob.start} {prob.op} {prob.amount} = {prob.answer}!</div>
        :<div className="prompt-bubble"><span className="start-num">{prob.start}</span>{' '}{prob.op==='+'?<span className="op-add">+ {prob.amount} →</span>:<span className="op-sub">− {prob.amount} ←</span>}{' '}<span className="eq-mark">=</span>{' '}<span className="target-num">?</span></div>}
      <div className="char-wrap">
        <div className="char-inner" style={{left:`clamp(0px, calc(${charPct}% - 38px), calc(100% - 76px))`}}>
          <CharImg src="princess.png"/>
        </div>
      </div>
      <div className="hop-strip">
        <div className="hop-arrows">
          {Array.from({length:count},(_,i)=>{const n=min+i;const hi=ordPath.indexOf(n);const inPath=hi>=0;const isStart=n===prob.start&&!celebrating;const arrow=inPath?(prob.op==='+'?'→':'←'):null;
            return(<div key={i} className={`hop-cell ${isStart?'start-cell':''}`}>
              {isStart?<span className="start-flag">START</span>:inPath?<span className={prob.op==='+'?'hop-num-badge hop-num-add':'hop-num-badge hop-num-sub'}>{hi+1}</span>:<span style={{height:18,display:'block'}}/>}
              {inPath?<span className={prob.op==='+'?'hop-arrow-add':'hop-arrow-sub'}>{arrow}</span>:<span className="hop-dot"/>}
            </div>);
          })}
        </div>
      </div>
      <div className="number-line-wrapper">
        <div className="number-line">
          <div className="nl-track"/>
          {Array.from({length:count},(_,i)=>{const n=min+i;return<button key={n} className={`nl-number ${n===prob.start&&!celebrating?'start-marker':''} ${n===prob.answer&&celebrating?'correct':''} ${pathSet.has(n)&&!celebrating?'hop-path':''} ${n===wrongId?'wrong':''}`} style={nlColor(n)} onClick={()=>tap(n)}>{n}</button>;})}
        </div>
      </div>
      {celebrating&&<button className="next-btn" onClick={next}>Next</button>}
    </div>
  );
}

/* ══ APP ══ */
function App(){
  const [mode,setMode]=useState(null);
  // Extra reward progress resets when the child leaves an activity.
  const [flowers,setFlowers]=useState(0);
  const [hearts,setHearts]=useState(0);
  const [scores,setScores]=useState({b1:0,b2:0,l1:0,l2:0});
  const setScore=useCallback(mode=>fn=>setScores(s=>({...s,[mode]:fn(s[mode])})),[]);
  const goHome=useCallback(()=>{setFlowers(0);setHearts(0);setMode(null);},[]);

  if(mode==='b1')return<BlocksGuided onBack={goHome} flowers={flowers} hearts={hearts} setFlowers={setFlowers} setHearts={setHearts} score={scores.b1} setScore={setScore('b1')}/>;
  if(mode==='b2')return<BlocksFill   onBack={goHome} flowers={flowers} hearts={hearts} setFlowers={setFlowers} setHearts={setHearts} score={scores.b2} setScore={setScore('b2')}/>;
  if(mode==='l1')return<NumberLineHop onBack={goHome} flowers={flowers} hearts={hearts} setFlowers={setFlowers} setHearts={setHearts} score={scores.l1} setScore={setScore('l1')}/>;
  if(mode==='l2')return<NumberLineAddSub onBack={goHome} flowers={flowers} hearts={hearts} setFlowers={setFlowers} setHearts={setHearts} score={scores.l2} setScore={setScore('l2')}/>;
  return<Home onSelect={setMode}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
